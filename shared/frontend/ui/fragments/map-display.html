<aside id="mapDisplaySurface" class="workspace-surface surface-display ui-sheet" aria-labelledby="displaySheetTitle" data-od-id="map-display-surface">
        <header class="surface-header">
          <button class="ui-button sheet-drag-handle" type="button" role="slider" data-sheet-handle="mapDisplaySurface" aria-label="보기 창 높이 조절" data-tooltip="보기 창 높이 조절" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1" aria-valuetext="중간 높이"><span aria-hidden="true"></span></button>
          <div class="surface-header-title"><strong id="displaySheetTitle">보기</strong></div>
          <div class="surface-header-actions"><button id="mapDisplayCloseBtn" class="ui-button icon-btn sheet-close-btn" type="button" aria-label="보기 창 닫기" data-tooltip="보기 창 닫기"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
        </header>
        <div class="surface-body surface-body-delegated">
        <section id="mapViewSection" class="panel-section ui-panel--dense map-view-panel-section ui-scroll-surface">
          <div class="map-view-settings view-menu-root">
<!-- include:map-decorations-basic -->
            <section class="layer-style-editor map-name-settings map-display-list" aria-labelledby="mapNameSettingsTitle">
              <strong id="mapNameSettingsTitle">객체</strong>
              <section class="layer-type-settings" data-map-display-group="objects" aria-label="객체 표시 설정">
                <div class="layer-type-settings-heading map-display-row"><button class="ui-button map-display-detail-trigger view-menu-parent" type="button" data-map-display-row="objects" aria-label="객체 표시 설정 펼치기" data-tooltip="객체 표시 설정 펼치기" aria-controls="layerStylePanel-objects" aria-expanded="false" aria-haspopup="true"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-territory"/></svg><span>객체</span></span><svg class="ui-icon view-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button></div>
                <div class="view-menu-popup view-menu-visibility-popup" data-view-menu-popup="objects">
                  <label class="ui-choice-row ui-toggle"><input id="objectsVisible" data-layer-visibility="objects" type="checkbox" checked aria-label="객체 표시" /><span>표시</span></label>
                  <span class="ui-menu-separator view-menu-separator" role="separator"></span>
                  <div id="layerStylePanel-objects" class="layer-inline-style-panel map-display-details view-menu-panel-content" data-layer-style-panel="objects" role="group" aria-label="객체 표시 설정" hidden>
                  <label class="ui-choice-row ui-toggle" data-territorial-symbol-row><input id="objectNamesVisible" data-territorial-symbol="objectNames" type="checkbox" checked aria-label="객체 이름" /><span>이름</span></label>
                  <label class="ui-choice-row ui-toggle" data-territorial-symbol-row><input id="objectFlagsVisible" data-territorial-symbol="objectFlags" type="checkbox" checked aria-label="객체 깃발" /><span>깃발</span></label>
                </div>
                </div>
              </section>
              <section class="layer-type-settings" data-map-display-group="labels" aria-label="지명 표시 설정">
                <div class="layer-type-settings-heading map-display-row"><button class="ui-button map-display-detail-trigger view-menu-parent" type="button" data-map-display-row="labels" aria-label="지명 표시 설정 펼치기" data-tooltip="지명 표시 설정 펼치기" aria-controls="layerStylePanel-labels" aria-expanded="false" aria-haspopup="true"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-place"/></svg><span>지명</span></span><svg class="ui-icon view-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button></div>
                <div class="view-menu-popup view-menu-visibility-popup" data-view-menu-popup="labels">
                  <label class="ui-choice-row ui-toggle"><input id="labelsVisible" data-layer-visibility="labels" type="checkbox" checked aria-label="지명 표시" /><span>표시</span></label>
                  <span class="ui-menu-separator view-menu-separator" role="separator"></span>
                  <div id="layerStylePanel-labels" class="layer-inline-style-panel map-display-details view-menu-panel-content" data-layer-style-panel="labels" role="group" aria-label="지명 표기 언어" hidden>
                  <label class="ui-choice-row ui-toggle"><input type="checkbox" data-place-language="ko" aria-label="지명 한국어 표시" checked /><span>한국어</span></label>
                  <label class="ui-choice-row ui-toggle"><input type="checkbox" data-place-language="en" aria-label="지명 영어 표시" /><span>영어</span></label>
                  <label class="ui-choice-row ui-toggle"><input type="checkbox" data-place-language="native" aria-label="지명 원어 표시" /><span>원어</span></label>
                </div>
                </div>
              </section>
              <section class="layer-type-settings" data-map-display-group="rivers" aria-label="강 표시 설정">
                <div class="layer-type-settings-heading map-display-row"><button class="ui-button map-display-detail-trigger view-menu-parent" type="button" data-map-display-row="rivers" aria-label="강 표시 설정 펼치기" data-tooltip="강 표시 설정 펼치기" aria-controls="layerStylePanel-rivers" aria-expanded="false" aria-haspopup="true"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-river"/></svg><span>강</span></span><svg class="ui-icon view-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button></div>
                <div class="view-menu-popup view-menu-visibility-popup" data-view-menu-popup="rivers">
                  <label class="ui-choice-row ui-toggle"><input id="riversVisible" data-layer-visibility="rivers" type="checkbox" checked aria-label="강 레이어 표시" /><span>표시</span></label>
                  <span class="ui-menu-separator view-menu-separator" role="separator"></span>
                  <div id="layerStylePanel-rivers" class="layer-inline-style-panel map-display-details view-menu-panel-content" data-layer-style-panel="rivers" role="group" aria-label="강 표시 설정" hidden></div>
                </div>
              </section>
              <section class="layer-type-settings" data-map-display-group="lakes" aria-label="호수 표시 설정">
                <div class="layer-type-settings-heading map-display-row"><button class="ui-button map-display-detail-trigger view-menu-parent" type="button" data-map-display-row="lakes" aria-label="호수 표시 설정 펼치기" data-tooltip="호수 표시 설정 펼치기" aria-controls="layerStylePanel-lakes" aria-expanded="false" aria-haspopup="true"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-lake"/></svg><span>호수</span></span><svg class="ui-icon view-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button></div>
                <div class="view-menu-popup view-menu-visibility-popup" data-view-menu-popup="lakes">
                  <label class="ui-choice-row ui-toggle"><input id="lakesVisible" data-layer-visibility="lakes" type="checkbox" checked aria-label="호수 레이어 표시" /><span>표시</span></label>
                  <span class="ui-menu-separator view-menu-separator" role="separator"></span>
                  <div id="layerStylePanel-lakes" class="layer-inline-style-panel map-display-details view-menu-panel-content" data-layer-style-panel="lakes" role="group" aria-label="호수 표시 설정" hidden></div>
                </div>
              </section>
              <section class="layer-type-settings" data-map-display-group="genericFeatures" aria-label="기타 객체 표시 설정">
                <div class="layer-type-settings-heading map-display-row"><button class="ui-button map-display-detail-trigger view-menu-parent" type="button" data-map-display-row="genericFeatures" aria-label="기타 객체 표시 설정 펼치기" data-tooltip="기타 객체 표시 설정 펼치기" aria-controls="layerStylePanel-genericFeatures" aria-expanded="false" aria-haspopup="true"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-type"/></svg><span>기타 객체</span></span><svg class="ui-icon view-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button></div>
                <div class="view-menu-popup view-menu-visibility-popup" data-view-menu-popup="genericFeatures">
                  <label class="ui-choice-row ui-toggle"><input id="genericFeaturesVisible" data-layer-visibility="genericFeatures" type="checkbox" checked aria-label="기타 객체 레이어 표시" /><span>표시</span></label>
                  <span class="ui-menu-separator view-menu-separator" role="separator"></span>
                  <div id="layerStylePanel-genericFeatures" class="layer-inline-style-panel map-display-details view-menu-panel-content" data-layer-style-panel="genericFeatures" role="group" aria-label="기타 객체 표시 설정" hidden></div>
                </div>
              </section>
<!-- include:map-terrain -->
            </section>
            <section id="distributionMenuGroup" class="layer-style-editor distribution-menu-group hidden" aria-labelledby="distributionViewSettingsTitle">
              <span class="ui-menu-separator view-menu-separator" role="separator"></span>
              <button id="distributionMenuTrigger" class="ui-button view-menu-parent view-menu-distribution-trigger" type="button" aria-label="분포 설정 펼치기" data-tooltip="분포 설정 펼치기" aria-controls="distributionViewSettings" aria-expanded="false" aria-haspopup="true"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-language"/></svg><span>분포</span></span><svg class="ui-icon view-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
              <section id="distributionViewSettings" class="distribution-view-settings view-menu-popup" data-view-menu-popup="distribution" aria-labelledby="distributionViewSettingsTitle">
              <strong id="distributionViewSettingsTitle">분포</strong>
              <label class="ui-choice-row ui-toggle"><input id="distributionsVisible" data-layer-visibility="distributions" type="checkbox" checked aria-label="분포 표시" /><span>표시</span></label>
              <div id="layerStylePanel-distributions" class="layer-inline-style-panel" data-layer-style-panel="distributions"></div>
              <span class="ui-menu-separator view-menu-separator" role="separator"></span>
              <div class="ui-field field-group" role="radiogroup" aria-label="표시 기준" aria-describedby="distributionLayerModeHint">
                <label class="ui-choice-row"><input id="distributionOverlapRadio" type="radio" name="distributionLayerMode" value="overlap" checked /><span class="ui-choice-copy"><strong>여러 분포 겹쳐 보기</strong></span></label>
                <label class="ui-choice-row"><input id="distributionSingleRadio" type="radio" name="distributionLayerMode" value="single" /><span class="ui-choice-copy"><strong>분포 하나만 보기</strong></span></label>
              </div>
              <select id="distributionLayerModeInput" data-native-select hidden><option value="overlap">여러 분포 겹쳐 보기</option><option value="single">분포 하나만 보기</option></select>
              <label class="ui-field field-group" for="distributionActiveLayerInput"><span>표시 대상</span><select id="distributionActiveLayerInput"></select></label>
              <div id="distributionLegend" class="distribution-legend" aria-label="분포 범례"></div>
              <small id="distributionLayerModeHint" class="layer-setting-hint"></small>
              <label class="ui-choice-row ui-toggle"><input id="distributionBoundaryVisibleInput" type="checkbox" checked aria-label="분포 경계 표시" /><span>분포 경계</span></label>
            </section>
            </section>
          </div>
          </section>
        </div>

      </aside>
