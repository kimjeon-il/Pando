<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="세계지도와 프로젝트를 탐색하는 판도연구소">
  <title>판도연구소</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/pretendard-v1.3.9/PretendardVariable.woff2?v={{assetRevision}}" as="font" type="font/woff2" crossorigin>

  <script>(function(){try{var p=JSON.parse(localStorage.getItem('pandolab-user-preferences')||'null')||{};var a=Number(p.version)===2&&p.appearance||{};var t=a.theme;document.documentElement.dataset.theme=t==='light'||t==='dark'?t:'light';document.documentElement.dataset.statusBarVisible='false';}catch(_){document.documentElement.dataset.theme='light';document.documentElement.dataset.statusBarVisible='false';}}());</script>
  <link rel="stylesheet" href="assets/css/app.css?v={{assetRevision}}">
  <link rel="stylesheet" href="assets/css/ui-viewer.bundle.css?v={{assetRevision}}" data-pandolab-ui="ui-bundle">
  <link rel="stylesheet" href="assets/css/viewer.css?v={{assetRevision}}">
  <script src="assets/js/build-meta.js?v={{assetRevision}}"></script>
  <script src="assets/js/vendor/d3.min.js?v={{assetRevision}}"></script>
  <script type="module" src="assets/js/viewer.js?v={{assetRevision}}"></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
<!-- include:map-icons -->

























  </svg>
  <div id="viewer" class="app-root viewer-root" data-layout="wide">
    <header class="topbar">
      <div class="topbar-actions" role="navigation" aria-label="지도 메뉴">
        <div class="topbar-file-actions">
          <button id="mobileFileBtn" class="ui-button file-menu-btn topbar-command topbar-text-command" type="button" aria-label="파일 메뉴 열기" data-tooltip="파일 메뉴 열기" aria-haspopup="menu" aria-controls="fileMenu" aria-expanded="false">파일</button>
        </div>
        <button id="mapDisplayBtn" class="ui-button topbar-command topbar-text-command map-display-command" type="button" aria-controls="mapDisplaySurface" aria-expanded="false">보기</button>
        <button id="preferencesBtn" class="ui-button topbar-command topbar-text-command" type="button" aria-haspopup="dialog">설정</button>
      </div>
      <!-- include:notification -->
    </header>
    <div id="viewerWorkspace" class="workspace">
      <main class="map-wrap" aria-label="지도 작업 공간">
        <!-- include:map-attribution -->
        <div class="ui-toolbar ui-floating-surface ui-floating-toolbar mobile-menu-toolbar">
          <button id="mobileMenuBtn" class="ui-button icon-btn mobile-menu-trigger" type="button" aria-label="메뉴 열기" data-tooltip="메뉴 열기" aria-haspopup="menu" aria-controls="mobileGlobalMenu" aria-expanded="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
        <!-- include:object-chooser -->
        <div id="map" class="map-stage" aria-label="지도" tabindex="0">
          <canvas id="viewerCanvas" class="gpu-map-canvas"></canvas>
          <svg id="viewerLabels" class="map-overlay-svg labels-layer country-label" aria-hidden="true"></svg>
          <svg id="viewerInitialPreview" class="viewer-initial-preview" aria-hidden="true" focusable="false" hidden>
            <path class="viewer-initial-preview-ocean"></path>
            <path class="viewer-initial-preview-land"></path>
          </svg>
        </div>
        <div class="viewer-map-tools">
        <div class="ui-toolbar ui-floating-surface ui-floating-toolbar map-command-toolbar" aria-label="지도 명령">
          <div class="map-command-search">
            <!-- include:map-search-control -->

          </div>
          <!-- include:map-fit-control -->
        </div>
        <!-- include:timeline -->
        </div>
        <div class="viewer-map-notices">
          <span id="viewerStatus" class="ui-visually-hidden" role="status" aria-live="polite" aria-atomic="true">지도 불러오는 중…</span>
          <div id="mapPreparationNotice" class="ui-floating-surface viewer-map-error" role="alert" hidden>
            <span id="mapPreparationStatus"></span>
            <button id="mapPreparationRetry" class="ui-button btn" type="button" hidden>다시 시도</button>
          </div>
        </div>
        <span id="viewerSelectionStatus" class="ui-visually-hidden" role="status" aria-live="polite"></span>
      </main>

      <!-- include:object-search -->

      <!-- include:map-display -->
    </div>
    <nav id="mobileGlobalMenu" class="ui-menu ui-popover ui-floating-surface ui-menu-list mobile-global-menu" role="menu" aria-label="모바일 메뉴" hidden>
        <button id="mobileMenuFileBtn" class="ui-button ui-menu-item" type="button" role="menuitem" aria-haspopup="menu"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder-open"/></svg><span>파일</span><svg class="ui-icon ui-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
        <button id="mobileDisplayBtn" class="ui-button ui-menu-item" type="button" role="menuitem" aria-controls="mapDisplaySurface" aria-expanded="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-tune"/></svg><span>보기</span></button>
        <button id="mobilePreferencesBtn" class="ui-button ui-menu-item" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-gear"/></svg><span>설정</span></button>
      </nav>
    <div id="fileMenu" class="top-actions ui-menu ui-menu-surface ui-menu-list" role="menu" aria-label="파일" hidden>
      <button id="openProjectBtn" class="ui-button btn ghost file-menu-item ui-menu-item" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder-open"/></svg><span>프로젝트 불러오기</span></button>
      <button id="builtinMapBtn" class="ui-button btn ghost file-menu-item ui-menu-item" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-library"/></svg><span>내장 지도</span></button>
    </div>
    <input id="projectFileInput" type="file" accept=".gpkg" hidden>
  </div>
  <!-- include:preferences -->
  <!-- include:tooltip -->
</body>
</html>
