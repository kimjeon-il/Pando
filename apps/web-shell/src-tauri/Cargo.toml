[package]
name = "pandolab-web-shell"
version = "0.1.0"
description = "PandoLab isolated Windows and Android WebView prototype"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pandolab_web_shell_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
base64 = "=0.23.1"
flate2 = "=1.1.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = false

[profile.dev.package.pandolab-web-shell]
debug = 1
