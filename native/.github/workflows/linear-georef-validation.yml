name: Linear georef validation

on:
  push:
    branches: [work/auto-georef]
    paths:
      - 'app/reference-web/reference-image-georef.js'
      - 'app/reference-web/manifest.json'
      - 'app/referenceimagelibrary.*'
      - 'tests/reference_image_tests.cpp'
      - '.github/workflows/linear-georef-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linear-georef-validation
  cancel-in-progress: true

jobs:
  rebuild-and-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/auto-georef
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify shared reference sources
        run: node tools/reference-parity/verify-source.mjs
      - name: Rebuild reference runtime
        run: node tools/reference-parity/build-runtime.mjs
      - name: Commit generated runtime
        shell: bash
        run: |
          if git diff --quiet -- app/reference-web/runtime.js; then
            echo "runtime already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/reference-web/runtime.js
            git commit -m "build(reference-web): regenerate linear georef runtime"
            git push origin HEAD:work/auto-georef
          fi
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: qtshadertools qtimageformats
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build reference image tests
        run: cmake --build build --config Release --target reference_image_tests
      - name: Run reference image tests
        run: ctest --test-dir build -C Release --output-on-failure -R "^reference_image_tests$"

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: work/auto-georef
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run linear georef web tests
        run: |
          node --test tests/unit/reference-image-model.test.mjs
          node --test tests/unit/reference-image-georef.test.mjs
