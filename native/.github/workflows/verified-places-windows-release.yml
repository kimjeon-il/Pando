name: Windows verified-places portable release

# Distribute only after a main-branch merge, focused native tests, and Qt packaging.
# The release is a Windows preview; it does not install or update a user's local app.
on:
  push:
    branches: [main]
    paths:
      - 'assets/place/**'
      - 'app/placeruntimestore.*'
      - 'app/placenamedisplay.*'
      - 'app/placeruntimeprovider.*'
      - 'app/editorplace.cpp'
      - 'app/editorpresentation.cpp'
      - 'app/editorview.cpp'
      - 'app/CMakeLists.txt'
      - 'engine/include/pandoeditor/map/labelengine.h'
      - 'engine/src/labelengine.cpp'
      - 'tests/place_sync_contract_tests.cpp'
      - '.github/workflows/verified-places-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-places-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4

      - name: Verify bundled release identity
        shell: pwsh
        run: |
          $manifest = Get-Content assets/place/manifest.json -Raw | ConvertFrom-Json
          $expected = '43664502a747723a5b4d0ee1dedb350775a3bdd209a6bfba117de369c4d7c594'
          if ($manifest.shards.'places-v1'.sha256 -ne $expected) {
            throw "Refusing release: approved-only place shard differs from verified Web release"
          }
          if ($manifest.revision -ne 'approved-places-a912045657f35026') {
            throw "Refusing release: unexpected place manifest revision"
          }
          $actual = (Get-FileHash assets/place/places-v1.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Refusing release: binary SHA-256 mismatch" }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Install Windows zlib
        shell: pwsh
        run: vcpkg install zlib:x64-windows

      - name: Configure Qt app and place tests
        shell: pwsh
        run: >
          cmake -S . -B build-portable
          -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DPANDOEDITOR_BUILD_APP=ON -DBUILD_TESTING=ON

      - name: Build Qt application and focused native place tests
        shell: pwsh
        run: >
          cmake --build build-portable --config Release --parallel 2
          --target pandoeditor place_sync_contract_tests
          place_runtime_store_tests place_runtime_provider_tests
          place_controller_tests place_label_collision_tests

      - name: Run native place integration tests
        shell: pwsh
        run: >
          ctest --test-dir build-portable -C Release --output-on-failure
          -R '^(place_sync_contract_tests|place_runtime_store_tests|place_runtime_provider_tests|place_controller_tests|place_label_collision_tests)$'

      - name: Package portable Qt runtime
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build-portable/app/Release/pandoeditor.exe'
          if (!(Test-Path $exe)) { throw "Built Windows executable missing: $exe" }
          $folder = Join-Path $PWD 'dist/Pandoeditor-verified-places'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $copy = Join-Path $folder 'pandoeditor.exe'
          Copy-Item $exe $copy
          $qtDeploy = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          if (!(Test-Path $qtDeploy)) { throw "windeployqt.exe missing: $qtDeploy" }
          & $qtDeploy --release --qmldir (Join-Path $PWD 'ui') --compiler-runtime $copy
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          Copy-Item README.md (Join-Path $folder 'README.md')
          @{
            sourceRepository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            releaseType = 'Windows x64 portable preview'
            approvedPlaces = 163
            researchedPlaceRecords = 264
            withheldPlaceRecords = 101
            placeShardSha256 = '43664502a747723a5b4d0ee1dedb350775a3bdd209a6bfba117de369c4d7c594'
            executableSha256 = (Get-FileHash $copy -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $folder 'BUILD-INFO.json')
          Compress-Archive -Path $folder -DestinationPath 'dist/Pandoeditor-verified-places-windows-x64.zip' -CompressionLevel Optimal -Force
          $archive = Join-Path $PWD 'dist/Pandoeditor-verified-places-windows-x64.zip'
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Pandoeditor-verified-places-windows-x64.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Smoke test bundled Windows app
        shell: pwsh
        run: |
          & (Join-Path $PWD 'dist/Pandoeditor-verified-places/pandoeditor.exe') --smoke-check
          if ($LASTEXITCODE -ne 0) { throw "Portable smoke check failed; do not release" }

      - name: Publish downloadable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pandoeditor-verified-places-windows-x64
          path: |
            dist/Pandoeditor-verified-places-windows-x64.zip
            dist/Pandoeditor-verified-places-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Create immutable GitHub prerelease for merged main
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 10)
          $tag = "v0.1.0-places-163-preview.$short"
          $zip = 'dist/Pandoeditor-verified-places-windows-x64.zip'
          $check = "$zip.sha256"
          $notes = @'
          Windows x64 portable preview with 163 explicitly approved built-in city records, mirrored byte-for-byte from Pando Web's approved-only place shard. The other 101 researched places remain withheld pending further verification.

          Unzip fully and run Pandoeditor-verified-places/pandoeditor.exe. The app is not an installer or an automatic update.
          Release was built and passed focused native Qt place tests on this main commit; full GPU/Android/Web parity is not claimed.
          SHA-256 is supplied as a separate asset and source/binary identities appear in BUILD-INFO.json.
          '@
          gh release create $tag $zip $check --target $env:GITHUB_SHA --title "PandoEditor verified places Windows preview ($short)" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease upload failed: $LASTEXITCODE" }
