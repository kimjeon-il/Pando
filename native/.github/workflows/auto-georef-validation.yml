name: Auto georef validation

on:
  push:
    branches:
      - work/auto-georef
    paths:
      - 'app/referenceautogeoref.*'
      - 'app/referenceocr.*'
      - 'app/referenceimagelibrary.*'
      - 'app/referencewarp.*'
      - 'app/CMakeLists.txt'
      - 'ui/common/MapView.qml'
      - 'tests/reference_auto_georef_tests.cpp'
      - 'tests/reference_image_tests.cpp'
      - '.github/workflows/auto-georef-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          modules: qtshadertools qtimageformats
          cache: true
      - name: Install Windows zlib
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install zlib:x64-windows
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build georeferencing tests
        run: cmake --build build --config Release --target reference_auto_georef_tests reference_image_tests
      - name: Run georeferencing tests
        run: ctest --test-dir build -C Release --output-on-failure -R "reference_(auto_georef|image)_tests"

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: work/auto-georef
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run automatic georeferencing unit tests
        run: |
          node --test tests/unit/reference-image-georef.test.mjs
          node --test tests/unit/reference-image-auto-georef.test.mjs
          node --test tests/unit/reference-image-place-match.test.mjs
          node --test tests/unit/reference-image-ocr.test.mjs
          node --test tests/unit/reference-image-ui.test.mjs
