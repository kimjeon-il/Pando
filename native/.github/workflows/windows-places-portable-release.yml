name: Windows Approved Places Portable Release

on:
  push:
    branches:
      - main
    paths:
      - 'assets/place/**'
      - 'app/placeruntime*'
      - 'app/placename*'
      - 'app/editorplace.cpp'
      - 'app/CMakeLists.txt'
      - 'tests/place_sync_contract_tests.cpp'
      - 'reports/places/source-manifest.json'
      - '.github/workflows/windows-places-portable-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-approved-places-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    if: github.repository == 'kimjeon-il/PandoEditor' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt 6.8.3 MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Verify curated 163-city bundled assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content 'reports/places/source-manifest.json' -Raw | ConvertFrom-Json
          $manifest = Get-Content 'assets/place/manifest.json' -Raw | ConvertFrom-Json
          $expected = '43664502a747723a5b4d0ee1dedb350775a3bdd209a6bfba117de369c4d7c594'
          $actual = (Get-FileHash -Algorithm SHA256 'assets/place/places-v1.bin').Hash.ToLowerInvariant()
          if ($metadata.publishedRuntime.records -ne 163 -or $metadata.publishedRuntime.withheldUnapprovedRecords -ne 101) {
            throw 'The bundled asset is not the 163-approved-city release.'
          }
          if ($actual -ne $expected -or $manifest.shards.'places-v1'.sha256 -ne $expected) {
            throw "Runtime binary or manifest differs from approved Web release: $actual"
          }
          Write-Output "Verified approved-only PLAC v3 runtime: $actual"

      - name: Configure Qt Release with Visual Studio 2022
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON

      - name: Build Windows app and place validation executable
        shell: pwsh
        run: cmake --build build --config Release --parallel 3 --target pandoeditor place_sync_contract_tests

      - name: Run native bundled-data regression
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure -R '^place_sync_contract_tests$'

      - name: Bundle Qt runtime and Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build -Recurse -File -Filter 'pandoeditor.exe' |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } | Select-Object -First 1
          if (-not $exe) { throw 'Missing built Windows pandoeditor.exe' }
          New-Item -ItemType Directory -Force 'dist/PandoEditor' | Out-Null
          Copy-Item $exe.FullName 'dist/PandoEditor/pandoeditor.exe'
          $qtDeploy = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          if (-not (Test-Path $qtDeploy)) { throw 'Qt windeployqt.exe not found' }
          & $qtDeploy --release --compiler-runtime --qmldir "$PWD/ui" --dir "$PWD/dist/PandoEditor" "$PWD/dist/PandoEditor/pandoeditor.exe"
          if ($LASTEXITCODE -ne 0) { throw "Qt runtime deployment failed: $LASTEXITCODE" }
          Copy-Item 'reports/places/source-manifest.json' 'dist/PandoEditor/places-source-manifest.json'
          $commit = $env:GITHUB_SHA.Substring(0,12)
          $zip = "dist/PandoEditor-places163-$commit-windows-portable.zip"
          Compress-Archive -Path 'dist/PandoEditor/*' -DestinationPath $zip -Force
          $checksum = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$checksum  $(Split-Path $zip -Leaf)" -Encoding ascii
          Write-Output "Built $zip (SHA-256 $checksum)"

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: approved-163-cities-windows-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v0.1.0-places163-$($env:GITHUB_SHA.Substring(0,12))"
          $zip = (Get-ChildItem dist -Filter '*.zip' -File | Select-Object -First 1).FullName
          if (-not $zip) { throw 'Missing portable zip to publish' }
          $sha = "$zip.sha256"
          $notes = 'Portable Windows Qt preview built from main. Bundles 163 source-approved city records and preserves 101 unapproved research candidates outside the runtime. Contains a provenance manifest and SHA-256 checksum. This is a preview release, not a stable signed installer.'
          gh release create $tag $zip $sha --target $env:GITHUB_SHA --title "PandoEditor approved-city Windows portable ($($env:GITHUB_SHA.Substring(0,12)))" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release publish failed: $LASTEXITCODE" }
