<!doctype html><html lang="ko"><meta charset="utf-8"><title>라이브러리 편집 UI 통합 검사</title>
<link rel="stylesheet" href="../../assets/css/ui.bundle.css"><link rel="stylesheet" href="../../assets/css/components/editor-shell.css">
<main id="sourceHost"></main><aside id="preview"></aside><pre id="failure"></pre>
<script type="module">
import {createTerritorialLibraryService} from '../../assets/js/modules/territorial-library-service.js';
import {createRepositoryTerritorialLoader} from '../../assets/js/modules/territorial-entity-loader.js';
import {createTerritorialLibraryEditingUi} from '../../assets/js/modules/territorial-library-editing-ui.js';
const base='../../assets/data/territorial-entities/generated/v2/';
const selectedId=new URLSearchParams(location.search).get('entity')||'state:KOR';
const initial=await (await fetch(base+'index.json')).json();
let saved=JSON.parse(localStorage.getItem('library-ui-component-test')||'null')||{revision:'initial',index:initial,records:{},status:{state:'queued'}};
let syncCalls=0,external=[],warningOnCommit=false,openCalls=0;
const repository={snapshot:()=>saved,open:async()=>{openCalls++;if(warningOnCommit&&saved.warning)throw new Error('working files remain locked');return saved;},
 async readEntity(id){if(saved.records[id])return structuredClone(saved.records[id]);const file=saved.index.entities.find(e=>e.entityId===id).file;
  const response=await fetch(base+file);return JSON.parse(await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text());},
 async commit(request){if(request.expectedRevision!==saved.revision)throw new Error('stale revision');
  if(external.length&&request.externalRevision!=='component-working-revision')throw new Error('external fingerprint missing');
  saved={revision:crypto.randomUUID(),index:request.index,status:{state:'queued'},records:{...saved.records,...Object.fromEntries(request.entities.map(e=>[e.entityId,e]))}};
  for(const id of request.deletedEntityIds)delete saved.records[id];external=[];if(warningOnCommit)saved.warning={code:'PL-LIBRARY-WORKING-REFRESH',message:'저장 완료 · 작업 파일 갱신 대기'};localStorage.setItem('library-ui-component-test',JSON.stringify(saved));return saved;},
 externalChanges:async()=>({expectedRevision:saved.revision,externalRevision:'component-working-revision',entities:external,deletedEntityIds:[]}),
 sync:async()=>{syncCalls++;return {state:'queued'};},resolveConflict:async()=>{},openGeometry:async()=>{throw new Error('Native geometry window is outside this component test');}};
const service=createTerritorialLibraryService({loader:createRepositoryTerritorialLoader(repository)});await service.load();
const host=document.getElementById('sourceHost'),preview=document.getElementById('preview');
let ui;
async function render(){preview.replaceChildren();const entity=await service.loadEntity(selectedId);ui.decorate({entity,version:entity.geometryVersions[0],host:preview});}
ui=createTerritorialLibraryEditingUi({document,window,host,service,repository,refresh:render,reportError:error=>{document.getElementById('failure').textContent=error.message;}});
await render();window.LIBRARY_UI_TEST={get saved(){return saved;},get syncCalls(){return syncCalls;},get openCalls(){return openCalls;},importRepresentative:async()=>{
const entity=await service.loadEntity(selectedId);const selection=service.resolveSelection(selectedId,null);
const result=await service.instantiateDescriptors([selectedId],null);
const value=result[0],version=entity.geometryVersions.find(v=>v.versionId===selection.geometryVersionId);
return {versionId:selection.geometryVersionId,referenceDate:value.metadata.sourceReferenceDate,
geometryMatches:JSON.stringify(value.geometry)===JSON.stringify(version.geometry)};
},warnOnCommit:()=>{warningOnCommit=true;},queueExternal:async invalid=>{
const entity=await repository.readEntity('state:KOR');entity.names.ko='외부 파일 수정';entity.geometryVersions[0].validFrom='1948-08-15';if(invalid)entity.lifetime.validFrom='bad';external=[entity];}};
</script></html>
