    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>
  <div id="viewer" class="app-root viewer-root" data-layout="wide">
    <header class="topbar">
      <div class="topbar-actions" role="navigation" aria-label="지도 메뉴">
        <div class="topbar-file-actions">
          <button id="viewerFileToggle" class="ui-button file-menu-btn topbar-command topbar-text-command" type="button" aria-label="파일 메뉴 열기" aria-haspopup="menu" aria-controls="viewerFileMenu" aria-expanded="false">파일</button>
        </div>
        <button id="viewerDisplayToggle" class="ui-button topbar-command topbar-text-command map-display-command" type="button" aria-controls="viewerDisplayPanel" aria-expanded="false">보기</button>
      </div>
    </header>
    <div id="viewerWorkspace" class="workspace">
      <main class="map-wrap" aria-label="지도 작업 공간">
        <div id="map" class="map-stage" aria-label="지도" tabindex="0">
          <canvas id="viewerCanvas" class="gpu-map-canvas"></canvas>
          <svg id="viewerLabels" class="map-label-svg labels-layer country-label" aria-hidden="true"></svg>
        </div>
        <div class="ui-toolbar ui-floating-surface ui-floating-toolbar map-command-toolbar" aria-label="지도 명령">
          <div class="map-command-search">
            <button id="viewerSearchToggle" class="ui-button icon-btn object-search-command" type="button" aria-label="검색" aria-controls="viewerSearchPanel" aria-expanded="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-search"/></svg></button>
      <aside id="viewerSearchPanel" class="workspace-surface surface-search ui-sheet surface-open search-toolbar-desktop" aria-labelledby="viewerSearchTitle" hidden>
        <header class="surface-header">
          <div class="surface-header-title"><strong id="viewerSearchTitle">검색</strong></div>
          <div class="surface-header-actions"></div>
        </header>
        <div class="surface-body surface-body-delegated">
          <section class="panel-section ui-panel--dense object-search-section">
            <div class="ui-search-field object-search">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-search"/></svg>
              <input id="viewerSearch" type="search" placeholder="지도에서 찾기" autocomplete="off" aria-label="지도에서 찾기">
              <button id="viewerSearchClose" class="ui-button icon-btn sheet-close-btn" type="button" aria-label="검색 창 닫기"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></button>
            </div>
            <div id="viewerResults" class="object-search-results ui-scroll-surface ui-floating-surface" role="listbox" aria-label="검색 결과"></div>
          </section>
        </div>
      </aside>
          </div>
          <button id="viewerFit" class="ui-button icon-btn reset-view-command" type="button" aria-label="전체 지도 보기"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-fit-map"/></svg></button>
        </div>
        <div class="ui-toolbar ui-floating-surface ui-floating-toolbar map-view-toolbar" aria-label="지도 확대와 축소">
          <button id="viewerZoomIn" class="ui-button icon-btn" type="button" aria-label="확대"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="viewerZoomOut" class="ui-button icon-btn" type="button" aria-label="축소"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        </div>
        <footer class="map-bottom-status">
          <div class="status-inner">
            <span id="viewerStatus" class="status-group status-primary" role="status" aria-live="polite">지도를 준비하고 있습니다…</span>
            <div class="status-group timeline-status" aria-label="지도 시점">
              <span class="timeline-month-control"><input id="viewerMonth" class="timeline-month-input" aria-label="지도 연월" type="month"></span>
            </div>
          </div>
        </footer>
      </main>

      <aside id="viewerDisplayPanel" class="workspace-surface surface-display ui-sheet surface-open" aria-labelledby="viewerDisplayTitle" hidden>
        <header class="surface-header">
          <div class="surface-header-title"><strong id="viewerDisplayTitle">보기</strong></div>
          <div class="surface-header-actions"><button id="viewerDisplayClose" class="ui-button icon-btn sheet-close-btn" type="button" aria-label="보기 창 닫기"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
        </header>
        <div class="surface-body surface-body-delegated">
          <section class="panel-section ui-panel--dense map-view-panel-section ui-scroll-surface">
            <div class="map-view-settings view-menu-root">
              <section class="layer-style-editor map-projection-settings" aria-labelledby="viewerProjectionTitle">
                <strong id="viewerProjectionTitle">투영법</strong>
                <div class="map-view-projection-slot">
                  <div class="ui-segmented projection-control" role="group" aria-label="투영법">
                    <button id="viewerGlobe" class="ui-button ui-segment-option projection-btn active" type="button" aria-label="지구본 투영" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-globe"/></svg><span>지구본</span></button>
                    <button id="viewerFlat" class="ui-button ui-segment-option projection-btn" type="button" aria-label="평면지도 투영" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-projection-flat"/></svg><span>평면지도</span></button>
                  </div>
                </div>
              </section>
              <span class="ui-menu-separator view-menu-separator" role="separator"></span>
              <section class="layer-style-editor map-name-settings" aria-label="객체 표시">
                  <details class="layer-type-settings">
                    <summary class="ui-button view-menu-parent">지형</summary>
                    <div class="terrain-mode-options" role="radiogroup" aria-label="지형 표현 방식">
                      <label class="ui-choice-row terrain-mode-option"><input type="radio" name="viewerTerrain" value="none" checked /><span>없음</span></label>
                      <label class="ui-choice-row terrain-mode-option"><input type="radio" name="viewerTerrain" value="political" /><span>흑백</span></label>
                      <label class="ui-choice-row terrain-mode-option"><input type="radio" name="viewerTerrain" value="physical" /><span>색채</span></label>
                    </div>
                  </details>
                <strong>객체</strong>
                <div id="viewerLayers" class="map-display-list">
                  <details class="layer-type-settings" data-map-display-group="general">
                    <summary class="ui-button view-menu-parent"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-country"/></svg><span>일반</span></span><svg class="ui-icon view-menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chevron-right"/></svg></summary>
                    <div class="layer-inline-style-panel map-display-details" role="group" aria-label="일반 객체 표시 설정">
                      <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-country"/></svg><span>상위 객체</span></span><input data-viewer-layer="countries" value="countries" type="checkbox" checked aria-label="상위 객체 표시"></label></div>
                      <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-subunits"/></svg><span>하위 객체</span></span><input data-viewer-layer="subunits" value="subunits" type="checkbox" checked aria-label="하위 객체 표시"></label></div>
                    </div>
                  </details>
                  <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-region"/></svg><span>지방</span></span><input data-viewer-layer="regions" value="regions" type="checkbox" checked aria-label="지방 표시"></label></div>
                  <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-place"/></svg><span>지명</span></span><input data-viewer-layer="labels" value="labels" type="checkbox" checked aria-label="지명 표시"></label></div>
                  <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-river"/></svg><span>강</span></span><input data-viewer-layer="rivers" value="rivers" type="checkbox" checked aria-label="강 표시"></label></div>
                  <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-lake"/></svg><span>호수</span></span><input data-viewer-layer="lakes" value="lakes" type="checkbox" checked aria-label="호수 표시"></label></div>
                  <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-shape"/></svg><span>기타 객체</span></span><input data-viewer-layer="genericFeatures" value="genericFeatures" type="checkbox" checked aria-label="기타 객체 표시"></label></div>
                  <span class="ui-menu-separator view-menu-separator" role="separator"></span>
                  <div class="layer-type-settings-heading map-display-row"><label class="ui-choice-row ui-toggle"><span class="view-menu-leading"><svg class="ui-icon view-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-area-draw"/></svg><span>분포</span></span><input data-viewer-layer="distributions" value="distributions" type="checkbox" checked aria-label="분포 표시"></label></div>
                </div>
              </section>
            </div>
          </section>
        </div>
      </aside>
      <aside id="viewerInfoPanel" class="sidebar editor-drawer editor-panel workspace-surface ui-sheet" aria-labelledby="viewerInfoTitle" hidden>
        <header class="surface-header">
          <div class="surface-header-title"><strong id="viewerInfoTitle">정보</strong></div>
          <div class="surface-header-actions"><button id="viewerInfoClose" class="ui-button icon-btn sheet-close-btn" type="button" aria-label="정보 창 닫기"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
        </header>
        <div class="surface-body editor-scroll-body ui-scroll-surface">
          <section id="viewerInfo" class="editor-view" aria-live="polite"></section>
        </div>
      </aside>
    </div>
    <div id="viewerFileMenu" class="top-actions ui-menu ui-menu-surface ui-menu-list" role="menu" aria-label="파일" hidden>
      <button id="viewerOpen" class="ui-button btn ghost file-menu-item ui-menu-item" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder-open"/></svg><span>프로젝트 불러오기</span></button>
      <button id="viewerBuiltin" class="ui-button btn ghost file-menu-item ui-menu-item" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-library"/></svg><span>내장 지도</span></button>
    </div>
    <input id="viewerFile" type="file" accept=".gpkg" hidden>
  </div>
</body>
</html>
