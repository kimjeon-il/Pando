      <button id="openProjectBtn" class="ui-button btn ghost file-menu-item ui-menu-item" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-folder-open"/></svg><span>프로젝트 불러오기</span></button>
      <button id="builtinMapBtn" class="ui-button btn ghost file-menu-item ui-menu-item" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-library"/></svg><span>내장 지도</span></button>
    </div>
    <input id="projectFileInput" type="file" accept=".gpkg" hidden>
  </div>
  <div id="preferencesModal" class="ui-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="preferencesTitle">
    <div class="ui-dialog-backdrop"></div>
    <section class="ui-dialog-card preferences-card">
      <header class="ui-dialog-header"><div><h2 id="preferencesTitle">환경설정</h2></div></header>
      <div class="preferences-fields">
        <section class="preferences-section" aria-labelledby="preferencesAppearanceTitle">
          <h3 id="preferencesAppearanceTitle">화면</h3>
          <div class="preferences-appearance-grid">
          <div class="preferences-theme" role="group" aria-labelledby="preferencesThemeTitle">
            <strong id="preferencesThemeTitle">테마</strong>
            <input id="preferencesThemeInput" type="hidden" value="system" />
            <div class="preferences-theme-swatches">
              <button type="button" class="ui-button preferences-accent-chip preferences-theme-chip" data-preference-theme="light" aria-label="밝은 테마" data-tooltip="밝은 테마" aria-pressed="false"></button>
              <button type="button" class="ui-button preferences-accent-chip preferences-theme-chip" data-preference-theme="dark" aria-label="어두운 테마" data-tooltip="어두운 테마" aria-pressed="false"></button>
              <button type="button" class="ui-button preferences-accent-chip preferences-theme-chip" data-preference-theme="system" aria-label="시스템 설정" data-tooltip="시스템 설정" aria-pressed="true"></button>
            </div>
          </div>
          <div class="preferences-accent" role="group" aria-labelledby="preferencesAccentTitle">
            <strong id="preferencesAccentTitle">강조색</strong>
            <div class="preferences-accent-swatches">
              <button type="button" class="ui-button preferences-accent-chip" data-preference-accent="red" aria-label="빨강" data-tooltip="빨강" aria-pressed="false"></button>
              <button type="button" class="ui-button preferences-accent-chip" data-preference-accent="orange" aria-label="주황" data-tooltip="주황" aria-pressed="false"></button>
              <button type="button" class="ui-button preferences-accent-chip" data-preference-accent="green" aria-label="초록" data-tooltip="초록" aria-pressed="false"></button>
              <button type="button" class="ui-button preferences-accent-chip" data-preference-accent="teal" aria-label="청록" data-tooltip="청록" aria-pressed="false"></button>
              <button type="button" class="ui-button preferences-accent-chip" data-preference-accent="blue" aria-label="파랑" data-tooltip="파랑" aria-pressed="true"></button>
              <button type="button" class="ui-button preferences-accent-chip" data-preference-accent="purple" aria-label="보라" data-tooltip="보라" aria-pressed="false"></button>
              <button type="button" class="ui-button preferences-accent-chip" data-preference-accent="pink" aria-label="분홍" data-tooltip="분홍" aria-pressed="false"></button>
            </div>
          </div>
          </div>
          <div class="preferences-display"><label class="ui-choice-row ui-toggle"><input id="preferencesSmoothLinesInput" type="checkbox" checked /><span>경계선 부드럽게</span></label></div>
        </section>
      </div>
      <div class="ui-dialog-actions"><button id="preferencesResetBtn" class="ui-button btn ghost" type="button">기본값 복원</button><span class="preferences-actions-spacer"></span><button id="preferencesCancelBtn" class="ui-button btn ghost" type="button">취소</button><button id="preferencesApplyBtn" class="ui-button btn" type="button">적용</button></div>
    </section>
  </div>
  <div id="uiTooltip" class="ui-tooltip hidden" role="tooltip" aria-hidden="true"></div>
</body>
