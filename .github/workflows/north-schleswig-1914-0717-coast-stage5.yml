name: Stage 5 1914 Hvidding-Ufer stone1/coast chronology audit

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/verify_north_schleswig_1914_0717_coast.py
      - .github/workflows/north-schleswig-1914-0717-coast-stage5.yml

permissions:
  contents: write

concurrency:
  group: north-schleswig-stage5-0717-coast
  cancel-in-progress: false

jobs:
  coastal-dike-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests shapely pyproj pillow
      - name: Pin exact master candidate hash
        run: sha256sum tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.geojson > /tmp/coast-stage5-original.sha
      - name: 1880 maps + stone1 and dike timeline (no historic geometry promotion)
        env:
          GIS_STAGE5_LOG_IMAGE: "1"
        run: python tools/verify_north_schleswig_1914_0717_coast.py
      - name: Check 1880/1914/source fidelity, pixel efficiency and chronology
        run: |
          sha256sum -c /tmp/coast-stage5-original.sha
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path("tools/historical-library/land-borders")
          stem="german-denmark-1914-north-schleswig-001-026.0717-hvidding-ufer-stage5"
          j=json.loads((b/(stem+".json")).read_text(encoding="utf-8"))
          geo=json.loads((b/(stem+".geojson")).read_text(encoding="utf-8"))
          assert j["referenceDate"] == "1914-07-31"
          assert geo["features"][0]["properties"]["doNotTreatAsFinal"] is True
          assert j["masterBorderEdited"] is False
          assert j["physicalCoastEdited"] is False
          assert j["historicalCoastlineIndependentlyDigitized"] is False
          assert j["historicalScreenDeviationCssPx"] is None
          assert j["historicalStopThresholdPassed"] is None
          assert j["primaryTreaty"]["historicalMarineBoundaryDigitized"] is False
          assert j["primaryTreaty"]["landShoreIntersection1914Confirmed"] is False
          assert j["chronology"]["fløjdiget"]["presentBefore1914Likely"] is True
          assert j["chronology"]["ribediget"]["officialHandover"] == "1915-05-10"
          assert j["chronology"]["ribediget"]["entireSystemCompleteByReferenceDate"] is False
          assert j["chronology"]["rejsbydiget"]["existsByReferenceDate"] is False
          assert j["chronology"]["graniteStone1"]["2014RestoreIs1914ShoreEvidence"] is False
          geom=j["workingGeometry"]
          assert geom["sourceSimple"]
          assert abs(geom["candidateLengthKm"]-.29380)<.01
          assert geom["candidateVertices"]==15
          assert geom["join0718GapDegrees"]==0
          assert geom["restoredStone1CoordDifferenceDegrees"]==0
          screen=geom["renderDisplayEstimate"]
          assert screen["mapCssWidthPx"]==2560
          assert screen["webFlatZoom"]==64
          assert screen["displayToleranceCssPx"]==.5
          assert screen["candidateToOwnSimplificationHausdorffCssPx"]<=.5
          assert screen["historic1914ScreenDeviationCssPx"] is None
          assert len(j["sourceRasterImages"]) == 3
          assert all(len(x["historicSourceMaps"]) == 2 for x in j["sourceRasterImages"])
          print("PASS: stage 5 marker1 chronology and 0717/0718 candidate topology; 1914 shoreline unverified.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: north-schleswig-0717-hvidding-ufer-stage5
          path: tools/historical-library/review-output/north-schleswig-1914-001-026/0717-hvidding-ufer/
          retention-days: 7
          if-no-files-found: error
      - name: Commit metadata and separate provisional section only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.0717-hvidding-ufer-stage5.geojson \
            tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.0717-hvidding-ufer-stage5.json
          if git diff --cached --quiet; then
            echo "Derived source unchanged"
          else
            git commit -m "data(gis): save non-final 0717 coast/stone1 period-map review"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
