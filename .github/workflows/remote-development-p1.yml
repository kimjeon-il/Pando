name: P1 Remote development (scoped)
on:
  push:
    branches:
      - work/ui
      - work/objects
      - work/gis
      - work/places
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Scope to validate, auto or explicitly selected
        required: false
        default: auto
        type: choice
        options:
          - auto
          - ui
          - objects
          - gis
          - places
          - core
          - wasm
          - all
          - native
          - native-tests
      native_platform:
        description: Native artifact target
        type: choice
        options: [all, windows, android, android-x86_64]
        default: all
      native_mode:
        description: Native execution mode
        type: choice
        options: [development, offline, verification]
        default: development
permissions:
  contents: read
concurrency:
  group: p1-remote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.native.outputs.needed }}
      matrix: ${{ steps.native.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select affected native targets
        id: native
        env:
          BASE_SHA: ${{ github.event.before }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
          REQUEST_PLATFORM: ${{ inputs.native_platform || 'all' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {nativeBuildSelection,nativeTargets} from './apps/web-shell/native-contract.mjs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          let paths=[];
          if(!process.env.MANUAL_SCOPE.startsWith('native')){
            let base=process.env.BASE_SHA;
            if(!/^[a-f0-9]{40}$/.test(base||'')||/^0+$/.test(base))base=git('rev-parse','HEAD^');
            try{git('cat-file','-e',base+'^{commit}');}catch{git('fetch','--no-tags','--depth=1','origin',base);}
            paths=git('diff','--name-only',base,'HEAD').split('\n');
          }
          const platform=process.env.MANUAL_SCOPE==='native-tests'?'windows':process.env.MANUAL_SCOPE==='native'?process.env.REQUEST_PLATFORM:undefined;
          const selected=nativeBuildSelection(paths,{platform});
          const matrix={include:selected.map(platform=>({platform,runner:platform==='windows'?'windows-2022':'ubuntu-24.04',target:nativeTargets[platform]}))};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+!!selected.length+'\nmatrix='+JSON.stringify(matrix)+'\n');
          JS
  native-artifact:
    needs: native-plan
    if: needs.native-plan.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Preserve source line identities
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Check peak native build headroom
        env:
          NATIVE_MODE: ${{ inputs.native_mode || 'development' }}
        run: node -e "const s=require('fs').statfsSync('.');const peak=process.env.NATIVE_MODE==='development'?10:12;const free=s.bavail*s.bsize/2**30;console.log({freeGiB:free,peakAdditionalGiB:peak,requiredHeadroomGiB:5});if(free<peak+5)throw Error('Insufficient native build peak plus 5GiB headroom');"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@v4
        if: matrix.platform != 'windows'
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android compiler and existing debug signer
        if: matrix.platform != 'windows'
        shell: bash
        env:
          DEBUG_KEYSTORE: ${{ secrets.PANDO_ANDROID_DEBUG_KEYSTORE_B64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.PANDO_ANDROID_DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.PANDO_ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE"
          test -n "$DEBUG_STORE_PASSWORD"
          test -n "$DEBUG_KEY_PASSWORD"
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.3.13750724'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Install producer dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/web-shell install --ignore-workspace --frozen-lockfile
      - uses: ./.github/actions/library-data
        if: inputs.native_mode == 'offline' || inputs.native_mode == 'verification'
      - name: Check native contracts
        run: node --test apps/web-shell/tests/native-contract.test.mjs apps/web-shell/tests/native-build.test.mjs
      - name: Build only the requested execution mode
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_MODE: ${{ inputs.native_mode || 'development' }}
          NATIVE_TEST: ${{ inputs.scope == 'native-tests' && '--test-native' || '' }}
        shell: bash
        run: node apps/web-shell/packaged-artifacts.mjs --ci-build --platform="$NATIVE_PLATFORM" --mode="$NATIVE_MODE" $NATIVE_TEST
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ inputs.native_mode || 'development' }}-${{ github.sha }}
          path: build-native/native-artifacts/${{ matrix.platform }}/${{ inputs.native_mode || 'development' }}/
          if-no-files-found: error
          retention-days: 7
  plan:
    if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.scope, 'native')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
      core: ${{ steps.scope.outputs.core }}
      wasm: ${{ steps.scope.outputs.wasm }}
      gis_tools: ${{ steps.scope.outputs.gis_tools }}
      ui: ${{ steps.scope.outputs.ui }}
      objects: ${{ steps.scope.outputs.objects }}
      gis: ${{ steps.scope.outputs.gis }}
      places: ${{ steps.scope.outputs.places }}
      cmake_version: ${{ steps.scope.outputs.cmake_version }}
      emscripten_version: ${{ steps.scope.outputs.emscripten_version }}
      emsdk_ref: ${{ steps.scope.outputs.emsdk_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify the same pinned versions and selective scopes
        run: node --test tests/unit/p1-remote-scopes.test.mjs tests/unit/p4-python-isolation.test.mjs tests/unit/versioning-source-schema.test.mjs
      - name: Try shallow-fetching push/PR base for exact changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0{40}$ ]]; then
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
      - name: Plan only the affected checks
        id: scope
        env:
          PANDO_P1_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          PANDO_P1_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/p1-plan-remote-checks.mjs --github-output
  web-smoke:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select current application checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ github.sha }}
          CHECK_PROFILE: p1
          CHECK_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/run-application-checks.mjs --list --github-output
      - name: Install Chromium only for selected browser checks
        if: steps.plan.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install native GIS prerequisites only for selected data checks
        if: steps.plan.outputs.gis_native == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev zlib1g-dev pkg-config cmake
      - name: Execute the same checks as local development
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ github.sha }}
          CHECK_PROFILE: p1
          CHECK_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/run-application-checks.mjs --output "$RUNNER_TEMP/application-checks.json"
      - name: Upload application check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-application-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-checks.json
          if-no-files-found: warn
  native-core:
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ needs.plan.outputs.cmake_version }}
      - name: Install only standalone C++ requirements
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Configure, compile and test bounded C++ contracts
        run: |
          cmake --preset pando-core
          cmake --build --preset pando-core
          ctest --preset pando-core
  gis-cpp-tools:
    needs: plan
    if: needs.plan.outputs.gis_tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ needs.plan.outputs.cmake_version }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and smoke-test the GEOS-free GIS C++ normalizer
        run: |
          cmake --preset pando-gis-tools
          cmake --build --preset pando-gis-tools
          ctest --preset pando-gis-tools
  wasm-compile:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EMCC_CORES: "1"
      BINARYEN_CORES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ needs.plan.outputs.cmake_version }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: ${{ needs.plan.outputs.emsdk_ref }}
          path: build-native/emsdk
          persist-credentials: false
      - name: Compile common C++ sources with the pinned Emscripten version
        shell: bash
        env:
          EMSDK_VERSION: ${{ needs.plan.outputs.emscripten_version }}
        run: |
          build-native/emsdk/emsdk install "$EMSDK_VERSION"
          build-native/emsdk/emsdk activate "$EMSDK_VERSION"
          source build-native/emsdk/emsdk_env.sh
          emcc --version | head -1 | grep -F "$EMSDK_VERSION"
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm
      - name: Preserve the compiled WASM result without modifying Git
        uses: actions/upload-artifact@v4
        with:
          name: p1-wasm-${{ github.sha }}
          path: |
            build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
            build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.wasm
          if-no-files-found: error
          retention-days: 7
