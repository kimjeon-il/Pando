name: Read-only Git history size audit

on:
  push:
    branches: [maintenance/git-history-dryrun-20261013]
    paths:
      - '.github/workflows/git-history-size-audit.yml'
      - 'tools/git-history-dryrun.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/git-history-dryrun.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local rewrite tool
        shell: bash
        run: |
          echo "HISTORY_VENV=$RUNNER_TEMP/history-venv" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/history-venv"
          "$RUNNER_TEMP/history-venv/bin/pip" install --disable-pip-version-check 'git-filter-repo==2.47.0'
      - name: Audit full Git mirror and isolated rewritten copy
        shell: bash
        run: bash tools/git-history-dryrun.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pando-git-history-readonly-evidence
          path: ${{ runner.temp }}/pando-git-history-dryrun/evidence/
          retention-days: 30
          if-no-files-found: warn
