name: Read-only Git history size audit

on:
  push:
    branches: [maintenance/git-history-dryrun-20261013]
    paths:
      - '.github/workflows/git-history-size-audit.yml'
      - 'tools/git-history-dryrun.sh'
      - 'tools/git-history-dryrun.mjs'
      - 'tools/library-history*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/git-history-dryrun.sh
            tools/git-history-dryrun.mjs
            tools/library-history.mjs
            tools/library-history-stream.mjs
            tools/library-report-layout.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit full Git mirror and isolated rewritten copy
        shell: bash
        run: bash tools/git-history-dryrun.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pando-git-history-readonly-evidence
          path: ${{ runner.temp }}/pando-git-history-dryrun/evidence/
          retention-days: 30
          if-no-files-found: warn
