name: Read-only Git history size audit

# Past source migration or repository-history audit: manual, not a release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/git-history-dryrun.sh
            tools/data/git-history-dryrun.mjs
            tools/data/library-history.mjs
            tools/data/library-history-stream.mjs
            tools/data/library-report-layout.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit full Git mirror and isolated rewritten copy
        shell: bash
        run: bash tools/git-history-dryrun.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pando-git-history-readonly-evidence
          path: ${{ runner.temp }}/pando-git-history-dryrun/evidence/
          retention-days: 30
          if-no-files-found: warn
