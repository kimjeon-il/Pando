name: Pando reports cleanup verification

on:
  # Historical repository-inventory audit; explicit manual invocation only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate relocated color generator and focused historical GIS tests
        run: |
          node tools/build-country-default-colors.mjs --check
          node --test tests/unit/historical-german-coastline-events.test.mjs tests/unit/historical-netherlands-coast-phase0.test.mjs
      - name: Python syntax for maintained GIS generators
        run: |
          python -m compileall -q scripts/gis
          node --check tools/build-place-candidates.mjs
          python -m py_compile tools/build_north_schleswig_1914_001_026.py tools/audit_north_schleswig_1914_001_026.py tools/audit_north_schleswig_1914_stone26_split.py tools/build_german_empire_1914_modern_coast.py
      - name: Validate inventory and deleted legacy locations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths=set(subprocess.check_output(['git','ls-files','-z']).decode().strip('\x00').split('\x00'))
          reports=[p for p in paths if p.startswith('reports/')]
          assert len(reports)==1957, f'unexpected report count {len(reports)}'
          assert len([p for p in paths if p.startswith('reports/borders/reconstruction/siachen/')])==54
          assert not any(p.startswith('assets/data/research/siachen/') for p in paths)
          assert not any(p.startswith('native/') for p in paths)
          assert not any(p.startswith('.superpowers/') for p in paths)
          assert 'reports/places/source-manifest.json' in paths
          assert 'reports/borders/reconstruction/netherlands/phase0-current-representation-inventory.json' in paths
          for batch in range(152,195):
            for name in ('results.json','source-notes.json'):
              path=f'reports/hydro/names/reconstruction-2026-10-09/batch-r{batch}/{name}'
              assert path in paths, path
          print('PASS: report inventory and research evidence checked; no retired app or legacy copies')
          PY
      - name: Verify old and new report layout resolution
        run: |
          node --test tests/unit/report-paths.test.mjs

  web-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Web test dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify selected UI candidates
        run: |
          node --test tests/unit/adaptive-render-quality.test.mjs tests/unit/country-mesh-zoom-policy.test.mjs
          pnpm exec playwright test tests/browser/country-shared-boundary.spec.mjs tests/browser/startup-performance.spec.mjs --grep 'keeps precise|Android-density'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: migration-mobile-test-failures
          path: test-results/
          if-no-files-found: ignore
