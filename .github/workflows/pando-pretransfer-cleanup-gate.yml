name: Pando reports cleanup verification

on:
  # Historical repository-inventory audit; explicit manual invocation only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate relocated color generator and focused historical GIS tests
        run: |
          node tools/build-country-default-colors.mjs --check
          node --test tests/unit/historical-german-coastline-events.test.mjs tests/unit/historical-netherlands-coast-events.test.mjs
      - name: Python syntax for maintained GIS generators
        run: |
          python -m compileall -q scripts/gis
          node --check tools/build-place-candidates.mjs
          python -m py_compile tools/build_german_empire_1914_modern_coast.py
      - name: Validate application report ownership
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          for(const prefix of ['reports/','assets/data/research/siachen/','native/','.superpowers/'])
            assert(!paths.some(path=>path.startsWith(prefix)),`Application Git must not own ${prefix}`);
          console.log('PASS: application Git owns no report originals or retired local copies');
          JS
      - name: Verify canonical report paths and scoped publication
        run: |
          node --test tests/unit/report-paths.test.mjs tests/unit/library-report-publication.test.mjs

  web-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Web test dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify selected UI candidates
        run: |
          node --test tests/unit/adaptive-render-quality.test.mjs tests/unit/country-mesh-zoom-policy.test.mjs
          pnpm exec playwright test tests/browser/country-shared-boundary.spec.mjs tests/browser/startup-performance.spec.mjs --grep 'keeps precise|Android-density'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: migration-mobile-test-failures
          path: test-results/
          if-no-files-found: ignore
