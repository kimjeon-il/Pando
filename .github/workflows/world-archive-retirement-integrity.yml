name: World Archive Retirement Integrity

on:
  pull_request:
    paths:
      - 'assets/data/world-preview-v*.json'
      - 'assets/data/countries-preview-v*.geojson.gz'
      - 'assets/data/world-mesh-preview-v*.bin.gz'
      - 'assets/data/countries-canonical-v*.pcg.gz'
      - 'tests/unit/renderable-outline.test.mjs'
      - 'tests/unit/mesh-geometry-assets.test.mjs'
      - '.github/workflows/world-archive-retirement-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data/world-preview-v*.json'
      - 'assets/data/countries-preview-v*.geojson.gz'
      - 'assets/data/world-mesh-preview-v*.bin.gz'
      - 'assets/data/countries-canonical-v*.pcg.gz'
      - 'tests/unit/renderable-outline.test.mjs'
      - 'tests/unit/mesh-geometry-assets.test.mjs'
      - '.github/workflows/world-archive-retirement-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/unit/renderable-outline.test.mjs
            /tests/unit/mesh-geometry-assets.test.mjs
            /assets/js/modules/**
            /assets/data/world-mesh-v0.12.6.bin.gz
            /assets/data/world-mesh-preview-v0.36.0.bin.gz
            /assets/data/countries-preview-v0.36.0.geojson.gz
            /assets/data/world/current.json
            /assets/data/world/build-input.json
            /assets/data/world-preview-v0.36.0.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current and pinned dependencies and retired Git paths
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const tracked = new Set(execFileSync('git',['ls-tree','-r','--name-only','HEAD'],{encoding:'utf8'}).split('\n'));
          const json=p=>JSON.parse(readFileSync(p,'utf8'));
          const bundle=json('assets/data/world/current.json');
          const seed=json('assets/data/world/build-input.json');
          const active=json('assets/data/world-preview-v0.36.0.json');
          assert.equal(seed.legacyPreviewManifest,'world-preview-v0.36.0.json');
          assert.equal(active.version,'0.36.0');
          const required=new Set([
            'assets/data/world/current.json','assets/data/world/build-input.json',
            'assets/data/world-preview-v0.36.0.json',
            'assets/data/terrain/v0.12.6/manifest.json',
            'assets/data/hydro/v0.13.2/hydro.bin',
            'assets/data/countries-preview-shared-v0.34.0.json.gz',
            'assets/data/countries-canonical-shared-v0.34.0.json.gz',
            'assets/data/countries-canonical-v0.35.0.pcg.gz',
            'assets/data/world-preview-v0.35.0.json'
          ]);
          for(const entry of Object.values(bundle.assets||{}))required.add('assets/data/'+entry.url);
          required.add('assets/data/'+bundle.source.url);
          for(const entry of Object.values(active.assets||{}))required.add('assets/data/'+entry.url);
          for(const path of required)assert(tracked.has(path),'Missing active/pinned Git path: '+path);
          const retired=[];
          for(const v of ['0.30.0','0.31.0','0.32.0','0.34.0'])for(const stem of [
            ['world-preview','.json'],['countries-preview','.geojson.gz'],
            ['world-mesh-preview','.bin.gz'],['countries-canonical','.pcg.gz']
          ]){const path='assets/data/'+stem[0]+'-v'+v+stem[1];if(tracked.has(path))retired.push(path)}
          assert.deepEqual(retired,[],'Historical bundles must not leak into publication');
          console.log('Active pin integrity passed: '+required.size+' paths; all four retired version groups absent');
          NODE
      - name: Verify original current preview geometry and mesh assertions
        run: node --test tests/unit/renderable-outline.test.mjs tests/unit/mesh-geometry-assets.test.mjs
