name: Project-selected world archive integrity

on:
  pull_request:
    paths:
      - 'projects/**'
      - 'config/library-data.json'
      - '.github/actions/library-data/**'
      - 'tools/data/library-*.mjs'
      - 'tools/build/build-world-bundle.mjs'
      - 'scripts/lib/frontend-build.mjs'
      - 'scripts/lib/product-assets.mjs'
      - 'src/data/runtime-manifest-assets.js'
      - 'src/data/map-project-manifest.js'
      - '.github/workflows/world-archive-retirement-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'config/library-data.json'
      - '.github/actions/library-data/**'
      - 'tools/build/build-world-bundle.mjs'
      - 'src/data/runtime-manifest-assets.js'
      - '.github/workflows/world-archive-retirement-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - name: Verify only project-selected pinned runtime closure
        run: |
          test -z "$(git ls-files assets/data)"
          node scripts/generate-build-metadata.mjs --check --product=viewer
          node --test tests/unit/data/map-project-manifest.test.mjs tests/unit/data/frontend-runtime-closure.test.mjs
