name: Main core repair source snapshot

on:
  push:
    branches: [work/ui]
    paths: [.github/workflows/main-core-repair-source.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35bce38a3444c57bcaf60a9a12d30421e6602740
          persist-credentials: false
      - name: Archive exact tracked main source without library data or history
        run: |
          test "$(git rev-parse HEAD)" = 35bce38a3444c57bcaf60a9a12d30421e6602740
          test -z "$(git status --porcelain)"
          mkdir -p build-native/core-repair-source
          git archive --format=tar HEAD > build-native/core-repair-source/main-source.tar
          git rev-parse HEAD > build-native/core-repair-source/source-commit.txt
          sha256sum build-native/core-repair-source/main-source.tar > build-native/core-repair-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: main-core-repair-source-35bce38a
          path: build-native/core-repair-source/
          if-no-files-found: error
          retention-days: 1
