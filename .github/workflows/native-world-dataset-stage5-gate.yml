name: Web/App Territorial Dataset Stage 5 Gate

on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/native-world-dataset-stage5-gate.yml'
      - 'native/assets/territorial-library-v2/**'
      - 'native/tools/compare-territorial-library.mjs'
      - 'native/tools/territorial-library-crosscheck.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  territorial-catalog-crosscheck:
    name: Pinned Web identity and historical catalog semantic drift
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout the exact Web source pinned by the native catalog
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: ebcfae4d27b29cbbea6416a7045a4806930204be
          path: native/pinned-web
          persist-credentials: false
          sparse-checkout: |
            assets/data/territorial-entities/generated/v2
      - name: Checkout the exact current Web revision under audit
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: a47c4c54655a802a64679a679fc7fa8a576bee56
          path: native/audited-web
          persist-credentials: false
          sparse-checkout: |
            assets/data/territorial-entities/generated/v2
      - name: Unit test the read-only crosscheck
        run: |
          node --check tools/compare-territorial-library.mjs
          node --test tools/territorial-library-crosscheck.test.mjs
      - name: Verify the App catalog exactly matches its approved Web source
        run: |
          node tools/compare-territorial-library.mjs --app-root assets/territorial-library-v2 --web-root pinned-web/assets/data/territorial-entities/generated/v2 --web-ref ebcfae4d27b29cbbea6416a7045a4806930204be --app-ref "$GITHUB_SHA" --gate exact --output reports/stage5-pinned-source.json
      - name: Audit newer Web snapshot without copying or modifying App assets
        run: |
          node tools/compare-territorial-library.mjs --app-root assets/territorial-library-v2 --web-root audited-web/assets/data/territorial-entities/generated/v2 --web-ref a47c4c54655a802a64679a679fc7fa8a576bee56 --app-ref "$GITHUB_SHA" --gate lifetime-only --output reports/stage5-current-web.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-web-territorial-stage5
          if-no-files-found: warn
          path: native/reports/stage5-*.json

  qt-native-catalog:
    name: Offline Qt historical catalog and editor integration
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - name: Configure and build focused historic tests
        run: |
          cmake -S . -B build-stage5 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build-stage5 --parallel 2 --target territorial_library_catalog_tests territorial_catalog_controller_tests
      - name: Verify pinned native catalog and editor transactions offline
        run: |
          ctest --test-dir build-stage5 --output-on-failure -R '^(territorial_library_catalog_tests|territorial_catalog_controller_tests)$'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-territorial-qt-stage5-failure
          if-no-files-found: ignore
          path: |
            native/build-stage5/Testing/Temporary/LastTest.log
            native/build-stage5/CMakeFiles/CMakeConfigureLog.yaml
