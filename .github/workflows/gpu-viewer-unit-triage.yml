name: GPU viewer source regression triage (no deployment)
on:
  push:
    branches: [work/ui]
    paths: [.github/workflows/gpu-viewer-unit-triage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply reviewed GPU candidate and frame admission corrections to throwaway checkout
        run: |
          node tests/helpers/prepare-gpu-recovery-candidate.mjs
          node tests/helpers/gpu-recovery-viewer-fix.mjs
          node tests/helpers/gpu-recovery-viewer-admission-fix.mjs
      - name: Reproduce exactly which focused regressions remain red
        run: |
          set +e
          node --test --test-reporter=tap \
            tests/helpers/gpu-recovery-viewer-progress.test.mjs \
            tests/helpers/gpu-recovery-viewer-admission.test.mjs \
            tests/helpers/gpu-recovery-viewer-presentation.test.mjs \
            tests/unit/gpu-shared-pass-initialization.test.mjs \
            tests/unit/gpu-resource-owners.test.mjs \
            tests/unit/map-render-coordinator.test.mjs \
            tests/unit/gpu-renderer-lifecycle.test.mjs \
            tests/unit/map-content-presentation.test.mjs > /tmp/gpu-unit-all.tap 2>&1
          code=$?
          set -e
          echo "FOCUSED EXIT: $code"
          grep -n -A 27 -B 2 '^not ok ' /tmp/gpu-unit-all.tap || true
          tail -n 16 /tmp/gpu-unit-all.tap
          exit "$code"
