name: P0 P1 isolated failing-unit remediation
# Only the explicit six repair suites. No deployments or broad CI.
on:
  push:
    branches: [fix/p0-gl-state-contract-20261112]
    paths: [.github/workflows/p0-p1-repair-focused-once.yml]
permissions:
  contents: read
jobs:
  focused-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Syntax for the modified Workers and test contracts
        run: |
          node --check src/rendering/canvas-inline-worker.js
          node --check src/rendering/workers/canvas-render-core.js
          node --check tests/unit/rendering/canvas-inline-worker.test.mjs
          node --check tests/unit/rendering/canvas-country-geometry.test.mjs
      - name: Validate Canvas recovery coverage after restored source contracts
        run: >-
          node --test --test-concurrency=2
          tests/unit/rendering/canvas-country-geometry.test.mjs
          tests/unit/rendering/canvas-inline-worker.test.mjs
          tests/unit/rendering/gpu-helper-utils.test.mjs
          tests/unit/rendering/gpu-resource-owners.test.mjs
          tests/unit/rendering/hydro-reliability-source.test.mjs
          tests/unit/rendering/selection-fill-handoff.test.mjs
