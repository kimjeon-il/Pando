name: GIS Baikonur USGS Landsat signed-access audit (no image download)
on:
  push:
    branches: [ work/gis ]
    paths:
      - 'tools/gis/probe-baikonur-planetary-landsat.mjs'
      - '.github/workflows/gis-baikonur-planetary-landsat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-usgs-access-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch only public-domain Landsat STAC metadata and ephemeral signed COG HEAD
        run: |
          node tools/gis/probe-baikonur-planetary-landsat.mjs \
            --output "$RUNNER_TEMP/baikonur-usgs-planetary-scenes.json"
      - name: Confirm no raster or unapproved riverbank geometry was published
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/baikonur-usgs-planetary-scenes.json'));
          assert.equal(report.sections.length,2);
          assert.equal(report.tokenOrSignedUrlSaved,false);
          assert.equal(report.imagePixelsDownloaded,false);
          assert.equal(report.geometryPublished,false);
          assert.equal(report.rightBankReconstructed,false);
          assert(!JSON.stringify(report).includes('sig='));
          console.log('USGS_INDEPENDENT_BAIKONUR_AUDIT='+JSON.stringify({
            sections:report.sections.map(x=>({pair:x.treatyPointPair,result:x.result,
              candidates:x.candidateSceneCount,access:x.signedPixelReadTestStatus,
              sourceError:x.failureClass||null}))}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: gis-baikonur-usgs-planetary-scenes-no-tokens
          path: ${{ runner.temp }}/baikonur-usgs-planetary-scenes.json
          retention-days: 21
          if-no-files-found: error
