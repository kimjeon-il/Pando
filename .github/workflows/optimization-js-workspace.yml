name: Optimization JS workspace preparation
on:
  push:
    branches: [work/optimization]
    paths: [.github/workflows/optimization-js-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare exact tracked source and JavaScript dependencies only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pando-js-workspace"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/head"
          { git rev-parse HEAD; git rev-list --objects HEAD^{tree} | cut -d' ' -f1; } | git pack-objects --stdout > "$out/source.pack"
          tar -czf "$out/node_modules.tar.gz" node_modules
          cp "$(command -v node)" "$out/node"
          cd "$out"
          sha256sum head source.pack node_modules.tar.gz node > SHA256SUMS
          du -sh .
      - uses: actions/upload-artifact@v4
        with:
          name: optimization-js-workspace
          path: ${{ runner.temp }}/pando-js-workspace/
          retention-days: 1
          if-no-files-found: error
