name: G4 GPU presentation-scene TDD (no deployment)
on:
  push:
    branches: [work/ui]
    paths: [.github/workflows/gpu-recovery-presentation-scene.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reproduce unintended scene replacement during presentation
        run: |
          set +e
          node --test tests/helpers/gpu-recovery-presentation-scene.test.mjs > /tmp/gpu-scene-red.tap 2>&1
          status=$?
          set -e
          cat /tmp/gpu-scene-red.tap
          test "$status" -eq 1
          grep -q 'ERR_ASSERTION' /tmp/gpu-scene-red.tap
          ! grep -Eq 'ERR_MODULE_NOT_FOUND|ReferenceError|SyntaxError|TypeError' /tmp/gpu-scene-red.tap
      - name: Apply minimal production-code candidate in disposable checkout
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const file='shared/frontend/js/modules/map-content-presentation.js';
          const source=readFileSync(file,'utf8');
          const before=`    countries.replaceGpuSceneDomain?.('country-overlays', {
      polygons: pendingPolygons,
      strokes: pendingStrokes,
    });
    countries.syncGpuRenderScene?.();`;
          assert.equal(source.split(before).length,2,'Review source before changing scene presentation boundary');
          const after=`    if (!presentationOnly) {
      countries.replaceGpuSceneDomain?.('country-overlays', {
        polygons: pendingPolygons,
        strokes: pendingStrokes,
      });
      countries.syncGpuRenderScene?.();
    }`;
          writeFileSync(file,source.replace(before,after));
          NODE
      - name: Verify scene safety and existing rendering regression
        run: |
          node --check shared/frontend/js/modules/map-content-presentation.js
          node --test tests/helpers/gpu-recovery-presentation-scene.test.mjs tests/unit/map-content-presentation.test.mjs
