name: Objects temporal cursor reuse verified
on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/objects-timeline-cursor-verification.yml'
      - 'shared/core/src/timeline-view.cpp'
      - 'shared/core/src/document-session.cpp'
      - 'shared/core/src/project.cpp'
      - 'shared/core/include/pandoeditor/timeline-view.h'
      - 'shared/core/include/pandoeditor/document-session.h'
      - 'shared/core/include/pandoeditor/project.h'
      - 'shared/tests/document-session-tests.cpp'
      - 'shared/tests/temporal-editing-tests.cpp'
      - 'shared/wasm/session-bindings.cpp'
      - 'assets/js/modules/core-document-runtime.js'
      - 'assets/wasm/pandoeditor-core.manifest.json'
      - 'tests/unit/core-document-runtime.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check pinned generated C++/WASM identity
        run: node tools/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - name: Install native core prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Build core timeline and document session tests (no Qt)
        run: |
          cmake -S . -B build-native/timeline-cursor-reuse -G Ninja -DCMAKE_BUILD_TYPE=Release -DPANDO_BUILD_VARIANT=core -DBUILD_TESTING=ON
          cmake --build build-native/timeline-cursor-reuse --target temporal_editing_tests document_session_tests --parallel 2
          ctest --test-dir build-native/timeline-cursor-reuse -R '^(temporal_editing_tests|document_session_tests)$' --output-on-failure
      - name: Verify existing JS/WASM contracts, no redundant Core world query
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/assets/wasm/pandoeditor-core.js
        run: |
          node --test tests/unit/core-document-runtime.test.mjs tests/unit/core-document-client.test.mjs
          node --test tests/unit/core-document-world-wasm.test.mjs shared/tests/wasm-document-session.test.mjs
  browser-timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install pinned browser dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install real Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify historical month selection, country changes, Undo and saved reopening
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: pnpm exec playwright test tests/browser/historical-world-timeline.spec.mjs tests/browser/timeline-persistence.spec.mjs tests/browser/temporal-editing.spec.mjs --workers=1 --retries=0 --trace off
      - name: Preserve failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-cursor-browser-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
