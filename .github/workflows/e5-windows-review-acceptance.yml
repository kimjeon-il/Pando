name: E5 Windows read-only reviewer acceptance

on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/e5-windows-review-acceptance.yml
      - apps/editor/stage.mjs
      - apps/editor/native-producer.mjs
      - apps/editor/native-contract.mjs
      - apps/editor/tests/native-platform-adapter.test.mjs
      - apps/editor/review-probe.js
      - apps/editor/verify-review-windows.ps1
      - apps/editor/src-tauri/**
      - apps/viewer/js/viewer.js
      - apps/viewer/js/modules/viewer-composition.js
      - apps/viewer/js/modules/viewer-review-panel.js
      - shared/frontend/js/modules/product-mode-policy.js
      - shared/frontend/js/modules/resource-capabilities.js
      - shared/frontend/js/modules/project-session.js
      - shared/frontend/js/modules/map-owner-composition.js
      - shared/frontend/js/modules/map-workspace-host.js
      - tests/unit/e5-windows-review.test.mjs
      - tests/browser/windows-review-e5.spec.mjs
      - tests/browser/server.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5-review-${{ github.sha }}
  cancel-in-progress: false

jobs:
  e5-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-core-prerequisite.mjs
      - name: Lint Windows reviewer and test boundaries
        run: >-
          pnpm exec eslint
          apps/viewer/js/viewer.js
          apps/viewer/js/modules/viewer-composition.js
          apps/viewer/js/modules/viewer-review-panel.js
          shared/frontend/js/modules/product-mode-policy.js
          shared/frontend/js/modules/resource-capabilities.js
          shared/frontend/js/modules/project-session.js
          shared/frontend/js/modules/map-owner-composition.js
          shared/frontend/js/modules/map-workspace-host.js
          apps/editor/stage.mjs
          apps/editor/native-producer.mjs
          apps/editor/native-contract.mjs
          apps/editor/review-probe.js
          apps/editor/tests/native-platform-adapter.test.mjs
          tests/unit/e5-windows-review.test.mjs
          tests/browser/windows-review-e5.spec.mjs
          tests/browser/server.mjs
      - name: Verify review-only map, Core, E2/E3/E4 and native contracts
        run: >-
          node --test --test-concurrency=2
          tests/unit/e5-windows-review.test.mjs
          tests/unit/viewer-globe-only.test.mjs
          tests/unit/core-product-mode.test.mjs
          tests/unit/project-product-surface.test.mjs
          tests/unit/map-readonly-flat-boundary.test.mjs
          tests/unit/review-inspection.test.mjs
          apps/editor/tests/native-contract.test.mjs
          apps/editor/tests/native-build.test.mjs
          apps/editor/tests/native-platform-adapter.test.mjs
      - run: node scripts/check-runtime-boundaries.mjs

  e5-browser:
    needs: e5-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise flat native review and unchanged public globe
        run: >-
          pnpm exec playwright test
          tests/browser/windows-review-e5.spec.mjs
          tests/browser/viewer-review-e4.spec.mjs
          --workers=1 --retries=0 --reporter=list
      - name: Preserve E5 browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e5-review-browser-failure-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  e5-windows-native:
    needs: e5-contract
    runs-on: windows-2022
    timeout-minutes: 85
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Preserve checked-in source bytes on NTFS
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - name: Verify native build free space and headroom
        shell: pwsh
        run: >-
          node -e "const s=require('node:fs').statfsSync('.');const free=s.bavail*s.bsize/2**30;
          console.log({freeGiB:free,requiredGiB:17});if(free<17)throw Error('Insufficient native build headroom')"
      - uses: ./.github/actions/library-data
      - name: Prepare pinned frontend and Windows Tauri dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/editor install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows reviewer and validate Rust commands
        shell: pwsh
        run: |
          node apps/editor/packaged-artifacts.mjs --ci-build --platform=windows --mode=verification --test-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute actual Windows WebView2/Core read-only acceptance
        shell: pwsh
        run: |
          ./apps/editor/verify-review-windows.ps1 -BinaryPath 'build-native/native-artifacts/windows/verification/pandolab-web-shell.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows GUI and native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-windows-review-native-${{ github.sha }}
          path: |
            build-native/e5-windows/windows-review-probe.json
            build-native/e5-windows/windows-review-stderr.txt
            build-native/e5-windows/windows-review-stdout.txt
            build-native/native-artifacts/windows/verification/native-artifact.json
          if-no-files-found: warn
          retention-days: 14
