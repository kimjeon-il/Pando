# Explicit GIS/source-data reproduction; lightweight source checks remain in gis-python-p4.yml.
name: Siachen Sentinel-2 optical comparison
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
          persist-credentials: true
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax and install geospatial packages
        run: |
          python -m py_compile scripts/research/siachen/compare_sentinel2_saltoro.py
          python -m pip install --quiet requests numpy rasterio pyproj shapely matplotlib
      - name: Retrieve Sentinel-2 and make georeferenced comparison
        run: python scripts/research/siachen/compare_sentinel2_saltoro.py
      - name: Verify provenance, georegistration and generated assets
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from report_paths import report_path
          import json
          from pathlib import Path
          p=report_path("reports/borders/reconstruction/siachen", access="read")
          x=json.loads((p/'siachen_s2_optical_comparison.json').read_text())
          assert set(x['scenes']) == {'2025','2026'}
          for year,record in x['scenes'].items():
              assert record['item_id'] and record['datetime'].startswith(year)
              for region,v in record['images'].items():
                  assert (p/v['path']).stat().st_size>25000
                  assert v['quality']['clear_fraction'] >= .55
              assert set(record['images']) == {'sia_la','bilafond_north'}
          print('PASS optical output integrity and per-AOI quality')
          PY
      - name: Commit only research data
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/siachen_s2_*_optical.png
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/siachen_s2_optical_comparison.json
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/README_s2_optical.md
          if ! git diff --cached --quiet; then
            git commit -m "research: record Sentinel-2 georeferenced optical comparisons"
            git fetch origin work/gis
            git rebase origin/work/gis
            git push origin HEAD:work/gis
          fi
      - name: Resolve branch report artifacts
        run: echo "PANDO_REPORT_ARTIFACTS=$(python tools/report_paths.py reports/borders/reconstruction/siachen --access read)" >> "$GITHUB_ENV"
      - name: Upload optical image and source data
        uses: actions/upload-artifact@v4
        with:
          name: siachen-sentinel2-optical
          path: |
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_s2_*_optical.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_s2_optical_comparison.json
            ${{ env.PANDO_REPORT_ARTIFACTS }}/README_s2_optical.md
