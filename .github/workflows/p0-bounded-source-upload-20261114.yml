name: P0 bounded source and GL upload regression (one shot)
# Repeat after upload-family and frame-cost attribution.
on:
  push:
    branches: [work/p0-world-stream-frame-budget-20261114]
    paths: [.github/workflows/p0-bounded-source-upload-20261114.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify current-world byte identity and WebGL2 upload state ownership
        run: node --test tests/core/current-world-stream.test.mjs tests/core/gpu-polygon-upload.test.mjs
