name: P0 state ledger recovery source-matched baseline/candidate
# One-shot focused causal check; identical runner and Chromium for both sources.
on:
  push:
    branches: ['work/p0-gl-state-20261112']
    paths: ['.github/workflows/p0-gl-state-recovery-ab.yml']
permissions:
  contents: read
jobs:
  recovery-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Same-run original main vs ledger context-loss acceptance
        shell: bash
        run: |
          set -uo pipefail
          BASE_SHA=87763ec1c231484c2d3787f49056f3f9f918a97d
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          echo "P0_RECOVERY_SOURCE_PAIR $BASE_SHA $CANDIDATE_SHA"
          test "$(git show "$BASE_SHA:config/library-data.json" | sha256sum | cut -d' ' -f1)" = "$(sha256sum config/library-data.json | cut -d' ' -f1)" || exit 10
          for label in baseline candidate; do
            sha="$BASE_SHA"
            if [ "$label" = candidate ]; then sha="$CANDIDATE_SHA"; fi
            git switch --detach "$sha"
            set +e
            pnpm exec playwright test tests/browser/rendering/viewer-renderer-recovery.spec.mjs --workers=1 --grep 'viewer acceptance webgl2: repeated real recovery' > "$RUNNER_TEMP/${label}-recovery.log" 2>&1
            status=$?
            set -e
            echo "$status" > "$RUNNER_TEMP/${label}-status.txt"
            echo "P0_RECOVERY_${label}_STATUS=$status"
            grep -E 'tests using|passed|failed|VIEWER_ACCEPTANCE|Timeout|Error:' "$RUNNER_TEMP/${label}-recovery.log" | cut -c 1-360 | tail -n 12 || true
            rm -rf test-results/ playwright-report/
          done
          git switch --detach "$CANDIDATE_SHA"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const base=Number(readFileSync(process.env.RUNNER_TEMP+'/baseline-status.txt','utf8').trim());
          const candidate=Number(readFileSync(process.env.RUNNER_TEMP+'/candidate-status.txt','utf8').trim());
          const report={baselineSha:'87763ec1c231484c2d3787f49056f3f9f918a97d',
            candidateSha:process.env.GITHUB_SHA,identicalPinnedData:true,
            sameRunner:true,focusedTest:'viewer acceptance webgl2 repeated real recovery',
            baselineExit:base,candidateExit:candidate};
          writeFileSync(process.env.RUNNER_TEMP+'/recovery-compare.json',JSON.stringify(report,null,2)+'\n');
          console.log('P0_RECOVERY_PAIR '+JSON.stringify(report));
          if(candidate)process.exitCode=1;
          NODE
      - name: Retain both original recovery test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-recovery-source-pair-${{ github.sha }}
          path: |
            ${{ runner.temp }}/baseline-recovery.log
            ${{ runner.temp }}/candidate-recovery.log
            ${{ runner.temp }}/baseline-status.txt
            ${{ runner.temp }}/candidate-status.txt
            ${{ runner.temp }}/recovery-compare.json
          if-no-files-found: warn
          retention-days: 14
