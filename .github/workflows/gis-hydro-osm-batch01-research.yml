name: GIS OSM replacement research batch 01

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/verify-osm-hydro-batch01-anchors.mjs'
      - 'tools/gis/hydro-osm-batch01-anchors.mjs'
      - 'tools/gis/hydro-point-screen-native.mjs'
      - 'tools/gis/hydro-numeric.mjs'
      - 'tools/cpp/hydro/point-screen.cpp'
      - 'tools/cpp/CMakeLists.txt'
      - 'tools/gis/probe-finnish-hydro.mjs'
      - 'tools/gis/bounded-source-json.mjs'
      - 'tests/unit/finnish-hydro-probe.test.mjs'
      - '.github/workflows/gis-hydro-osm-batch01-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-ten-independent-stations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the paired data revision
        id: hydro-data-pin
        run: node -e "console.log('revision='+require('./config/library-data.json').revision)" >> "$GITHUB_OUTPUT"
      - name: Fetch only the pinned Hydro bundle
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: ${{ steps.hydro-data-pin.outputs.revision }}
          path: .pando-hydro-input
          persist-credentials: false
          filter: blob:none
          sparse-checkout: assets/data/hydro/v0.13.2
      - name: Build the read-only native point screen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev ninja-build
          cmake -S tools/cpp -B build-native/hydro-point-screen -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON
          cmake --build build-native/hydro-point-screen --target pando-hydro-point-screen
          node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/pando-hydro-point-screen --directory build-native/hydro-point-screen/artifact
      - name: Decode exactly the public HydroRIVERS version with the production decoder
        run: node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/batch01-decoded.json
      - name: Measure every first-ten system against independent named stations
        run: |
          node tools/gis/verify-osm-hydro-batch01-anchors.mjs \
            --decoded /tmp/batch01-decoded.json \
            --output /tmp/batch01-independent-stations.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('/tmp/batch01-independent-stations.json','utf8'));
          const expected=['10521208','10526283','20071308','20075401','20282318','20456598','20532766','20540915','20561290','20565620'];
          assert.deepEqual(j.items.map(row=>row.systemId),expected);
          assert.deepEqual(j,JSON.parse(readFileSync('tests/fixtures/hydro-osm-batch01-v0132-expected.json','utf8')));
          assert.equal(j.osmSourcesNotUsed,true);assert.equal(j.metadataNotModified,true);
          assert(j.items.every(row=>row.independentStations.length>=2));
          console.log('Independent spatial screen of all 10 pending systems succeeded, no name applied');
          JS
      - name: Probe Finland NLS national INSPIRE river-vector read-only endpoint
        shell: bash
        run: |
          node tools/gis/probe-finnish-hydro.mjs --output /tmp/batch01-finnish-api-probe.json
          node --test tests/unit/finnish-hydro-probe.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gis-osm-batch01-independent-evidence
          path: |
            /tmp/batch01-independent-stations.json
            /tmp/batch01-finnish-api-probe.json
          retention-days: 30
          if-no-files-found: warn
