name: GIS natural-surface representative tiles and immutable external loading
on:
  push:
    branches: [work/gis]
    paths: ['.github/workflows/gis-natural-surface-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pando-natural-surface-preview
  cancel-in-progress: false
jobs:
  representative:
    if: github.repository == 'kimjeon-il/Pando' && github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_PATH: terrain/natural/v0.1.0-preview.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Focused canonical data and existing presentation regression checks
        env:
          CHECK_SELECTION: '{"unitTests":["tests/unit/data/terrain-natural-surface.test.mjs","tests/unit/data/terrain-external-source.test.mjs","tests/unit/rendering/terrain-numeric-color.test.mjs","tests/unit/rendering/canvas-dem-theme-cache.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: |
          mkdir -p "$RUNNER_TEMP/natural-proof"
          node scripts/run-application-checks.mjs --phase non-browser --output "$RUNNER_TEMP/natural-proof/unit.json"
      - name: Checkout existing external data work branch without runtime datasets
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: work/gis
          path: .natural-library
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: Check isolated target and bounded peak storage before acquisition
        env:
          LIBRARY_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$LIBRARY_TOKEN"
          test "$(git branch --show-current)" = 'work/gis'
          test -z "$(git -C .natural-library status --porcelain)"
          if git -C .natural-library cat-file -e "HEAD:$CANDIDATE_PATH" 2>/dev/null; then
            echo 'Immutable preview edition already exists; no overwrite or automatic replacement.'
            exit 1
          fi
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 8589934592
          git -C .natural-library rev-parse HEAD > "$RUNNER_TEMP/natural-proof/library-before.txt"
      - name: Acquire NASA unshaded Base Map and record acquisition identity
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --connect-timeout 30 --max-time 300 --max-filesize 41943040 \
            'https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/july/world.200407.3x21600x10800.jpg' \
            --output "$RUNNER_TEMP/natural-source.jpg"
          test "$(stat -c%s "$RUNNER_TEMP/natural-source.jpg")" -eq 21125326
          sha256sum "$RUNNER_TEMP/natural-source.jpg" > "$RUNNER_TEMP/natural-proof/source-acquisition.sha256"
          echo "NATURAL_SOURCE_SHA=$(cut -d' ' -f1 "$RUNNER_TEMP/natural-proof/source-acquisition.sha256")" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded offline image dependency on CI only
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Validate gutters and generate only the nine representative natural tiles
        run: |
          set -euo pipefail
          python tools/gis/build-natural-surface-samples.py --self-test > "$RUNNER_TEMP/natural-proof/gutter.json"
          python tools/gis/build-natural-surface-samples.py \
            --source "$RUNNER_TEMP/natural-source.jpg" --source-sha256 "$NATURAL_SOURCE_SHA" \
            --output "$RUNNER_TEMP/natural-preview" > "$RUNNER_TEMP/natural-proof/generation.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {validateNaturalSurfaceManifest} from './src/data/terrain-manifest.js';
          const root=process.env.RUNNER_TEMP+'/natural-preview';
          const raw=JSON.parse(readFileSync(root+'/manifest.json','utf8'));
          assert.equal(Object.keys(raw.tiles).length,9);
          assert.equal(raw.sources[0].sha256,process.env.NATURAL_SOURCE_SHA);
          validateNaturalSurfaceManifest({...raw,sourceRevision:'0'.repeat(40)},raw);
          for(const [key,entry] of Object.entries(raw.tiles)){
            const bytes=readFileSync(root+'/'+key);
            assert.equal(bytes.length,entry.bytes);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),entry.sha256);
          }
          console.log('REPRESENTATIVE_TILE_CONTRACT_OK');
          JS
      - name: Store new source and candidate on external work/gis only
        env:
          LIBRARY_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .natural-library/terrain/natural/sources
          cp -a "$RUNNER_TEMP/natural-preview" ".natural-library/$CANDIDATE_PATH"
          cp "$RUNNER_TEMP/natural-source.jpg" ".natural-library/terrain/natural/sources/$NATURAL_SOURCE_SHA.jpg"
          git -C .natural-library add --sparse -- "$CANDIDATE_PATH" "terrain/natural/sources/$NATURAL_SOURCE_SHA.jpg"
          git -C .natural-library diff --cached --check
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const token=process.env.LIBRARY_TOKEN,dir='.natural-library';assert(token);
          const env={...process.env,GIT_CONFIG_COUNT:'1',GIT_CONFIG_KEY_0:'http.https://github.com/.extraheader',
            GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+Buffer.from('x-access-token:'+token).toString('base64')};
          const git=args=>execFileSync('git',['-C',dir,...args],{env,encoding:'utf8',timeout:300000}).trim();
          const before=readFileSync(process.env.RUNNER_TEMP+'/natural-proof/library-before.txt','utf8').trim();
          assert.equal(git(['rev-parse','HEAD']),before);
          assert.equal(git(['ls-remote','--exit-code','origin','refs/heads/work/gis']).split(/\s+/)[0],before,
            'External work/gis changed; preserve concurrent work and stop without force');
          const files=git(['diff','--cached','--name-only']).split('\n');
          assert.equal(files.length,12);
          assert(files.every(path=>path.startsWith(process.env.CANDIDATE_PATH+'/')
            || path==='terrain/natural/sources/'+process.env.NATURAL_SOURCE_SHA+'.jpg'));
          git(['-c','user.name=Pando natural terrain builder','-c','user.email=pando-terrain@users.noreply.github.com',
            'commit','-m','data(terrain): preserve NASA-based natural-color representative preview']);
          const revision=git(['rev-parse','HEAD']);
          git(['push','origin','HEAD:refs/heads/work/gis']);
          assert.equal(git(['ls-remote','--exit-code','origin','refs/heads/work/gis']).split(/\s+/)[0],revision);
          writeFileSync(process.env.RUNNER_TEMP+'/natural-proof/library-revision.txt',revision+'\n');
          console.log('NATURAL_LIBRARY_REVISION='+revision);
          JS
      - name: Read every stored tile through existing terrain fetch and hash verification
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {validateNaturalSurfaceManifest,terrainNaturalTileRequest,fetchTerrainTile} from './src/data/terrain-manifest.js';
          const base=process.env.RUNNER_TEMP+'/natural-proof';
          const revision=readFileSync(base+'/library-revision.txt','utf8').trim();
          const rawUrl=`https://raw.githubusercontent.com/kimjeon-il/PandoLab-library-data/${revision}/${process.env.CANDIDATE_PATH}/manifest.json`;
          const response=await fetch(rawUrl,{signal:AbortSignal.timeout(30000)});
          assert(response.ok,'Remote natural manifest unavailable');
          const raw=await response.json();
          assert.deepEqual(raw,JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natural-preview/manifest.json','utf8')));
          const admitted=validateNaturalSurfaceManifest({...raw,sourceRevision:revision},raw);
          const manifest={...raw,naturalSurface:admitted};
          const files=[];
          for(const [key,entry] of Object.entries(admitted.tiles)){
            const [,level,column,row]=/^(\d+)\/(\d+)-(\d+)\.webp$/.exec(key).map(Number);
            const spec={level,column,row,pixelWidth:entry.pixelWidth-2,pixelHeight:entry.pixelHeight-2};
            const request=terrainNaturalTileRequest(spec,manifest);
            const blob=await fetchTerrainTile(request,{signal:AbortSignal.timeout(30000)});
            assert.equal(blob.size,entry.bytes);
            assert.equal(terrainNaturalTileRequest(spec,manifest,{physicalStyle:'political'}),null);
            assert.equal(terrainNaturalTileRequest(spec,manifest,{pass:'ocean'}),null);
            files.push({key,bytes:blob.size,sha256:entry.sha256});
          }
          const receipt={status:'verified-external-representative-only',revision,tiles:files,
            sourceSha256:raw.sources[0].sha256,sourceObservation:raw.referenceDate,
            viewerDisplayIntegrated:false,landcoverAndIceMasksIntegrated:false,mainChanged:false,operationalPinChanged:false};
          writeFileSync(base+'/external-readback.json',JSON.stringify(receipt,null,2)+'\n');
          writeFileSync(base+'/bound-natural-manifest.json',JSON.stringify(admitted,null,2)+'\n');
          console.log('NATURAL_EXTERNAL_READBACK='+JSON.stringify(receipt));
          JS
      - name: Keep scoped generation and readback receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-surface-representative-evidence
          path: ${{ runner.temp }}/natural-proof/*
          if-no-files-found: warn
          retention-days: 14
