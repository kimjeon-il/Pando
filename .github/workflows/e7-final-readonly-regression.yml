name: E7 final Web and Windows read-only regression
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/e7-final-readonly-regression.yml
      - scripts/contracts/application-checks.json
      - apps/viewer/**
      - apps/editor/src-tauri/**
      - apps/editor/stage.mjs
      - apps/editor/native-producer.mjs
      - apps/editor/native-contract.mjs
      - apps/editor/review-probe.js
      - apps/editor/verify-review-windows.ps1
      - shared/frontend/js/**
      - tests/browser/viewer-review-e4.spec.mjs
      - tests/browser/windows-review-e5.spec.mjs
      - tests/browser/viewer-boundary-p4-5.spec.mjs
      - tests/browser/viewer-latest-year-p3-1.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e7-final-readonly-${{ github.sha }}
  cancel-in-progress: false

jobs:
  e7-contract:
    name: C++ Core, E2-E6 review contracts, and retired runtime perimeter
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify authoritative C++ temporal runtime
        run: node scripts/check-core-prerequisite.mjs
      - name: Lint current review/model/Windows boundary code
        run: >-
          pnpm exec eslint
          apps/viewer/js/viewer.js
          apps/viewer/js/modules/viewer-composition.js
          apps/viewer/js/modules/viewer-review-panel.js
          shared/frontend/js/modules/review-change-records.js
          shared/frontend/js/modules/review-inspection.js
          shared/frontend/js/modules/review-evidence-files.js
          shared/frontend/js/modules/product-mode-policy.js
          shared/frontend/js/modules/map-owner-composition.js
          apps/editor/stage.mjs
          apps/editor/native-producer.mjs
          apps/editor/native-contract.mjs
          apps/editor/review-probe.js
          tests/browser/viewer-review-e4.spec.mjs
          tests/browser/windows-review-e5.spec.mjs
          tests/browser/viewer-boundary-p4-5.spec.mjs
          tests/browser/viewer-latest-year-p3-1.spec.mjs
      - name: Test E2-E6 read-only and native packaging contracts
        run: >-
          node --test --test-concurrency=2
          tests/unit/review-change-records.test.mjs
          tests/unit/review-inspection.test.mjs
          tests/unit/e3-revision-diff.test.mjs
          tests/unit/e5-windows-review.test.mjs
          tests/unit/core-product-mode.test.mjs
          tests/unit/frontend-layout.test.mjs
          tests/unit/frontend-build.test.mjs
          tests/unit/brand-icons.test.mjs
          tests/unit/brand-platforms.test.mjs
          tests/unit/map-readonly-flat-boundary.test.mjs
          tests/unit/viewer-composition-recovery.test.mjs
          apps/editor/tests/stage.test.mjs
          apps/editor/tests/stage-world.test.mjs
          apps/editor/tests/native-contract.test.mjs
          apps/editor/tests/native-build.test.mjs
          apps/editor/tests/native-launch.test.mjs
      - name: Validate current test registry without running retired/manual suites
        shell: bash
        run: node scripts/run-application-checks.mjs --list --base HEAD > /dev/null
      - name: Confirm editor and Android remain excluded from distributable Viewer and native IPC
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/editor/src-tauri/android
          test ! -e apps/editor/src-tauri/gen/android
          test ! -e apps/editor/src-tauri/src/library_commands.rs
          test ! -e apps/editor/src-tauri/src/document_transfer.rs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {buildFrontendIndex} from './scripts/lib/frontend-layout.mjs';
          const paths=[...buildFrontendIndex(process.cwd()).keys()];
          assert.ok(paths.includes('assets/js/viewer.js'));
          assert.equal(paths.some(x=>x.startsWith('shell/')||x==='assets/js/bootstrap.js'||x==='assets/js/app.js'),false);
          assert.equal(paths.some(x=>x.includes('gis-gpkg-worker.js')||x.includes('map-edit-worker.js')),false);
          const rust=readFileSync('apps/editor/src-tauri/src/lib.rs','utf8');
          for(const symbol of ['document_transfer::','library_commands::','TransferManager::'])assert.equal(rust.includes(symbol),false);
          const cap=JSON.parse(readFileSync('apps/editor/src-tauri/capabilities/prototype-review.json','utf8'));
          assert.deepEqual([...cap.permissions].sort(),['allow-save-review-correction','allow-write-diagnostic-report'].sort());
          console.log(JSON.stringify({viewerSharedAssets:paths.length,retiredEntrypoints:0,retiredNativeIpc:0}));
          NODE

  e7-browser:
    name: Chromium WebGL/Canvas, mobile, read-only E4/E5 and latest-year regression
    needs: e7-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise E4 review, E5 flat viewer, WebGL country borders and dated map
        run: >-
          pnpm exec playwright test
          tests/browser/viewer-review-e4.spec.mjs
          tests/browser/windows-review-e5.spec.mjs
          tests/browser/viewer-boundary-p4-5.spec.mjs
          tests/browser/viewer-latest-year-p3-1.spec.mjs
          --workers=1 --retries=0 --reporter=list
      - name: Retain browser regression screenshots/traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e7-browser-failure-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  e7-windows-native:
    name: Real Windows 2022 Tauri/WebView2 read-only Core acceptance
    needs: e7-contract
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Preserve checked-in NTFS/UTF-8 inputs
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - name: Check Windows runner build space
        shell: pwsh
        run: >-
          node -e "const s=require('node:fs').statfsSync('.');const n=s.bavail*s.bsize/2**30;console.log({freeGiB:n});if(n<17)throw Error('Insufficient native build headroom')"
      - uses: ./.github/actions/library-data
      - name: Install locked Web and Tauri build dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/editor install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build post-E6 Windows reviewer and validate real Rust commands
        shell: pwsh
        run: |
          node apps/editor/packaged-artifacts.mjs --ci-build --platform=windows --mode=verification --test-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute real WebView2 map/panel/Core read-only verification
        shell: pwsh
        run: |
          ./apps/editor/verify-review-windows.ps1 -BinaryPath 'build-native/native-artifacts/windows/verification/pandolab-web-shell.exe' -OutputDirectory 'build-native/e7-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm runtime and immutable native artifact belong to current Git SHA
        shell: pwsh
        run: |
          $r = Get-Content 'build-native/e7-windows/windows-review-probe.json' -Raw | ConvertFrom-Json
          $a = Get-Content 'build-native/native-artifacts/windows/verification/native-artifact.json' -Raw | ConvertFrom-Json
          if ($a.sourceCommit -ne $env:GITHUB_SHA -or $a.mode -ne 'verification' -or $a.platform -ne 'windows') { throw 'Native identity differs from source' }
          if ($r.embeddedBuild.sourceCommit -ne $env:GITHUB_SHA -or -not $r.ok -or $r.phase -ne 'read-only-map-ready') { throw 'WebView2 runtime identity or status mismatch' }
          if ($r.observed.projection -ne 'flat' -or -not $r.observed.readOnly -or -not $r.observed.mutationBlocked -or $r.observed.canUndo -ne $false) { throw 'Review mode mutation boundary failed' }
          Write-Output ('E7 native WebView2 source-pinned review PASS: ' + $env:GITHUB_SHA)
      - name: Retain actual Windows GUI and binary identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e7-windows-webview2-${{ github.sha }}
          path: |
            build-native/e7-windows/windows-review-probe.json
            build-native/e7-windows/windows-review-stderr.txt
            build-native/e7-windows/windows-review-stdout.txt
            build-native/native-artifacts/windows/verification/native-artifact.json
          if-no-files-found: warn
          retention-days: 14
