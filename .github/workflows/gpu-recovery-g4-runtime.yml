name: GPU G4 actual browser verification (no deployment)
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/gpu-recovery-g4-runtime.yml
      - tests/fixtures/gpu-recovery/**
      - tests/helpers/prepare-gpu-recovery-candidate.mjs
      - tests/helpers/gpu-recovery-source-harness.mjs
      - tests/browser/gpu-recovery-g4.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-g4-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        product: [viewer, editor]
    env:
      G4_EVIDENCE: gpu-g4-evidence
      G4_PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Mount the unchanged paired library revision
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply guarded candidate in CI only
        run: node tests/helpers/prepare-gpu-recovery-candidate.mjs
      - name: Required shared-pass source regression
        id: unit
        continue-on-error: true
        run: node --test tests/unit/gpu-shared-pass-initialization.test.mjs > gpu-g4-evidence/shared-pass.tap 2>&1
      - name: Lint candidate sources
        id: lint
        continue-on-error: true
        run: pnpm exec eslint shared/frontend/js/modules/gpu-map-renderer.js shared/frontend/js/modules/gpu-context-recovery.js > gpu-g4-evidence/lint.txt 2>&1
      - name: Install the repository-pinned browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual full product screen regression
        id: screen
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: gpu-g4-evidence/playwright.json
        run: pnpm exec playwright test tests/browser/gpu-recovery-g4.spec.mjs --workers=1 --retries=0 --grep "${G4_PRODUCT} " --reporter=list,json
      - name: Preserve exact validation outcomes
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          SCREEN_RESULT: ${{ steps.screen.outcome }}
        run: |
          mkdir -p gpu-g4-evidence
          node --input-type=module -e 'import{writeFileSync}from"node:fs";writeFileSync("gpu-g4-evidence/outcomes.json",JSON.stringify({sourceCommit:process.env.GITHUB_SHA,product:process.env.G4_PRODUCT,unit:process.env.UNIT_RESULT,lint:process.env.LINT_RESULT,screen:process.env.SCREEN_RESULT,nativeVerified:false,hardwareGpuVerified:false,phoneVerified:false,productionIntegrated:false,deploy:false},null,2));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-g4-${{ matrix.product }}-${{ github.sha }}
          path: |
            gpu-g4-evidence
            test-results
          retention-days: 7
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
      - name: Fail unless all executed verification gates passed
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          SCREEN_RESULT: ${{ steps.screen.outcome }}
        run: test "$UNIT_RESULT" = success && test "$LINT_RESULT" = success && test "$SCREEN_RESULT" = success
