name: Integration R4 GIS W2 - Stage 1

on:
  push:
    branches:
      - integration/r4-gis-w2-20261103
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integration-r4-gis-w2-stage1.yml'
      - 'docs/development/integration-r4-gis-w2-stage0-stage1-2026-11-03.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-r4-gis-w2-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gis-python-contracts:
    name: GIS source and interpreter retirement contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the frozen integration baseline as an ancestor
        run: git merge-base --is-ancestor b917ddb7485f4bab3446aa31050270f5b2aa7a45 HEAD
      - name: Validate zero owned interpreter code and active GIS boundaries
        run: |
          node --test \
            tests/unit/gis-source-isolation.test.mjs \
            tests/unit/gis-source-launcher.test.mjs \
            tests/unit/p1-hydro-source-receipts.test.mjs
      - name: Prove source generator dispatch is non-mutating without execute
        run: |
          node scripts/gis/run-source.mjs --task hydro-tiles
          node scripts/gis/run-source.mjs --task terrain-dem

  cpp-core-gis:
    name: Native C++ Core and GIS preset smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libgeos-dev libproj-dev libgdal-dev zlib1g-dev pkg-config
      - name: Mount the library pinned by this exact source commit
        uses: ./.github/actions/library-data
      - name: Configure, build, and test the current Core preset
        run: |
          cmake --preset pando-core
          cmake --build --preset pando-core
          ctest --preset pando-core
      - name: Configure, build, and test the current GIS tools preset
        run: |
          cmake --preset pando-gis-tools
          cmake --build --preset pando-gis-tools
          ctest --preset pando-gis-tools
