name: Builtin country publication contracts

on:
  # Preserved as a focused publication/archival audit; shared CI selects ordinary tests.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builtin-country-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check space before preparing paired read-only test dependencies
        shell: bash
        run: |
          set -euo pipefail
          free_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$free_kib" -ge 10485760 || { echo 'Need dependency cache space plus 5 GiB headroom'; exit 1; }
      - name: Prepare the pinned runtime used by the existing country compiler
        uses: ./.github/actions/library-data
      - name: Verify generation and direct loading only; do not regenerate or publish library data
        run: node --test --test-timeout=15000 tests/unit/data/builtin-country-publication.test.mjs tests/unit/data/historical-world-publication.test.mjs tests/unit/document/builtin-world-catalog.test.mjs tests/unit/data/builtin-world-loader.test.mjs tests/unit/data/builtin-country-loading.test.mjs
