name: DEM Terrain Preview Gate

on:
  push:
    branches: [main, work/gis]
    paths:
      - 'assets/data/terrain-preview/**'
      - 'assets/js/**terrain**'
      - 'assets/js/modules/gpu-map-renderer.js'
      - 'tools/*terrain-preview*'
      - 'tests/**/terrain-preview*'
      - 'src/rendering/gpu-map-renderer.js'
      - 'src/app/viewer-map.js'
      - 'src/app/viewer-composition.js'
      - 'src/app/viewer-initial-presentation.js'
      - 'tests/browser/document/viewer-project-open.spec.mjs'
      - 'tests/browser/document/viewer-calendar.spec.mjs'
      - 'src/rendering/gpu-base-scene-pass.js'
      - 'src/app/startup-readiness.js'
      - 'src/rendering/workers/canvas-render-worker.js'
      - 'src/rendering/workers/canvas-terrain-dem-core.js'
      - 'tests/unit/rendering/canvas-country-geometry.test.mjs'
      - 'tests/unit/rendering/canvas-terrain-independence.test.mjs'
      - 'tests/unit/rendering/gpu-base-scene-order.test.mjs'
      - 'tests/unit/rendering/map-presentation-readiness.test.mjs'
      - 'tests/browser/geometry/viewer-startup-and-terrain.spec.mjs'
      - '.github/workflows/terrain-preview-gate.yml'
  pull_request:
    paths:
      - 'assets/data/terrain-preview/**'
      - 'assets/js/**terrain**'
      - 'tools/*terrain-preview*'
      - 'tests/**/terrain-preview*'
      - 'src/rendering/gpu-map-renderer.js'
      - 'src/app/viewer-map.js'
      - 'src/app/viewer-composition.js'
      - 'src/app/viewer-initial-presentation.js'
      - 'tests/browser/document/viewer-project-open.spec.mjs'
      - 'tests/browser/document/viewer-calendar.spec.mjs'
      - 'src/rendering/gpu-base-scene-pass.js'
      - 'src/app/startup-readiness.js'
      - 'src/rendering/workers/canvas-render-worker.js'
      - 'src/rendering/workers/canvas-terrain-dem-core.js'
      - 'tests/unit/rendering/canvas-country-geometry.test.mjs'
      - 'tests/unit/rendering/canvas-terrain-independence.test.mjs'
      - 'tests/unit/rendering/gpu-base-scene-order.test.mjs'
      - 'tests/unit/rendering/map-presentation-readiness.test.mjs'
      - 'tests/browser/geometry/viewer-startup-and-terrain.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PANDO_TERRAIN_PREVIEW_BINARY: ${{ github.workspace }}/build-native/terrain-preview/pando-terrain-preview
      PANDO_TERRAIN_PREVIEW_DIRECTORY: ${{ github.workspace }}/build-native/terrain-preview/artifact
      PANDO_MAP_IMAGE_ARTIFACT: ${{ github.workspace }}/build-native/map-image/artifact
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Rebuild the fixed DEM preview and verify current terrain assets
        run: |
          cmake -S tools/cpp/terrain -B build-native/terrain-preview -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native/terrain-preview --target pando-terrain-preview
          node tools/gis/package-terrain-preview.mjs --binary "$PANDO_TERRAIN_PREVIEW_BINARY" --directory "$PANDO_TERRAIN_PREVIEW_DIRECTORY"
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          cmake --build build-native/map-image --target pando-map-image --parallel 2
          node tools/map-image/package-native.mjs --binary build-native/map-image/pando-map-image --directory "$PANDO_MAP_IMAGE_ARTIFACT"
          node tools/build/build-terrain-preview.mjs --rebuild-check
          node tools/checks/check-terrain-preview.mjs --out terrain-preview-evidence.json
          node --test tests/unit/geometry/terrain-preview-native.test.mjs tests/unit/geometry/terrain-preview-audit.test.mjs tests/unit/build/terrain-preview-builder.test.mjs
          node --test tests/unit/geometry/terrain-preview-audit.test.mjs tests/unit/rendering/physical-layer-service.test.mjs tests/unit/rendering/canvas-country-geometry.test.mjs
          node --test tests/unit/rendering/canvas-terrain-independence.test.mjs tests/unit/rendering/gpu-scene-staging.test.mjs
      - name: Check actual WebGL and Canvas display paths with fixed terrain responses
        run: |
          pnpm install --frozen-lockfile
          node --test tests/unit/rendering/gpu-canvas-worker.test.mjs tests/unit/rendering/gpu-base-scene-order.test.mjs tests/unit/rendering/map-presentation-readiness.test.mjs
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test tests/browser/document/viewer-calendar.spec.mjs --grep 'webgl 1280px dedicated temporal path|Canvas user-file opening retains full document admission after a builtin delta transition' --workers=1 --output=viewer-date-browser
          pnpm exec playwright test tests/browser/document/viewer-project-open.spec.mjs --grep 'viewer opens the real editor GeoPackage' --output=viewer-gpkg-browser
          pnpm exec playwright test tests/browser/geometry/terrain-preview.spec.mjs --output=terrain-preview-browser
          pnpm exec playwright test tests/browser/geometry/viewer-startup-and-terrain.spec.mjs --grep 'WebGL publishes an actual physical country frame before optional terrain detail resolves' --output=webgl-initial-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-preview-evidence
          path: |
            terrain-preview-evidence.json
            terrain-preview-browser
            webgl-initial-browser
            viewer-date-browser
            viewer-gpkg-browser
