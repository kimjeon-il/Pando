name: Focused integration of optimization with main
on:
  push:
    branches: [work/optimization-main-merge-20261110]
    paths: [.github/workflows/main-integration-focused-checks.yml]
permissions:
  contents: write
jobs:
  contract-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: pnpm}
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: syntax
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node --check src/rendering/workers/gpu-mesh-worker.js
          node --check tools/build/stage-monorepo-pages.mjs
          node --check tests/helpers/frontend-pages-fixture.mjs
          node --check tests/unit/document/monorepo-pages-staging.test.mjs
          node --check src/rendering/workers/gpu-mesh-core.js
          node --check src/rendering/workers/polygon-raster-contract.js
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint \
            src/rendering/workers/gpu-mesh-worker.js \
            src/rendering/workers/gpu-mesh-core.js \
            src/rendering/workers/polygon-raster-contract.js \
            tools/build/stage-monorepo-pages.mjs \
            tests/helpers/frontend-pages-fixture.mjs \
            tests/unit/document/monorepo-pages-staging.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/merge-lint.log"
      - id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=30000 \
            tests/unit/document/monorepo-pages-staging.test.mjs \
            tests/unit/build/frontend-build.test.mjs \
            tests/unit/data/map-project-runtime.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/merge-tests.log"
      - name: Record exact integration check outcomes in this validation branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),branch=context.ref.replace('refs/heads/','');
            const read=name=>{const p=process.env.RUNNER_TEMP+'/merge-'+name+'.log';
              return fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(-20000):'not executed';};
            const result={sourceCommit:context.sha,
              install:'${{ steps.install.outcome }}',syntax:'${{ steps.syntax.outcome }}',
              lint:'${{ steps.lint.outcome }}',tests:'${{ steps.tests.outcome }}',
              logs:{lint:read('lint'),tests:read('tests')}};
            const path='validation-results/main-optimization-merge.json';
            let sha;try{sha=(await github.rest.repos.getContent({
              owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha;}
            catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch,
              ...(sha?{sha}:{}),
              message:'test: record focused main optimization integration result',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')});
      - name: Require focused contracts
        if: always()
        run: |
          test '${{ steps.syntax.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
