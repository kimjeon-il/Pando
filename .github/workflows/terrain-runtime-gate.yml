name: Project-selected terrain and Canvas contract

on:
  pull_request:
    paths:
      - 'projects/**'
      - 'src/rendering/**terrain**'
      - 'src/rendering/gpu-map-renderer.js'
      - 'src/rendering/gpu-base-scene-pass.js'
      - 'src/rendering/workers/canvas-render-worker.js'
      - 'src/data/physical-resources.js'
      - 'tests/unit/rendering/terrain-tile-selection-shared.test.mjs'
      - '.github/workflows/terrain-runtime-gate.yml'
  push:
    branches: [main, work/optimization]
    paths:
      - 'projects/**'
      - 'src/rendering/**terrain**'
      - 'src/rendering/gpu-map-renderer.js'
      - 'src/data/physical-resources.js'
      - '.github/workflows/terrain-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare pinned external DEM, land and selected map catalog
        uses: ./.github/actions/library-data
      - name: Verify pinned terrain and runtime source consistency
        run: node scripts/generate-build-metadata.mjs --check --product=viewer
      - name: Verify shared terrain LOD, Canvas and GPU display contracts
        run: >-
          node --test
          tests/unit/rendering/terrain-tile-selection-shared.test.mjs
          tests/unit/rendering/canvas-terrain-independence.test.mjs
          tests/unit/rendering/gpu-base-scene-order.test.mjs
