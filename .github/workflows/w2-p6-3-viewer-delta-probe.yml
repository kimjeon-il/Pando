name: W2-P6-3 pinned Viewer immutable geometry delta pilot
on:
  push:
    branches: [work/ui]
    paths:
      - tools/w2-p6-3-boundary-delta-sender.mjs
      - tools/w2-p6-3-worker-bridge.mjs
      - tools/w2-p6-3-browser-delta-probe.mjs
      - .github/workflows/w2-p6-3-viewer-delta-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w2-p6-3-browser-delta-pilot
  cancel-in-progress: true
jobs:
  delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only exact measurement-source checkout
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: fe8282ba32761ab9586348d1712e11cc1f4e7882
          path: .w2-p6-fixed
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Verify exact source/library pin, script syntax and JS lint
        run: |
          test "$(git -C .w2-p6-fixed rev-parse HEAD)" = fe8282ba32761ab9586348d1712e11cc1f4e7882
          node --check tools/w2-p6-3-browser-delta-probe.mjs
          pnpm exec eslint tools/w2-p6-3-browser-delta-probe.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise pinned actual Viewer full → delta and original Worker output
        env:
          PANDOLAB_P6_PINNED_SOURCE: .w2-p6-fixed
          PANDOLAB_P6_OUTPUT: test-results/w2-p6-3
          PANDOLAB_P6_PORT: '4253'
          PANDOLAB_P6_REPETITIONS: '1'
        run: node --max-old-space-size=6144 tools/w2-p6-3-browser-delta-probe.mjs
      - name: Preserve every original run and byte-level frame/packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-p6-3-immutable-country-delta-viewer-pilot
          path: test-results/w2-p6-3/
          if-no-files-found: warn
          retention-days: 14
