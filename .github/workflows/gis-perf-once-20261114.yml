name: GIS performance verification (one shot)
on:
  push:
    branches: [work/gis]
    paths: [.github/workflows/gis-perf-once-20261114.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'kimjeon-il/Pando'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Node regression checks, only physical masks and uploads
        run: node scripts/run-application-checks.mjs --group=node --test-name-pattern="physical relief keeps|GPU upload queue prioritizes"
      - name: Prepare pinned Viewer data metadata
        run: node tools/data/library-data.mjs --prepare-metadata
      - name: Prepare Chromium in CI
        run: pnpm exec playwright install --with-deps chromium
      - name: Append runner-only measurement scenario
        run: |
          cat >> tests/browser/viewer.spec.mjs <<'GISTEST'
          
          for (const profile of [
            {name:'desktop',viewport:{width:1280,height:800}},
            {name:'mobile-viewport',viewport:{width:390,height:844}},
          ]) test('GIS performance actual Viewer '+profile.name,async({page},info)=>{
            test.setTimeout(440_000);
            const {writeFileSync}=await import('node:fs');
            const data={schema:'pando-gis-performance-v1',commit:process.env.GITHUB_SHA,
              profile:profile.name,viewport:profile.viewport,actualMobileHardware:false,
              gpuTimerMeasured:false,gpuVramMeasured:false,startup:{},records:[],errors:[],warnings:[]};
            page.on('pageerror',e=>data.errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')data.warnings.push(m.text().slice(0,300));});
            async function snapshot(){
              const out=await page.evaluate(()=>{
                const v=window.__PANDOLAB_VIEWER__;
                if(!v)return {missingViewer:true};
                const s=v.rendererStats(),p=s.polygonOverlay||{},u=s.gpuUpload||{},t=s.mapReadiness||{};
                return {renderer:s.renderer,firstPresented:v.initialMapPresented(),
                  statusReady:document.querySelector('#viewerStatus')?.dataset.ready,
                  mapReady:t.mapReady,terrainReady:t.terrainReady,terrainStatus:t.status,
                  displayedRevision:s.displayedRevision,projectRenderBlocked:s.projectRenderBlocked,
                  scale:s.screenScale,dpr:s.effectivePixelRatio,quality:s.renderQuality?.tier,
                  targetLevel:s.terrainTargetLevel,renderedLevel:s.terrainRenderedLevel,
                  tilesLoaded:s.terrainTargetTilesLoaded,tilesExpected:s.terrainTargetTileCount,
                  terrainBytes:s.terrainCacheBytes,terrainOverBudget:s.terrainCacheOverBudgetBytes,
                  managedGpuBytes:s.managedGpuBytes,polygonBytes:p.activeBufferBytes,
                  physicalBaseBytes:p.physicalBaseBufferBytes,optionalOverlayBytes:p.optionalOverlayBufferBytes,
                  stagingBytes:p.stagingBufferBytes,polygonBudget:p.resourceBudget,
                  largestPolygonResources:p.largestResources,
                  strokeBytes:s.stroke?.activeBufferBytes,
                  upload:{pending:u.pending,completed:u.completed,cancelled:u.cancelled,
                    maxFrameMs:u.maxFrameMs,overrunCount:u.overrunCount,maxQueueWaitMs:u.maxQueueWaitMs},
                  screenLodTargetKey:s.screenLodTargetKey,screenLodPreparingKey:s.screenLodPreparingKey,
                  screenLodFailure:s.screenLodFailure,drawCalls:s.webGlLastFrameSceneDrawCalls};
              });
              const cdp=await page.context().newCDPSession(page);
              try{
                await cdp.send('Performance.enable');
                const values=(await cdp.send('Performance.getMetrics')).metrics;
                const metrics=Object.fromEntries(values.map(row=>[row.name,row.value]));
                return {...out,jsHeapUsedBytes:metrics.JSHeapUsedSize??null,
                  cpuTaskDurationSeconds:metrics.TaskDuration??null};
              }finally{await cdp.detach();}
            }
            async function frameGaps(zoom,durationMs=3500){
              return page.evaluate(({zoom,durationMs})=>new Promise(resolve=>{
                const h=window.__PANDOLAB_MAP_HOST__,v=h.getViewState();
                const started=performance.now(),samples=[];let previous=started;
                h.setViewState({projection:'globe',view:{...v,globeRotation:[-106,-30,0],globeZoom:zoom}});
                h.requestRepaint('gis-performance-'+zoom);
                function tick(t){
                  samples.push(t-previous);previous=t;
                  if(t-started<durationMs){requestAnimationFrame(tick);return;}
                  samples.sort((a,b)=>a-b);
                  const q=p=>samples.length?Math.round(samples[Math.min(samples.length-1,Math.ceil(samples.length*p)-1)]*100)/100:null;
                  resolve({sampleCount:samples.length,elapsedMs:performance.now()-started,
                    p50:q(.5),p95:q(.95),p99:q(.99),max:q(1),
                    gapsOver50:samples.filter(x=>x>50).length,
                    gapsOver1000:samples.filter(x=>x>1000).length});
                }
                requestAnimationFrame(tick);
              }),{zoom,durationMs});
            }
            try{
              await page.setViewportSize(profile.viewport);
              const start=Date.now();
              await page.goto('./?debug=1',{waitUntil:'domcontentloaded'});
              const ready=await expect.poll(()=>page.evaluate(()=>{
                const v=window.__PANDOLAB_VIEWER__,s=v?.rendererStats();
                return !!v?.initialMapPresented()&&!!s?.mapReadiness?.mapReady
                  &&s.displayedRevision>0&&document.querySelector('#viewerStatus')?.dataset.ready==='true';
              }),{timeout:180_000,intervals:[500,1000,2000]}).toBe(true).then(()=>true,()=>false);
              data.startup={ready,elapsedMs:Date.now()-start,snapshot:await snapshot()};
              console.log('GIS_STARTUP '+profile.name+' '+JSON.stringify(data.startup));
              if(!ready)throw Error('Initial map not ready');
              for(const zoom of [1,8,16,32]){
                const gaps=await frameGaps(zoom),state=await snapshot();
                const settled=state.terrainReady===true&&!state.screenLodPreparingKey
                  &&Number(state.tilesLoaded||0)>=Number(state.tilesExpected||0);
                data.records.push({zoom,frameGaps:gaps,snapshot:state,terrainSettled:settled});
                console.log('GIS_ZOOM '+profile.name+' '+zoom+' '+JSON.stringify({
                  maxGapMs:gaps.max,p95Ms:gaps.p95,polygonBytes:state.polygonBytes,
                  physicalBaseBytes:state.physicalBaseBytes,optionalBytes:state.optionalOverlayBytes,
                  stagingBytes:state.stagingBytes,managedGpuBytes:state.managedGpuBytes,
                  uploadPending:state.upload?.pending,terrainSettled:settled}));
              }
              await page.locator('canvas.gpu-map-canvas').first()
                .screenshot({path:info.outputPath('gis-perf-'+profile.name+'-32x.png')});
              expect(data.errors).toEqual([]);
            }catch(error){data.error=error.stack||String(error);throw error;}
            finally{writeFileSync(info.outputPath('gis-perf-'+profile.name+'.json'),JSON.stringify(data,null,2));}
          });
          GISTEST
      - name: Real Chromium desktop and mobile viewport measurements
        run: pnpm exec playwright test tests/browser/viewer.spec.mjs --grep "GIS performance actual Viewer" --workers=1 --retries=0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-performance-actual-measurements
          path: |
            test-results/**/gis-perf-*.json
            test-results/**/gis-perf-*.png
          if-no-files-found: warn
          retention-days: 7
