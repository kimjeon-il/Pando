name: Place V2 Snapshot Parity
on:
  push:
    branches:
      - work/places
    paths:
      - 'native/assets/place/**'
      - 'native/contracts/places/**'
      - 'reports/places/**'
      - 'native/reports/places/**'
      - 'native/tools/place-runtime-contract/**'
      - 'native/app/placenamedisplay.*'
      - 'native/app/placeruntimestore.*'
      - 'native/app/placeruntimeprovider.*'
      - 'native/app/editorplace.cpp'
      - 'native/app/editorpresentation.cpp'
      - 'native/app/editorcontroller.h'
      - 'native/app/editorview.cpp'
      - 'native/app/CMakeLists.txt'
      - 'native/engine/include/pandoeditor/map/labelengine.h'
      - 'native/engine/src/labelengine.cpp'
      - 'native/ui/common/MapDisplayControls.qml'
      - 'native/ui/common/MapView.qml'
      - 'native/tests/place_sync_contract_tests.cpp'
      - '.github/workflows/native-place-v2-parity.yml'
  pull_request:
    paths:
      - 'native/assets/place/**'
      - 'native/contracts/places/**'
      - 'reports/places/**'
      - 'native/reports/places/**'
      - 'native/tools/place-runtime-contract/**'
      - '.github/workflows/native-place-v2-parity.yml'
      - 'native/app/placenamedisplay.*'
      - 'native/app/placeruntimestore.*'
      - 'native/app/placeruntimeprovider.*'
      - 'native/app/editorplace.cpp'
      - 'native/app/editorpresentation.cpp'
      - 'native/app/editorcontroller.h'
      - 'native/app/editorview.cpp'
      - 'native/app/CMakeLists.txt'
      - 'native/engine/include/pandoeditor/map/labelengine.h'
      - 'native/engine/src/labelengine.cpp'
      - 'native/ui/common/MapDisplayControls.qml'
      - 'native/ui/common/MapView.qml'
      - 'native/tests/place_sync_contract_tests.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-v2-snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare native mirror with pinned Web
        run: node --test tools/place-runtime-contract/v2-snapshot.test.mjs
      - name: Exercise live Web parity comparison logic without network
        run: node --test tools/place-runtime-contract/live-web-parity.test.mjs
      - name: Detect drift from Web files in this commit
        run: node tools/place-runtime-contract/live-web-parity.mjs

  native-place-v2:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - name: Configure Qt Debug
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build focused app/native place targets
        run: cmake --build build --parallel 2 --target place_sync_contract_tests place_runtime_store_tests place_runtime_provider_tests place_controller_tests place_label_collision_tests
      - name: Run focused native place regressions
        run: ctest --test-dir build --output-on-failure -R '^(place_sync_contract_tests|place_runtime_store_tests|place_runtime_provider_tests|place_controller_tests|place_label_collision_tests)$'
