name: Integration R4 E4 E5 retired-editor elimination
on:
  push:
    branches: [integration/r4-gis-w2-20261103]
    paths:
      - '.github/workflows/integration-r4-e4-e5.yml'
      - 'apps/editor/frontend/**'
      - 'apps/editor/templates/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/development/r4-source-pruning.json'
      - 'docs/development/r4e0-source-dispositions.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect exact old-source external blockers before deletion
        shell: bash
        run: |
          mkdir -p test-results
          node scripts/r4e0-dependency-audit.mjs --check --output test-results/r4e4-e5-dependency-map.json
          node --input-type=module <<'NODE'
          import {buildR4E0Map} from './scripts/r4e0-dependency-audit.mjs';
          const audit=buildR4E0Map(), owners=new Map(), files=new Map();
          for (const row of audit.records) for (const blocker of row.blocking) {
            const k=blocker.owner||'other';
            if(!owners.has(k))owners.set(k,new Set());
            owners.get(k).add(blocker.from);
            if(!files.has(blocker.from))files.set(blocker.from,[]);
            files.get(blocker.from).push(row.path);
          }
          console.log('R4_E4_BLOCKERS_JSON '+JSON.stringify({
            summary:audit.summary, errors:audit.errors,
            ownerCounts:Object.fromEntries([...owners].map(([k,v])=>[k,v.size])),
            affectedSources:[...files].map(([from,to])=>({from,count:to.length,owners:[...new Set(audit.records.flatMap(row=>row.blocking.filter(x=>x.from===from).map(x=>x.owner)))]})).sort((a,b)=>a.from.localeCompare(b.from)),
            dynamic:audit.unresolvedExpressions.slice(0,15),
          }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-e4-e5-dependency-evidence-${{ github.sha }}
          path: test-results/r4e4-e5-dependency-map.json
          if-no-files-found: warn
          retention-days: 14
