name: GIS OSM replacement research batch 02

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/verify_osm_hydro_batch02_points.py'
      - 'tools/gis/probe-nga-streams.mjs'
      - 'tools/gis/probe-central-asia-gauges.mjs'
      - 'tools/gis/bounded-source-json.mjs'
      - 'tests/unit/hydro-nga-source-probe.test.mjs'
      - 'tests/unit/hydro-central-asia-probe.test.mjs'
      - '.github/workflows/gis-hydro-osm-batch02-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-source-batch02:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mount paired, published Hydro v0.13.2
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install independent geometry projection software
        run: python -m pip install --quiet "shapely>=2,<3" "pyproj>=3,<4"
      - name: Test bounded independent-source acquisition
        run: node --test tests/unit/hydro-nga-source-probe.test.mjs tests/unit/hydro-central-asia-probe.test.mjs
      - name: Decode Hydro exactly with production runtime
        run: node tools/decode-hydro-connectivity.mjs assets/data/hydro/v0.13.2 /tmp/batch02-decoded.json
      - name: Query NGA US government non-OSM named-stream locations
        run: node tools/gis/probe-nga-streams.mjs --output /tmp/batch02-nga.json
      - name: Acquire checksum-verified 2023 Central Asia scientific Hydromet gauge locations
        run: node tools/gis/probe-central-asia-gauges.mjs --output /tmp/batch02-ca-gauges.json
      - name: Compare all 10 pending river mainstems against real independent locations
        run: |
          python tools/gis/verify_osm_hydro_batch02_points.py \
            --decoded /tmp/batch02-decoded.json \
            --external-gauges /tmp/batch02-ca-gauges.json \
            --nga /tmp/batch02-nga.json \
            --output /tmp/batch02-source-independent-point-audit.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync('/tmp/batch02-source-independent-point-audit.json','utf8'));
          assert.equal(receipt.studyCount,10);assert.equal(receipt.originalVersion,'0.13.2');
          assert.equal(receipt.publishedHydroGeometryChanged,false);assert.equal(receipt.publishedRiverNameMetadataChanged,false);assert.equal(receipt.osmRelationUsedAsReference,false);
          assert.deepEqual(receipt.items.map(row=>row.systemId),['20628098','20773860','20774342','30145067','40188382','40364680','40391614','40414035','40415850','40423228']);
          console.log('All 10 systems spatially examined; no production data mutation');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gis-osm-batch02-research-evidence
          path: |
            /tmp/batch02-nga.json
            /tmp/batch02-ca-gauges.json
            /tmp/batch02-source-independent-point-audit.json
          retention-days: 30
          if-no-files-found: warn
