name: Source-review 1914 German Empire SH coastal raster epochs

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/probe_german_empire_1914_coast_period_rasters.py
      - .github/workflows/german-empire-coast-period-raster-probe.yml

permissions:
  contents: write

concurrency:
  group: german-empire-coast-period-raster-review
  cancel-in-progress: false

jobs:
  source-raster-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source review dependencies
        run: python -m pip install --disable-pip-version-check requests pillow shapely
      - name: Pin the unchanged German Empire working geometry
        run: sha256sum tools/historical-library/working/german-empire-1914-base.geojson > /tmp/gis-coast-original.sha
      - name: Obtain and overlay original state-map rasters, do not trace invented 1914 coastlines
        env:
          GIS_COAST_LOG_THUMBNAILS: "1"
        run: python tools/probe_german_empire_1914_coast_period_rasters.py
      - name: Verify historical assertions and original geometry integrity
        run: |
          sha256sum -c /tmp/gis-coast-original.sha
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("tools/historical-library/sources/german-coastline/sh-wms-period-overlay-probe.json")
          d=json.loads(p.read_text())
          assert d["referenceDate"] == "1914-07-31"
          assert not d["independent1914ShorelineDigitized"]
          assert not d["actual1914PixelDisplacementMeasured"]
          assert d["historicOverlayStopThresholdPassed"] is None
          assert len(d.get("panels",[]))==4 or d["status"]=="service-capabilities-unavailable"
          for a in d.get("panels",[]):
            for b in a["layerImages"]:
              assert b["historic1914ToCurrentCssPx"] is None
              assert not b["actualSurveyOrRevisionYearVerified"]
          print("PASS: source images only; historical delta UNVERIFIED.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recalculate sourced CSS pixel samples from the working polygon
        run: node --test tests/unit/historical-german-coastline-period-screen-samples.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: german-empire-1914-sh-coast-period-map-overlays
          path: tools/historical-library/review-output/german-coastline-sh-period/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only source metadata, no historical polygon edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/historical-library/sources/german-coastline/sh-wms-period-overlay-probe.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "data(gis): record official SH coastline source-raster coverage"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
