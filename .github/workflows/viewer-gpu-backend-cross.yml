name: Viewer GPU backend cross-check (actual driver verified)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-gpu-backend-cross-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gpu-cross:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: pnpm exec playwright install chromium
      - name: Check test syntax and actually run full dated Viewer on each backend
        run: |
          node --check tests/browser/rendering/viewer-gpu-backend-cross.spec.mjs
          pnpm exec playwright test tests/browser/rendering/viewer-gpu-backend-cross.spec.mjs --workers=1 --retries=0 --trace=off --reporter=list
      - name: Preserve raw backend identity and measured date-transition results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-gpu-cross-${{ matrix.platform }}-${{ github.sha }}
          path: |
            test-results/viewer-gpu-backend-cross/
            test-results/viewer-gpu-backend-cross-*/
          if-no-files-found: warn
          retention-days: 7
