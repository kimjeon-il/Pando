name: Web-only GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stage exactly the committed viewer dependency closure
        run: node tools/stage-monorepo-pages.mjs --root . --stage "$RUNNER_TEMP/pages-site" --manifest "$RUNNER_TEMP/pages-evidence.json"
      - name: Overlay the verified independent library publication when available
        run: |
          if git ls-remote --exit-code origin refs/heads/library-data >/dev/null; then
            git fetch origin refs/heads/library-data:refs/remotes/origin/library-data
            mkdir -p "$RUNNER_TEMP/current-library"
            git archive origin/library-data assets/data | tar -xf - -C "$RUNNER_TEMP/current-library"
            node tools/assemble-library-release.mjs --verify-archive --output "$RUNNER_TEMP/current-library"
            cp -a "$RUNNER_TEMP/current-library/assets/data/library-channel" "$RUNNER_TEMP/pages-site/assets/data/"
            mkdir -p "$RUNNER_TEMP/pages-site/assets/data/library-releases"
            cp -a "$RUNNER_TEMP/current-library/assets/data/library-releases/." "$RUNNER_TEMP/pages-site/assets/data/library-releases/"
            node tools/assemble-library-release.mjs --verify-archive --output "$RUNNER_TEMP/pages-site"
            node tools/check-library-release-code.mjs --site "$RUNNER_TEMP/pages-site"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - uses: actions/upload-artifact@v4
        with:
          name: pages-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/pages-evidence.json
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
