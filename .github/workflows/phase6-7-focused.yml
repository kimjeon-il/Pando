name: Focused phase 6-7 project manifest and Viewer checks
# Source-matched C++ was verified in phase 5; this checks changed JS contracts.
on:
  push:
    branches: [work/phase6-7-validation-20261110]
    paths: [.github/workflows/phase6-7-focused.yml]
permissions:
  contents: write
jobs:
  project-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: syntax
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node --check src/data/map-project-runtime.js
          node --check src/app/viewer-composition.js
          node --check src/app/viewer-map.js
          node --check tests/unit/data/map-project-runtime.test.mjs
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec eslint src/data/map-project-runtime.js src/app/viewer-composition.js src/app/viewer-map.js tests/unit/data/map-project-runtime.test.mjs
      - id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 \
            tests/unit/data/map-project-runtime.test.mjs \
            tests/unit/data/map-project-manifest.test.mjs \
            tests/unit/build/frontend-build.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/project-focused.log"
      - name: Record bounded result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),file=process.env.RUNNER_TEMP+'/project-focused.log';
            const data={sourceCommit:context.sha,install:'${{ steps.install.outcome }}',
              syntax:'${{ steps.syntax.outcome }}',lint:'${{ steps.lint.outcome }}',
              tests:'${{ steps.tests.outcome }}',
              output:fs.existsSync(file)?fs.readFileSync(file,'utf8').slice(-14000):'not executed'};
            const branch=context.ref.replace('refs/heads/',''),path='validation-results/phase6-7-focused.json';
            let sha;try{sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch,
              ...(sha?{sha}:{}),content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64'),
              message:'test: record focused manifest runtime and Viewer validation'});
      - name: Require bounded checks
        if: always()
        run: |
          test '${{ steps.syntax.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
