name: UI data history review
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/ui-data-history-review.yml']
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - run: node tools/review-ui-data-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-data-history
          path: ${{ runner.temp }}/ui-data-history.json
          retention-days: 1
