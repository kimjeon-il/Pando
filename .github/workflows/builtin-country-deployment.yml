name: Independent country deployment contracts

on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/builtin-country-deployment.yml'
      - 'tests/unit/builtin-country-deployment.test.mjs'
      - 'tests/unit/builtin-country-parts.test.mjs'
      - 'tools/builtin-country-storage.mjs'
      - 'shared/frontend/js/modules/builtin-country-files.js'
      - 'scripts/lib/product-assets.mjs'
      - 'apps/editor/world-data-plan.mjs'
      - 'apps/editor/stage.mjs'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: builtin-country-deployment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deployment:
    if: github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare exact pinned inputs; no regeneration or data publication
        uses: ./.github/actions/library-data
      - name: Verify independent deployment, bounded files and scoped storage contracts
        run: node --test --test-timeout=15000 tests/unit/builtin-country-deployment.test.mjs tests/unit/builtin-country-parts.test.mjs
