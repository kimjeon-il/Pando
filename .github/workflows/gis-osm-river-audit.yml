name: GIS OSM river name dependency inventory

on:
  push:
    branches: [work/gis]
    paths:
      - tools/inventory-osm-hydronyms.py
      - tools/gis/compare_osm_hydro_natural_earth.py
      - tools/gis/hydro_independent_name_policy.py
      - tools/gis/hydro-independent-name-replacements.json
      - tools/gis/prepare_hydro_name_replacement_bundle.py
      - tests/test_hydro_independent_names.py
      - tools/build-hydro-tiles.py
      - .github/workflows/gis-osm-river-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mount pinned external geographic data
        uses: ./.github/actions/library-data
      - name: Extract 73 matched systems without modifying map data
        run: |
          python tools/inventory-osm-hydronyms.py \
            --manifest assets/data/hydro/v0.13.2/manifest.json \
            --bundle assets/data/hydro/v0.13.2/hydro.bin \
            --output /tmp/osm-hydro-inventory.json
      - name: Decode original Hydro geometry using the published production decoder
        run: |
          node tools/decode-hydro-connectivity.mjs \
            assets/data/hydro/v0.13.2 /tmp/hydro-decoded.json
      - name: Acquire hash-verified public-domain Natural Earth name geometry
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          manifest=json.loads(Path('assets/data/hydro/v0.13.2/manifest.json').read_text())
          expected=next(x['sha256'] for x in manifest['sources']['naturalEarthNameReference'] if x['file']=='rivers_base.geojson')
          url='https://raw.githubusercontent.com/kimjeon-il/Pando/6b0c501dd09029ef237e90c1ef55fdb82bdf315f/assets/data/hydro/rivers_base.geojson'
          request=urllib.request.Request(url,headers={'User-Agent':'PandoLab-GIS-audit/1.0'})
          with urllib.request.urlopen(request,timeout=90) as response:
              data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          if actual!=expected: raise ValueError('Natural Earth reference source SHA-256 mismatch '+actual+' != '+expected)
          Path('/tmp/ne-rivers-base.geojson').write_bytes(data)
          print('NE_RIVER_REFERENCE_SHA='+actual,flush=True)
          PY
      - name: Independently compare 73 Hydro mainstem routes with Natural Earth
        run: |
          python -m pip install --quiet shapely
          python tools/gis/compare_osm_hydro_natural_earth.py \
            --decoded /tmp/hydro-decoded.json \
            --natural-earth /tmp/ne-rivers-base.geojson \
            --expected-sha256 "$(python -c "import json; m=json.load(open('assets/data/hydro/v0.13.2/manifest.json')); print(next(x['sha256'] for x in m['sources']['naturalEarthNameReference'] if x['file']=='rivers_base.geojson'))")" \
            --inventory /tmp/osm-hydro-inventory.json \
            --output /tmp/osm-ne-crosscheck.json
      - name: Verify independently researched river-name records
        run: |
          python -m unittest discover -s tests -p 'test_hydro_independent_names.py' -v
      - name: Rebuild only verified-name metadata into an isolated candidate
        run: |
          python tools/gis/prepare_hydro_name_replacement_bundle.py \
            --manifest assets/data/hydro/v0.13.2/manifest.json \
            --bundle assets/data/hydro/v0.13.2/hydro.bin \
            --replacements tools/gis/hydro-independent-name-replacements.json \
            --output-dir /tmp/hydro-independent-five
      - name: Verify candidate by reusing the production geometry decoder
        run: |
          node tools/decode-hydro-connectivity.mjs \
            /tmp/hydro-independent-five /tmp/hydro-independent-five-decoded.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/hydro-independent-five')
          proof=json.loads((root/'proof.json').read_text())
          manifest=json.loads((root/'manifest.json').read_text())
          assert len(proof['changedSystemIds']) == 16
          assert proof['remainingOsmMatchedSystems'] == 57
          assert proof['sourceIndependentSystemCount'] == 16
          assert proof['renamedSystemCount'] == 5
          assert proof['nameUnchangedSourceReplacementCount'] == 11
          assert proof['originalIndexSha256'] == proof['newIndexSha256']
          assert proof['originalGeometryShardsSha256'] == proof['newGeometryShardsSha256']
          assert manifest['metadata']['featureCount'] == 16548
          assert manifest['stats']['compressedBytes'] == manifest['container']['bytes']
          assert manifest['version'] == '0.13.2'
          print('Independent source candidate passed metadata and geometry integrity checks')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gis-osm-hydro-inventory
          path: |
            /tmp/osm-hydro-inventory.json
            /tmp/osm-ne-crosscheck.json
            /tmp/hydro-independent-five/manifest.json
            /tmp/hydro-independent-five/hydro.bin
            /tmp/hydro-independent-five/proof.json
          retention-days: 14
