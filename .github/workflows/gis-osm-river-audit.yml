name: GIS OSM river name dependency inventory

on:
  push:
    branches: [work/gis]
    paths:
      - tools/inventory-osm-hydronyms.mjs
      - tests/unit/osm-hydro-inventory.test.mjs
      - tools/gis/compare-osm-hydro-natural-earth.mjs
      - tests/unit/hydro-ne-sampling.test.mjs
      - tools/gis/verify_victorian_yarra_source.py
      - tools/gis/check-official-usgs-hydro-gauges.mjs
      - tests/unit/hydro-usgs-official-gauges.test.mjs
      - tools/gis/hydro-independent-name-policy.mjs
      - tools/gis/hydro-independent-name-replacements.json
      - tools/gis/prepare-hydro-name-replacement-bundle.mjs
      - tests/unit/hydro-name-repack.test.mjs
      - tests/unit/hydro-independent-name-policy.test.mjs
      - tools/build-hydro-tiles.py
      - .github/workflows/gis-osm-river-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mount pinned external geographic data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract verified matched systems without modifying map data
        run: |
          node tools/inventory-osm-hydronyms.mjs \
            --manifest assets/data/hydro/v0.13.2/manifest.json \
            --bundle assets/data/hydro/v0.13.2/hydro.bin \
            --output /tmp/osm-hydro-inventory.json
      - name: Decode original Hydro geometry using the published production decoder
        run: |
          node tools/decode-hydro-connectivity.mjs \
            assets/data/hydro/v0.13.2 /tmp/hydro-decoded.json
      - name: Select pinned Natural Earth name geometry
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const m=JSON.parse(fs.readFileSync('assets/data/hydro/v0.13.2/manifest.json','utf8'));
          const expected=m.sources.naturalEarthNameReference.find(row=>row.file==='rivers_base.geojson')?.sha256;
          const bytes=fs.readFileSync('assets/data/hydro/rivers_base.geojson');
          if(!expected || createHash('sha256').update(bytes).digest('hex')!==expected)throw Error('Natural Earth reference source SHA-256 mismatch');
          fs.writeFileSync('/tmp/hydro-ne-reference.sha256',expected,{flag:'wx'});
          console.log('NE_RIVER_REFERENCE_SHA='+expected);
          JS
      - name: Independently compare remaining Hydro mainstem routes with Natural Earth
        run: |
          node tools/gis/compare-osm-hydro-natural-earth.mjs \
            --decoded /tmp/hydro-decoded.json \
            --natural-earth assets/data/hydro/rivers_base.geojson \
            --expected-sha256 "$(cat /tmp/hydro-ne-reference.sha256)" \
            --inventory /tmp/osm-hydro-inventory.json \
            --output /tmp/osm-ne-crosscheck.json
      - name: Independently check suspect Texas streams against USGS field stations
        run: |
          node tools/gis/check-official-usgs-hydro-gauges.mjs \
            --decoded /tmp/hydro-decoded.json \
            --output /tmp/usgs-official-anchor-check.json
      - name: Validate independently sourced names with the canonical Node policy
        run: node tools/gis/hydro-independent-name-policy.mjs --input tools/gis/hydro-independent-name-replacements.json > /tmp/hydro-independent-review-validated.json
      - name: Verify pinned USGS station distances against the original Python audit oracle
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const proof=JSON.parse(fs.readFileSync('/tmp/usgs-official-anchor-check.json','utf8'));
          const oracle=[
            ['USGS-08116650',0.218,48.839],['USGS-08114000',0.143,44.988],
            ['USGS-08117300',0.371,60.091],['USGS-08162500',40.811,0.199],
            ['USGS-08162504',57.549,0.153],['USGS-08162501',51.828,0.061],
          ];
          for(let i=0;i<oracle.length;i++){
            const row=proof.stationRows[i], [id,brazos,colorado]=oracle[i];
            if(row.station!==id||Math.abs(row.distancesToHydroMainstemKm['70816878']-brazos)>0.0011
                ||Math.abs(row.distancesToHydroMainstemKm['70819626']-colorado)>0.0011)
              throw Error('Independent pinned USGS metric changed: '+id);
          }
          JS
      - name: Verify USGS station evidence is tied to the exact published Hydro geometry
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/gis')
          stations=json.loads(Path('/tmp/usgs-official-anchor-check.json').read_text())
          review=json.loads(Path('/tmp/hydro-independent-review-validated.json').read_text())
          for ident in ('70816878','70819626'):
              measured=stations['candidateSystems'][ident]
              recorded=review[ident]['officialStationEvidence']
              own={r['station'] for r in stations['stationRows'] if r['independentHydrography']==measured['candidateName']}
              assert measured['criteriaSatisfied'],ident
              assert set(recorded['stationIds'])==own,ident
              assert abs(recorded['maximumMatchingStationDistanceKm']-measured['maxMatchingStationDistanceKm'])<0.002
              assert abs(recorded['nearestDifferentBasinStationKm']-measured['nearestDifferentBasinStationKm'])<0.002
          print('Both station-based source exemptions reproduced against original Hydro geometry')
          PY
      - name: Check all 42 reviewed mainstems independently of the 73 OSM-matched systems
        run: |
          node tools/gis/hydro-independent-name-policy.mjs \
            --input tools/gis/hydro-independent-name-replacements.json \
            > /tmp/hydro-independent-review-validated.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const verified=JSON.parse(fs.readFileSync('/tmp/hydro-independent-review-validated.json','utf8'));
          fs.writeFileSync('/tmp/reviewed-mainstem-scope.json',JSON.stringify({
            items:Object.entries(verified).map(([systemId,value])=>({systemId,nameKo:value.previousNameKo}))
          }));
          JS
          node tools/gis/compare-osm-hydro-natural-earth.mjs \
            --decoded /tmp/hydro-decoded.json --natural-earth assets/data/hydro/rivers_base.geojson \
            --expected-sha256 "$(cat /tmp/hydro-ne-reference.sha256)" \
            --inventory /tmp/reviewed-mainstem-scope.json \
            --output /tmp/reviewed-ne-crosscheck.json
      - name: Verify all lower-coverage candidate river names against independent Natural Earth line comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          review=json.loads(Path('tools/gis/hydro-independent-name-replacements.json').read_text())['replacements']
          ne=json.loads(Path('/tmp/reviewed-ne-crosscheck.json').read_text())['items']
          ne_by_id={str(row['systemId']):row for row in ne}
          for entry in review:
              if entry.get('naturalEarth') is None: continue
              candidates=ne_by_id[entry['systemId']]['naturalEarthCandidates']
              match=next((row for row in candidates if row['name'] == entry['naturalEarth']['name']),None)
              assert match is not None, entry['systemId']
              assert abs(match['sampleCoverage'] - entry['naturalEarth']['sampleCoverage']) < 0.001, entry['systemId']
              conservative=entry.get('conservativeMainstemReview')
              if conservative:
                  assert candidates[0]['name']==match['name'],entry['systemId']
                  competing=max((row['sampleCoverage'] for row in candidates
                                 if row['name']!=match['name'] and row['nameKo']),default=0)
                  assert abs(competing-conservative['otherNamedNECoverage'])<0.001,entry['systemId']
                  assert match['meanDistanceDegrees'] <= 0.04,entry['systemId']
              cross_border=entry.get('crossBorderNameReview')
              if cross_border:
                  rivals=[z for z in candidates if z['name']!=match['name'] and z.get('nameKo')]
                  max_rival=max((z['sampleCoverage'] for z in rivals),default=0)
                  assert abs(max_rival-cross_border['strongestOtherNENameCoverage'])<0.001,entry['systemId']
                  assert 0.35<=match['sampleCoverage']<0.45,entry['systemId']
                  assert match['meanDistanceDegrees']<0.06,entry['systemId']
              partial=entry.get('partialExistingNameReview')
              if partial:
                  assert candidates[0]['name'] == match['name'],entry['systemId']
                  rivals=[row for row in candidates if row['name']!=match['name'] and row['nameKo']]
                  max_rival=max((row['sampleCoverage'] for row in rivals),default=0)
                  assert abs(max_rival-partial['strongestOtherNENameCoverage'])<0.001,entry['systemId']
                  assert max_rival<=0.05 and match['meanDistanceDegrees']<=0.025,entry['systemId']
              confluence=entry.get('basinConfluenceReview') or entry.get('independentBasinRename')
              if confluence:
                  trib=next((row for row in candidates
                             if row['name']==confluence['namedTributaryNE']),None)
                  assert trib is not None,entry['systemId']
                  assert abs(trib['sampleCoverage']-confluence['tributarySampleCoverage'])<0.001,entry['systemId']
                  threshold=0.90 if entry.get('independentBasinRename') else 0.75
                  assert match['sampleCoverage']+trib['sampleCoverage']>=threshold,entry['systemId']
                  assert match['meanDistanceDegrees']<=0.05,entry['systemId']
                  assert trib['meanDistanceDegrees']<=0.05,entry['systemId']
          print('Source-independent 81-sample geometry comparisons reproduced for all reviewed river systems')
          PY
      - name: Reproduce the independent Victorian Yarra government river vector check
        run: |
          python -m pip install --quiet pyproj
          python tools/gis/verify_victorian_yarra_source.py \
            --decoded /tmp/hydro-decoded.json \
            --output /tmp/yarra-government-vector-validated.json
          python - <<'PY'
          import json
          from pathlib import Path
          match=json.loads(Path('/tmp/yarra-government-vector-validated.json').read_text())
          review=json.loads(Path('tools/gis/hydro-independent-name-replacements.json').read_text())
          by_id={row['systemId']:row for row in review['replacements']}
          recorded=by_id['50798885']['officialGovernmentVectorEvidence']
          assert match['source']['sourceGeoJSONSha256']==recorded['sourceGeoJSONSha256']
          assert match['hydroSamplesToNamedGovernmentRiver']['samples']==recorded['hydroMainstemSamples']
          assert abs(match['hydroSamplesToNamedGovernmentRiver']['within1km']-recorded['within1kmHydroToGovernment'])<0.0002
          assert abs(match['governmentSamplesToHydroMainstem']['within1km']-recorded['within1kmGovernmentToHydro'])<0.0002
          assert abs(match['hydroSamplesToNamedGovernmentRiver']['p90DistanceKm']-recorded['p90DistanceKm'])<0.01
          assert match['source']['license']=='CC BY 4.0'
          print('Victoria government river centerline spatial verification reproduced')
          PY
      - name: Verify independently researched river-name records
        run: |
          node --test tests/unit/hydro-independent-name-policy.test.mjs tests/unit/hydro-name-repack.test.mjs
      - name: Verify feature-level independent-source notes
        run: node --test tests/unit/hydro-source-notes.test.mjs
      - name: Verify current published independent names and immutable Hydro bytes
        run: |
          node tools/gis/verify-published-hydro-independent-names.mjs \
            --manifest assets/data/hydro/v0.13.2/manifest.json \
            --bundle assets/data/hydro/v0.13.2/hydro.bin \
            --archive-review assets/data/hydro/v0.13.2/hydro-independent-name-replacements.json \
            --current-review tools/gis/hydro-independent-name-replacements.json \
            --output /tmp/hydro-current-independent-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: gis-osm-hydro-inventory
          path: |
            /tmp/osm-hydro-inventory.json
            /tmp/osm-ne-crosscheck.json
            /tmp/usgs-official-anchor-check.json
            /tmp/yarra-government-vector-validated.json
            /tmp/hydro-current-independent-proof.json
          retention-days: 14
