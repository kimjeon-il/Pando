name: GIS Victorian official Yarra river identity

on:
  push:
    branches: [work/gis]
    paths:
      - tools/gis/verify-victorian-yarra-source.mjs
      - tools/gis/hydro-point-screen-native.mjs
      - tools/gis/hydro-numeric.mjs
      - tools/cpp/hydro/point-screen.cpp
      - tools/cpp/CMakeLists.txt
      - .github/workflows/gis-victoria-yarra-official.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  government-vector-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the paired data revision
        id: hydro-data-pin
        run: node -e "console.log('revision='+require('./config/library-data.json').revision)" >> "$GITHUB_OUTPUT"
      - name: Fetch only the pinned Hydro bundle
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: ${{ steps.hydro-data-pin.outputs.revision }}
          path: .pando-hydro-input
          persist-credentials: false
          filter: blob:none
          sparse-checkout: assets/data/hydro/v0.13.2
      - name: Build the read-only native vector screen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev ninja-build
          cmake -S tools/cpp -B build-native/hydro-point-screen -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON
          cmake --build build-native/hydro-point-screen --target pando-hydro-point-screen
          node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/pando-hydro-point-screen --directory build-native/hydro-point-screen/artifact
      - name: Decode unchanged original Hydro geometry
        run: |
          node tools/decode-hydro-connectivity.mjs \
            .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-hydro-decoded.json
      - name: Compare with official Victorian Yarra river centerline
        run: |
          node tools/gis/verify-victorian-yarra-source.mjs \
            --decoded /tmp/pando-hydro-decoded.json \
            --output /tmp/yarra-government-vector-evidence.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {verifyYarraEvidence} from './tools/gis/hydro-independent-name-policy.mjs';
          verifyYarraEvidence(JSON.parse(readFileSync('/tmp/yarra-government-vector-evidence.json')),JSON.parse(readFileSync('tools/gis/hydro-independent-name-replacements.json')));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: yarra-government-vector-evidence
          path: /tmp/yarra-government-vector-evidence.json
          retention-days: 14
