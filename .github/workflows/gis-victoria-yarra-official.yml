name: GIS Victorian official Yarra river identity

on:
  push:
    branches: [work/gis]
    paths:
      - tools/gis/verify_victorian_yarra_source.py
      - .github/workflows/gis-victoria-yarra-official.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  government-vector-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - name: Decode unchanged original Hydro geometry
        run: |
          node tools/decode-hydro-connectivity.mjs \
            assets/data/hydro/v0.13.2 /tmp/pando-hydro-decoded.json
      - name: Compare with official Victorian Yarra river centerline
        run: |
          python -m pip install --quiet shapely pyproj
          python tools/gis/verify_victorian_yarra_source.py \
            --decoded /tmp/pando-hydro-decoded.json \
            --output /tmp/yarra-government-vector-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: yarra-government-vector-evidence
          path: /tmp/yarra-government-vector-evidence.json
          retention-days: 14
