name: Object cursor regression baseline comparison
on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/objects-cursor-baseline-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            source_sha: 219b8726df6bfc26467257a19f0f358fa52353c5
          - label: after
            source_sha: 2e332b4cd443f8931a2d28ee865aba50c4696b41
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          persist-credentials: false
      - name: Install core compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Build existing Core source and run unchanged document and timeline tests
        run: |
          cmake -S . -B build-native/cursor-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release -DPANDO_BUILD_VARIANT=core -DBUILD_TESTING=ON
          cmake --build build-native/cursor-baseline --target temporal_editing_tests document_session_tests --parallel 2
          ctest --test-dir build-native/cursor-baseline -R '^(temporal_editing_tests|document_session_tests)$' --output-on-failure
  browser-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            source_sha: 219b8726df6bfc26467257a19f0f358fa52353c5
          - label: after
            source_sha: 2e332b4cd443f8931a2d28ee865aba50c4696b41
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare historically failing visible-state and persistence contracts unchanged
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: |
          pnpm exec playwright test tests/browser/historical-world-timeline.spec.mjs tests/browser/timeline-persistence.spec.mjs --grep 'canvas default world uses the common historical trace|new world reset retains the complete history after an edit|static v10 UI file save/open' --workers=1 --retries=0 --trace off
      - name: Retain real failure evidence for baseline/candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-cursor-compare-${{ matrix.label }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
