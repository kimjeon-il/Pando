name: Publish verified OSM-independent Hydro metadata

on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/gis-hydro-reviewed-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gis-hydro-reviewed-storage-release
  cancel-in-progress: false

jobs:
  publish-reviewed-river-names:
    if: github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require scoped storage write authority before release
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        shell: bash
        run: |
          if test -z "$PANDOLAB_LIBRARY_WRITE_TOKEN"; then
            echo "::error::PANDOLAB_LIBRARY_WRITE_TOKEN not configured; source data has not been changed"
            exit 1
          fi
      - name: Mount original immutable Hydro v0.13.2
        uses: ./.github/actions/library-data
      - name: Download independently audited and source-linked 42-system package
        uses: actions/download-artifact@v4
        with:
          name: gis-osm-hydro-inventory
          repository: kimjeon-il/Pando
          run-id: 40055943255
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gis-verified
      - name: Verify source, package identity, and unmodified geometry
        shell: bash
        env:
          VERIFIED: ${{ runner.temp }}/gis-verified/hydro-independent-five
        run: |
          node --test tests/unit/hydro-source-notes.test.mjs
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ["VERIFIED"])
          current=pathlib.Path("assets/data/hydro/v0.13.2")
          files=("manifest.json","hydro.bin","hydro-independent-name-replacements.json","proof.json")
          for n in files: assert (root/n).is_file(), f"Missing verified artifact {n}"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          manifest=json.loads((root/"manifest.json").read_text())
          proof=json.loads((root/"proof.json").read_text())
          original=json.loads((current/"manifest.json").read_text())
          sources=json.loads((root/"hydro-independent-name-replacements.json").read_text())
          code_sources=json.loads(pathlib.Path("tools/gis/hydro-independent-name-replacements.json").read_text())
          assert sources==code_sources
          assert sha(root/"hydro.bin") == "aee3368aa05543050fb4455265d2192c2322d2a0506c88f9f9a61f1f1158daf4"
          assert sha(current/"hydro.bin") == proof["beforeBundleSha256"] == original["container"]["sha256"]
          assert sha(root/"hydro.bin") == proof["afterBundleSha256"] == manifest["container"]["sha256"]
          assert manifest["sources"]["independentHydronymReplacements"]["sha256"]==sha(root/"hydro-independent-name-replacements.json")
          assert len(proof["changedSystemIds"])==42 == len(sources["replacements"])
          assert proof["changedCoreFragments"]==1895
          assert proof["remainingOsmMatchedSystems"]==31
          assert proof["renamedSystemCount"]==8
          assert proof["nameUnchangedSourceReplacementCount"]==34
          assert proof["originalIndexSha256"]==proof["newIndexSha256"]
          assert proof["originalGeometryShardsSha256"]==proof["newGeometryShardsSha256"]
          assert manifest["metadata"]["featureCount"]==16548
          assert manifest["cache"]["name"]!=original["cache"]["name"]
          assert sorted(proof["changedSystemIds"], key=int)==sorted([x["systemId"] for x in sources["replacements"]], key=int)
          print("Confirmed audited bundle, source citations, unchanged geometry and 31 residual OSM systems")
          PY
      - name: Store reviewed package into Pando data mount
        env:
          VERIFIED: ${{ runner.temp }}/gis-verified/hydro-independent-five
        run: |
          cp "$VERIFIED/manifest.json" assets/data/hydro/v0.13.2/manifest.json
          cp "$VERIFIED/hydro.bin" assets/data/hydro/v0.13.2/hydro.bin
          cp "$VERIFIED/hydro-independent-name-replacements.json" assets/data/hydro/v0.13.2/hydro-independent-name-replacements.json
      - name: Sync storage checkout to current main without changing unrelated data
        shell: bash
        run: |
          storage="$GITHUB_WORKSPACE/.library-data/repository"
          test -z "$(git -C "$storage" status --porcelain)"
          git -C "$storage" fetch --filter=blob:none origin main
          git -C "$storage" checkout --detach FETCH_HEAD
      - name: Store only three audited Hydro files and pin the immutable data commit
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          node tools/library-data.mjs --store-and-stage --push -- \
            assets/data/hydro/v0.13.2/manifest.json \
            assets/data/hydro/v0.13.2/hydro.bin \
            assets/data/hydro/v0.13.2/hydro-independent-name-replacements.json
          test -n "$(git diff --cached --name-only | grep '^config/library-data.json$')"
      - name: Commit exactly the updated library pin to existing GIS branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'data(gis): pin validated 42-river independent-source Hydro release'
          git push origin HEAD:refs/heads/work/gis
          echo "LIBRARY_COMMIT=$(node -p 'require("./config/library-data.json").revision')"
      - name: Upload audited release receipt
        uses: actions/upload-artifact@v4
        with:
          name: gis-hydro-reviewed-release-receipt
          path: config/library-data.json
          retention-days: 30
