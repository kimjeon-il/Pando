name: GPU stage 3 main-equivalence validation

on:
  push:
    branches: [work/gpu-stage3]
    paths:
      - .github/workflows/gpu-stage3-main-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-stage3-main-equivalence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Focused GPU recovery source contracts
        run: >
          node --test
          tests/helpers/gpu-recovery-viewer-progress.test.mjs
          tests/unit/gpu-scene-presentation-ownership.test.mjs
          tests/helpers/gpu-recovery-viewer-presentation.test.mjs
          tests/unit/gpu-shared-pass-initialization.test.mjs
          tests/unit/gpu-resource-owners.test.mjs
          tests/unit/map-render-coordinator.test.mjs

      - name: Affected lint only
        run: >
          pnpm exec eslint
          shared/frontend/js/modules/gpu-map-renderer.js
          shared/frontend/js/modules/gpu-context-recovery.js
          shared/frontend/js/modules/map-content-presentation.js
          tests/browser/viewer-recovery-acceptance.spec.mjs

      - run: pnpm exec playwright install --with-deps chromium

      - name: Real WebGL2 and WebGL1 repeated recovery acceptance
        env:
          G4_EVIDENCE: gpu-stage3-evidence
        run: >
          pnpm exec playwright test
          tests/browser/viewer-recovery-acceptance.spec.mjs
          --workers=1 --retries=0 --trace=off --reporter=list

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-stage3-main-equivalence-${{ github.sha }}
          path: |
            gpu-stage3-evidence
            test-results
          if-no-files-found: warn
          retention-days: 3
