name: GIS Baikonur independent historic Landsat scene inventory
on:
  push:
    branches: [ work/gis ]
    paths:
      - 'tools/gis/probe-baikonur-1994-landsat.mjs'
      - '.github/workflows/gis-baikonur-1994-landsat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-usgs-1994-and-2020-scene-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query independent USGS archive for 1994/1995 and 2019/2020
        run: |
          node tools/gis/probe-baikonur-1994-landsat.mjs             --output "$RUNNER_TEMP/baikonur-historic-satellite-scenes.json"
      - name: Verify all eight source-screens and fail closed on legal polygon approval
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const path=process.env.RUNNER_TEMP+'/baikonur-historic-satellite-scenes.json';
          const data=JSON.parse(readFileSync(path,'utf8'));
          assert.equal(data.records.length,8);
          assert.equal(data.appliedPublishedGeometry,false);
          assert.equal(data.legalHistoricRightBankVerified,false);
          assert.equal(data.originalDatumVerified,false);
          assert(data.records.every(x=>x.candidates.every(y=>
            y.verifiedPixels===false && y.siteCloudCoverNotEstablished===true)));
          console.log('BAIKONUR_HISTORIC_SCENE_SUMMARY='+JSON.stringify(data.records.map(x=>({
            bank:x.pair.join('-'),year:x.year,scenes:x.scenesScanned,
            eligible:x.totalEligible,selected:x.candidates.map(c=>c.sceneId),
            status:x.status
          }))));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: baikonur-usgs-historic-source-index-no-bank-geometry
          path: ${{ runner.temp }}/baikonur-historic-satellite-scenes.json
          retention-days: 30
          if-no-files-found: error
