name: P0 P1 original-main baseline real Chromium regression
on:
  push:
    branches: [work/p0-p1-baseline-regression-20261112]
    paths: [.github/workflows/p0-p1-baseline-regression-once.yml]
permissions:
  contents: read
jobs:
  base-gpu-recovery:
    if: "!contains(github.event.head_commit.message, '[terrain-only]') && !contains(github.event.head_commit.message, '[unit-only]') && !contains(github.event.head_commit.message, '[geometry-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Baseline original-main recovery regression
        run: pnpm exec playwright test tests/browser/rendering/viewer-renderer-recovery.spec.mjs --workers=1 --retries=0 --reporter=list
  base-viewer-functional:
    if: "!contains(github.event.head_commit.message, '[terrain-only]') && !contains(github.event.head_commit.message, '[unit-only]') && !contains(github.event.head_commit.message, '[geometry-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Baseline P6 desktop and mobile functional contracts
        run: |
          pnpm exec playwright test --config tests/integration/viewer-functional-p6-1.config.mjs --workers=1 --retries=0
          pnpm exec playwright test --config tests/integration/viewer-functional-p6-2.config.mjs --workers=1 --retries=0
  base-terrain-continuity:
    if: contains(github.event.head_commit.message, '[terrain-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Original main DEM/Canvas continuous terrain readiness baseline
        run: >-
          pnpm exec playwright test
          tests/browser/rendering/terrain-zoom-continuity.spec.mjs
          --grep 'retains numerical terrain during delayed detail|current-view detail reaches an actual WebGL frame'
          --workers=1 --retries=0 --reporter=list
  base-unit-regression:
    if: contains(github.event.head_commit.message, '[unit-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Baseline current-main affected unit contracts
        run: >-
          node --test --test-concurrency=2
          tests/unit/document/selection-domain-core.test.mjs
          tests/unit/rendering/canvas-country-geometry.test.mjs
          tests/unit/rendering/canvas-inline-worker.test.mjs
          tests/unit/rendering/gpu-helper-utils.test.mjs
          tests/unit/rendering/gpu-resource-owners.test.mjs
          tests/unit/rendering/hydro-reliability-source.test.mjs
          tests/unit/rendering/map-presentation-readiness.test.mjs
          tests/unit/rendering/selection-fill-handoff.test.mjs
  base-geometry-worker:
    if: contains(github.event.head_commit.message, '[geometry-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Original main geometry Worker and startup regression
        run: >-
          pnpm exec playwright test
          tests/browser/geometry/terrain-preview.spec.mjs
          tests/browser/geometry/viewer-boundary-p4-5.spec.mjs
          tests/browser/geometry/viewer-startup-and-terrain.spec.mjs
          tests/browser/rendering/country-prepared-scene.spec.mjs
          --grep 'selected webgl2 relief|selected canvas relief|P4-5 real viewer WebGL boundary|matching boundary Worker protocol|W2-P3 real Viewer reuses|Web publishes sharp|keeps physical land across empty time|historical Soviet scope'
          --workers=1 --retries=0 --reporter=list
