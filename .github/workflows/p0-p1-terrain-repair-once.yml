name: P0 P1 terrain v0.14 browser contract repair
# Two isolated real Chromium scenarios. No generated build/Pages/whole CI.
on:
  push:
    branches: [fix/p0-gl-state-contract-20261112]
    paths: [.github/workflows/p0-p1-terrain-repair-once.yml]
permissions:
  contents: read
jobs:
  quality:
    if: "!contains(github.event.head_commit.message, '[stream-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real v0.14 Himalayan/Indian physical and grayscale pixel checks
        run: >-
          pnpm exec playwright test tests/browser/geometry/terrain-preview.spec.mjs
          --grep 'selected .* relief distinguishes'
          --workers=1 --retries=0 --reporter=list
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-p1-terrain-quality-failure-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
  streaming:
    if: "!contains(github.event.head_commit.message, '[quality-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate strict synthetic DEM source identity and pixel hashes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {syntheticDemManifest} from './tests/browser/helpers/synthetic-dem-terrain.mjs';
          import {validateTerrainManifest,terrainTileRequest} from './src/data/terrain-manifest.js';
          const manifest=validateTerrainManifest(syntheticDemManifest());
          const revision=JSON.parse(readFileSync('config/library-data.json','utf8')).revision;
          const request=terrainTileRequest({level:0,column:0,row:0},manifest,{
            manifestUrl:'http://127.0.0.1:4173/assets/data/terrain/v0.14.0/manifest.json',
            dataBaseUrl:'http://127.0.0.1:4173/assets/data/',
            externalSource:{revision}
          });
          assert.ok(request.url.href.includes(revision));
          assert.match(request.sha256,/^[a-f0-9]{64}$/);
          assert.ok(request.bytes>0);
          console.log('SIGNED_SYNTHETIC_DEM_ACCEPTED '+JSON.stringify({revision,tiles:Object.keys(manifest.tiles).length}));
          NODE
      - name: Complete synthetic v0.14 tiles and interactive streaming
        run: >-
          pnpm exec playwright test tests/browser/rendering/terrain-zoom-continuity.spec.mjs
          --grep 'retains numerical terrain during delayed detail|current-view detail reaches an actual WebGL frame'
          --workers=1 --retries=0 --reporter=list
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-p1-terrain-stream-failure-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
