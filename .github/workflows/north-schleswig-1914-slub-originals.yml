name: Verify SLUB original 1878/1880 Schleswig map-sheet raster views

on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/preserve-north-schleswig-period-maps.mjs'
      - 'tests/unit/north-schleswig-period-maps.test.mjs'
      - '.github/workflows/north-schleswig-1914-slub-originals.yml'

permissions:
  contents: read

concurrency:
  group: north-schleswig-1914-slub-originals
  cancel-in-progress: false

jobs:
  verify-four-period-maps:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source restrictions, image integrity, and missing-original behavior
        run: node --test tests/unit/north-schleswig-period-maps.test.mjs
      - name: Probe four period-map services into private candidate staging only
        run: |
          node tools/gis/preserve-north-schleswig-period-maps.mjs \
            --output-root build-native/historical/north-schleswig-period-private
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const path='build-native/historical/north-schleswig-period-private/source-receipt.json';
          const p=JSON.parse(readFileSync(path,'utf8'));
          if(p.originalFullSheetScanArchived!==false || p.readyForPermanentLicensedArchive!==false)
            throw Error('Do not promote restricted period-map views');
          if(p.mapProbes.length!==4)throw Error('Four historic map sheets required');
          console.log('NORTH_SCHLESWIG_PRIVATE_STAGING='+JSON.stringify({
            mapViews:p.successfulRasterViews,
            archivedFullScans:false,
            rightsReviewed:false,
            repositoryOriginalsModified:false,
          }));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: north-schleswig-original-map-view-private-review
          path: build-native/historical/north-schleswig-period-private/
          retention-days: 14
          if-no-files-found: warn
