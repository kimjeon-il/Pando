name: GPU G4 isolated viewer-editor screen validation (no deployment)
on:
  push:
    branches: [work/gpu-g4-validation]
    paths:
      - .github/workflows/gpu-g4-isolated-validation.yml
      - tests/browser/gpu-recovery-g4.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-g4-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: viewer
            backend: canvas-worker
          - product: editor
            backend: webgl2
    env:
      G4_EVIDENCE: gpu-g4-isolated-evidence
      G4_PRODUCT: ${{ matrix.product }}
      G4_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Mount pinned world without modifying data
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Source regression on the integrated renderer (not a temporary candidate)
        run: node --test tests/helpers/gpu-recovery-viewer-progress.test.mjs tests/unit/gpu-scene-presentation-ownership.test.mjs tests/helpers/gpu-recovery-viewer-presentation.test.mjs tests/unit/gpu-shared-pass-initialization.test.mjs tests/unit/gpu-resource-owners.test.mjs tests/unit/map-render-coordinator.test.mjs tests/unit/country-mesh-zoom-policy.test.mjs tests/unit/canvas-worker-background-admission.test.mjs
      - run: pnpm exec eslint shared/frontend/js/modules/gpu-map-renderer.js shared/frontend/js/modules/gpu-context-recovery.js shared/frontend/js/modules/map-content-presentation.js shared/frontend/js/modules/country-mesh-zoom-policy.js tests/browser/gpu-recovery-g4.spec.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Focused real product screen regression
        run: pnpm exec playwright test tests/browser/gpu-recovery-g4.spec.mjs --workers=1 --retries=0 --grep "${G4_PRODUCT} ${G4_BACKEND}:" --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-g4-isolated-${{ matrix.product }}-${{ matrix.backend }}-${{ github.sha }}
          path: |
            gpu-g4-isolated-evidence
            test-results
          if-no-files-found: warn
          retention-days: 3
