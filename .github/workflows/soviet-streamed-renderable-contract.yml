name: Soviet streamed outline retention and output parity
on:
  push:
    branches: [work/perf-renderable-on-demand-20261017]
    paths:
      - '.github/workflows/soviet-streamed-renderable-contract.yml'
      - 'assets/js/modules/geographic-boundary.js'
      - 'assets/js/modules/boundary-topology.js'
      - 'assets/js/modules/country-shared-boundary-packet.js'
      - 'tests/unit/renderable-boundary-stream.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soviet-streamed-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stream-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify compiled WASM source match and stream parity
        run: |
          node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
          pnpm exec eslint assets/js/modules/geographic-boundary.js assets/js/modules/boundary-topology.js assets/js/modules/country-shared-boundary-packet.js tests/unit/renderable-boundary-stream.test.mjs
          node --test tests/unit/renderable-boundary-stream.test.mjs
      - name: Verify stateful country contacts, outline clipping and edits
        run: |
          node --test tests/unit/country-shared-boundary-state.test.mjs tests/unit/country-shared-boundary.test.mjs tests/unit/boundary-preparation.test.mjs tests/unit/country-contact-legacy-parity.test.mjs
  known-baseline-gis-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 6b0c501dd09029ef237e90c1ef55fdb82bdf315f
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Classify unchanged main GIS invalid-polygon contract discrepancy
        shell: bash
        run: |
          set +e
          node --test tests/unit/gis-math-contract.test.mjs > /tmp/baseline-gis-contract.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Pinned original main unexpectedly passes the historical GIS contract; reassess the candidate gate.'
            cat /tmp/baseline-gis-contract.log
            exit 1
          fi
          grep -F "PL-WORKER-RPC-OPERATION" /tmp/baseline-gis-contract.log
          grep -F "invalid의 Polygon" /tmp/baseline-gis-contract.log
          grep -F "fail 1" /tmp/baseline-gis-contract.log
          echo 'Confirmed exact pre-existing GIS invalid-polygon Worker error-code difference on untouched main.'
