name: P0 RenderDevice GL state scoped check
on:
  push:
    branches: ['fix/p0-gl-state-contract-20261112']
    paths: ['.github/workflows/p0-gl-state-contract-check.yml']
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Syntax of only touched JavaScript
        run: |
          node --check src/rendering/render-device.js
          node --check src/rendering/gpu-hydro-coverage.js
          node --check src/rendering/gpu-stroke-renderer.js
          node --check src/rendering/gpu-map-renderer.js
      - name: Targeted renderer contracts only
        run: node --test tests/unit/rendering/gpu-stroke-renderer.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real Chromium P7 32x single-sample acceptance
        run: node scripts/p7-browser-ab-measure.mjs --label=p7 --out=/tmp/p0-gl-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-gl-contract-p7-${{ github.sha }}
          path: /tmp/p0-gl-contract.json
          if-no-files-found: warn
          retention-days: 14
