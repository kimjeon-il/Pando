name: Optimization focused recovery contracts
# Exact recovery suites only; never run the full test catalog.
on:
  push:
    branches: [work/optimization]
    paths:
      - '.github/workflows/optimization-focused-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: P0-1 Pages staging contracts
        run: node --test --test-timeout=30000 tests/unit/document/monorepo-pages-staging.test.mjs
      - name: P0-2 and P0-3 project change selection
        run: node --test --test-timeout=30000 tests/unit/runtime/project-manifest-change-plan.test.mjs
      - name: P1-1 project terrain and P1-2 shared Hydro contract
        run: node --test --test-timeout=30000 tests/unit/data/physical-source-project.test.mjs tests/unit/data/map-project-manifest.test.mjs
      - name: P1-3 project catalog coherence and P1-5 publishing closure
        run: node --test --test-timeout=30000 tests/unit/build/frontend-build.test.mjs
      - name: P2-1 place data policy and presentation compatibility
        run: node --test --test-timeout=30000 tests/unit/rendering/place-runtime.test.mjs
      - name: P1-4 import identity and replacement rollback
        run: node --test --test-timeout=30000 tests/unit/document/map-project-identity.test.mjs tests/unit/document/project-domain-core-command.test.mjs
      - name: P1-5 archive compatibility contracts
        run: node --test --test-timeout=30000 tests/unit/data/library-data-scope.test.mjs
      - name: P2-1 physical water model and presentation contracts
        run: node --test --test-timeout=30000 tests/unit/document/historical-physical-water.test.mjs
      - name: P2-2 workflow ownership and check deduplication
        run: node --test --test-timeout=30000 tests/unit/runtime/workflow-check-ownership.test.mjs tests/unit/runtime/project-manifest-change-plan.test.mjs
      - name: Audit retained workflow owners (no broad test run)
        run: node tools/checks/audit-workflow-check-owners.mjs > "$RUNNER_TEMP/workflow-owners.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-workflow-owners
          path: ${{ runner.temp }}/workflow-owners.json
          if-no-files-found: ignore
          retention-days: 3
  project-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and run only C++ project codec contract
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/build/native -B build-native/optimization-project-codec -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native/optimization-project-codec --target project_codec_tests --parallel 2
          ctest --test-dir build-native/optimization-project-codec -R '^project_codec_tests --output-on-failure
