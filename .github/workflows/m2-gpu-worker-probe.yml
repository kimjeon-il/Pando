name: M2 Canvas Worker first-frame exact owner probe (no deployment)
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/m2-gpu-worker-probe.yml
      - tests/browser/m2-gpu-worker-frame-probe.spec.mjs
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Observe true received, stale and presented Worker frames
        run: >-
          pnpm exec playwright test tests/browser/m2-gpu-worker-frame-probe.spec.mjs
          --workers=1 --retries=0 --reporter=list --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-g4-worker-probe-${{ github.sha }}
          path: gpu-canvas-first-frame-evidence
          if-no-files-found: ignore
          retention-days: 3
