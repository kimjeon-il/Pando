name: GIS Baikonur government riverbank source availability (read-only)
on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/probe-baikonur-government-hydrography.mjs'
      - 'tests/unit/gis-baikonur-government-hydrography-probe.test.mjs'
      - '.github/workflows/gis-baikonur-government-bank-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify no unlicensed geometry can leak into probe receipts
        run: |
          node --test tests/unit/gis-baikonur-government-hydrography-probe.test.mjs
      - name: Query only public government hydrology attributes near the two treaty right-bank arcs
        run: |
          node tools/gis/probe-baikonur-government-hydrography.mjs \
            --output "$RUNNER_TEMP/baikonur-gov-water-availability.json"
      - name: Enforce source-only, no claims of independent surveyed geometry or reuse rights
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/baikonur-gov-water-availability.json','utf8'));
          assert.equal(p.maps.length,4);
          assert.equal(p.geometryApproved,false);
          assert.equal(p.geometryExported,false);
          assert.equal(p.geometryCopiedIntoPublishedMap,false);
          assert(p.maps.every(r=>r.status==='unavailable'||r.status==='candidate-attributes-received'));
          console.log('KAZAKH_TREATY_BANK_SOURCE_STATUS='+JSON.stringify(
            p.maps.map(x=>({pointPair:x.treatyPointPair,layer:x.layerId,status:x.status,
              featureCount:x.featureCount||0,hasName:!!x.names?.length,error:x.failureClass||null}))));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: baikonur-government-riverbank-source-only
          path: ${{ runner.temp }}/baikonur-gov-water-availability.json
          retention-days: 21
          if-no-files-found: warn
