name: "[HISTORICAL] GIS v0.14.0 private source archive catalog integration into library main"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pando-v014-library-main-catalog
  cancel-in-progress: false
jobs:
  catalog:
    if: github.repository == 'kimjeon-il/Pando' && github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 0866eb0aebb35d1355892b808de331b30c5fe52b
      SOURCE_PATH: terrain/v0.14.0/manifest.json
      TARGET_PATH: assets/data/terrain/v0.14.0/manifest.json
      EXPECTED_ASSETS: 773526f2535cace2cddca36a63803b3922ddbc4711a7c041e08add89ce7d9cf8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source metadata-only checkout of library main, no GIS regeneration
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: 0866eb0aebb35d1355892b808de331b30c5fe52b
          path: .pando-dem-main
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            archive/index.json
            terrain/v0.14.0/manifest.json
            terrain/v0.14.0/tint.webp
          sparse-checkout-cone-mode: false
      - name: Require scoped writer, main source identity and adequate disk
        env:
          LIBRARY_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$LIBRARY_TOKEN" || { echo 'Missing authorized library writer'; exit 1; }
          test "$(git -C .pando-dem-main rev-parse HEAD)" = "$SOURCE_SHA"
          available=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          test "$available" -gt 5368709120
      - name: Build source-verified public metadata receipts and preserve existing archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pando-dem-receipts"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {gunzipSync} from 'node:zlib';
          import {resolve,dirname} from 'node:path';
          import {validateTerrainManifest} from './src/data/terrain-manifest.js';
          const cwd='.pando-dem-main', sha=process.env.SOURCE_SHA, logical=process.env.TARGET_PATH;
          const digest=x=>createHash('sha256').update(x).digest('hex');
          const git=(...args)=>execFileSync('git',['-C',cwd,...args],{maxBuffer:24*1024*1024});
          assert.equal(git('rev-parse','HEAD').toString().trim(),sha);
          const source=git('show',sha+':'+process.env.SOURCE_PATH);
          const manifest=validateTerrainManifest(JSON.parse(source.toString('utf8')));
          assert.equal(manifest.version,'0.14.0');
          assert.equal(manifest.assetsSha256,process.env.EXPECTED_ASSETS);
          const index=JSON.parse(git('show',sha+':archive/index.json').toString('utf8'));
          assert(index.files&&!index.files[logical],'New manifest must not overwrite an archived resource');
          const old=index.files['assets/data/terrain/v0.13.3/manifest.json'];
          assert(old&&['gzip','identity'].includes(old.encoding),'Existing v0.13.3 archive contract required');
          const prior=git('show',sha+':'+old.stored);
          const priorManifest=JSON.parse((old.encoding==='gzip'?gunzipSync(prior):prior).toString('utf8'));
          assert(priorManifest.packaging?.sourceRevision&&priorManifest.tiles);
          const tree=git('ls-tree','-r','-l','-z',sha,'--','terrain/v0.14.0')
            .toString('utf8').split('\0').filter(Boolean);
          const sources=new Map();
          for(const line of tree){
            const m=/^100644 blob ([0-9a-f]{40})\s+(\d+)\t(terrain\/v0\.14\.0\/.+)$/.exec(line);
            assert(m,'Nonregular source asset');
            sources.set(m[3],{bytes:Number(m[2]),oid:m[1]});
          }
          assert.equal(sources.size,1282);
          const tiles={},aggregate=createHash('sha256');let totalBytes=0;
          for(const level of manifest.levels)for(let row=0;row<level.rows;row++)for(let column=0;column<level.columns;column++){
            const key=level.id+'/'+column+'-'+row+'.webp',stored='terrain/v0.14.0/'+key;
            const entry=sources.get(stored),hash=manifest.tileSha256[key];
            assert(entry&&entry.bytes>0&&/^[0-9a-f]{64}$/.test(hash||''),'Missing or unverified DEM tile '+key);
            tiles[key]={bytes:entry.bytes,sha256:hash};
            index.files['assets/data/terrain/v0.14.0/'+key]={stored,encoding:'identity',bytes:entry.bytes,sha256:hash};
            aggregate.update(key).update(Buffer.from(hash,'hex')); totalBytes+=entry.bytes;
          }
          assert.equal(Object.keys(tiles).length,1280);
          const tintEntry=sources.get('terrain/v0.14.0/tint.webp');
          const tintBytes=git('show',sha+':terrain/v0.14.0/tint.webp');
          assert(tintEntry&&tintEntry.bytes===tintBytes.length&&digest(tintBytes)===manifest.tint.sha256);
          index.files['assets/data/terrain/v0.14.0/tint.webp']={stored:'terrain/v0.14.0/tint.webp',
            encoding:'identity',bytes:tintEntry.bytes,sha256:manifest.tint.sha256};
          aggregate.update(Buffer.from(manifest.tint.sha256,'hex'));
          assert.equal(aggregate.digest('hex'),manifest.assetsSha256);
          assert.equal(totalBytes,269225242);
          assert.equal(totalBytes+tintEntry.bytes,271659036);
          const packaging={...priorManifest.packaging,sourceRevision:sha,
            sourcePath:process.env.SOURCE_PATH,sourceSha256:digest(source)};
          const catalog={...manifest,packaging,tiles};
          validateTerrainManifest(catalog);
          const encoded=Buffer.from(JSON.stringify(catalog)+'\n');
          index.files[logical]={stored:logical,encoding:'identity',bytes:encoded.length,sha256:digest(encoded)};
          mkdirSync(resolve(cwd,dirname(logical)),{recursive:true});
          writeFileSync(resolve(cwd,logical),encoded,{flag:'wx'});
          writeFileSync(resolve(cwd,'archive/index.json'),JSON.stringify(index)+'\n');
          const receipt={schema:'pando-dem-v014-main-catalog-v1',sourceRevision:sha,
            sourceManifestSha256:digest(source),catalogSha256:digest(encoded),tiles:1280,
            tileBytes:totalBytes,tintBytes:tintEntry.bytes,totalBytes:totalBytes+tintEntry.bytes,
            assetsSha256:manifest.assetsSha256,originalRetained:!!index.files['assets/data/terrain/v0.13.3/manifest.json']};
          writeFileSync(process.env.RUNNER_TEMP+'/pando-dem-receipts/catalog.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('V014_CATALOG_VERIFIED='+JSON.stringify(receipt));
          JS
      - name: Commit only catalog and archive index on library main
        shell: bash
        run: |
          set -euo pipefail
          git -C .pando-dem-main add --sparse -- archive/index.json assets/data/terrain/v0.14.0/manifest.json
          git -C .pando-dem-main diff --cached --check
          count=$(git -C .pando-dem-main diff --cached --name-only | wc -l)
          test "$count" -eq 2
          test "$(git -C .pando-dem-main diff --cached --name-only)" = "$(printf 'archive/index.json\nassets/data/terrain/v0.14.0/manifest.json')"
          git -C .pando-dem-main -c user.name='Pando terrain catalog integrator' \
            -c user.email='terrain-integrator@users.noreply.github.com' \
            commit -m 'data(terrain): index immutable v0.14.0 LOD tiles for main Viewer'
      - name: Fast-forward library main and verify remote object identity
        env:
          LIBRARY_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const dir='.pando-dem-main',token=process.env.LIBRARY_TOKEN,source=process.env.SOURCE_SHA;
          assert(token);
          const env={...process.env,GIT_CONFIG_COUNT:'1',
            GIT_CONFIG_KEY_0:'http.https://github.com/.extraheader',
            GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+Buffer.from('x-access-token:'+token).toString('base64')};
          const git=(args)=>execFileSync('git',['-C',dir,...args],{env,encoding:'utf8',timeout:300000}).trim();
          const oldRemote=git(['ls-remote','--exit-code','origin','refs/heads/main']).split(/\s+/)[0];
          assert.equal(oldRemote,source,'Library main changed during candidate packaging');
          const next=git(['rev-parse','HEAD']);
          git(['push','origin','HEAD:refs/heads/main']);
          const current=git(['ls-remote','--exit-code','origin','refs/heads/main']).split(/\s+/)[0];
          assert.equal(current,next,'Library main remote readback failed');
          writeFileSync(process.env.RUNNER_TEMP+'/pando-dem-receipts/data-commit.txt',next+'\n');
          console.log('V014_MAIN_DATA_COMMIT='+next);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-v014-main-catalog-receipt
          path: ${{ runner.temp }}/pando-dem-receipts/*
          if-no-files-found: warn
          retention-days: 21
