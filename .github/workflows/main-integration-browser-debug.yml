name: "[HISTORICAL] Focused browser project replacement diagnostics"
# Recheck latest optimization runtime with the shipping renderer after conflict reconciliation.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc,cache: pnpm}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-core-prerequisite.mjs
      - id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium
          node tools/data/library-data.mjs --purpose=viewer
          pnpm exec playwright test tests/browser/document/viewer-project-runtime-roundtrip.spec.mjs \
            --workers=1 --reporter=list --timeout=165000 2>&1 | tee "$RUNNER_TEMP/merge-browser-debug.log"
      - name: Save diagnostic log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-runtime-browser-debug
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Record diagnostic result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),log=process.env.RUNNER_TEMP+'/merge-browser-debug.log',path='validation-results/main-integration-browser-debug.json';
            const result={sourceCommit:context.sha,test:'${{ steps.test.outcome }}',
              output:fs.existsSync(log)?fs.readFileSync(log,'utf8').slice(-25000):'not executed'};
            let sha;try{sha=(await github.rest.repos.getContent({owner:context.repo.owner,
              repo:context.repo.repo,path,ref:'work/optimization-main-merge-20261110'})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,
              repo:context.repo.repo,path,branch:'work/optimization-main-merge-20261110',
              ...(sha?{sha}:{}),content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),
              message:'test: capture project replacement browser regression'});
      - name: Require browser pass
        if: always()
        run: test '${{ steps.test.outcome }}' = success
