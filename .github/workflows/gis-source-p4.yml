name: P4 Isolated GIS source checks
# Past source migration or repository-history audit: manual, not a release gate.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: p4-gis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gis-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify GIS dispatcher and current source isolation
        run: node --test tests/unit/geometry/gis-source-launcher.test.mjs
