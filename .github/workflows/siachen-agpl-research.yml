name: Siachen AGPL research split
on:
  push:
    branches: [work/gis]
    paths:
      - scripts/research/siachen/build_control_zones.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS tools
        run: python -m pip install --quiet shapely pyproj matplotlib
      - name: Verify and split Natural Earth Siachen geometries
        run: python scripts/research/siachen/build_control_zones.py
      - name: Check data artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path('assets/data/research/siachen')
          expected=['siachen_agpl_osm_candidate.geojson','siachen_control_split_ne_10m.geojson','siachen_control_split_ne_50m.geojson','siachen_control_comparison.json','siachen_control_comparison.png','README_control.md']
          for name in expected:
            assert (folder/name).stat().st_size > 100, name
          for scale in ['10m','50m']:
            data=json.loads((folder/f'siachen_control_split_ne_{scale}.geojson').read_text())
            assert sorted(f['properties']['control'] for f in data['features']) == ['IND','PAK']
          report=json.loads((folder/'siachen_control_comparison.json').read_text())
          assert report['10m']['coverage_gap_km2'] < .001
          assert report['50m']['coverage_gap_km2'] < .001
          print('SUCCESS: checked all AGPL candidate outputs')
          PY
      - name: Commit research results only to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/research/siachen/
          if ! git diff --cached --quiet; then
            git commit -m "research: save source-attributed approximate AGPL and polygon splits"
            git push origin HEAD:work/gis
          fi
      - name: Export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siachen-agpl-research
          path: |
            assets/data/research/siachen/siachen_agpl_osm_candidate.geojson
            assets/data/research/siachen/siachen_control_split_ne_10m.geojson
            assets/data/research/siachen/siachen_control_split_ne_50m.geojson
            assets/data/research/siachen/siachen_control_comparison.json
            assets/data/research/siachen/siachen_control_comparison.png
            assets/data/research/siachen/README_control.md
