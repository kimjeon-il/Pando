# Explicit GIS/source-data reproduction; lightweight source checks remain in gis-python-p4.yml.
name: Siachen AGPL research split
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
          persist-credentials: true
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS tools
        run: python -m pip install --quiet shapely pyproj matplotlib
      - name: Verify and split Natural Earth Siachen geometries
        run: python scripts/research/siachen/build_control_zones.py
      - name: Check data artifacts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from report_paths import report_path
          from pathlib import Path
          import json
          folder=report_path("reports/borders/reconstruction/siachen", access="read")
          expected=['siachen_agpl_osm_candidate.geojson','siachen_control_split_ne_10m.geojson','siachen_control_split_ne_50m.geojson','siachen_control_comparison.json','siachen_control_comparison.png','README_control.md']
          for name in expected:
            assert (folder/name).stat().st_size > 100, name
          for scale in ['10m','50m']:
            data=json.loads((folder/f'siachen_control_split_ne_{scale}.geojson').read_text())
            assert sorted(f['properties']['control'] for f in data['features']) == ['IND','PAK']
          report=json.loads((folder/'siachen_control_comparison.json').read_text())
          assert report['10m']['coverage_gap_km2'] < .001
          assert report['50m']['coverage_gap_km2'] < .001
          print('SUCCESS: checked all AGPL candidate outputs')
          PY
      - name: Commit research results only to research branch
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/
          if ! git diff --cached --quiet; then
            git commit -m "research: save source-attributed approximate AGPL and polygon splits"
            git push origin HEAD:work/gis
          fi
      - name: Resolve branch report artifacts
        run: echo "PANDO_REPORT_ARTIFACTS=$(python tools/report_paths.py reports/borders/reconstruction/siachen --access read)" >> "$GITHUB_ENV"
      - name: Export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siachen-agpl-research
          path: |
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_agpl_osm_candidate.geojson
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_control_split_ne_10m.geojson
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_control_split_ne_50m.geojson
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_control_comparison.json
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_control_comparison.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/README_control.md
