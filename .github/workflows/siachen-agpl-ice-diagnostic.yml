# Explicit GIS/source-data reproduction; lightweight source checks remain in gis-python-p4.yml.
name: Siachen AGPL ice-discrepancy diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet shapely pyproj matplotlib
      - name: Analyse the spatial discrepancy
        run: python scripts/research/siachen/diagnose_glacier_agpl_discrepancy.py
      - name: Validate output files
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from report_paths import report_path
          import json
          from pathlib import Path
          p=report_path("reports/borders/reconstruction/siachen", access="read")
          m=json.loads((p/"siachen_agpl_discrepancy_diagnostic.json").read_text())
          assert 1 < m["by_source_scale"]["10m"]["rgi_overlap_pakistan_km2"] < 2
          assert m["line_through_ice"]["intersected_length_km"] > 0
          assert len(m["by_source_scale"]["10m"]["rgi_pakistan_components"])>0
          print("VALIDATED",m["by_source_scale"]["10m"]["rgi_pakistan_components"][0])
          PY
      - name: Commit research-only diagnostic
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/
          if ! git diff --cached --quiet; then
            git commit -m "research: record spatial diagnosis of AGPL and ice overlaps"
            git push origin HEAD:work/gis
          fi
      - name: Resolve branch report artifacts
        run: echo "PANDO_REPORT_ARTIFACTS=$(python tools/report_paths.py reports/borders/reconstruction/siachen --access read)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: siachen-ice-agpl-discrepancy
          path: |
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_agpl_discrepancy_diagnostic.json
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_glacier_agpl_discrepancy.geojson
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_agpl_discrepancy_overview.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_agpl_discrepancy_zoom.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/README_discrepancy.md
