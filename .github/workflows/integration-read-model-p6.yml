name: P6 integration read-model contract
on:
  push:
    branches: [work/ui]
    paths:
      - tests/unit/core-document-read-model.test.mjs
      - shared/frontend/js/modules/core-document-read-model.js
      - .github/workflows/integration-read-model-p6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Verify committed Core identity
        run: node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
      - name: Synthetic read-model fixture contract
        run: node --test tests/unit/core-document-read-model.test.mjs
      - name: Focused check inventory and runner contracts
        run: node --test tests/unit/check-automation.test.mjs tests/unit/check-runner.test.mjs
      - name: Record the actual integration check plan
        shell: bash
        run: |
          mkdir -p test-results/p6-integration
          node scripts/run-application-checks.mjs --list --base 2b460e40dbc51de2d13b0fe40e11bd4af9e49b75 --output test-results/p6-integration/plan.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { loadRepository, planApplicationChecks } from './scripts/plan-application-checks.mjs';
          const plan = JSON.parse(readFileSync('test-results/p6-integration/plan.json', 'utf8')).plan;
          const deferred = 'tests/browser/deferred-builtin-timeline.spec.mjs';
          assert.ok(!plan.browserSpecs.includes(deferred), 'User-deferred cases must stay out of automatic integration checks');
          assert.ok(plan.browserSpecs.includes('tests/browser/timeline-controls.spec.mjs'), 'Ordinary timeline acceptance remains automatic');
          const manual = planApplicationChecks({ changedFiles: [], repository: loadRepository(), groups: ['deferred-builtin-timeline'] });
          assert.deepEqual(manual.browserSpecs, [deferred], 'Deferred cases remain explicitly callable');
          console.log('P6_INTEGRATION_PLAN ' + JSON.stringify({ unitTests: plan.unitTests.length,
            browserSpecs: plan.browserSpecs.length, commands: plan.commands, prerequisites: plan.prerequisites,
            deferredAutomatic: false, deferredManual: manual.browserSpecs }));
          NODE
      - name: Retain integration selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-integration-plan-${{ github.sha }}
          path: test-results/p6-integration/
          if-no-files-found: warn
          retention-days: 14
