name: P6 integration fixture contracts
on:
  push:
    branches: [work/ui]
    paths:
      - tests/unit/document/core-document-read-model.test.mjs
      - tests/unit/rendering/country-shared-boundary-generator.test.mjs
      - src/document/core-document-read-model.js
      - .github/workflows/integration-read-model-p6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Verify committed Core identity
        run: node tools/build/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - name: Synthetic read-model fixture contract
        run: node --test tests/unit/document/core-document-read-model.test.mjs
      - name: Focused check inventory and runner contracts
        run: node --test tests/unit/runtime/check-runner.test.mjs 
  shared-boundary-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Check pinned fixture preparation capacity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, statfsSync } from 'node:fs';
          const pin = JSON.parse(readFileSync('config/library-data.json', 'utf8'));
          assert.equal(pin.revision, '5eb7be55208efaafe39bd5a65ec2f111d70b9053');
          // Reviewed 5eb7 runtime index: 1,763 active paths; archive blob 771135a880965fc17314ec6d9506583edbc7d282.
          const requiredBytes = 1797260115n + 512n * 1024n ** 2n + 5n * 1024n ** 3n;
          const disk = statfsSync(process.cwd(), { bigint: true });
          const freeBytes = disk.bavail * disk.bsize;
          console.log(JSON.stringify({ dataRevision: pin.revision,
            requiredBytes: String(requiredBytes), freeBytes: String(freeBytes) }));
          assert.ok(freeBytes >= requiredBytes, 'Fixture preparation needs its cold peak, temporary reserve and 5 GiB headroom');
          NODE
      - uses: ./.github/actions/library-data
      - name: Verify committed Core identity without rebuilding
        run: node tools/build/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - name: Verify shared-boundary archive ownership and exact content
        run: node --test tests/unit/rendering/country-shared-boundary-generator.test.mjs
