name: Optimization source-matched C++ codec and runtime contracts
# Builds only the changed C++ codec, the paired WASM target, and directly affected unit contracts.
on:
  push:
    branches: [work/optimization]
    paths:
      - '.github/workflows/optimization-source-matched-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-codec:
    # Only project_codec_tests is built on this validation push; no whole native suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify just the C++ project codec
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/build/native -B build-native/optimization-codec -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native/optimization-codec --target project_codec_tests --parallel 2
          ctest --test-dir build-native/optimization-codec -R project_codec_tests --output-on-failure
  source-matched-wasm:
    # Rebuilding the entire WASM toolchain is opt-in, not a prerequisite for the bounded C++ codec test.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 3.31.6
      - name: Get source-pinned Emscripten SDK
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - name: Compile only the shared native-backed WASM target
        shell: bash
        run: |
          set -euo pipefail
          build-native/emsdk/emsdk install 6.0.3
          build-native/emsdk/emsdk activate 6.0.3
          source build-native/emsdk/emsdk_env.sh
          emcc --version | sed -n '1p' | grep -F '6.0.3'
          port_file=build-native/emsdk/upstream/emscripten/tools/ports/zlib.py
          original='https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz'
          canonical='https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION}'
          grep -Fq "$original" "$port_file"
          sed -i "s|$original|$canonical|" "$port_file"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='build-native/emsdk/upstream/emscripten/tools/ports/__init__.py';
          const input=readFileSync(file,'utf8');
          const old="    ext = url_filename.split('.', 1)[1]";
          if(input.split(old).length!==2)throw Error('Unexpected pinned Emscripten port loader');
          const next="    ext = 'tar.gz' if name == 'zlib' and url.startswith('https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v') else url_filename.split('.', 1)[1]";
          writeFileSync(file,input.replace(old,next));
          NODE
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm
      - name: Recheck only the corrected historical water date-boundary contract
        env:
          PANDOEDITOR_WASM_MODULE: build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
        run: >-
          node --test --test-concurrency=1 --test-timeout=30000
          tests/unit/document/historical-physical-water.test.mjs
