          tests/unit/editing-render-packet.test.mjs
          tests/unit/editing-interaction-events.test.mjs
          tests/unit/app-geometry-preview.test.mjs
          tests/browser/edit-preview-handoff.spec.mjs
      - name: Verify M2 lifecycle, editing packets, frame acceptance and M1 continuity
        run: >
          node --test
          tests/unit/edit-preview-handoff.test.mjs
          tests/unit/edit-preview-presentation.test.mjs
          tests/unit/edit-preview-controller.test.mjs
          tests/unit/app-geometry-preview.test.mjs
          tests/unit/editing-vertex-transaction.test.mjs
          tests/unit/editing-interaction-events.test.mjs
          tests/unit/editing-render-packet.test.mjs
