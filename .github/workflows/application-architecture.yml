name: Viewer core checks
on:
  workflow_dispatch:
    inputs:
      group:
        type: choice
        options:
          - node
          - browser
          - lint
        default: node
        description: Selected core check
      test_name_pattern:
        type: string
        default: ""
        description: Optional Node scenario name
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: inputs.group == 'browser'
        run: node tools/data/library-data.mjs --prepare-metadata
      - if: inputs.group == 'browser'
        run: pnpm exec playwright install --with-deps chromium
      - env:
          CHECK_GROUP: ${{ inputs.group }}
          CHECK_PATTERN: ${{ inputs.test_name_pattern }}
        run: |-
          node --input-type=module <<'NODE'
          import { executeChecks } from './scripts/run-application-checks.mjs';
          executeChecks({groups:[process.env.CHECK_GROUP],testNamePattern:process.env.CHECK_PATTERN||undefined});
          NODE
