name: Application Architecture

on:
  workflow_dispatch:
    inputs:
      browser_scope:
        description: Browser validation scope; default preserves existing checks
        required: false
        type: choice
        default: default
        options:
          - default
          - map-rendering
          - editor-diagnostics
          - boundary-capture-comparison
          - boundary-native-capture
          - boundary-revision-comparison
  pull_request:
    paths:
      - 'assets/js/**'
      - 'assets/data/**'
      - 'assets/css/**'
      - 'tools/**'
      - 'tests/**/*.py'
      - 'tests/fixtures/**'
      - 'scripts/check*.mjs'
      - 'scripts/plan-application-checks.mjs'
      - 'scripts/lib/**'
      - 'scripts/contracts/**'
      - 'index.html'
      - 'README.md'
      - 'tests/unit/**'
      - 'tests/helpers/**'
      - 'tests/browser/**'
      - 'playwright.config.js'
      - 'scripts/generate-build-metadata.mjs'
      - 'docs/architecture/application-command-pipeline.md'
      - 'docs/architecture/generic-feature-provenance.md'
      - 'docs/architecture/versioning-migrations-exchange.md'
      - 'docs/architecture/worker-rpc.md'
      - 'docs/architecture/renderer-v2.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - '.github/workflows/application-architecture.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/js/**'
      - 'assets/data/**'
      - 'assets/css/**'
      - 'tools/**'
      - 'tests/**/*.py'
      - 'tests/fixtures/**'
      - 'scripts/check*.mjs'
      - 'scripts/plan-application-checks.mjs'
      - 'scripts/lib/**'
      - 'scripts/contracts/**'
      - 'index.html'
      - 'README.md'
      - 'tests/unit/**'
      - 'tests/helpers/**'
      - 'tests/browser/**'
      - 'playwright.config.js'
      - 'scripts/generate-build-metadata.mjs'
      - 'docs/architecture/application-command-pipeline.md'
      - 'docs/architecture/generic-feature-provenance.md'
      - 'docs/architecture/versioning-migrations-exchange.md'
      - 'docs/architecture/worker-rpc.md'
      - 'docs/architecture/renderer-v2.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - '.github/workflows/application-architecture.yml'

# Automatic runs share their current PR/ref; manual diagnostics and reruns stay isolated.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name != 'workflow_dispatch' && github.run_attempt == 1
    && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref)
    || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  changes:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'map-rendering' && 'Focused map rendering / ' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'editor-diagnostics' && 'Focused editor diagnostics / ' || '' }}Detect application scopes
    runs-on: ubuntu-latest
    outputs:
      territorial-store: ${{ steps.plan.outputs.territorial_store }}
      unit-suite: ${{ steps.plan.outputs.unit_suite }}
      data-contracts: ${{ steps.plan.outputs.data_contracts }}
      terrain-rendering: ${{ steps.plan.outputs.terrain_rendering }}
      boundary-continuity: ${{ steps.plan.outputs.boundary_continuity }}
      preview-handoff: ${{ steps.plan.outputs.preview_handoff }}
      scene-staging: ${{ steps.plan.outputs.scene_staging }}
      visual-policy: ${{ steps.plan.outputs.visual_policy }}
      current-browser-specs: ${{ steps.plan.outputs.current_browser_specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Plan application checks from current dependencies
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BROWSER_SCOPE: ${{ inputs.browser_scope || 'default' }}
        run: node scripts/plan-application-checks.mjs --github-output
      - name: Verify shared core prerequisite once before dependent jobs
        if: github.event_name != 'workflow_dispatch' || inputs.browser_scope == 'default' || inputs.browser_scope == 'map-rendering' || inputs.browser_scope == 'editor-diagnostics'
        run: node scripts/check-core-prerequisite.mjs

  boundary-capture-comparison:
    name: Boundary screencast comparison (A1, B1, B2, A2)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'boundary-capture-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare screenshot capture in four independent desktop runs
        run: node scripts/run-boundary-capture-comparison.mjs
      - name: Upload comparison manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-summary-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/boundary-capture-comparison/comparison-*/summary.json
            test-results/boundary-capture-comparison/comparison-*/**/evidence/**
          if-no-files-found: error
      - name: Upload A1 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-A1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/A1
          if-no-files-found: error
      - name: Upload B1 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-B1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/B1
          if-no-files-found: error
      - name: Upload B2 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-B2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/B2
          if-no-files-found: error
      - name: Upload A2 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-A2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/A2
          if-no-files-found: error

  boundary-native-capture:
    name: Boundary native rendering attribution (one B run)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'boundary-native-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture one exact desktop Undo with screenshots disabled
        shell: bash
        env:
          PANDOLAB_BOUNDARY_NATIVE_TRACE: '1'
          PANDOLAB_BOUNDARY_CAPTURE_SCREENSHOTS: 'false'
        run: |
          mkdir -p test-results/boundary-native-capture
          set -o pipefail
          pnpm exec playwright test tests/browser/boundary-cut-snapping.spec.mjs --config=playwright.boundary-capture.config.mjs --grep='(?:^|\s)a child cut snaps to both parent boundaries, preserves coverage and undoes in one step$' --workers=1 --retries=0 --repeat-each=1 --output=test-results/boundary-native-capture 2>&1 | tee test-results/boundary-native-capture.log
      - name: Upload bounded native raw trace separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-native-raw-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-native-capture/**/boundary-project-undo-native-timeline.json
          compression-level: 0
          if-no-files-found: warn
      - name: Upload compact native manifest and host log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-native-manifest-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/boundary-native-capture/**/boundary-project-undo-native-timeline-manifest.json
            test-results/boundary-native-capture.log
          if-no-files-found: error
      - name: Upload existing Playwright evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-native-playwright-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/boundary-native-capture
            !test-results/boundary-native-capture/**/boundary-project-undo-native-timeline.json*
            !test-results/boundary-native-capture/**/boundary-project-undo-native-timeline-manifest.json*
          if-no-files-found: error

  boundary-revision-comparison:
    name: Boundary revision comparison (PR1, main1, main2, PR2)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'boundary-revision-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: boundary-pr
    steps:
      - name: Checkout comparison harness and PR product
        uses: actions/checkout@v4
        with:
          path: boundary-pr
          fetch-depth: 1
      - name: Checkout immutable latest main product
        uses: actions/checkout@v4
        with:
          ref: 0c55e8e4e8bacb3b125091c9b3a12ff535b5bdb6
          path: boundary-main
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: boundary-pr/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare exact desktop case with added helpers and tracing off
        env:
          PANDOLAB_BOUNDARY_BASELINE_ROOT: ${{ github.workspace }}/boundary-main
          PANDOLAB_BOUNDARY_PR_REVISION: ${{ github.sha }}
        run: node scripts/run-boundary-revision-comparison.mjs
      - name: Upload compact revision summary and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-summary-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            boundary-pr/test-results/boundary-revision-comparison/comparison-*/summary.json
            boundary-pr/test-results/boundary-revision-comparison/comparison-*/**/timings.json
          if-no-files-found: error
      - name: Upload PR1 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-PR1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/PR1
          if-no-files-found: error
      - name: Upload main1 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-main1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/main1
          if-no-files-found: error
      - name: Upload main2 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-main2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/main2
          if-no-files-found: error
      - name: Upload PR2 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-PR2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/PR2
          if-no-files-found: error

  current-browser-contracts:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'map-rendering' && 'Focused map rendering / ' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'editor-diagnostics' && 'Focused editor diagnostics / ' || '' }}Current browser contract (${{ matrix.spec }})
    needs: changes
    if: needs.changes.outputs.current-browser-specs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        spec: ${{ fromJSON(needs.changes.outputs.current-browser-specs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint "${{ matrix.spec }}"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the changed current workflow
        run: |
          mkdir -p test-results
          set -o pipefail
          pnpm exec playwright test "${{ matrix.spec }}" --workers=1 --output=test-results/current-browser-contracts 2>&1 | tee test-results/current-browser-contract.log
      - name: Upload current browser contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-browser-contract-${{ strategy.job-index }}
          path: test-results
          if-no-files-found: error

  visual-policy:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'map-rendering' && 'Focused map rendering / ' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'editor-diagnostics' && 'Focused editor diagnostics / ' || '' }}Common map visual policy and frame consumers (M4-M6)
    needs: changes
    if: needs.changes.outputs.visual-policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused visual policy lint
        run: >
          pnpm exec eslint assets/js/modules/layer-presentation.js assets/js/modules/map-interaction-style.js
          assets/js/modules/selection-pass.js assets/js/modules/gpu-scene-preparation.js
          assets/js/modules/gpu-scene.js assets/js/modules/rendering-domain.js assets/js/modules/map-workspace-host.js
          assets/js/modules/gpu-base-scene-pass.js assets/js/modules/gpu-map-renderer.js
          assets/js/modules/gpu-interaction-pass.js assets/js/modules/app-interaction-packets.js
          assets/js/workers/canvas-render-worker.js assets/js/workers/canvas-scene-composition-core.js
          assets/js/modules/app-environment.js assets/js/modules/edit-preview-controller.js
          assets/js/modules/gpu-stroke-renderer.js assets/js/modules/selection-overlay-plan.js
          assets/js/modules/selection-style.js tests/unit/map-stroke-style.test.mjs
          tests/unit/country-shared-boundary.test.mjs tests/unit/map-interaction-style.test.mjs
          tests/unit/map-visual-order.test.mjs
          tests/unit/gpu-prepared-draw.test.mjs tests/unit/interaction-roles.test.mjs
          tests/browser/renderer-migration-gaps.spec.mjs tests/browser/selection-interaction-style.spec.mjs
          tests/browser/interaction-unification.spec.mjs
          assets/js/modules/map-projection.js assets/js/modules/territorial-labels.js
          assets/js/modules/app-domain-assembly.js assets/js/modules/app-service-assembly.js
          assets/js/modules/app-generic-commands.js assets/js/modules/app-territorial-drafts.js
          assets/js/modules/physical-resources.js assets/js/modules/app-map-audit.js
          assets/js/modules/map-visual-frame.js assets/js/modules/map-render-coordinator.js
          assets/js/modules/gpu-hydro-preparation.js tests/browser/visual-frame-sync.spec.mjs
          tests/unit/visual-frame-consumers.test.mjs tests/unit/map-label-visibility.test.mjs
          tests/unit/domain-split-contract.test.mjs tests/unit/editing-render-packet.test.mjs
          tests/unit/distribution-selection.test.mjs tests/unit/label-shell-performance.test.mjs
          tests/unit/app-map-audit.test.mjs
      - name: Focused visual policy regressions
        run: >
          node --test tests/unit/map-visual-order.test.mjs tests/unit/gpu-base-scene-order.test.mjs
          tests/unit/gpu-prepared-draw.test.mjs tests/unit/interaction-roles.test.mjs
          tests/unit/map-interaction-style.test.mjs tests/unit/gpu-scene-staging.test.mjs
          tests/unit/render-channel-ownership.test.mjs tests/unit/selection-overlay-plan.test.mjs
          tests/unit/map-stroke-style.test.mjs tests/unit/country-shared-boundary.test.mjs
          tests/unit/gpu-stroke-renderer.test.mjs tests/unit/territorial-boundary-continuity.test.mjs
          tests/unit/edit-preview-presentation.test.mjs tests/unit/edit-preview-controller.test.mjs
          tests/unit/visual-frame-consumers.test.mjs tests/unit/map-visual-frame.test.mjs
          tests/unit/map-render-coordinator.test.mjs tests/unit/map-label-visibility.test.mjs
          tests/unit/domain-split-contract.test.mjs tests/unit/distribution-selection.test.mjs
          tests/unit/editing-render-packet.test.mjs tests/unit/label-shell-performance.test.mjs
          tests/unit/gpu-hydro-preparation.test.mjs tests/unit/gpu-renderer-lifecycle.test.mjs
          tests/unit/country-mesh-zoom-runtime.test.mjs tests/unit/app-map-audit.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Canvas Worker and WebGL overlay pixels
        run: pnpm exec playwright test tests/browser/renderer-migration-gaps.spec.mjs --grep='boundary edit SVG|shared stroke policy|multiply strokes|Canvas receives' --output=test-results/m5-stroke-pixels
      - name: Verify WebGL and SVG selection ownership
        run: pnpm exec playwright test tests/browser/selection-interaction-style.spec.mjs --grep='WebGL2 country selection|renderer fallback draws a single' --output=test-results/m4-selection
      - name: Verify direct edited line handoff in both renderers
        run: pnpm exec playwright test tests/browser/edit-preview-handoff.spec.mjs --grep='river hands.*outlines on' --output=test-results/m5-edit-ui
      - name: Verify direct coastline style and cancellation in both renderers
        run: pnpm exec playwright test tests/browser/interaction-unification.spec.mjs --grep='direct coastline gesture' --output=test-results/m7-coast-cancellation
      - name: Verify M6 frame consumers in WebGL, Canvas Worker and direct Canvas
        run: pnpm exec playwright test tests/browser/visual-frame-sync.spec.mjs --output=test-results/m6-visual-frames
      - name: Upload visual policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-visual-policy-evidence
          path: test-results
          if-no-files-found: error

  scene-staging:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'map-rendering' && 'Focused map rendering / ' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'editor-diagnostics' && 'Focused editor diagnostics / ' || '' }}GPU stroke domain staging (M3)
    needs: changes
    if: needs.changes.outputs.scene-staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused M3 lint
        run: >
          pnpm exec eslint
          assets/js/modules/gpu-scene.js assets/js/modules/render-scene.js
          assets/js/modules/gpu-scene-preparation.js assets/js/modules/gpu-base-scene-pass.js
          assets/js/modules/gpu-map-renderer.js assets/js/modules/gpu-stroke-renderer.js
          assets/js/modules/rendering-domain.js tests/unit/gpu-scene-staging.test.mjs
          tests/unit/gpu-prepared-draw.test.mjs tests/unit/gpu-base-scene-order.test.mjs
          tests/browser/gpu-scene-staging.spec.mjs tests/browser/renderer-migration-gaps.spec.mjs
          tests/browser/territorial-boundary-continuity.spec.mjs
      - name: Verify staged resources, frame commit, M1 and M2 regressions
        run: >
          node --test tests/unit/gpu-scene-staging.test.mjs tests/unit/gpu-prepared-draw.test.mjs
          tests/unit/gpu-base-scene-order.test.mjs tests/unit/render-scene.test.mjs
          tests/unit/gpu-stroke-renderer.test.mjs tests/unit/gpu-upload-staging.test.mjs
          tests/unit/territorial-boundary-continuity.test.mjs tests/unit/edit-preview-presentation.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify real GPU partial uploads and frame release
        run: pnpm exec playwright test tests/browser/gpu-scene-staging.spec.mjs --output=test-results/m3-gpu
      - name: Verify affected scene pixel contract
        run: pnpm exec playwright test tests/browser/renderer-migration-gaps.spec.mjs --grep='Canvas receives' --output=test-results/m3-scene-pixels
      - name: Verify affected child creation and redraw UI
        run: pnpm exec playwright test tests/browser/territorial-boundary-continuity.spec.mjs --grep=webgl2 --output=test-results/m3-ui
      - name: Upload M3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-scene-staging-evidence
          path: test-results
          if-no-files-found: error

  preview-handoff:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'map-rendering' && 'Focused map rendering / ' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'editor-diagnostics' && 'Focused editor diagnostics / ' || '' }}Direct edit preview and end-to-end continuity (M2/M7, ${{ matrix.renderer }})
    needs: changes
    if: needs.changes.outputs.preview-handoff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        renderer: [webgl2, canvas]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused M2 lint
        run: >
          pnpm exec eslint
          assets/js/modules/edit-preview-controller.js
          assets/js/modules/editing-domain.js
          assets/js/modules/app-domain-assembly.js
          assets/js/modules/gpu-scene.js
          assets/js/modules/app-geometry-preview.js
          assets/js/modules/app-capability-ports-lifecycle-ui.js
          assets/js/modules/rendering-domain.js
          tests/unit/edit-preview-handoff.test.mjs
          tests/unit/edit-preview-presentation.test.mjs
          tests/unit/editing-vertex-transaction.test.mjs
          tests/unit/editing-render-packet.test.mjs
          tests/unit/editing-interaction-events.test.mjs
          tests/unit/app-geometry-preview.test.mjs
          tests/browser/edit-preview-handoff.spec.mjs
      - name: Verify M2 lifecycle, editing packets, frame acceptance and M1 continuity
        run: >
          node --test
          tests/unit/edit-preview-handoff.test.mjs
          tests/unit/edit-preview-presentation.test.mjs
          tests/unit/edit-preview-controller.test.mjs
          tests/unit/app-geometry-preview.test.mjs
          tests/unit/editing-vertex-transaction.test.mjs
          tests/unit/editing-interaction-events.test.mjs
          tests/unit/editing-render-packet.test.mjs
          tests/unit/map-render-coordinator.test.mjs
          tests/unit/map-visual-frame.test.mjs
