      - 'tests/unit/generic-feature-service.test.mjs'
      - 'tests/unit/generic-provenance.test.mjs'
      - 'tests/unit/project-migrations.test.mjs'
      - 'tests/unit/exchange-adapter-registry.test.mjs'
      - 'tests/unit/project-state.test.mjs'
      - 'tests/unit/project-serializer.test.mjs'
      - 'tests/unit/import-service.test.mjs'
      - 'tests/unit/worker-rpc.test.mjs'
      - 'tests/unit/worker-rpc-pool.test.mjs'
      - 'tests/unit/worker-job-scheduler.test.mjs'
      - 'tests/unit/map-edit-worker-client.test.mjs'
      - 'tests/unit/gpu-stroke-renderer.test.mjs'
      - 'tests/unit/renderer-v2.test.mjs'
      - 'tests/unit/selection-architecture.test.mjs'
      - 'tests/unit/render-scene.test.mjs'
      - 'tests/unit/map-render-coordinator.test.mjs'
      - 'tests/unit/startup-performance-contract.test.mjs'
      - 'tests/test_v0307_current_schema.py'
      - 'docs/architecture/application-command-pipeline.md'
      - 'docs/architecture/generic-feature-provenance.md'
      - 'docs/architecture/versioning-migrations-exchange.md'
      - 'docs/architecture/worker-rpc.md'
      - 'docs/architecture/renderer-v2.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
