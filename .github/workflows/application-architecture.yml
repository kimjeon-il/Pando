name: Application Architecture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        version: [baseline, current]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 582908e9645b79b212f7db5105e596c9986a6ee1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline libraries
        if: matrix.version == 'baseline'
        run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Install current CI libraries
        if: matrix.version == 'current'
        run: python -m pip install 'shapely==2.2.0' 'pyproj==3.8.0'
      - name: Observe exact generated data without modifying sources
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import pathlib
          import platform
          import sys
          import shapely
          import pyproj
          
          source = pathlib.Path('tools/build-territorial-geometry.py').resolve()
          spec = importlib.util.spec_from_file_location('territorial_builder', source)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          recipe = module.load_json(module.DEFAULT_RECIPE)
          builder = module.RecipeBuilder(recipe)
          geometry = builder.build_geometry()
          generated = json.loads(module.build_entity(recipe, geometry))
          stored = module.load_json(module.ROOT / recipe['output'])
          differences = []
          def compare(left, right, path='$'):
              if type(left) is not type(right):
                  differences.append({'path': path, 'stored': left, 'generated': right})
              elif isinstance(left, dict):
                  for key in left.keys() | right.keys():
                      if key not in left or key not in right:
                          differences.append({'path': path + '.' + key, 'missing': True})
                      else:
                          compare(left[key], right[key], path + '.' + key)
              elif isinstance(left, list):
                  if len(left) != len(right):
                      differences.append({'path': path, 'storedLength': len(left), 'generatedLength': len(right)})
                  for index, (a, b) in enumerate(zip(left, right)):
                      compare(a, b, f'{path}[{index}]')
              elif left != right:
                  differences.append({'path': path, 'stored': left, 'generated': right})
          compare(stored, generated)
          report = {'platform': platform.platform(), 'python': sys.version,
                    'shapely': shapely.__version__, 'GEOS': shapely.geos_version_string,
                    'pyproj': pyproj.__version__, 'PROJ': pyproj.proj_version_str,
                    'differenceCount': len(differences), 'differences': differences,
                    'sourceHashes': {key: module.sha256(value.path) for key, value in builder.sources.items()},
                    'diagnostics': module.validate_geometry(geometry, builder.results['canonical-country'], recipe['validation'])}
          out = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else 'diagnostic-output')
          out.mkdir(exist_ok=True)
          (out / 'report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          (out / 'generated.json').write_text(json.dumps(generated), encoding='utf-8')
          (out / 'stages.json').write_text(json.dumps({key: module.mapping(value) for key, value in builder.results.items()}), encoding='utf-8')
          print(json.dumps({**report, 'differences': differences[:12]}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: germany-${{ matrix.version }}
          path: diagnostic-output
