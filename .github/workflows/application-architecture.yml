  python-contracts:
    name: Current Python contracts and terrain DEM
    needs: changes
    if: needs.changes.outputs.python-contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current GIS and raster test dependencies
        run: python -m pip install -r tools/requirements-hydro-tiles.txt -r tools/requirements-historical-library.txt "numpy>=2,<3" "rasterio>=1.4,<2"
      - name: Root Python contracts
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Terrain DEM production generator and verifier regressions
        run: python -m unittest discover -s tests/python -p "test_*.py"

  data-contracts:
    name: Validation entrypoints and current generated assets
    needs: changes
    if: needs.changes.outputs.data-contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r tools/requirements-historical-library.txt
      - name: Validate JavaScript syntax and shared asset versions
        run: pnpm check:js && pnpm check:version
      - name: Validate canonical country sources and shared boundaries
        run: pnpm check:country-schema && pnpm check:country-default-colors && pnpm check:country-shared-boundaries
      - name: Validate generated preview assets and historical exchange library
        run: pnpm check:preview && pnpm check:historical-library

  full-unit-suite:
    name: Full unit suite
    needs: changes
