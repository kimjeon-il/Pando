          tests/unit/domain-split-contract.test.mjs
          tests/unit/capability-ports-contract.test.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify M7 per-frame ownership through Workers, topology and GPU upload plus M2 editing UI
        run: pnpm exec playwright test tests/browser/edit-preview-handoff.spec.mjs --grep='${{ matrix.renderer }} '
      - name: Upload M2/M7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edit-preview-handoff-evidence-${{ matrix.renderer }}
          path: test-results
          if-no-files-found: error

  terrain-rendering-contract:
    name: Terrain coverage and GPU upload regression
    needs: changes
    if: needs.changes.outputs.terrain-rendering == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused terrain lint
        run: >
          pnpm exec eslint
          assets/js/modules/gpu-terrain-preparation.js
          assets/js/modules/gpu-map-renderer.js
          assets/js/modules/rendering-domain.js
          tests/unit/gpu-terrain-preparation.test.mjs
          tests/unit/domain-split-contract.test.mjs
          tests/browser/terrain-lod-independence.spec.mjs
          tests/browser/terrain-preview-quality.spec.mjs
          tests/browser/terrain-progressive.spec.mjs
          tests/browser/terrain-request-priority.spec.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify actual terrain coverage, hover uploads and viewport cancellation
        env:
          PANDOLAB_VERIFY_LIVE_DEM: '1'
        run: >
          pnpm exec playwright test
          tests/browser/terrain-lod-independence.spec.mjs
          tests/browser/terrain-request-priority.spec.mjs
          tests/browser/terrain-preview-quality.spec.mjs
          tests/browser/terrain-progressive.spec.mjs
          --grep 'keeps terrain resources|rotating the globe|improved webgl2|slow mobile globe|surfaces exhausted'
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-rendering-evidence
          path: test-results
          if-no-files-found: ignore

