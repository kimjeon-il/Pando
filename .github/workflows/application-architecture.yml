name: Application Architecture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/js/**'
      - 'tests/unit/**'
      - 'tests/helpers/**'
      - 'tests/browser/terrain-*.spec.mjs'
      - 'tests/browser/territorial-boundary-continuity.spec.mjs'
      - 'tests/browser/edit-preview-handoff.spec.mjs'
      - 'tests/browser/server.mjs'
      - 'playwright.config.js'
      - 'scripts/check-runtime-boundaries.mjs'
      - 'scripts/lib/application-source.mjs'
      - 'scripts/generate-build-metadata.mjs'
      - 'scripts/check-version.mjs'
      - 'scripts/check-command-architecture.mjs'
      - 'scripts/check-territorial-storage.mjs'
      - 'scripts/lib/territorial-storage-audit.mjs'
      - 'scripts/contracts/territorial-storage-access.json'
      - 'scripts/check-generic-provenance.mjs'
      - 'scripts/check-version-architecture.mjs'
      - 'scripts/check-worker-architecture.mjs'
      - 'scripts/check-renderer-v2.mjs'
      - 'scripts/lib/renderer-v2-architecture.mjs'
      - 'scripts/check-object-registry.mjs'
      - 'tests/test_v0307_current_schema.py'
      - 'docs/architecture/application-command-pipeline.md'
      - 'docs/architecture/generic-feature-provenance.md'
      - 'docs/architecture/versioning-migrations-exchange.md'
      - 'docs/architecture/worker-rpc.md'
      - 'docs/architecture/renderer-v2.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - '.github/workflows/application-architecture.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/js/**'
      - 'tests/unit/**'
      - 'tests/helpers/**'
      - 'tests/browser/terrain-*.spec.mjs'
      - 'tests/browser/territorial-boundary-continuity.spec.mjs'
      - 'tests/browser/edit-preview-handoff.spec.mjs'
      - 'tests/browser/server.mjs'
      - 'playwright.config.js'
      - 'scripts/check-runtime-boundaries.mjs'
      - 'scripts/lib/application-source.mjs'
      - 'scripts/check-territorial-storage.mjs'
      - 'scripts/lib/territorial-storage-audit.mjs'
      - 'scripts/contracts/territorial-storage-access.json'
      - 'scripts/generate-build-metadata.mjs'
      - 'scripts/check-version.mjs'
      - 'scripts/check-command-architecture.mjs'
      - 'scripts/check-generic-provenance.mjs'
      - 'scripts/check-version-architecture.mjs'
      - 'scripts/check-worker-architecture.mjs'
      - 'scripts/check-renderer-v2.mjs'
      - 'scripts/lib/renderer-v2-architecture.mjs'
      - 'scripts/check-object-registry.mjs'
      - 'tests/test_v0307_current_schema.py'
      - 'docs/architecture/application-command-pipeline.md'
      - 'docs/architecture/generic-feature-provenance.md'
      - 'docs/architecture/versioning-migrations-exchange.md'
      - 'docs/architecture/worker-rpc.md'
      - 'docs/architecture/renderer-v2.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - '.github/workflows/application-architecture.yml'

permissions:
  contents: read

jobs:
  changes:
    name: Detect application scopes
    runs-on: ubuntu-latest
    outputs:
      territorial-store: ${{ steps.scope.outputs.territorial_store }}
      unit-suite: ${{ steps.scope.outputs.unit_suite }}
      terrain-rendering: ${{ steps.scope.outputs.terrain_rendering }}
      boundary-continuity: ${{ steps.scope.outputs.boundary_continuity }}
      preview-handoff: ${{ steps.scope.outputs.preview_handoff }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect application and test changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          territorial_store=false
          unit_suite=false
          terrain_rendering=false
          boundary_continuity=false
          preview_handoff=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            territorial_store=true
            unit_suite=true
            terrain_rendering=true
            boundary_continuity=true
            preview_handoff=true
          else
            while IFS= read -r file; do
              case "$file" in
                assets/js/modules/edit-preview-controller.js|assets/js/modules/editing-domain.js|assets/js/modules/app-domain-assembly.js|assets/js/modules/app-gpu-scene.js|assets/js/modules/app-geometry-preview.js|assets/js/modules/app-capability-ports-lifecycle-ui.js|assets/js/modules/rendering-domain.js|assets/js/modules/editing-render-packet.js|assets/js/modules/map-render-coordinator.js|assets/js/modules/app-interaction-packets.js|assets/js/modules/selection-*|assets/js/modules/render-channel-ownership.js|assets/js/modules/map-visual-frame.js|assets/js/modules/map-edit-*|assets/js/modules/gpu-map-renderer.js|assets/js/modules/gpu-canvas-worker.js|assets/js/modules/gpu-interaction-pass.js|assets/js/modules/gpu-stroke-renderer.js|assets/js/workers/canvas-render-worker.js|assets/js/workers/map-edit-worker.js|tests/unit/edit-preview-*.test.mjs|tests/unit/editing-*.test.mjs|tests/unit/app-geometry-preview.test.mjs|tests/unit/capability-ports-contract.test.mjs|tests/browser/edit-preview-handoff.spec.mjs|tests/helpers/production-geopackage.mjs|tests/fixtures/timeline-exchange/static.json|tests/browser/server.mjs|playwright.config.js|package.json|pnpm-lock.yaml|eslint.config.js|.github/workflows/application-architecture.yml)
                  preview_handoff=true
                  ;;
              esac
              case "$file" in
                assets/js/*|tests/unit/territorial-*.test.mjs|package.json|pnpm-lock.yaml|eslint.config.js|scripts/check-territorial-storage.mjs|scripts/lib/territorial-storage-audit.mjs|scripts/contracts/territorial-storage-access.json|.github/workflows/application-architecture.yml)
                  territorial_store=true
                  ;;
              esac
              case "$file" in
                assets/js/*|tests/unit/*|tests/helpers/*|package.json|pnpm-lock.yaml|eslint.config.js|.github/workflows/application-architecture.yml)
                  unit_suite=true
                  ;;
              esac
              case "$file" in
                assets/js/modules/rendering-domain.js|assets/js/modules/app-domain-assembly.js|assets/js/modules/edit-display-preparation.js|assets/js/modules/map-edit-*|assets/js/modules/boundary-*|assets/js/modules/gpu-scene-*|assets/js/modules/gpu-map-renderer.js|assets/js/modules/gpu-canvas-worker.js|assets/js/modules/gpu-base-scene-pass.js|assets/js/modules/gpu-stroke-renderer.js|assets/js/modules/app-gpu-scene.js|assets/js/modules/map-visual-frame.js|assets/js/modules/map-render-coordinator.js|assets/js/modules/render-channel-ownership.js|assets/js/workers/map-edit-worker.js|assets/js/workers/canvas-render-worker.js|tests/unit/territorial-boundary-continuity.test.mjs|tests/unit/domain-split-contract.test.mjs|tests/unit/empty-territorial-boundary.test.mjs|tests/unit/render-channel-ownership.test.mjs|tests/browser/territorial-boundary-continuity.spec.mjs|tests/browser/server.mjs|playwright.config.js|package.json|pnpm-lock.yaml|eslint.config.js|.github/workflows/application-architecture.yml)
                  boundary_continuity=true
                  ;;
              esac
              case "$file" in
                assets/js/modules/gpu-*|assets/js/modules/terrain-*|assets/js/modules/map-visual-frame.js|assets/js/modules/rendering-domain.js|assets/js/modules/app-map-*|assets/js/modules/app-physical-*|tests/browser/terrain-*.spec.mjs|tests/browser/server.mjs|playwright.config.js|tests/unit/gpu-terrain-preparation.test.mjs|tests/unit/domain-split-contract.test.mjs|package.json|pnpm-lock.yaml|eslint.config.js|.github/workflows/application-architecture.yml)
                  terrain_rendering=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "territorial_store=$territorial_store" >> "$GITHUB_OUTPUT"
          echo "unit_suite=$unit_suite" >> "$GITHUB_OUTPUT"
          echo "terrain_rendering=$terrain_rendering" >> "$GITHUB_OUTPUT"
          echo "boundary_continuity=$boundary_continuity" >> "$GITHUB_OUTPUT"
          echo "preview_handoff=$preview_handoff" >> "$GITHUB_OUTPUT"

  preview-handoff:
    name: Direct edit preview handoff (M2)
    needs: changes
    if: needs.changes.outputs.preview-handoff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused M2 lint
        run: >
          pnpm exec eslint
          assets/js/modules/edit-preview-controller.js
          assets/js/modules/editing-domain.js
          assets/js/modules/app-domain-assembly.js
          assets/js/modules/app-gpu-scene.js
          assets/js/modules/app-geometry-preview.js
          assets/js/modules/app-capability-ports-lifecycle-ui.js
          assets/js/modules/rendering-domain.js
          tests/unit/edit-preview-handoff.test.mjs
          tests/unit/edit-preview-presentation.test.mjs
          tests/unit/editing-vertex-transaction.test.mjs
          tests/unit/editing-render-packet.test.mjs
          tests/unit/editing-interaction-events.test.mjs
          tests/unit/app-geometry-preview.test.mjs
          tests/browser/edit-preview-handoff.spec.mjs
      - name: Verify M2 lifecycle, editing packets, frame acceptance and M1 continuity
        run: >
          node --test
          tests/unit/edit-preview-handoff.test.mjs
          tests/unit/edit-preview-presentation.test.mjs
          tests/unit/edit-preview-controller.test.mjs
          tests/unit/app-geometry-preview.test.mjs
          tests/unit/editing-vertex-transaction.test.mjs
          tests/unit/editing-interaction-events.test.mjs
          tests/unit/editing-render-packet.test.mjs
          tests/unit/map-render-coordinator.test.mjs
          tests/unit/map-visual-frame.test.mjs
          tests/unit/territorial-boundary-continuity.test.mjs
          tests/unit/empty-territorial-boundary.test.mjs
          tests/unit/render-channel-ownership.test.mjs
          tests/unit/domain-split-contract.test.mjs
          tests/unit/capability-ports-contract.test.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify boundary, coastline, river and lake handoff through actual UI
        run: pnpm exec playwright test tests/browser/edit-preview-handoff.spec.mjs
      - name: Upload M2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edit-preview-handoff-evidence
          path: test-results
          if-no-files-found: error

  terrain-rendering-contract:
    name: Terrain coverage and GPU upload regression
    needs: changes
    if: needs.changes.outputs.terrain-rendering == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused terrain lint
        run: >
          pnpm exec eslint
          assets/js/modules/gpu-terrain-preparation.js
          assets/js/modules/gpu-map-renderer.js
          assets/js/modules/rendering-domain.js
          tests/unit/gpu-terrain-preparation.test.mjs
          tests/unit/domain-split-contract.test.mjs
          tests/browser/terrain-lod-independence.spec.mjs
          tests/browser/terrain-preview-quality.spec.mjs
          tests/browser/terrain-progressive.spec.mjs
          tests/browser/terrain-request-priority.spec.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify actual terrain coverage, hover uploads and viewport cancellation
        env:
          PANDOLAB_VERIFY_LIVE_DEM: '1'
        run: >
          pnpm exec playwright test
          tests/browser/terrain-lod-independence.spec.mjs
          tests/browser/terrain-request-priority.spec.mjs
          tests/browser/terrain-preview-quality.spec.mjs
          tests/browser/terrain-progressive.spec.mjs
          --grep 'keeps terrain resources|rotating the globe|improved webgl2|slow mobile globe|surfaces exhausted'
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-rendering-evidence
          path: test-results
          if-no-files-found: ignore

  boundary-continuity:
    name: Territorial boundary topology continuity
    needs: changes
    if: needs.changes.outputs.boundary-continuity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused lint
        run: >
          pnpm exec eslint
          assets/js/modules/rendering-domain.js
          tests/unit/territorial-boundary-continuity.test.mjs
          tests/unit/domain-split-contract.test.mjs
          tests/browser/territorial-boundary-continuity.spec.mjs
      - name: Verify topology handoff and boundary ownership
        run: >
          node --test
          tests/unit/territorial-boundary-continuity.test.mjs
          tests/unit/domain-split-contract.test.mjs
          tests/unit/empty-territorial-boundary.test.mjs
          tests/unit/render-channel-ownership.test.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production UI and Worker in WebGL2 and Canvas
        run: pnpm exec playwright test tests/browser/territorial-boundary-continuity.spec.mjs
      - name: Upload focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-continuity-evidence
          path: test-results
          if-no-files-found: ignore

  command-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check application architecture
        run: pnpm check:architecture

  territorial-store-contract:
    name: Territorial storage contract
    needs: changes
    if: needs.changes.outputs.territorial-store == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused lint
        run: >
          pnpm exec eslint
          assets/js/modules/territorial-entity-store.js
          assets/js/modules/territorial-entity-repository.js
          assets/js/modules/territorial-service.js
          assets/js/modules/app-domain-assembly.js
          assets/js/modules/app-history-assembly.js
          assets/js/modules/app-runtime-dependencies.js
          assets/js/modules/app-capability-ports-foundation.js
          assets/js/modules/app-capability-ports.js
          assets/js/modules/app-capability-ports-lifecycle-ui.js
          assets/js/modules/app-builtin-session.js
          assets/js/modules/app-progressive-startup.js
          assets/js/modules/app-gis-assembly.js
          assets/js/modules/gis-import-transaction.js
          assets/js/modules/app-project-snapshots.js
          assets/js/modules/app-project-restore.js
          assets/js/modules/app-cut-geometry.js
          assets/js/modules/app-capability-ports-project-io.js
          assets/js/modules/app-capability-ports-object-editing.js
          assets/js/modules/territorial-interaction-policy.js
          assets/js/modules/app-object-deletion.js
          assets/js/modules/app-land-relations.js
          assets/js/modules/app-generic-commands.js
          assets/js/modules/app-territorial-conversion.js
          assets/js/modules/app-territorial-drafts.js
          tests/unit/territorial-entity-store.test.mjs
          tests/unit/territorial-entity-repository.test.mjs
          tests/unit/territorial-service.test.mjs
          tests/unit/territorial-store-boundary.test.mjs
          tests/unit/territorial-interaction-policy.test.mjs
      - name: Audit classified territorial storage access
        run: pnpm check:territorial-storage

  full-unit-suite:
    name: Full unit suite
    needs: changes
    if: needs.changes.outputs.unit-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full unit suite
        run: pnpm test:unit
