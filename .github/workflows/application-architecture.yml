name: Application Architecture
on:
  workflow_dispatch:
    inputs:
      browser_scope:
        description: Browser validation scope; default preserves existing checks
        required: false
        type: choice
        default: default
        options:
          - default
          - map-rendering
          - boundary-capture-comparison
          - boundary-native-capture
          - boundary-revision-comparison
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name != 'workflow_dispatch' &&
    github.run_attempt == 1 && format('{0}-{1}', github.event_name,
    github.event.pull_request.number || github.ref) ||
    format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == 1 }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      non_browser: ${{ steps.plan.outputs.non_browser }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_count: ${{ steps.plan.outputs.browser_count }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
    steps:
      - &a1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - &a2
        uses: pnpm/action-setup@v4
      - &a3
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &a4
        run: pnpm install --frozen-lockfile
      - &library
        name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - name: Select current application checks
        id: plan
        if: github.event_name != 'workflow_dispatch' ||
          !startsWith(inputs.browser_scope, 'boundary-')
        env: &a5
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before ||
            'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BROWSER_SCOPE: ${{ inputs.browser_scope || 'default' }}
          PLAYWRIGHT_LIST_PRINT_FAILURES_INLINE: '1'
        run: node scripts/run-application-checks.mjs --list --github-output
  non-browser:
    needs: changes
    if: needs.changes.outputs.non_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
      - *library
      - name: Select current application checks
        id: plan
        env: *a5
        run: node scripts/run-application-checks.mjs --list --github-output --phase non-browser
      - name: Install native GIS prerequisites only for selected data checks
        if: steps.plan.outputs.gis_native == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev libproj-dev
          zlib1g-dev pkg-config cmake
      - name: Prepare selected native test prerequisites
        uses: ./.github/actions/native-test-prerequisites
        with:
          requirements: ${{ steps.plan.outputs.native_requirements }}
      - name: Execute selected commands and unit tests once
        env: *a5
        run: node scripts/run-application-checks.mjs --phase non-browser --output
          "$RUNNER_TEMP/application-checks-non-browser.json"
      - name: Upload non-browser check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-checks-non-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-checks-non-browser.json
          if-no-files-found: warn
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - *a1
      - *a2
      - *a3
      - *a4
      - *library
      - name: Select current application checks
        id: plan
        env: *a5
        run: node scripts/run-application-checks.mjs --list --github-output --phase browser
          --shard ${{ matrix.current }}/${{ matrix.total }}
      - name: Install Chromium for selected browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare selected browser native prerequisites
        uses: ./.github/actions/native-test-prerequisites
        with:
          requirements: ${{ steps.plan.outputs.native_requirements }}
      - name: Execute this shard of the complete selected browser list
        env: *a5
        run: node scripts/run-application-checks.mjs --phase browser
          --shard ${{ matrix.current }}/${{ matrix.total }} --output
          "$RUNNER_TEMP/application-checks-browser-${{ matrix.current }}-of-${{ matrix.total }}.json"
      - name: Upload browser shard evidence and existing failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-checks-browser-${{ matrix.current }}-of-${{ matrix.total }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/application-checks-browser-${{ matrix.current }}-of-${{ matrix.total }}.json
            test-results/
          if-no-files-found: warn
  checks:
    needs: [changes, non-browser, browser]
    if: always() && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.browser_scope, 'boundary-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require every selected phase to finish successfully
        id: aggregate
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          CHECKS_SELECTED: ${{ needs.changes.outputs.checks }}
          NON_BROWSER_SELECTED: ${{ needs.changes.outputs.non_browser }}
          BROWSER_SELECTED: ${{ needs.changes.outputs.browser }}
          BROWSER_COUNT: ${{ needs.changes.outputs.browser_count }}
          BROWSER_MATRIX: ${{ needs.changes.outputs.browser_matrix }}
          NON_BROWSER_RESULT: ${{ needs.non-browser.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          node <<'NODE'
          const env = process.env;
          if (env.SELECTION_RESULT !== 'success') throw Error('Application selection did not succeed');
          const selected = name => {
            if (!['true', 'false'].includes(env[name])) throw Error('Missing or invalid selection output: ' + name);
            return env[name] === 'true';
          };
          const checks = selected('CHECKS_SELECTED'), nonBrowser = selected('NON_BROWSER_SELECTED'), browser = selected('BROWSER_SELECTED');
          if (checks !== (nonBrowser || browser)) throw Error('Inconsistent application phase selection');
          const count = Number(env.BROWSER_COUNT);
          if (!/^(0|[1-9]\d*)$/.test(env.BROWSER_COUNT || '') || !Number.isSafeInteger(count) || browser !== (count > 0))
            throw Error('Missing or invalid browser count');
          const matrix = JSON.parse(env.BROWSER_MATRIX), total = Math.min(8, count);
          if (!matrix || Object.keys(matrix).length !== 1 || !Array.isArray(matrix.include) || matrix.include.length !== total ||
              !matrix.include.every((row, index) => row && Object.keys(row).length === 2 && row.current === index + 1 && row.total === total))
            throw Error('Missing or invalid browser matrix');
          for (const [phase, required, result] of [
            ['non-browser', nonBrowser, env.NON_BROWSER_RESULT], ['browser', browser, env.BROWSER_RESULT],
          ]) {
            const expected = required ? 'success' : 'skipped';
            if (result !== expected) throw Error(phase + ' phase must be ' + expected + '; received ' + (result || 'missing'));
          }
          console.log(JSON.stringify({ applicationChecksPassed: true, nonBrowser, browser, browserShards: total }));
          NODE
  boundary-capture-comparison:
    name: Boundary screencast comparison (A1, B1, B2, A2)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.browser_scope ==
      'boundary-capture-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare screenshot capture in four independent desktop runs
        run: node scripts/run-boundary-capture-comparison.mjs
      - name: Upload comparison manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-summary-${{ github.run_id }}-attempt-${{
            github.run_attempt }}
          path: |
            test-results/boundary-capture-comparison/comparison-*/summary.json
            test-results/boundary-capture-comparison/comparison-*/**/evidence/**
          if-no-files-found: error
      - name: Upload A1 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-A1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/A1
          if-no-files-found: error
      - name: Upload B1 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-B1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/B1
          if-no-files-found: error
      - name: Upload B2 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-B2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/B2
          if-no-files-found: error
      - name: Upload A2 comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-capture-A2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-capture-comparison/comparison-*/A2
          if-no-files-found: error
  boundary-native-capture:
    name: Boundary native rendering attribution (one B run)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.browser_scope ==
      'boundary-native-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture one exact desktop Undo with screenshots disabled
        shell: bash
        env:
          PANDOLAB_BOUNDARY_NATIVE_TRACE: "1"
          PANDOLAB_BOUNDARY_CAPTURE_SCREENSHOTS: "false"
        run: |
          mkdir -p test-results/boundary-native-capture
          set -o pipefail
          pnpm exec playwright test tests/browser/boundary-cut-snapping.spec.mjs --config=playwright.boundary-capture.config.mjs --grep='(?:^|\s)a child cut snaps to both parent boundaries, preserves coverage and undoes in one step$' --workers=1 --retries=0 --repeat-each=1 --output=test-results/boundary-native-capture 2>&1 | tee test-results/boundary-native-capture.log
      - name: Upload bounded native raw trace separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-native-raw-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/boundary-native-capture/**/boundary-project-undo-native-timeline.json
          compression-level: 0
          if-no-files-found: warn
      - name: Upload compact native manifest and host log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-native-manifest-${{ github.run_id }}-attempt-${{
            github.run_attempt }}
          path: |
            test-results/boundary-native-capture/**/boundary-project-undo-native-timeline-manifest.json
            test-results/boundary-native-capture.log
          if-no-files-found: error
      - name: Upload existing Playwright evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-native-playwright-${{ github.run_id }}-attempt-${{
            github.run_attempt }}
          path: |
            test-results/boundary-native-capture
            !test-results/boundary-native-capture/**/boundary-project-undo-native-timeline.json*
            !test-results/boundary-native-capture/**/boundary-project-undo-native-timeline-manifest.json*
          if-no-files-found: error
  boundary-revision-comparison:
    name: Boundary revision comparison (PR1, main1, main2, PR2)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.browser_scope ==
      'boundary-revision-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: boundary-pr
    steps:
      - name: Checkout comparison harness and PR product
        uses: actions/checkout@v4
        with:
          path: boundary-pr
          fetch-depth: 1
      - name: Checkout immutable latest main product
        uses: actions/checkout@v4
        with:
          ref: 9fe9e91c2894c23a646b38ce5c792299dc102f99
          path: boundary-main
          fetch-depth: 1
      - name: Mount selected baseline inputs from library storage
        id: library_baseline_1
        uses: kimjeon-il/Pando/.github/actions/library-data@main
        with:
          inputs-revision: 4e93ea7b4fe3be3afc0eb17b11e2f1c6663dcbc2
          inputs-target: boundary-main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: boundary-pr/pnpm-lock.yaml
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare exact desktop case with added helpers and tracing off
        env:
          PANDOLAB_BOUNDARY_BASELINE_ROOT: ${{ github.workspace }}/boundary-main
          PANDOLAB_BOUNDARY_PR_REVISION: ${{ github.sha }}
        run: node scripts/run-boundary-revision-comparison.mjs
      - name: Upload compact revision summary and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-summary-${{ github.run_id }}-attempt-${{
            github.run_attempt }}
          path: |
            boundary-pr/test-results/boundary-revision-comparison/comparison-*/summary.json
            boundary-pr/test-results/boundary-revision-comparison/comparison-*/**/timings.json
          if-no-files-found: error
      - name: Upload PR1 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-PR1-${{ github.run_id }}-attempt-${{ github.run_attempt
            }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/PR1
          if-no-files-found: error
      - name: Upload main1 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-main1-${{ github.run_id }}-attempt-${{
            github.run_attempt }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/main1
          if-no-files-found: error
      - name: Upload main2 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-main2-${{ github.run_id }}-attempt-${{
            github.run_attempt }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/main2
          if-no-files-found: error
      - name: Upload PR2 revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-revision-PR2-${{ github.run_id }}-attempt-${{ github.run_attempt
            }}
          path: boundary-pr/test-results/boundary-revision-comparison/comparison-*/PR2
          if-no-files-found: error
      - name: Verify selected library input bytes remain unchanged
        if: always() && steps.library_baseline_1.outcome == 'success'
        shell: bash
        env:
          INPUT_CHECKOUT: .pando-inputs/boundary-main
        run: >
          dirty="$(git -C "$GITHUB_WORKSPACE/$INPUT_CHECKOUT" status --porcelain
          --untracked-files=all -- assets/data)"

          test -z "$dirty" || { printf '%s\n' "$dirty"; exit 1; }
