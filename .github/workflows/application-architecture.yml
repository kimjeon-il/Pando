name: Viewer core checks
on:
  push:
    branches: [work/gis]
    paths: [.github/workflows/application-architecture.yml]
  workflow_dispatch:
    inputs:
      group:
        type: choice
        options:
          - node
          - browser
          - lint
        default: node
        description: Selected core check
      test_name_pattern:
        type: string
        default: ""
        description: Optional Node scenario name
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: inputs.group == 'browser' || github.event_name == 'push'
        run: node tools/data/library-data.mjs --prepare-metadata
      - if: inputs.group == 'browser' || github.event_name == 'push'
        run: pnpm exec playwright install --with-deps chromium
      # Re-check after eliminating redundant country and physical-mask passes.
      - name: Capture only WebGL2 startup resource attribution
        if: github.event_name == 'push'
        run: pnpm exec playwright test tests/browser/viewer.spec.mjs --grep 'stage-4 GPU memory attribution' --workers=1 --retries=0
      - name: Retain focused diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: stage4-gpu-attribution-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - if: github.event_name != 'push'
        env:
          CHECK_GROUP: ${{ inputs.group }}
          CHECK_PATTERN: ${{ inputs.test_name_pattern }}
        run: |-
          node --input-type=module <<'NODE'
          import { executeChecks } from './scripts/run-application-checks.mjs';
          executeChecks({groups:[process.env.CHECK_GROUP],testNamePattern:process.env.CHECK_PATTERN||undefined});
          NODE
