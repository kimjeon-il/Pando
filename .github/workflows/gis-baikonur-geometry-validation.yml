name: GIS Baikonur treaty bank and exclusions validation
on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/validate-baikonur-independent-banks.mjs'
      - 'tools/gis/verify-baikonur-lease-exclusions.mjs'
      - 'tools/gis/baikonur-2019-exclusions.mjs'
      - 'tools/gis/baikonur-official-reference.mjs'
      - 'tests/unit/gis-baikonur-reference.test.mjs'
      - 'tests/unit/gis-baikonur-reference.test.mjs'
      - 'tests/unit/gis-baikonur-reference.test.mjs'
      - '.github/workflows/gis-baikonur-geometry-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-canonical-treaty-coordinate-and-geometry-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate standalone boundary and exclusions tests
        run: |
          node --test tests/unit/gis-baikonur-reference.test.mjs
      - name: Emit independently reproducible official exclusion statistics
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {verifyBaikonurLeaseExclusionSource}
            from './tools/gis/verify-baikonur-lease-exclusions.mjs';
          const result=verifyBaikonurLeaseExclusionSource();
          assert.equal(result.features.length,6);
          assert.equal(result.properties.effectiveDate,'2020-01-22');
          assert.equal(result.diagnostics.crossings.length,0);
          assert.equal(result.properties.rightBankSegmentsIndependentlySurveyed,false);
          console.log('BAIKONUR_OFFICIAL_EXCLUSIONS_REVIEW='+JSON.stringify({
            plotAreasSqKm:result.diagnostics.perPlot,
            total2020ReturnSqKm:result.properties.returnedPlotsAreaSqKm,
            missing:['two riverbank arcs','road/rail corridor geometries','datum verification'],
            runtimeModified:false,
          }));
          JS
