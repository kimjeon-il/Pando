name: Builtin country residual dependency contracts
on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/builtin-country-residuals.yml'
      - 'tests/unit/builtin-country-residuals.test.mjs'
      - 'tests/unit/builtin-country-materialization.test.mjs'
      - 'tools/gis/prepare-water-object-history.mjs'
      - 'tools/library-runtime-index.mjs'
      - 'tools/library-data.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builtin-country-residuals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  residuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify residual architecture and archive preparation without network data
        run: node --test tests/unit/builtin-country-residuals.test.mjs tests/unit/builtin-country-materialization.test.mjs
