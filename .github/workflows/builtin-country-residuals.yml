name: Builtin country residual dependency contracts
on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/builtin-country-residuals.yml'
      - 'tests/unit/builtin-country-residuals.test.mjs'
      - 'tools/gis/prepare-water-object-history.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builtin-country-residuals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  residuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inventory only builtin-related residual references
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const paths=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(path=>/\.(?:m?js|json|ya?ml|md)$/.test(path)&&/^(?:tools|scripts|shared\/frontend|apps\/editor|tests|config|docs|\.github)\//.test(path));
          for(const path of paths){
           if(/(?:vendor|node_modules|docs\/superpowers)\//.test(path))continue;
           const text=readFileSync(path,'utf8');
           if(!/builtin.world|builtin.country|prepareCommonCountryTargets/.test(text))continue;
           const lines=text.split('\n');
           for(let i=0;i<lines.length;i++)if(/transport|pack-existing|prepareCommonCountryTargets|readFileSync\(.*\.file|readFile\(.*\.file|readCountry\(.*\.file|files\.get\(.*\.file/.test(lines[i]))console.log(`${path}:${i+1}: ${lines[i].trim().slice(0,300)}`);
          }
          JS
      - name: Verify residual architecture contracts only
        run: node --test tests/unit/builtin-country-residuals.test.mjs
