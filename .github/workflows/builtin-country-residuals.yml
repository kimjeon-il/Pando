name: Builtin country residual dependency contracts
on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/builtin-country-residuals.yml'
      - 'tests/unit/data/builtin-country-publication.test.mjs'
      - 'tests/unit/data/builtin-country-loading.test.mjs'
      - 'tests/unit/rendering/prepared-country-scope.test.mjs'
      - 'tools/gis/prepare-water-object-history.mjs'
      - 'tools/data/library-runtime-index.mjs'
      - 'tools/data/library-data.mjs'
      - 'scripts/lib/prepared-input-verification.mjs'
      - 'scripts/p2-validate-artifacts.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builtin-country-residuals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  residuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify residual architecture, archive preparation and prepared input reads without network data
        run: |
          node --check scripts/p2-validate-artifacts.mjs
          node --test tests/unit/data/builtin-country-publication.test.mjs tests/unit/data/builtin-country-loading.test.mjs tests/unit/rendering/prepared-country-scope.test.mjs
