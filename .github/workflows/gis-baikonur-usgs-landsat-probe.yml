name: GIS Baikonur public-domain Landsat source scenes (read-only)
on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/probe-baikonur-usgs-landsat.mjs'
      - 'tests/unit/gis-baikonur-usgs-landsat-probe.test.mjs'
      - '.github/workflows/gis-baikonur-usgs-landsat-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-independent-riverbank-imagery:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test public-domain evidence boundary and scene selection
        run: |
          node --test tests/unit/gis-baikonur-usgs-landsat-probe.test.mjs
      - name: Search USGS Landsat collection for both official treaty bank sections
        run: |
          node tools/gis/probe-baikonur-usgs-landsat.mjs \
            --output "$RUNNER_TEMP/baikonur-public-domain-landsat-scene-inventory.json"
      - name: Validate metadata-only source discovery
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const out=JSON.parse(readFileSync(process.env.RUNNER_TEMP
            +'/baikonur-public-domain-landsat-scene-inventory.json'));
          assert.equal(out.bankSections.length,2);
          assert.equal(out.geometryCopiedIntoPublishedMap,false);
          assert.equal(out.treatyRiverbankIdentified,false);
          assert.equal(out.shorelineDigitized,false);
          assert(out.bankSections.every(x=>x.status==='unavailable'
            ||x.status==='public-domain-scenes-discovered'
            ||x.status==='no-eligible-public-https-scene-in-sample'));
          console.log('USGS_BAIKONUR_RIGHT_BANK_SCENES='+JSON.stringify(
            out.bankSections.map(x=>({pair:x.officialTreatyPointPair,
              status:x.status,selected:x.candidates?.length||0}))));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: gis-usgs-landsat-baikonur-rightbank-scene-search
          path: ${{ runner.temp }}/baikonur-public-domain-landsat-scene-inventory.json
          retention-days: 21
          if-no-files-found: error
