name: Siachen Saltoro GLO30 terrain comparison
on:
  push:
    branches: [work/gis]
    paths:
      - scripts/research/siachen/compare_cop30_sia_bilafond.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare-dem:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster and statistics libraries
        run: python -m pip install --quiet requests numpy scipy shapely pyproj rasterio matplotlib
      - name: Compare DEM with OSM candidate
        run: python scripts/research/siachen/compare_cop30_sia_bilafond.py
      - name: Verify source attribution and bounded output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/data/research/siachen')
          r=json.loads((p/'sia_bilafond_dem_comparison.json').read_text())
          assert 'Copernicus' in r['sources']['copernicus_dem']['dataset']
          assert r['sector']['sample_count'] > 60
          assert r['sources']['copernicus_dem_processing']['warped_grid_shape'][0] >= 500
          assert (p/'sia_bilafond_dem_samples.geojson').stat().st_size > 100
          for name in ('sia_bilafond_cop30_relief.png', 'sia_bilafond_sia_osm_transect.png', 'sia_bilafond_bila_osm_transect.png'):
            assert (p/name).stat().st_size > 10000
          print('SUCCESS: terrain outputs valid')
          PY
      - name: Commit only research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/research/siachen/
          if ! git diff --cached --quiet; then
            git commit -m "research: record Copernicus GLO30 Saltoro terrain diagnostics"
            git push origin HEAD:work/gis
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sia-bilafond-cop30-terrain
          path: |
            assets/data/research/siachen/sia_bilafond_dem_comparison.json
            assets/data/research/siachen/sia_bilafond_dem_samples.geojson
            assets/data/research/siachen/sia_bilafond_cop30_relief.png
            assets/data/research/siachen/sia_bilafond_sia_osm_transect.png
            assets/data/research/siachen/sia_bilafond_bila_osm_transect.png
            assets/data/research/siachen/README_dem_sia_bilafond.md
