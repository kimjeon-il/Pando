# Explicit GIS/source-data reproduction; lightweight source checks remain in gis-python-p4.yml.
name: Siachen Saltoro GLO30 terrain comparison
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare-dem:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster and statistics libraries
        run: python -m pip install --quiet requests numpy scipy shapely pyproj rasterio matplotlib
      - name: Compare DEM with OSM candidate
        run: python scripts/research/siachen/compare_cop30_sia_bilafond.py
      - name: Verify source attribution and bounded output
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from report_paths import report_path
          import json
          from pathlib import Path
          p=report_path("reports/borders/reconstruction/siachen", access="read")
          r=json.loads((p/'sia_bilafond_dem_comparison.json').read_text())
          assert 'Copernicus' in r['sources']['copernicus_dem']['dataset']
          assert r['sector']['sample_count'] > 60
          assert r['sources']['copernicus_dem_processing']['warped_grid_shape'][0] >= 500
          assert (p/'sia_bilafond_dem_samples.geojson').stat().st_size > 100
          for name in ('sia_bilafond_cop30_relief.png', 'sia_bilafond_sia_osm_transect.png', 'sia_bilafond_bila_osm_transect.png'):
            assert (p/name).stat().st_size > 10000
          print('SUCCESS: terrain outputs valid')
          PY
      - name: Commit only research outputs
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/
          if ! git diff --cached --quiet; then
            git commit -m "research: record Copernicus GLO30 Saltoro terrain diagnostics"
            git push origin HEAD:work/gis
          fi
      - name: Resolve branch report artifacts
        run: echo "PANDO_REPORT_ARTIFACTS=$(python tools/report_paths.py reports/borders/reconstruction/siachen --access read)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sia-bilafond-cop30-terrain
          path: |
            ${{ env.PANDO_REPORT_ARTIFACTS }}/sia_bilafond_dem_comparison.json
            ${{ env.PANDO_REPORT_ARTIFACTS }}/sia_bilafond_dem_samples.geojson
            ${{ env.PANDO_REPORT_ARTIFACTS }}/sia_bilafond_cop30_relief.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/sia_bilafond_sia_osm_transect.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/sia_bilafond_bila_osm_transect.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/README_dem_sia_bilafond.md
