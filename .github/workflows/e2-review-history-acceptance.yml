name: E2 review sidecar and history acceptance
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/e2-review-history-acceptance.yml
      - shared/frontend/js/modules/review-change-records.js
      - tests/unit/review-change-records.test.mjs
      - tests/fixtures/review/e2-synthetic-review.json
      - tools/review/validate-review-bundle.mjs
  workflow_dispatch:
permissions:
  contents: read
# Preserve evidence for each source commit despite concurrent work/ui pushes.
concurrency:
  group: e2-review-${{ github.sha }}
  cancel-in-progress: false
jobs:
  review-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the authoritative C++ temporal parser
        run: node scripts/check-core-prerequisite.mjs
      - name: Lint E2 data contracts and tests
        run: >-
          pnpm exec eslint
          shared/frontend/js/modules/review-change-records.js
          tests/unit/review-change-records.test.mjs
          tools/review/validate-review-bundle.mjs
      - name: Validate review proposal, immutable history, and temporal precision
        run: node --test tests/unit/review-change-records.test.mjs
      - name: Validate the synthetic external report sidecar format
        run: node tools/review/validate-review-bundle.mjs tests/fixtures/review/e2-synthetic-review.json
      - name: Verify application runtime boundaries remain unchanged
        run: node scripts/check-runtime-boundaries.mjs
