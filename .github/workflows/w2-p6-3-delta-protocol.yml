name: W2-P6-3 verified immutable country geometry delta contract
on:
  push:
    branches: [work/ui]
    paths:
      - tools/w2-p6-3-boundary-delta-sender.mjs
      - tools/w2-p6-3-worker-bridge.mjs
      - tests/unit/w2-p6-3-delta-protocol.test.mjs
      - .github/workflows/w2-p6-3-delta-protocol.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w2-p6-3-delta-contract
  cancel-in-progress: true
jobs:
  geometry-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Verify unmodified P6-3 prototype source and unit syntax
        run: |
          node --check tools/w2-p6-3-boundary-delta-sender.mjs
          node --check tools/w2-p6-3-worker-bridge.mjs
          node --check tests/unit/w2-p6-3-delta-protocol.test.mjs
          pnpm exec eslint tools/w2-p6-3-boundary-delta-sender.mjs tools/w2-p6-3-worker-bridge.mjs tests/unit/w2-p6-3-delta-protocol.test.mjs
      - name: Real C++ country boundary output parity and exact-geometry reference resync
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/unit/w2-p6-3-delta-protocol.test.mjs tests/unit/country-shared-boundary-state.test.mjs
