name: P0 bounded-world and upload fairness focused checks
on:
  push:
    branches:
      - work/p0-world-consumers-upload-fairness-20261115
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reuse P0 Node regression checks
        run: node scripts/run-application-checks.mjs --group=node --test-name-pattern="bounded current-world loader|scoped polygon uploads"
