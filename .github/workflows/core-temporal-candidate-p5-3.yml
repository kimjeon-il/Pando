name: Core P5-3 read-only temporal candidate
on:
  push:
    branches: [work/ui]
    paths:
      - shared/core/include/pandoeditor/document-session.h
      - shared/core/src/document-session.cpp
      - shared/tests/temporal-candidate-tests.cpp
      - shared/tests/temporal-adopt-tests.cpp
      - shared/tests/CMakeLists.txt
      - .github/workflows/core-temporal-candidate-p5-3.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-p5-3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure existing native Core
        run: cmake -S shared -B build-native/p5-3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile candidate, adoption, source and existing Core contracts
        run: cmake --build build-native/p5-3 --target temporal_adopt_tests temporal_candidate_tests temporal_source_tests document_session_tests --parallel 2
      - name: Verify existing replacement capsule, stale requests and state recovery
        run: ctest --test-dir build-native/p5-3 --output-on-failure -R '^(temporal_adopt_tests|temporal_candidate_tests|temporal_source_tests|document_session_tests)

