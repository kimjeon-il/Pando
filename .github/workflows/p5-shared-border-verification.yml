name: P5 Shared border calculation and generator verification
on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/p5-shared-border-verification.yml'
      - 'shared/core/include/pandoeditor/boundarychain.h'
      - 'shared/core/src/boundarychain.cpp'
      - 'shared/core/include/pandoeditor/boundarypacket.h'
      - 'shared/core/src/boundarypacket.cpp'
      - 'shared/tests/boundary-packet-tests.cpp'
      - 'shared/tests/p5-boundary-packet-wasm.test.mjs'
      - 'shared/core/include/pandoeditor/boundarycontact.h'
      - 'shared/core/src/boundarycontact.cpp'
      - 'shared/core/include/pandoeditor/boundaryoverlap.h'
      - 'shared/core/src/boundaryoverlap.cpp'
      - 'shared/core/include/pandoeditor/boundaryrefinement.h'
      - 'shared/core/src/boundaryrefinement.cpp'
      - 'shared/core/include/pandoeditor/boundarysplit.h'
      - 'shared/core/src/boundarysplit.cpp'
      - 'shared/core/include/pandoeditor/countrycontact.h'
      - 'shared/core/src/countrycontact.cpp'
      - 'shared/core/CMakeLists.txt'
      - 'shared/tests/boundary-chain-tests.cpp'
      - 'shared/tests/boundary-interior-tests.cpp'
      - 'shared/tests/boundary-overlap-tests.cpp'
      - 'shared/tests/boundary-refinement-tests.cpp'
      - 'shared/tests/boundary-split-tests.cpp'
      - 'shared/tests/country-contact-tests.cpp'
      - 'shared/tests/CMakeLists.txt'
      - 'assets/wasm/pandoeditor-core.manifest.json'
      - 'assets/js/modules/boundary-lines.js'
      - 'assets/js/modules/geographic-boundary.js'
      - 'native/engine/src/renderpacket.cpp'
      - 'tests/unit/boundary-display-refinement.test.mjs'
      - 'assets/js/modules/boundary-topology.js'
      - 'assets/js/modules/country-contact-core.js'
      - 'tests/unit/country-contact-core.test.mjs'
      - 'tests/unit/country-contact-legacy-parity.test.mjs'
      - 'assets/js/modules/country-shared-boundary-packet.js'
      - 'tools/build-country-shared-boundaries.mjs'
      - 'tools/benchmark-shared-border-p5.mjs'
      - 'tests/unit/boundary-lines.test.mjs'
      - 'tests/unit/country-shared-boundary-generator.test.mjs'
      - 'tests/unit/boundary-topology-split.test.mjs'
      - 'native/engine/src/sharedboundary.cpp'
      - 'CMakePresets.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install bounded core C++ prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Build and check canonical native boundary-chain kernel
        run: |
          cmake -S shared -B build-native/p5-border -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native/p5-border --target boundary_chain_tests boundary_packet_tests boundary_interior_tests boundary_overlap_tests boundary_refinement_tests boundary_split_tests country_contact_tests --parallel 2
          ctest --test-dir build-native/p5-border -R '^(boundary_chain_tests|boundary_packet_tests|boundary_interior_tests|boundary_overlap_tests|boundary_refinement_tests|boundary_split_tests|country_contact_tests)$' --output-on-failure
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Check the exact C++ source fingerprint before generated-cache tests
        id: core
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { sharedSourceManifest } from './tools/package-shared-core-assets.mjs';
          const manifest=JSON.parse(readFileSync('assets/wasm/pandoeditor-core.manifest.json','utf8'));
          const ready=sharedSourceManifest(process.cwd()).sourceSha256===manifest.sourceSha256;
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if (!ready) console.log('P2 source-matched WASM publication must precede this generator verification.');
          NODE
      - name: Run Web chain and immutable shared-cache generator regression
        if: steps.core.outputs.ready == 'true'
        run: |
          node --test tests/unit/boundary-lines.test.mjs tests/unit/country-shared-boundary-generator.test.mjs tests/unit/country-shared-boundary-state.test.mjs tests/unit/boundary-display-refinement.test.mjs tests/unit/country-shared-boundary.test.mjs tests/unit/country-contact-core.test.mjs tests/unit/country-contact-legacy-parity.test.mjs tests/unit/boundary-topology-split.test.mjs

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: b436f85a53a5d5fde4e44ca502e08c79488bd1ce
          path: build-native/p5-legacy
          sparse-checkout: |
            assets/js/modules/country-shared-boundary-packet.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify immutable pre-C++ packet adapter
        run: |
          cp build-native/p5-legacy/assets/js/modules/country-shared-boundary-packet.js assets/js/modules/.p5-legacy-country-shared-boundary-packet.js
          test "$(git hash-object assets/js/modules/.p5-legacy-country-shared-boundary-packet.js)" = be3a2ebde3820e25a6ac231565e7b406eac21f89
      - name: Measure real-world preview, canonical, and stress packet paths
        run: |
          node --expose-gc --max-old-space-size=3072 tools/benchmark-shared-border-p5.mjs --output build-native/p5-performance.json --check-regressions
      - name: Publish comparable elapsed times and footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-shared-border-performance-${{ github.sha }}
          path: build-native/p5-performance.json
          if-no-files-found: warn
          retention-days: 14
