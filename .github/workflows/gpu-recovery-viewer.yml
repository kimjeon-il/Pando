name: GPU viewer recovery follow-up (no deployment)
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/gpu-recovery-viewer.yml
      - tests/helpers/gpu-recovery-viewer-*.mjs
      - tests/browser/gpu-recovery-viewer-*.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-viewer-followup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Inspect unchanged candidate without deploying or committing sources
        run: |
          git worktree list --porcelain
          git status --short --branch
          node tests/helpers/prepare-gpu-recovery-candidate.mjs > /tmp/gpu-viewer-candidate-identity.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const s=readFileSync('shared/frontend/js/modules/gpu-map-renderer.js','utf8'),lines=s.split('\n');
          for(const [a,b]of [[390,526],[845,880],[1790,2085],[4215,4250],[5810,5850]])console.log('SOURCE '+a+'-'+b+'\n'+lines.slice(a-1,b).join('\n'));
          console.log('FUNCTION_INDEX\n'+lines.map((l,i)=>/^    (async )?function /.test(l)?(i+1)+':'+l:'').filter(Boolean).join('\n'));
          NODE
