name: GPU viewer recovery follow-up (no deployment)
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/gpu-recovery-viewer.yml
      - tests/helpers/gpu-recovery-viewer-*.mjs
      - tests/browser/gpu-recovery-viewer-*.spec.mjs
      - tests/browser/viewer-recovery-acceptance.spec.mjs
      - tests/helpers/fix-viewer-recovery-environment.mjs
      - shared/frontend/js/modules/map-content-presentation.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-viewer-followup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      G4_EVIDENCE: gpu-viewer-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare fixed library data without regeneration
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record the committed recovery candidate
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {mkdirSync,readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          assert.equal(execFileSync('git',['status','--porcelain','--untracked-files=no'],{encoding:'utf8'}),'');
          mkdirSync(process.env.G4_EVIDENCE,{recursive:true});
          const files=['shared/frontend/js/modules/gpu-map-renderer.js','shared/frontend/js/modules/gpu-context-recovery.js','shared/frontend/js/modules/rendering-domain.js','shared/frontend/js/modules/map-content-presentation.js','tests/browser/viewer-recovery-acceptance.spec.mjs'];
          const evidence={sourceRevision:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),dataRevision:JSON.parse(readFileSync('config/library-data.json','utf8')).revision,sourceInstrumentation:false,files:files.map(path=>({path,sha256:createHash('sha256').update(readFileSync(path)).digest('hex')}))};
          writeFileSync(process.env.G4_EVIDENCE+'/candidate.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence));
          NODE
      - name: Verify focused existing and new regressions
        id: unit
        continue-on-error: true
        run: node --test --test-reporter=tap tests/helpers/gpu-recovery-viewer-progress.test.mjs tests/helpers/gpu-recovery-viewer-admission.test.mjs tests/helpers/gpu-recovery-viewer-presentation.test.mjs tests/unit/gpu-shared-pass-initialization.test.mjs tests/unit/gpu-resource-owners.test.mjs tests/unit/map-render-coordinator.test.mjs tests/unit/gpu-renderer-lifecycle.test.mjs tests/unit/map-content-presentation.test.mjs > gpu-viewer-evidence/unit.tap 2>&1
      - name: Lint changed runtime sources
        id: lint
        continue-on-error: true
        run: pnpm exec eslint shared/frontend/js/modules/gpu-map-renderer.js shared/frontend/js/modules/gpu-context-recovery.js shared/frontend/js/modules/rendering-domain.js shared/frontend/js/modules/map-content-presentation.js > gpu-viewer-evidence/lint.txt 2>&1
      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium > /tmp/viewer-browser-install.log 2>&1
      - name: Verify one actual WebGL1 viewer recovery
        id: screen
        continue-on-error: true
        run: pnpm exec playwright test tests/browser/viewer-recovery-acceptance.spec.mjs --grep webgl1 --workers=1 --retries=0 --reporter=list > gpu-viewer-evidence/browser.log 2>&1
      - name: Summarize actual viewer recovery
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const file='gpu-viewer-evidence/acceptance-webgl1/result.json';
          if(existsSync(file)){
            const r=JSON.parse(readFileSync(file));console.log('RESULT '+JSON.stringify({passed:r.passed,error:r.error,rounds:r.rounds,final:r.final?.stats?.gpuRecovery,runtime:r.final?.runtime}));
          }
          for(const path of ['unit.tap','lint.txt','browser.log'])if(existsSync('gpu-viewer-evidence/'+path))console.log(path+'\n'+readFileSync('gpu-viewer-evidence/'+path,'utf8').slice(-6000));
          NODE
      - name: Verify the tested source stayed unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-viewer-followup-${{ github.sha }}
          path: gpu-viewer-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Enforce executed validation outcomes
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          SCREEN_RESULT: ${{ steps.screen.outcome }}
        run: test "$UNIT_RESULT" = success && test "$LINT_RESULT" = success && test "$SCREEN_RESULT" = success
