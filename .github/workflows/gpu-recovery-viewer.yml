name: GPU viewer recovery follow-up (no deployment)
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/gpu-recovery-viewer.yml
      - tests/helpers/gpu-recovery-viewer-*.mjs
      - tests/browser/gpu-recovery-viewer-*.spec.mjs
      - tests/browser/viewer-recovery-acceptance.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-viewer-followup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      G4_EVIDENCE: gpu-viewer-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare fixed library data without regeneration
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply reviewed G1-G3 candidate only to verification checkout
        run: node tests/helpers/prepare-gpu-recovery-candidate.mjs
      - name: Reproduce missing upload progress with a complete fixture
        run: |
          set +e
          node --test --test-reporter=tap tests/helpers/gpu-recovery-viewer-progress.test.mjs > gpu-viewer-evidence/progress-before.tap 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q ERR_ASSERTION gpu-viewer-evidence/progress-before.tap
          ! grep -Eq 'ReferenceError|SyntaxError|TypeError|ERR_MODULE_NOT_FOUND' gpu-viewer-evidence/progress-before.tap
      - name: Apply upload progress correction
        run: node tests/helpers/gpu-recovery-viewer-fix.mjs
      - name: Reproduce and correct the missing frame approval request
        run: node tests/helpers/gpu-recovery-viewer-admission-fix.mjs
      - name: Verify focused existing and new regressions
        id: unit
        continue-on-error: true
        run: node --test --test-reporter=tap tests/helpers/gpu-recovery-viewer-progress.test.mjs tests/helpers/gpu-recovery-viewer-admission.test.mjs tests/helpers/gpu-recovery-viewer-presentation.test.mjs tests/unit/gpu-shared-pass-initialization.test.mjs tests/unit/gpu-resource-owners.test.mjs tests/unit/map-render-coordinator.test.mjs tests/unit/gpu-renderer-lifecycle.test.mjs > gpu-viewer-evidence/unit.tap 2>&1
      - name: Lint changed runtime sources
        id: lint
        continue-on-error: true
        run: pnpm exec eslint shared/frontend/js/modules/gpu-map-renderer.js shared/frontend/js/modules/gpu-context-recovery.js shared/frontend/js/modules/rendering-domain.js > gpu-viewer-evidence/lint.txt 2>&1
      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium > /tmp/viewer-browser-install.log 2>&1
      - name: Observe actual approval rejection conditions without weakening them
        run: node tests/helpers/inspect-viewer-recovery.mjs
      - name: Diagnose one actual WebGL2 viewer recovery
        id: screen
        continue-on-error: true
        run: pnpm exec playwright test tests/browser/viewer-recovery-acceptance.spec.mjs --grep webgl2 --workers=1 --retries=0 --reporter=list > gpu-viewer-evidence/browser.log 2>&1
      - name: Summarize exact approval predicates
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const file='gpu-viewer-evidence/acceptance-webgl2/result.json';
          if(existsSync(file)){
            const r=JSON.parse(readFileSync(file));console.log('RESULT '+JSON.stringify({passed:r.passed,error:r.error,rounds:r.rounds,final:r.final?.stats?.gpuRecovery,runtime:r.final?.runtime}));
            console.log('APPROVAL_COUNTS '+JSON.stringify(r.final?.approvalTrace?.counts));
            for(const row of r.final?.approvalTrace?.events||[])console.log('APPROVAL '+JSON.stringify(row));
          }
          for(const path of ['unit.tap','lint.txt','browser.log'])if(existsSync('gpu-viewer-evidence/'+path))console.log(path+'\n'+readFileSync('gpu-viewer-evidence/'+path,'utf8').slice(-6000));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-viewer-followup-${{ github.sha }}
          path: gpu-viewer-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Enforce executed validation outcomes
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          SCREEN_RESULT: ${{ steps.screen.outcome }}
        run: test "$UNIT_RESULT" = success && test "$LINT_RESULT" = success && test "$SCREEN_RESULT" = success
