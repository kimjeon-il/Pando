name: Objects cursor replacement race diagnosis
on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/objects-cursor-reset-race.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            source_sha: 219b8726df6bfc26467257a19f0f358fa52353c5
          - label: after
            source_sha: 2e332b4cd443f8931a2d28ee865aba50c4696b41
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Repeat unchanged project reset and month change scenario four times
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: pnpm exec playwright test tests/browser/historical-world-timeline.spec.mjs --grep 'new world reset retains the complete history after an edit' --repeat-each=4 --workers=1 --retries=0 --trace off
      - name: Keep failure screenshots and DOM context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objects-cursor-reset-${{ matrix.label }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
