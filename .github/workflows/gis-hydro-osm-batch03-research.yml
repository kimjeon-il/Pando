name: GIS OSM replacement research batch 03 final 11

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/verify_osm_hydro_batch03_points.py'
      - '.github/workflows/gis-hydro-osm-batch03-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-eleven-independent-geonames:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mount immutable HydroRIVERS GIS library v0.13.2
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install metric river geometry library
        run: python -m pip install --quiet 'shapely>=2,<3' 'pyproj>=3,<4'
      - name: Decode identical published Hydro geometry with product decoder
        run: |
          python -m py_compile tools/gis/verify_osm_hydro_batch03_points.py
          node tools/decode-hydro-connectivity.mjs \
            assets/data/hydro/v0.13.2 /tmp/osm-hydro-batch03-decoded.json
      - name: Query United States NGA independent named river points and compare all last eleven
        run: |
          python tools/gis/verify_osm_hydro_batch03_points.py \
            --decoded /tmp/osm-hydro-batch03-decoded.json \
            --output /tmp/osm-hydro-batch03-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/osm-hydro-batch03-results.json').read_text())
          expected=['40475481','40486439','41023100','41067217','41109275',
                    '41171836','41182380','41337891','41386179','41386700','41390476']
          assert data['systemsReviewed']==11
          assert [x['systemId'] for x in data['items']]==expected
          assert data['geoDataNotChanged'] and data['sourceOnlyScreen']
          assert data['approvalCount']==0
          assert data['baseline']=='HydroRIVERS v0.13.2'
          assert all(x['mainstemLengthKm']>0 and x['mainstemLineSegments']>=1 for x in data['items'])
          print('FINAL_11_RESEARCH_SCREEN_SUCCESS')
          # Human-readable audit is bounded to a short global summary; the
          # complete point-to-mainstem measurements are emitted in chunks
          # below so they can be archived as an exact permanent research record.
          for item in data['items']:
            points=item['independentPointChecks']
            for offset in range(0,max(len(points),1),25):
              payload={
                 'systemId':item['systemId'],'nameKo':item['originalNameKo'],
                 'mainstemLengthKm':item['mainstemLengthKm'],
                 'mainstemFeatures':item['mainstemFeatures'],
                 'mainstemLineSegments':item['mainstemLineSegments'],
                 'pointCount':len(points),'chunkIndex':offset//25,
                 'points':points[offset:offset+25],
              }
              print('OSM_BATCH03_POINT_CHUNK='+json.dumps(payload,ensure_ascii=False,separators=(',',':')),flush=True)
          for query in data['governmentQueryReceipts']:
            payload={
              'id':query['systemId'],'kind':query['kind'],
              'status':query['status'],'responseSha256':query.get('responseSha256'),
              'raw':query.get('rawFeatureCount',0),
              'unique':query.get('uniqueRiverPointCount',0),
              'limit':query.get('exceededTransferLimit',False),
              'failureClass':query.get('failureClass'),
              'url':query['url'],
            }
            print('OSM_BATCH03_QUERY_RECEIPT='+json.dumps(payload,ensure_ascii=False,separators=(',',':')),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gis-osm-hydro-batch03-independent-points
          path: /tmp/osm-hydro-batch03-results.json
          if-no-files-found: error
          retention-days: 30
