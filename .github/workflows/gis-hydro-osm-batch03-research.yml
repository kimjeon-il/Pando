name: GIS OSM replacement research batch 03 final 11

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/verify-osm-hydro-batch03-points.mjs'
      - 'tools/gis/hydro-osm-batch03-anchors.mjs'
      - 'tools/gis/probe-nga-streams.mjs'
      - 'tools/gis/hydro-point-screen-native.mjs'
      - 'tools/cpp/hydro/point-screen.cpp'
      - 'tools/cpp/CMakeLists.txt'
      - 'tools/gis/hydro-independent-name-policy.mjs'
      - 'tests/unit/hydro-batch03-receipt.test.mjs'
      - '.github/workflows/gis-hydro-osm-batch03-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-eleven-independent-geonames:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the paired data revision
        id: hydro-data-pin
        run: node -e "console.log('revision='+require('./config/library-data.json').revision)" >> "$GITHUB_OUTPUT"
      - name: Fetch only the pinned Hydro bundle
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: ${{ steps.hydro-data-pin.outputs.revision }}
          path: .pando-hydro-input
          persist-credentials: false
          filter: blob:none
          sparse-checkout: assets/data/hydro/v0.13.2
      - name: Build the read-only native point screen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev ninja-build
          cmake -S tools/cpp -B build-native/hydro-point-screen -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON
          cmake --build build-native/hydro-point-screen --target pando-hydro-point-screen
          node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/pando-hydro-point-screen --directory build-native/hydro-point-screen/artifact
      - name: Decode identical published Hydro geometry with product decoder
        run: |
          node tools/decode-hydro-connectivity.mjs \
            .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/osm-hydro-batch03-decoded.json
      - name: Query United States NGA independent named river points and compare all last eleven
        run: |
          node tools/gis/verify-osm-hydro-batch03-points.mjs \
            --decoded /tmp/osm-hydro-batch03-decoded.json \
            --output /tmp/osm-hydro-batch03-results.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {formatBatch03Receipts} from './tools/gis/hydro-independent-name-policy.mjs';
          const data=JSON.parse(readFileSync('/tmp/osm-hydro-batch03-results.json','utf8'));
          for(const line of formatBatch03Receipts(data))console.log(line);
          JS
          node --test tests/unit/hydro-batch03-receipt.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gis-osm-hydro-batch03-independent-points
          path: /tmp/osm-hydro-batch03-results.json
          if-no-files-found: error
          retention-days: 30
