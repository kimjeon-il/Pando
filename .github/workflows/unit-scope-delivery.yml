name: Unit scope reviewed delivery
on:
  push:
    branches: [work/optimization]
    paths: [.github/workflows/unit-scope-delivery.yml, .github/test-scope-delivery.json]
permissions:
  contents: write
concurrency:
  group: unit-scope-reviewed-delivery
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply only source-hash-checked reviewed edits
        run: node .github/test-scope-delivery.mjs
      - name: Check retained registrations and workflow references
        run: node scripts/check-test-consolidation.mjs
      - name: Preserve exact recovery patch before publication
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/unit-scope-reviewed.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-scope-reviewed-patch
          path: ${{ runner.temp }}/unit-scope-reviewed.patch
          retention-days: 30
          if-no-files-found: error
      - name: Commit only reviewed paths and fast-forward the work branch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(node -e "for(const row of require('/tmp/pando-test-scope-output.json')) console.log(row.path)")
          test "${#paths[@]}" -gt 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git diff --cached --check
          git commit -m 'test: remove one-off research and data snapshot suites with their registrations'
          git push origin HEAD:refs/heads/work/optimization
