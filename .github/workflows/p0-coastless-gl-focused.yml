name: P0 coastless borders and RenderDevice focused verification
# One-shot branch-focused test: no full suite, no GIS rebuild, no public deployment.
on:
  push:
    branches: ['work/ui']
    paths:
      - '.github/workflows/p0-coastless-gl-focused.yml'
      - 'src/rendering/gpu-map-renderer.js'
      - 'src/rendering/country-shared-boundary-packet.js'
      - 'src/rendering/workers/country-shared-boundary-worker.js'
      - 'src/rendering/render-device-state.js'
      - 'src/rendering/render-device.js'
      - 'src/rendering/gpu-hydro-coverage.js'
      - 'src/rendering/gpu-stroke-renderer.js'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Parse only P0 changed sources
        run: |
          for f in src/rendering/country-shared-boundary-packet.js src/rendering/workers/country-shared-boundary-worker.js src/rendering/workers/canvas-render-core.js src/rendering/gpu-canvas-scene-packets.js src/rendering/gpu-map-renderer.js src/rendering/render-device-state.js src/rendering/render-device.js src/rendering/gpu-hydro-coverage.js src/rendering/gpu-stroke-renderer.js tests/unit/geometry/country-shared-boundary.test.mjs tests/unit/rendering/render-device-state.test.mjs; do
            node --check "$f"
          done
      - name: Lint only changed P0 modules
        run: |
          pnpm exec eslint src/rendering/country-shared-boundary-packet.js src/rendering/workers/country-shared-boundary-worker.js src/rendering/workers/canvas-render-core.js src/rendering/gpu-canvas-scene-packets.js src/rendering/gpu-map-renderer.js src/rendering/render-device-state.js src/rendering/render-device.js src/rendering/gpu-hydro-coverage.js src/rendering/gpu-stroke-renderer.js tests/unit/geometry/country-shared-boundary.test.mjs tests/unit/rendering/render-device-state.test.mjs
      # The retired generator fixture countries-preview-shared-v0.36.1.json.gz is absent
      # from the pinned current world pack; the live Worker contracts are checked instead.
      - name: Shared border, non-outline Worker, GL state and coverage unit contracts
        run: |
          node --test tests/unit/geometry/country-shared-boundary.test.mjs tests/unit/geometry/country-shared-boundary-state.test.mjs tests/unit/rendering/render-device-state.test.mjs tests/unit/rendering/gpu-stroke-renderer.test.mjs tests/unit/data/hydro-coverage-surface.test.mjs
      - name: Install Chromium for two focused WebGL pixel contracts
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual WebGL1/2 hydro shader and country coverage behavior
        run: |
          pnpm exec playwright test tests/browser/geometry/hydro-sdf-webgl.spec.mjs tests/browser/rendering/viewer-renderer-recovery.spec.mjs --workers=1 --retries=0 --grep 'real WebGL 1/2 compile|country and interaction coverage stay uniform'
      - name: Preserve focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-coastless-gl-focused-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
