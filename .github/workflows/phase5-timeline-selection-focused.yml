name: Focused phase 5 timeline and project selection
on:
  push:
    branches: [work/phase5-time-search-verification-20261109]
    paths: [.github/workflows/phase5-timeline-selection-focused.yml]
permissions:
  contents: write
jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: syntax
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for file in src/document/project-domain.js src/document/project-month-clock.js src/document/selection-domain.js src/app/viewer-composition.js src/ui/object-search-controller.js src/ui/timeline-controls.js src/ui/user-preferences.js; do
            node --check "$file"
          done
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint \
            src/document/project-domain.js src/document/project-month-clock.js src/document/selection-domain.js \
            src/app/viewer-composition.js src/ui/object-search-controller.js \
            src/ui/timeline-controls.js src/ui/user-preferences.js \
            tests/unit/document/project-month-clock.test.mjs tests/unit/document/project-domain-active-timeline.test.mjs \
            tests/unit/document/selection-domain-core.test.mjs tests/unit/ui/user-preferences.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/phase5-lint.log"
      - name: Record bounded static outcomes
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path='validation-results/phase5-static.json',branch=context.ref.replace('refs/heads/','');
            const log=process.env.RUNNER_TEMP+'/phase5-lint.log';
            const result={sourceCommit:context.sha,install:'${{ steps.install.outcome }}',
              syntax:'${{ steps.syntax.outcome }}',lint:'${{ steps.lint.outcome }}',
              output:fs.existsSync(log)?fs.readFileSync(log,'utf8').slice(-15000):'not executed'};
            let sha;try{sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,
              path,branch,...(sha?{sha}:{}),content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),
              message:'test: record phase 5 focused static validation'});
      - name: Require syntax and lint
        if: always()
        run: |
          test '${{ steps.syntax.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
  source-matched-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: jwlawson/actions-setup-cmake@v2
        with: {cmake-version: 3.31.6}
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          build-native/emsdk/emsdk install 6.0.3
          build-native/emsdk/emsdk activate 6.0.3
          source build-native/emsdk/emsdk_env.sh
          port_file=build-native/emsdk/upstream/emscripten/tools/ports/zlib.py
          original='https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz'
          canonical='https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION}'
          grep -Fq "$original" "$port_file"
          sed -i "s|$original|$canonical|" "$port_file"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='build-native/emsdk/upstream/emscripten/tools/ports/__init__.py';
          const input=readFileSync(file,'utf8');
          const old="    ext = url_filename.split('.', 1)[1]";
          if(input.split(old).length!==2)throw Error('Unexpected pinned Emscripten port loader');
          const next="    ext = 'tar.gz' if name == 'zlib' and url.startswith('https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v') else url_filename.split('.', 1)[1]";
          writeFileSync(file,input.replace(old,next));
          NODE
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm --parallel 2
      - id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PANDOEDITOR_WASM_MODULE: build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=30000 \
            tests/unit/document/project-month-clock.test.mjs \
            tests/unit/document/project-domain-active-timeline.test.mjs \
            tests/unit/document/project-domain-core-command.test.mjs \
            tests/unit/document/selection-domain-core.test.mjs \
            tests/unit/document/object-search-availability.test.mjs \
            tests/unit/ui/user-preferences.test.mjs 2>&1 | tee "$RUNNER_TEMP/phase5-native.log"
      - name: Record source-matched Core results without touching the work branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path='validation-results/phase5-core.json',branch=context.ref.replace('refs/heads/','');
            const log=process.env.RUNNER_TEMP+'/phase5-native.log';
            const result={sourceCommit:context.sha,install:'${{ steps.install.outcome }}',
              build:'${{ steps.build.outcome }}',test:'${{ steps.test.outcome }}',
              output:fs.existsSync(log)?fs.readFileSync(log,'utf8').slice(-24000):'not executed'};
            let sha;try{sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,
              path,branch,...(sha?{sha}:{}),content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),
              message:'test: record phase 5 source-matched C++ validation'});
      - name: Require actual C++ tests
        if: always()
        run: test '${{ steps.test.outcome }}' = success
