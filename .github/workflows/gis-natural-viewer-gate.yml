name: GIS natural surface real Viewer acceptance
on:
  push:
    branches: [work/gis]
    paths:
      - .github/workflows/gis-natural-viewer-gate.yml
      - tests/browser/rendering/terrain-natural-live-viewer.spec.mjs
      - tests/browser/rendering/terrain-natural-parity.spec.mjs
      - src/rendering/gpu-natural-surface-cache.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pando-natural-viewer-acceptance
  cancel-in-progress: true
jobs:
  natural-browser:
    if: github.repository == 'kimjeon-il/Pando' && github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real external natural tile, sparse seam and shader parity browser acceptance
        run: |
          pnpm exec playwright test \
            tests/browser/rendering/terrain-natural-live-viewer.spec.mjs \
            tests/browser/rendering/terrain-natural-parity.spec.mjs \
            --workers=1 --retries=0 --output=test-results/natural-viewer
      - name: Preserve screenshots, HTTP diagnostics and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-viewer-acceptance-${{ github.run_id }}
          path: |
            test-results/natural-viewer/
            test-results/
          if-no-files-found: warn
          retention-days: 14
