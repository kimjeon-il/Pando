name: UI natural surface real Chromium acceptance
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/gis-natural-viewer-gate.yml
      - tests/browser/rendering/terrain-natural-live-viewer.spec.mjs
      - tests/browser/rendering/terrain-natural-parity.spec.mjs
      - src/rendering/workers/canvas-terrain-dem-core.js
      - src/rendering/workers/canvas-render-core.js
      - tests/unit/rendering/canvas-natural-numeric-path.test.mjs
      - tests/unit/rendering/canvas-terrain-independence.test.mjs
      - tests/browser/rendering/canvas-numeric-dem.spec.mjs
      - tests/browser/rendering/canvas-globe-performance.spec.mjs
      - tests/browser/rendering/terrain-natural-observed-viewer.spec.mjs
      - src/data/terrain-natural-candidate.js
      - src/data/physical-source-configuration.js
      - src/rendering/gpu-natural-surface-cache.js
      - src/rendering/gpu-terrain-preparation.js
      - src/rendering/gpu-map-renderer.js
      - src/rendering/terrain-dem-shaders.js
      - src/data/terrain-manifest.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pando-ui-natural-viewer-acceptance
  cancel-in-progress: true
jobs:
  natural-browser:
    if: github.repository == 'kimjeon-il/Pando' && github.ref == 'refs/heads/work/ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Focused polar visibility and GPU/Canvas memory admission unit checks
        if: ${{ !contains(github.event.head_commit.message, '[canvas-paint-ab]') }}
        run: >-
          node --test
          tests/unit/rendering/terrain-tile-selection-shared.test.mjs
          tests/unit/rendering/terrain-natural-gpu.test.mjs
          tests/unit/rendering/canvas-natural-numeric-path.test.mjs
          tests/unit/rendering/canvas-terrain-independence.test.mjs
          tests/unit/rendering/canvas-dem-theme-cache.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real Canvas numerical output, WebGL fragment parity and seam proof
        if: ${{ !contains(github.event.head_commit.message, '[canvas-paint-ab]') }}
        run: |
          pnpm exec playwright test \
            tests/browser/rendering/canvas-numeric-dem.spec.mjs \
            tests/browser/rendering/terrain-natural-parity.spec.mjs \
            --workers=1 --retries=0 --output=test-results/canvas-numeric
      - name: Actual Canvas Viewer natural blend and memory acceptance
        if: ${{ !contains(github.event.head_commit.message, '[canvas-paint-ab]') }}
        run: |
          pnpm exec playwright test \
            tests/browser/rendering/terrain-natural-live-viewer.spec.mjs \
            --grep 'natural external preview incrementally repaints actual canvas Viewer in china-southwest' \
            --workers=1 --retries=0 --output=test-results/canvas-live
      - name: Greenland observed ice after Canvas parity
        if: ${{ !contains(github.event.head_commit.message, '[canvas-paint-ab]') }}
        env:
          PANDO_GREENLAND_ONLY: '1'
        run: |
          pnpm exec playwright test \
            tests/browser/rendering/terrain-natural-observed-viewer.spec.mjs \
            --workers=1 --retries=0 --output=test-results/natural-viewer
      - name: Canvas real paint CPU profile for the approved candidate
        if: ${{ contains(github.event.head_commit.message, '[canvas-paint-ab]') }}
        env:
          PANDO_CANVAS_PROFILE_AB: '1'
        run: |
          pnpm exec playwright test \
            tests/browser/rendering/canvas-globe-performance.spec.mjs \
            --grep 'physical' --workers=1 --retries=0 \
            --output=test-results/canvas-profile-candidate
      - name: Match the same Canvas paint scenario to pinned main baseline
        if: ${{ contains(github.event.head_commit.message, '[canvas-paint-ab]') }}
        env:
          BASE_CANVAS_SHA: b9a2cf4bb651397de79cb009398c13883a32a9d3
          PANDO_CANVAS_PROFILE_AB: '1'
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          # Run the identical current acceptance script on both source commits.
          # The old main test hardcodes obsolete country-opacity expectations.
          cp tests/browser/rendering/canvas-globe-performance.spec.mjs "$RUNNER_TEMP/canvas-paint-ab.spec.mjs"
          git fetch --depth=1 origin "$BASE_CANVAS_SHA"
          git -c advice.detachedHead=false switch --detach "$BASE_CANVAS_SHA"
          cp "$RUNNER_TEMP/canvas-paint-ab.spec.mjs" tests/browser/rendering/canvas-globe-performance.spec.mjs
          pnpm exec playwright test \
            tests/browser/rendering/canvas-globe-performance.spec.mjs \
            --grep 'physical' --workers=1 --retries=0 \
            --output=test-results/canvas-profile-main
      - name: Preserve screenshots, HTTP diagnostics and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-viewer-acceptance-${{ github.run_id }}
          path: |
            test-results/natural-viewer/
            test-results/canvas-numeric/
            test-results/canvas-live/
            test-results/canvas-profile-candidate/
            test-results/canvas-profile-main/
            test-results/
          if-no-files-found: warn
          retention-days: 14
