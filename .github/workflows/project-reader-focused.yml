name: Focused project reader unification
on:
  push:
    branches: [work/map-project-reader-check-20261109]
    paths: [.github/workflows/project-reader-focused.yml]
permissions:
  contents: write
jobs:
  project-readers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec eslint src/document/project-open-adapter.js src/document/project-domain.js tests/unit/document/project-open-adapter.test.mjs
      - id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/unit/document/project-open-adapter.test.mjs tests/unit/document/project-domain-core-command.test.mjs 2>&1 | tee "$RUNNER_TEMP/project-reader.log"
      - name: Record focused outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),file=process.env.RUNNER_TEMP+'/project-reader.log';
            const result={sourceCommit:context.sha,install:'${{ steps.install.outcome }}',
              lint:'${{ steps.lint.outcome }}',test:'${{ steps.test.outcome }}',
              output:fs.existsSync(file)?fs.readFileSync(file,'utf8').slice(-18000):'not executed'};
            const path='validation-results/project-reader-focused.json',branch=context.ref.replace('refs/heads/','');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch,...(sha?{sha}:{}),
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),
              message:'test: record focused reader integration result'});
      - name: Require scoped checks
        if: always()
        run: |
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.test.outcome }}' = success
