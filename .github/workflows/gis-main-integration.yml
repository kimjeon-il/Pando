name: GIS integration final historical contracts
on:
  push:
    branches: [work/gis]
    paths: [.github/workflows/gis-main-integration.yml]
permissions:
  contents: read
jobs:
  final-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/library-data
      - name: Preserve source and dates; correct only stale historical expectation and Node global
        run: |
          test "$(git rev-parse HEAD^)" = efecb8650cc508a601b6689642491290b9afd202
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          p=Path('tests/unit/builtin-country-retry.test.mjs');s=p.read_text();old='setImmediate(resolve)';assert s.count(old)==1;p.write_text(s.replace(old,'globalThis.setImmediate(resolve)'))
          p=Path('tests/unit/sudan-ukraine-transition.test.mjs');s=p.read_text()
          old="const ids=['state:SDN','state:SDS','state:UKR'];";assert s.count(old)==1;s=s.replace(old,"const ids=['state:SDN','state:SDS','state:UKR','state:RUS'];")
          old=" assert.equal(selectGeometryVersion(ukr,'2014-03')?.versionId,'state:UKR:2014-03-18-post-crimea-r1');"
          new=old+"\n const rus=entries.get('state:RUS');\n assert.equal(selectGeometryVersion(rus,'2014-03-17')?.versionId,\n  'state:RUS:post-soviet-existing-coordinates:rus-kaz-treaty-2006-01-12-abc-r1');\n assert.equal(selectGeometryVersion(rus,'2014-03-18')?.versionId,'state:RUS:natural-earth-5.1.1');"
          assert s.count(old)==1;s=s.replace(old,new)
          old=" assert.equal(at('2014-03','RUS'),undefined,'Russian historical Crimea needs separate reconstruction');"
          new=""" // The pinned publication now contains the reviewed RUS periods; absence was
           // an obsolete pre-reconstruction expectation. Check the same dated ownership
           // as UKR, without asking assertion formatting to dump a whole country shape.
           const beforeRus=at('2014-02','RUS'),afterRus=at('2014-03','RUS');
           assert.equal(beforeRus?.properties?.sourceGeometryVersion,
            'state:RUS:post-soviet-existing-coordinates:rus-kaz-treaty-2006-01-12-abc-r1');
           assert.equal(afterRus?.properties?.sourceGeometryVersion,'state:RUS:natural-earth-5.1.1');
           assert.equal(covers(beforeRus?.geometry,crimea),false);
           assert.equal(covers(afterRus?.geometry,crimea),true);"""
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          expected={'tests/unit/sudan-ukraine-transition.test.mjs':'0562072947fc1ccd2dc7ecd4ff008f78da617beb','tests/unit/builtin-country-retry.test.mjs':'949aed21e4be26607af8670b065331f60e903136'}
          for p,sha in expected.items():assert subprocess.check_output(['git','hash-object',p],text=True).strip()==sha,p
          assert json.loads(Path('config/library-data.json').read_text())['revision']=='5eb7be55208efaafe39bd5a65ec2f111d70b9053'
          PY
      - name: Verify the original failing file plus transient retry and lint
        run: |
          node --max-old-space-size=2048 --test --test-concurrency=1 tests/unit/sudan-ukraine-transition.test.mjs tests/unit/builtin-country-retry.test.mjs
          pnpm exec eslint shared/frontend/js/modules/builtin-world-loader.js tests/helpers/frontend-build-fixture.mjs tests/unit/builtin-country-loading.test.mjs tests/unit/builtin-country-retry.test.mjs apps/editor/tests/helpers/world-fixture.mjs tests/unit/builtin-country-deployment.test.mjs tests/unit/product-assets.test.mjs tests/unit/sudan-ukraine-transition.test.mjs
      - name: Publish only verified test corrections to work/gis, never main
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/work/gis | cut -f1)" = "$GITHUB_SHA"
          git add -- tests/unit/sudan-ukraine-transition.test.mjs tests/unit/builtin-country-retry.test.mjs
          git rm -- .github/workflows/gis-main-integration.yml
          git diff --cached --check
          git diff --cached --exit-code fa2ba8084453396bfde385d311c668dc4381b6c7 -- shared/core shared/wasm shared/frontend/static/wasm
          git diff --cached --exit-code 05bcde7a80a06980abb83823d0235213ae6a21c4 -- apps shared scripts config tools
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(gis): validate published Russia periods without unbounded failure output' -m 'The pinned 5eb7be55 source already has pre/post-2014-03-18 RUS versions. Replace the obsolete RUS-absence assertion with exact version, day-boundary and Crimea-point checks. Preserve all Sudan, South Sudan and Ukraine assertions, production code and data. Qualify the existing Node test global. Original failure reproduced with bounded output in run 41276796991. Final targeted tests and lint passed before this commit. Remove completed diagnostic workflow; main publication remains a separate acceptance decision.'
          git push origin HEAD:refs/heads/work/gis
          test "$(git ls-remote origin refs/heads/work/gis | cut -f1)" = "$(git rev-parse HEAD)"
          mkdir -p build-native/gis-integration-final
          git update-ref refs/pando/integration/final HEAD
          git bundle create build-native/gis-integration-final/incremental.bundle refs/pando/integration/final ^9ec204ec16207d24b7fd47b80a28bef4c74d8a1c ^fa2ba8084453396bfde385d311c668dc4381b6c7
          git rev-parse HEAD > build-native/gis-integration-final/commit.txt
          git rev-parse HEAD^{tree} > build-native/gis-integration-final/tree.txt
          sha256sum build-native/gis-integration-final/incremental.bundle > build-native/gis-integration-final/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gis-integration-final-source
          path: build-native/gis-integration-final/
          if-no-files-found: error
          retention-days: 1
