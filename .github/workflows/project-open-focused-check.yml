name: Focused project open route validation
on:
  push:
    branches: [work/map-project-open-validation-20261109]
    paths: [.github/workflows/project-open-focused-check.yml]
permissions:
  contents: write
jobs:
  project-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: library
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/data/library-data.mjs --purpose=gis --include-prefix=assets/data/builtin-world/display-policy-v1.json 2>&1 | tee "$RUNNER_TEMP/open-library.log"
      - id: core
        if: steps.install.outcome == 'success' && steps.library.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-core-prerequisite.mjs
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint src/data/project-open-adapter.js src/document/project-domain.js \
            src/app/viewer-composition.js tests/unit/data/project-open-adapter.test.mjs \
            tests/unit/data/builtin-world-loader.test.mjs \
            tests/unit/document/project-domain-core-command.test.mjs 2>&1 | tee "$RUNNER_TEMP/open-lint.log"
      - id: adapter-tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=15000 \
            tests/unit/data/project-open-adapter.test.mjs \
            tests/unit/document/project-domain-core-command.test.mjs 2>&1 | tee "$RUNNER_TEMP/open-adapter.log"
      - id: core-tests
        if: steps.core.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=15000 \
            tests/unit/data/builtin-world-loader.test.mjs \
            tests/unit/document/builtin-resource-core-wasm.test.mjs 2>&1 | tee "$RUNNER_TEMP/open-core.log"
      - name: Preserve exact focused results on validation branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read=name=>{
              const file=process.env.RUNNER_TEMP+'/open-'+name+'.log';
              return fs.existsSync(file)?fs.readFileSync(file,'utf8').slice(-18000):'not executed';
            };
            const outcome={
              schema:'pando-project-open-focused-v1',
              sourceCommit:context.sha,
              install:'${{ steps.install.outcome }}',
              library:'${{ steps.library.outcome }}',
              core:'${{ steps.core.outcome }}',
              lint:'${{ steps.lint.outcome }}',
              adapterTests:'${{ steps.adapter-tests.outcome }}',
              coreTests:'${{ steps.core-tests.outcome }}',
              logs:{library:read('library'),lint:read('lint'),adapter:read('adapter'),core:read('core')},
            };
            const path='validation-results/project-open-unification.json';
            const branch=context.ref.replace('refs/heads/','');
            let sha;
            try{
              const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch});
              sha=old.data.sha;
            }catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch,...(sha?{sha}:{}),
              message:'test: record focused project opening validation',
              content:Buffer.from(JSON.stringify(outcome,null,2)+'\n').toString('base64'),
            });
      - name: Require all selected checks
        if: always()
        run: |
          test '${{ steps.library.outcome }}' = success
          test '${{ steps.core.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.adapter-tests.outcome }}' = success
          test '${{ steps.core-tests.outcome }}' = success
