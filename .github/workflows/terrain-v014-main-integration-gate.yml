name: Terrain v0.14.0 focused main integration / source-matched Pages dry-run
on:
  push:
    branches: [work/gis]
    paths: ['config/library-data.json']
permissions:
  contents: read
jobs:
  terrain-v014-stage:
    if: github.repository == 'kimjeon-il/Pando' && github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Mount only source-pinned Viewer runtime data
        uses: ./.github/actions/library-data
      - name: Narrow numeric / external tile / Canvas / asset SHA contracts
        run: |
          node --test tests/unit/data/terrain-external-source.test.mjs \
            tests/unit/geometry/terrain-dem-assets.test.mjs \
            tests/unit/rendering/terrain-numeric-color.test.mjs \
            tests/unit/rendering/canvas-terrain-independence.test.mjs
      - name: Verify source pins, build metadata and no bundled tiles
        run: |
          set -euo pipefail
          node scripts/generate-build-metadata.mjs --check --product=viewer
          node tools/build/stage-monorepo-pages.mjs --root . \
            --stage "$RUNNER_TEMP/terrain-v014-stage" \
            --manifest "$RUNNER_TEMP/terrain-v014-stage-receipt.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const meta=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/terrain-v014-stage-receipt.json','utf8'));
          const filePaths=meta.files.map(file=>file.path);
          assert.equal(meta.terrainExternalSource?.revision,'0866eb0aebb35d1355892b808de331b30c5fe52b');
          assert.equal(meta.terrainManifest,'assets/data/terrain/v0.14.0/manifest.json');
          assert(!filePaths.some(path=>/^assets\/data\/terrain\/v0\.14\.0\/\d+\//.test(path)),
            'DEM binary tiles must remain external');
          assert(meta.bytes<=1_000_000_000,'Pages artifact exceeds size limit');
          console.log('TERRAIN_V014_STAGE_VERIFIED='+JSON.stringify({
            appCommit:meta.sourceCommit,dataCommit:meta.dataCommit,terrain:meta.terrainManifest,
            external:meta.terrainExternalSource,siteBytes:meta.bytes,fileCount:meta.fileCount}));
          JS
      - name: Keep only small staging metadata receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-v014-main-stage-receipt
          path: ${{ runner.temp }}/terrain-v014-stage-receipt.json
          if-no-files-found: warn
          retention-days: 14
