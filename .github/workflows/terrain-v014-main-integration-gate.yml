name: Terrain focused work-gis integration and source-matched staging
on:
  push:
    branches: [work/gis]
    paths:
      - config/library-data.json
      - .github/workflows/terrain-v014-main-integration-gate.yml
      - tools/gis/terrain-natural-runtime-edits.json
      - tools/gis/terrain-natural-integration-fixes.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: terrain-focused-work-gis-integration
  cancel-in-progress: false
jobs:
  terrain-v014-stage:
    if: github.repository == 'kimjeon-il/Pando' && github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply reviewed source edits without touching main, data pins or unrelated files
        run: |
          mkdir -p "$RUNNER_TEMP/terrain-integration"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync,writeFileSync,unlinkSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const patches=['tools/gis/terrain-natural-runtime-edits.json','tools/gis/terrain-natural-integration-fixes.json'].filter(existsSync);
          if(!patches.length)process.exit(0);
          assert.equal(process.env.GITHUB_REF,'refs/heads/work/gis');
          const allowed=new Set(['src/rendering/gpu-terrain-preparation.js','src/rendering/gpu-natural-surface-cache.js',
            'src/rendering/gpu-map-renderer.js','src/rendering/terrain-dem-shaders.js',
            'src/rendering/workers/canvas-render-core.js','src/rendering/workers/canvas-terrain-dem-core.js',
            'tests/unit/rendering/terrain-natural-gpu.test.mjs','tests/unit/rendering/canvas-natural-numeric-path.test.mjs',
            'tests/unit/rendering/canvas-terrain-independence.test.mjs','tools/gis/build-natural-observed-preview.py']);
          const edited=new Map();
          for(const path of patches){
            const patch=JSON.parse(readFileSync(path,'utf8'));assert.equal(patch.schema,'pando-scoped-source-edit-v1');
            for(const file of patch.files){
              assert(allowed.has(file.path),'Unapproved source edit');
              let text=edited.get(file.path)??readFileSync(file.path,'utf8');
              for(const edit of file.edits){
                assert.equal(text.split(edit.before).length,2,'Source anchor drift: '+file.path+' '+edit.before);
                text=text.replace(edit.before,edit.after);
              }
              edited.set(file.path,text);
            }
          }
          for(const [file,text] of edited){
            writeFileSync(file,text);
            if(file.endsWith('.py'))execFileSync('python3',['-c','import sys;compile(open(sys.argv[1]).read(),sys.argv[1],"exec")',file]);
            else execFileSync(process.execPath,['--check',file]);
          }
          writeFileSync(process.env.RUNNER_TEMP+'/terrain-integration/applied-edits.json',JSON.stringify({base:process.env.GITHUB_SHA,paths:[...edited.keys()],patches},null,2));
          for(const path of patches)unlinkSync(path);
          JS
      - name: Mount only existing pinned Viewer data
        uses: ./.github/actions/library-data
      - name: Run only terrain resource, palette, source masks and numerical Canvas contracts
        env:
          CHECK_SELECTION: '{"unitTests":["tests/unit/rendering/canvas-natural-numeric-path.test.mjs","tests/unit/rendering/terrain-natural-gpu.test.mjs","tests/unit/rendering/gpu-terrain-preparation.test.mjs","tests/unit/data/terrain-natural-surface.test.mjs","tests/unit/data/terrain-external-source.test.mjs","tests/unit/rendering/terrain-numeric-color.test.mjs","tests/unit/rendering/canvas-terrain-independence.test.mjs","tests/unit/rendering/canvas-dem-theme-cache.test.mjs","tests/unit/geometry/terrain-natural-masks.test.mjs","tests/unit/geometry/terrain-polar-coverage.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase non-browser --output "$RUNNER_TEMP/terrain-integration/checks.json"
      - name: Commit only verified canonical changes in this CI checkout
        run: |
          node --input-type=module <<'JS'
          import {existsSync,readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const evidence=process.env.RUNNER_TEMP+'/terrain-integration/applied-edits.json';
          if(!existsSync(evidence))process.exit(0);
          const {paths,patches}=JSON.parse(readFileSync(evidence,'utf8'));
          const git=args=>execFileSync('git',args,{stdio:'inherit'});
          git(['diff','--exit-code','--','config/library-data.json','projects/default-world/manifest.json']);
          git(['add','--',...paths,...patches]);git(['diff','--cached','--check']);
          git(['-c','user.name=Pando terrain integration','-c','user.email=pando-terrain@users.noreply.github.com',
            'commit','-m','feat(terrain): integrate verified numerical Canvas path and strict observed-mask range handling']);
          JS
      - name: Preserve source-matched staging, data identity and external tile policy
        run: |
          set -euo pipefail
          node scripts/generate-build-metadata.mjs --check --product=viewer
          node tools/build/stage-monorepo-pages.mjs --root . \
            --stage "$RUNNER_TEMP/terrain-v014-stage" \
            --manifest "$RUNNER_TEMP/terrain-integration/stage.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const meta=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/terrain-integration/stage.json','utf8'));
          assert.equal(meta.terrainExternalSource?.revision,'0866eb0aebb35d1355892b808de331b30c5fe52b');
          assert.equal(meta.terrainManifest,'assets/data/terrain/v0.14.0/manifest.json');
          assert(!meta.files.some(file=>/^assets\/data\/terrain\/v0\.14\.0\/\d+\//.test(file.path)));
          assert(meta.bytes<=1_000_000_000);
          console.log('TERRAIN_STAGE_VERIFIED='+JSON.stringify({appCommit:meta.sourceCommit,dataCommit:meta.dataCommit,bytes:meta.bytes}));
          JS
      - name: Fast-forward only the unchanged work/gis branch after checks
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {existsSync,writeFileSync} from 'node:fs';
          if(!existsSync(process.env.RUNNER_TEMP+'/terrain-integration/applied-edits.json'))process.exit(0);
          const env={...process.env,GIT_CONFIG_COUNT:'1',GIT_CONFIG_KEY_0:'http.https://github.com/.extraheader',
            GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+Buffer.from('x-access-token:'+process.env.GH_TOKEN).toString('base64')};
          const git=args=>execFileSync('git',args,{env,encoding:'utf8',timeout:300000}).trim();
          assert.equal(process.env.GITHUB_REF,'refs/heads/work/gis');
          assert.equal(git(['ls-remote','--exit-code','origin','refs/heads/work/gis']).split(/\s+/)[0],process.env.GITHUB_SHA,
            'Concurrent branch edit: preserve evidence, never force push');
          const next=git(['rev-parse','HEAD']);git(['push','origin','HEAD:refs/heads/work/gis']);
          assert.equal(git(['ls-remote','--exit-code','origin','refs/heads/work/gis']).split(/\s+/)[0],next);
          writeFileSync(process.env.RUNNER_TEMP+'/terrain-integration/verified-commit.txt',next+'\n');
          console.log('VERIFIED_WORK_GIS='+next);
          JS
      - name: Retain focused receipts and source diff on failure or success
        if: always()
        run: git diff HEAD -- src/rendering tests/unit/rendering tools/gis > "$RUNNER_TEMP/terrain-integration/pending.diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-natural-runtime-integration
          path: ${{ runner.temp }}/terrain-integration/*
          if-no-files-found: warn
          retention-days: 14
