name: Integrated timeline lightweight autosave
on:
  push:
    branches: [work/integration-ui-objects-20261016]
    paths:
      - '.github/workflows/timeline-lightweight-regression.yml'
      - 'tests/browser/soviet-lightweight-timeline.spec.mjs'
      - 'tests/unit/persistence-service.test.mjs'
      - 'tests/unit/progressive-startup-runtime.test.mjs'
      - 'tests/unit/progressive-startup-runtime-contract.test.mjs'
      - 'assets/js/modules/app-domain-assembly.js'
      - 'assets/js/modules/app-history-assembly.js'
      - 'assets/js/modules/persistence-service.js'
      - 'assets/js/modules/app-progressive-startup.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate session contract and startup owners
        run: |
          node --check assets/js/modules/app-history-assembly.js
          node --check assets/js/modules/persistence-service.js
          node --check assets/js/modules/app-progressive-startup.js
          node --test tests/unit/persistence-service.test.mjs tests/unit/progressive-startup-runtime.test.mjs tests/unit/progressive-startup-runtime-contract.test.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise Soviet month change and reopen without full autosave
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: pnpm exec playwright test tests/browser/soviet-lightweight-timeline.spec.mjs --workers=1 --retries=0 --trace off
      - name: Preserve failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-timeline-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
