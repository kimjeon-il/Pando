name: P0 shared RenderDevice GL state focused acceptance
# Opt-in branch-local verification. No main push, full-suite fanout or generated-artifact publication.
on:
  push:
    branches: ['work/p0-gl-state-20261112']
    paths: ['.github/workflows/p0-gl-state-focused.yml']
permissions:
  contents: read
concurrency:
  group: p0-gl-state-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Parse only updated JavaScript
        run: |
          for f in src/rendering/render-device-state.js src/rendering/render-device.js src/rendering/gpu-hydro-coverage.js src/rendering/gpu-stroke-renderer.js src/rendering/gpu-map-renderer.js tests/unit/rendering/render-device-state.test.mjs tests/browser/geometry/hydro-sdf-webgl.spec.mjs; do
            node --check "$f"
          done
      - name: Lint only modified execution and test modules
        run: pnpm exec eslint src/rendering/render-device-state.js src/rendering/render-device.js src/rendering/gpu-hydro-coverage.js src/rendering/gpu-stroke-renderer.js src/rendering/gpu-map-renderer.js tests/unit/rendering/render-device-state.test.mjs tests/browser/geometry/hydro-sdf-webgl.spec.mjs
      - name: Run the three affected unit owners
        run: node --test tests/unit/rendering/render-device-state.test.mjs tests/unit/data/hydro-coverage-surface.test.mjs tests/unit/rendering/gpu-stroke-renderer.test.mjs
      - name: Install Chromium for focused WebGL correctness
        run: pnpm exec playwright install --with-deps chromium
      - name: Real WebGL1/2 coverage, state parity and WebGL2 context recovery
        run: |
          pnpm exec playwright test tests/browser/geometry/hydro-sdf-webgl.spec.mjs tests/browser/rendering/viewer-renderer-recovery.spec.mjs --workers=1 --grep 'real WebGL 1/2 compile|country and interaction coverage stay uniform|viewer acceptance webgl2: repeated real recovery'
      - name: Preserve focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-gl-state-focused-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
