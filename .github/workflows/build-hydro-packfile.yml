# Reproduction of historical pinned source; never overwrites independently updated deployed Hydro metadata.
name: Reproduce immutable Hydro v0.13.2 source packfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/build-hydro-packfile.mjs
            /tools/library-data.mjs
            /tools/library-report-layout.mjs
            /tools/library-content.mjs
            /config/library-data.json
            /tests/unit/hydro-packfile-builder.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 8de07030cccff5e7ec3c68e6beb6bb288c95afb2
          path: historical-hydro
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/data/hydro/v0.13.0/
            /assets/data/hydro/v0.13.1/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce and verify historical fragments outside the published asset tree
        run: |
          node --test tests/unit/hydro-packfile-builder.test.mjs
          node tools/build-hydro-packfile.mjs --source historical-hydro/assets/data/hydro/v0.13.1 --output "$RUNNER_TEMP/historical-hydro-v0.13.2"
          node tools/build-hydro-packfile.mjs --source historical-hydro/assets/data/hydro/v0.13.1 --output "$RUNNER_TEMP/historical-hydro-v0.13.2" --check
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-original-hydro-v0.13.2-reproduction
          path: |
            ${{ runner.temp }}/historical-hydro-v0.13.2/hydro.bin
            ${{ runner.temp }}/historical-hydro-v0.13.2/manifest.json
