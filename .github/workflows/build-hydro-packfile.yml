name: Reproduce immutable Hydro v0.13.2 source packfile
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/build/build-hydro-packfile.mjs
            /tools/data/library-data.mjs
            /tools/data/library-report-layout.mjs
            /tools/data/library-content.mjs
            /config/library-data.json
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library
          ref: 81c45d11d1265e287dd21aaf0127c1112aca1176
          path: historical-hydro
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/data/hydro/v0.13.0/
            /assets/data/hydro/v0.13.1/
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reproduce and verify historical fragments outside the published asset tree
        run: |-
          node tools/build/build-hydro-packfile.mjs --source historical-hydro/assets/data/hydro/v0.13.1 --output "$RUNNER_TEMP/historical-hydro-v0.13.2"
          node tools/build/build-hydro-packfile.mjs --source historical-hydro/assets/data/hydro/v0.13.1 --output "$RUNNER_TEMP/historical-hydro-v0.13.2" --check
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-original-hydro-v0.13.2-reproduction
          path: |
            ${{ runner.temp }}/historical-hydro-v0.13.2/hydro.bin
            ${{ runner.temp }}/historical-hydro-v0.13.2/manifest.json
