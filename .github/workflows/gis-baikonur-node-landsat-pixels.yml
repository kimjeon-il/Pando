name: GIS Baikonur Node USGS pixel evidence (no Python, no publication)
on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/baikonur-landsat-pixel-preflight.mjs'
      - 'tests/unit/geometry/gis-baikonur-1994-landsat.test.mjs'
      - '.github/workflows/gis-baikonur-node-landsat-pixels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-temporal-pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Node GIS spectral calculations
        run: |
          node --test tests/unit/geometry/gis-baikonur-1994-landsat.test.mjs
          node tools/gis/baikonur-landsat-pixel-preflight.mjs --self-test
      - name: Install deterministic scientific JS dependencies in isolated temporary folder
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baikonur-node-raster"
          printf '%s\n' '{"private":true,"type":"commonjs"}' > "$RUNNER_TEMP/baikonur-node-raster/package.json"
          npm install --prefix "$RUNNER_TEMP/baikonur-node-raster"             --no-save --package-lock=false --ignore-scripts --no-audit --no-fund             geotiff@2.1.3 proj4@2.22.0
      - name: Open authentic historical USGS Green/NIR/QA COG via HTTP byte ranges
        env:
          PANDO_RASTER_DEPS_DIR: ${{ runner.temp }}/baikonur-node-raster
        run: |
          node tools/gis/baikonur-landsat-pixel-preflight.mjs             --output "$RUNNER_TEMP/baikonur-independent-node-pixel-proof.json"
      - name: Enforce a strict separation between satellite observation and legal lease polygon
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
            '/baikonur-independent-node-pixel-proof.json','utf8'));
          assert.equal(p.records.length,6);
          assert.equal(p.osmDataUsed,false);
          assert.equal(p.siteMapChanged,false);
          assert.equal(p.legalRightBankVerified,false);
          assert.equal(p.bankLinesReconstructed,false);
          assert.equal(p.originalDatumVerified,false);
          assert(p.records.every(x=>x.samples.every(s=>s.sourceMetricOnly===true
            &&s.pixelSizeMeters.every(n=>n>0&&n<100))));
          console.log('BAIKONUR_NODE_COG_VALIDATION='+JSON.stringify(p.records.map(x=>({
            pair:x.pair.join('-'),year:x.year,n:x.samples.length,
            distances:x.samples.map(s=>s.nearestWaterToTreatyAnchorsMeters),
            clouds:x.samples.map(s=>s.cleanPercent),
            continuousWater:x.samples.map(s=>s.anchorsOnOneConnectedWaterMask),
            connectedWaterComponents:x.samples.map(s=>s.waterComponentCount),
            largestComponentPixels:x.samples.map(s=>s.largestConnectedWaterPixelCount),
            failureCount:x.unavailable.length
          }))));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baikonur-node-l2-original-pixel-proof-legal-border-not-approved
          path: ${{ runner.temp }}/baikonur-independent-node-pixel-proof.json
          retention-days: 30
          if-no-files-found: warn
