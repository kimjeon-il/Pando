name: Current Hydro Runtime and Native Contract

on:
  push:
    branches: [main, work/ui, work/objects, work/gis, work/places]
    paths:
      - 'tools/check-current-hydro-layout.mjs'
      - 'tests/unit/current-hydro-layout.test.mjs'
      - 'tests/unit/hydro-packfile.test.mjs'
      - 'assets/js/workers/hydro-tile-worker.js'
      - 'assets/js/workers/hydro-shard-store.js'
      - 'assets/data/hydro/**'
      - 'native/assets/world/manifest.json'
      - 'native/assets/world/hydro/**'
      - 'native/tools/lib/world-dataset-contract.mjs'
      - '.github/workflows/active-hydro-optimization-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-hydro:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /tools/check-current-hydro-layout.mjs
            /tests/unit/current-hydro-layout.test.mjs
            /tests/unit/hydro-packfile.test.mjs
            /assets/js/workers/hydro-tile-worker.js
            /assets/js/workers/hydro-shard-store.js
            /assets/data/hydro/
            /native/assets/world/manifest.json
            /native/assets/world/hydro/
            /native/tools/lib/world-dataset-contract.mjs
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify current package and Worker contracts
        run: node --test tests/unit/current-hydro-layout.test.mjs tests/unit/hydro-packfile.test.mjs
      - name: Verify current Web and native bytes and real Worker reads
        run: >-
          node tools/check-current-hydro-layout.mjs --root . --allow-retired false
          --out build-native/active-hydro-optimization.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-hydro-optimization-audit
          if-no-files-found: warn
          path: build-native/active-hydro-optimization.json
