name: Reference Image Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/js/modules/reference-image-*.js'
      - 'assets/js/modules/map-input-presentation.js'
      - 'assets/css/tokens/reference-images.css'
      - 'assets/css/components/reference-images.css'
      - 'assets/css/layout/reference-images.css'
      - 'assets/css/features/reference-images.css'
      - 'tests/unit/reference-image-*.test.mjs'
      - 'tests/browser/reference-image-*.spec.mjs'
      - 'tests/fixtures/**'
      - 'tests/helpers/**'
      - 'tests/browser/server.mjs'
      - 'playwright.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - '.github/workflows/reference-image-integration.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint reference image modules and tests
        run: >-
          pnpm exec eslint
          assets/js/modules/reference-image-*.js
          assets/js/modules/map-input-presentation.js
          tests/unit/reference-image-*.test.mjs
          tests/browser/reference-image-*.spec.mjs

      - name: Run reference image unit suite
        run: node --test "tests/unit/reference-image-*.test.mjs"

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        spec:
          - overlay
          - line-refine
          - live-wire
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ${{ matrix.spec }} browser regression
        run: pnpm exec playwright test "tests/browser/reference-image-${{ matrix.spec }}.spec.mjs" --workers=1
