name: P1 DEM tint alternative archived-mask pixel diagnostic (not exact source parity)
on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/gis-p1-dem-tint-diagnostic.yml'
      - 'tools/gis/verify-p1-dem-tint-historical.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tint-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: 91c127ddbae902405de6e35b38940a59a8c0d021
          path: .pando-p1-tint
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /terrain/v0.13.3/manifest.json
            /terrain/v0.13.3/tint.webp
            /archive/blobs/52590ce133a779fc678496844c844137aeaa0dca41ceca1621cd7c50169f5efb.gz
      - uses: mamba-org/setup-micromamba@v3
        id: pinned-gdal
        with:
          environment-name: pando-p1-dem-gdal
          create-args: libgdal-core=3.13.3
          init-shell: none
      - name: Build source-verified map image and native GDAL tint/fill
        run: |
          set -euo pipefail
          prefix='${{ steps.pinned-gdal.outputs.environment-path }}'
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          cmake -S tools/cpp -B build-native/p1-map-image -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          cmake --build build-native/p1-map-image --target pando-map-image --parallel 2
          node tools/map-image/package-native.mjs --binary build-native/p1-map-image/pando-map-image \
            --directory build-native/p1-map-image/artifact
          cmake -S tools/cpp/terrain-dem-tint -B build-native/p1-dem-tint -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build-native/p1-dem-tint --target pando-terrain-dem-tint
          node tools/gis/package-terrain-dem-tint.mjs --binary build-native/p1-dem-tint/pando-terrain-dem-tint \
            --directory build-native/p1-dem-tint/artifact
          cmake -S tools/cpp/terrain-dem-fill -B build-native/p1-dem-fill -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build-native/p1-dem-fill --target pando-terrain-dem-fill
          node tools/gis/package-terrain-dem-fill.mjs --binary build-native/p1-dem-fill/pando-terrain-dem-fill \
            --directory build-native/p1-dem-fill/artifact
      - name: Fetch and verify pinned Natural Earth tint original and glaciated areas
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 450 --max-filesize 110000000 \
            'https://naturalearth.s3.amazonaws.com/10m_raster/HYP_HR.zip' -o "$RUNNER_TEMP/HYP_HR.zip"
          echo "29ba984a14d96c3d745065b096eccf0a21207718d8549341c955c64b150e3e09  $RUNNER_TEMP/HYP_HR.zip" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 200 --max-filesize 9000000 \
            'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/693f11422f4e08d2da4566b854dda53eb7c39fb3/geojson/ne_10m_glaciated_areas.geojson' \
            -o "$RUNNER_TEMP/ice.geojson"
          echo "04fd2303d5f0ece2cf482af19d06731d745db9690501d7b0a2a4b7fe23a7726f  $RUNNER_TEMP/ice.geojson" | sha256sum -c -
      - name: Regenerate and compare all 8.4 million tint pixels; mark mask as alternate
        env:
          PANDO_MAP_IMAGE_ARTIFACT: build-native/p1-map-image/artifact
          PANDO_TERRAIN_DEM_TINT_DIRECTORY: build-native/p1-dem-tint/artifact
          PANDO_TERRAIN_DEM_FILL_DIRECTORY: build-native/p1-dem-fill/artifact
        run: |
          set -euo pipefail
          mkdir -p p1-proof
          node tools/gis/verify-p1-dem-tint-historical.mjs \
            --tint-zip "$RUNNER_TEMP/HYP_HR.zip" --ice "$RUNNER_TEMP/ice.geojson" \
            --archive-mask .pando-p1-tint/archive/blobs/52590ce133a779fc678496844c844137aeaa0dca41ceca1621cd7c50169f5efb.gz \
            --baseline .pando-p1-tint/terrain/v0.13.3 \
            --staging "$RUNNER_TEMP/p1-tint-staging" \
            --output p1-proof/tint-archived-mask-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-dem-archived-mask-tint-pixel-diagnostic
          path: p1-proof/*.json
          if-no-files-found: warn
          retention-days: 21
