name: UI same-run cold and warm startup comparison
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/ui-startup-ab.yml']
permissions: {contents: read}
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Interleave three fresh-browser and cached-reload pairs per source
        shell: bash
        env:
          BASE: b89b20cd6263e9e311e9333aab19b4d82f06b637
          CANDIDATE: c866380c4cb7bf3ffacfc70f85a5ef61d387b77b
        run: |
          set -euo pipefail
          git diff --exit-code
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const pin=sha=>JSON.parse(execFileSync('git',['show',sha+':config/library-data.json'])).revision;
          if(pin(process.env.BASE)!==pin(process.env.CANDIDATE))throw Error('Comparison requires the exact same immutable data pin');
          JS
          cp scripts/measure-viewer-startup.mjs scripts/.ui-startup-ab.tmp.mjs
          trap 'rm -f scripts/.ui-startup-ab.tmp.mjs' EXIT
          mkdir -p "$RUNNER_TEMP/ui-startup-ab"
          failed=0
          for slot in base-1 optimized-1 optimized-2 base-2 base-3 optimized-3; do
            label="${slot%-*}"
            target="$BASE"; if [ "$label" = optimized ]; then target="$CANDIDATE"; fi
            git switch --detach "$target"
            node scripts/.ui-startup-ab.tmp.mjs --label="$slot" --out="$RUNNER_TEMP/ui-startup-ab/$slot.json" || failed=1
          done
          git switch --detach "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP+'/ui-startup-ab/';
          const groups=Object.fromEntries(['base','optimized'].map(label=>[label,[1,2,3].map(i=>JSON.parse(readFileSync(root+label+'-'+i+'.json')))]));
          const all=Object.values(groups).flat(),reference=all[0];
          if(all.some(row=>row.status!=='passed'||row.data!==reference.data||row.browser!==reference.browser
            ||row.samples.length!==2||row.samples.some(s=>s.gpu!==reference.samples[0].gpu||s.month!==reference.samples[0].month)))throw Error('Failed or non-comparable measurement, inspect originals');
          const median=v=>[...v].sort((a,b)=>a-b)[1];
          const rows=['cold','warm'].map(visit=>{
            const values=Object.fromEntries(Object.entries(groups).map(([label,group])=>[label,group.map(row=>row.samples.find(s=>s.visit===visit).elapsedMs)]));
            const base=median(values.base),optimized=median(values.optimized);
            return {visit,baseMedianMs:base,optimizedMedianMs:optimized,changePercent:Math.round((optimized/base-1)*1000)/10,samples:values};
          });
          const report={schema:'pando-ui-startup-ab-v1',base:groups.base[0].commit,optimized:groups.optimized[0].commit,
            data:reference.data,browser:reference.browser,gpu:reference.samples[0].gpu,environment:reference.environment,rows,
            limitations:['One Linux runner and software GPU; not user hardware or public network','Three pairs per revision, not a confidence interval','GPU command fence completion is not physical monitor presentation']};
          writeFileSync(root+'comparison.json',JSON.stringify(report,null,2)+'\n');
          console.log('UI_STARTUP_COMPARISON '+JSON.stringify(report));
          JS
          test "$failed" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-startup-ab-${{ github.sha }}
          path: ${{ runner.temp }}/ui-startup-ab/
          if-no-files-found: warn
          retention-days: 7
