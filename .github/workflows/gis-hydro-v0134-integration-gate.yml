name: Hydro v0.13.4 live-cutover integration gate

on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/gis-hydro-v0134-integration-gate.yml'
      - 'scripts/lib/product-assets.mjs'
      - 'scripts/lib/frontend-build.mjs'
      - 'tools/stage-monorepo-pages.mjs'
      - 'tests/unit/pages-deployment-footprint.test.mjs'
      - 'tools/check-current-hydro-layout.mjs'
      - 'apps/editor/world-data-plan.mjs'
      - 'config/library-data.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gis-hydro-v0134-full-integration
  cancel-in-progress: false

jobs:
  exact-pinned-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install pinned app build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Mount the exact new public Hydro data commit
        run: |
          set -euo pipefail
          test "$(node -p "require('./config/library-data.json').revision")" = \
            '91c127ddbae902405de6e35b38940a59a8c0d021'
          node tools/library-data.mjs
      - name: Verify all Hydro package receipts and actual Viewer Worker reads
        run: |
          node tools/check-current-hydro-layout.mjs --root . --allow-retired false \
            --out "$RUNNER_TEMP/hydro-v0134-layout.json"
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {auditHydroOsm} from './tools/gis/audit-osm-credit-removal.mjs';
          const hash=x=>createHash('sha256').update(x).digest('hex');
          const base='assets/data/hydro/v0.13.4/';
          const m=JSON.parse(readFileSync(base+'manifest.json','utf8'));
          const bytes=readFileSync(base+'hydro.bin');
          const audit=auditHydroOsm(m,bytes);
          assert.equal(m.version,'0.13.4');
          assert.equal(audit.remainingCount,0);
          assert.equal(hash(bytes),'82cd70c2c0434ecfbc6e8be53843527c2dc0318ecdf814731a8c7441295230e2');
          assert.equal(m.sources.independentHydronymReplacements.replacedSystems,42);
          assert.equal(m.sources.independentHydronymFollowup.replacedSystems,2);
          assert.equal(m.sources.independentHydronymBulk.replacedSystems,29);
          const old=JSON.parse(readFileSync('assets/data/hydro/v0.13.2/manifest.json','utf8'));
          assert.equal(old.container.sha256,
            'f0832dd2024cbfad8b1662410a4f189fa95bcecb56c3e3f1ad69d36af4a0c36f');
          assert.equal(old.stats.osmWaterwayMatchCount,31);
          assert.deepEqual(m.shards.map(x=>x.sha256),old.shards.map(x=>x.sha256));
          assert.equal(m.index.sha256,old.index.sha256);
          console.log('PINNED_RUNTIME_HYDRO='+JSON.stringify({
            version:m.version,pinnedFileHash:hash(bytes),
            originalArchived:true,remainingOsm:0,
            unchangedGeometryShards:true,
          }));
          JS
      - name: Check scoped real-data and Web/Windows asset contracts
        run: |
          node --test \
            tests/unit/current-hydro-layout.test.mjs \
            tests/unit/hydro-packfile.test.mjs \
            tests/unit/physical-layer-service.test.mjs \
            tests/unit/geographic-name-spacing.test.mjs \
            tests/unit/frontend-product-output.test.mjs \
            apps/editor/tests/world-data-plan.test.mjs \
            tests/unit/pages-release-staging.test.mjs \
            tests/unit/pages-deployment-footprint.test.mjs \
            tests/unit/product-assets.test.mjs \
            tests/unit/monorepo-pages-staging.test.mjs
      - name: Build the complete current public Viewer dependency closure without deploying
        run: |
          node tools/stage-monorepo-pages.mjs --root . \
            --stage "$RUNNER_TEMP/pando-hydro-0134-pages" \
            --manifest "$RUNNER_TEMP/pando-hydro-0134-pages-evidence.json"
          node tools/stage-monorepo-pages.mjs --finalize \
            --stage "$RUNNER_TEMP/pando-hydro-0134-pages" \
            --manifest "$RUNNER_TEMP/pando-hydro-0134-pages-evidence.json"
      - name: Validate protected new river URLs, published OSM border credit and source hashes
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          import {join} from 'node:path';
          const dir=process.env.RUNNER_TEMP+'/pando-hydro-0134-pages';
          const evidence=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
            '/pando-hydro-0134-pages-evidence.json','utf8'));
          const paths=new Set(evidence.files.map(x=>x.path));
          const base='assets/data/hydro/v0.13.4/';
          for(const path of ['manifest.json','hydro.bin',
            'hydro-independent-name-replacements.json',
            'hydro-followup-independent-name-replacements.json',
            'hydro-bulk-independent-remaining29.json']){
            assert(paths.has(base+path),'New independent Hydro asset absent from Viewer: '+path);
          }
          assert.equal(paths.has('assets/data/hydro/v0.13.2/hydro.bin'),false,
            'Retired OSM Hydro product input still included');
          assert.equal(evidence.dataCommit,'91c127ddbae902405de6e35b38940a59a8c0d021');
          assert.equal(createHash('sha256').update(readFileSync(join(dir,base,'hydro.bin')))
            .digest('hex'),'82cd70c2c0434ecfbc6e8be53843527c2dc0318ecdf814731a8c7441295230e2');
          const home=readFileSync(join(dir,'index.html'),'utf8');
          assert.match(home,/openstreetmap.org\/copyright/,
            'Keep mandatory map credit while Baikonur OSM-derived borders remain');
          console.log('HYDRO_V0134_PAGES_DEPLOYMENT_READY='+JSON.stringify({
            dataCommit:evidence.dataCommit,fileCount:evidence.fileCount,
            totalBytes:evidence.bytes,independentHydroResources:5,
            oldOsmHydroIncluded:false,baikonurAttributionPreserved:true,
          }));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydro-v0134-pinned-Web-Windows-integration-proof
          path: |
            ${{ runner.temp }}/hydro-v0134-layout.json
            ${{ runner.temp }}/pando-hydro-0134-pages-evidence.json
          if-no-files-found: warn
          retention-days: 30
