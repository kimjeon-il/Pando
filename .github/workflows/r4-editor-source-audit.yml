name: R4 archived editor source references audit
on:
  push:
    branches: [fix/r4-editor-source-retirement-20261102]
    paths:
      - scripts/r4-editor-source-audit.mjs
      - .github/workflows/r4-editor-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/r4-editor-source-audit.mjs
