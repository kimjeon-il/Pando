name: R4 archived editor source references audit
on:
  push:
    branches: [work/ui, work/r4e0-dependency-audit-20261103]
    paths:
      - scripts/r4-editor-source-audit.mjs
      - scripts/r4e0-dependency-audit.mjs
      - docs/development/r4e0-source-dispositions.json
      - tests/unit/r4e0-dependency-audit.test.mjs
      - apps/editor/frontend/**
      - tools/gis/**
      - tests/helpers/**
      - scripts/r4d-check-retired-tests.mjs
      - scripts/contracts/application-checks.json
      - tests/unit/**
      - tests/browser/**
      - .github/workflows/r4-editor-pruning-validation.yml
      - .github/workflows/r4-editor-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/r4-editor-source-audit.mjs
      - run: node scripts/r4d-check-retired-tests.mjs --check
      - name: Build complete R4-E0 dependency map
        run: node scripts/r4e0-dependency-audit.mjs --check --output test-results/r4e0-dependency-map.json
      - name: Validate R4-E0 disposition and canonical constraints
        run: node --test tests/unit/r4e0-dependency-audit.test.mjs
      - name: Publish deletion dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4e0-dependency-map-${{ github.run_id }}
          path: test-results/r4e0-dependency-map.json
          if-no-files-found: warn
