name: W2-P6-3 boundary base delta isolated verification
on:
  push:
    branches: [work/w2-p6-3-geometry-delta-20261103]
    paths:
      - shared/frontend/js/modules/country-boundary-geometry-transport.js
      - shared/frontend/js/modules/gpu-map-renderer.js
      - shared/frontend/js/workers/country-shared-boundary-worker.js
      - tests/unit/country-boundary-geometry-transport.test.mjs
      - tests/unit/country-shared-boundary-state.test.mjs
      - tests/browser/viewer-w2-p3-packet-reuse.spec.mjs
      - tests/browser/viewer-temporal-boundary-worker-rollback.spec.mjs
      - .github/workflows/w2-p6-3-boundary-delta.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w2-p6-3-boundary-delta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Syntax and focused lint
        run: |
          node --check shared/frontend/js/modules/country-boundary-geometry-transport.js
          node --check shared/frontend/js/modules/gpu-map-renderer.js
          node --check shared/frontend/js/workers/country-shared-boundary-worker.js
          node --check tests/unit/country-boundary-geometry-transport.test.mjs
          node --check tests/unit/country-shared-boundary-state.test.mjs
          pnpm exec eslint shared/frontend/js/modules/country-boundary-geometry-transport.js shared/frontend/js/modules/gpu-map-renderer.js shared/frontend/js/workers/country-shared-boundary-worker.js tests/unit/country-boundary-geometry-transport.test.mjs tests/unit/country-shared-boundary-state.test.mjs tests/browser/viewer-temporal-boundary-worker-rollback.spec.mjs
      - name: Exact Worker SHA and base plus delta regressions
        run: node --test --test-concurrency=1 --test-timeout=120000 tests/unit/country-boundary-geometry-transport.test.mjs tests/unit/country-shared-boundary-state.test.mjs
      - name: Real Viewer regression browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Temporal boundary packet reuse
        run: pnpm exec playwright test tests/browser/viewer-w2-p3-packet-reuse.spec.mjs --workers=1 --retries=0 --trace=off
      - name: Temporal Worker error rollback
        run: pnpm exec playwright test tests/browser/viewer-temporal-boundary-worker-rollback.spec.mjs --workers=1 --retries=0 --trace=off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-p6-3-worker-delta-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
