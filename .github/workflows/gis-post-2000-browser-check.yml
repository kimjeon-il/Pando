name: Verify published 2000–2026 GIS historical year display

# Normal GIS date and Viewer checks are selected by the shared P3 application
# gate. Reserve this complete source-pinned reproduction for manual evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gis-post-2000-browser-check
  cancel-in-progress: false

jobs:
  browser-year-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare the exact new library source and runtime pin
        uses: ./.github/actions/library-data
      - name: Check the pinned source and generated runtime inputs
        run: |
          node scripts/generate-build-metadata.mjs
          node scripts/check-version.mjs
          node --test --test-concurrency=1 tests/unit/data/post-2000-generated-world-display.test.mjs \
            tests/unit/document/timeline-resolver.test.mjs \
            tests/unit/geometry/indonesia-territory-timeline.test.mjs \
            tests/unit/geometry/sudan-ukraine-transition.test.mjs \
            tests/unit/document/builtin-world-catalog.test.mjs
      - name: Install Chromium for dated GIS visual evidence
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify historical country dates in the Viewer
        run: pnpm exec playwright test tests/browser/document/viewer-calendar.spec.mjs --workers=1 --retries=0 --trace off
      - name: Preserve actual rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-post-2000-year-display-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
