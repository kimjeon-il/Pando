name: German Empire diagnostics (manual)
on:
  workflow_dispatch:
    inputs:
      recipe_only:
        description: Build and compare the C++ territorial recipe only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    if: ${{ !inputs.recipe_only }}
    runs-on: ubuntu-latest
    outputs:
      data-contracts: ${{ steps.scope.outputs.data-contracts }}
    steps:
      - id: scope
        run: echo 'data-contracts=true' >> "$GITHUB_OUTPUT"
  historical-geometry:
    name: C++ historical geometry recipe
    needs: changes
    if: needs.changes.outputs.data-contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    env:
      PANDO_TERRITORIAL_RECIPE_BINARY: ${{ github.workspace }}/build-native/territorial-recipe/pando-territorial-recipe
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/cpp/territorial-recipe-environment.yml
          init-shell: bash
      - name: Build the native recipe engine
        run: |
          cmake -S tools/cpp -B build-native/territorial-recipe -G Ninja \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF \
            -DPANDO_BUILD_TERRITORIAL_RECIPE=ON
          cmake --build build-native/territorial-recipe --target pando-territorial-recipe
      - name: Verify the stored geometry through the C++ recipe
        run: |
          node --test tests/unit/territorial-recipe-cli.test.mjs tests/unit/territorial-recipe-cpp.test.mjs
          node tools/build-territorial-geometry.mjs --check

  data-contracts:
    name: Validation entrypoints and current generated assets
    needs: [changes, historical-geometry]
    if: needs.changes.outputs.data-contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install native GIS geometry validator dependencies
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev zlib1g-dev pkg-config cmake
      - run: python -m pip install -r tools/requirements-historical-library.txt
      - name: Validate JavaScript syntax and shared asset versions
        run: pnpm check:js && pnpm check:version
      - name: Validate canonical country sources and shared boundaries
        run: pnpm check:country-schema && pnpm check:country-default-colors && pnpm check:country-shared-boundaries
      - name: Validate generated preview assets and unified territorial catalog
        run: >-
          pnpm check:preview &&
          node tools/build-territorial-entity-chunks.mjs --check &&
          node scripts/check-territorial-library.mjs
      - name: Validate catalog geometry parity, lazy loading and timeline storage
        run: >-
          node --test tests/unit/territorial-library.test.mjs
          tests/unit/territorial-library-data.test.mjs
          tests/unit/territorial-source-files.test.mjs
          tests/unit/territorial-source-parity.test.mjs
          tests/unit/territorial-chunks.test.mjs
          tests/unit/territorial-canonical-parity.test.mjs
          tests/unit/territorial-library-service.test.mjs
          tests/unit/territorial-entity-loader.test.mjs
          tests/unit/territorial-timeline-storage.test.mjs
          tests/unit/territorial-snapshots.test.mjs
          tests/unit/country-lineage.test.mjs
          tests/unit/country-lineage-preservation.test.mjs
          tests/unit/library-ownership.test.mjs
          tests/unit/library-import-atomic.test.mjs
          tests/unit/library-map-preview.test.mjs
          tests/unit/territorial-library-controller.test.mjs
          tests/unit/territorial-source-provenance.test.mjs

  exact-cpp-recipe:
    if: ${{ inputs.recipe_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/cpp/territorial-recipe-environment.yml
          init-shell: bash
      - name: Build the native recipe engine
        run: |
          cmake -S tools/cpp -B build-native/territorial-recipe -G Ninja \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF \
            -DPANDO_BUILD_TERRITORIAL_RECIPE=ON
          cmake --build build-native/territorial-recipe --target pando-territorial-recipe
      - name: Compare the generated DDR geometry and stored library
        env:
          PANDO_TERRITORIAL_RECIPE_BINARY: ${{ github.workspace }}/build-native/territorial-recipe/pando-territorial-recipe
        run: |
          node --test tests/unit/territorial-recipe-cli.test.mjs tests/unit/territorial-recipe-cpp.test.mjs
          node tools/build-territorial-geometry.mjs --check

