name: Main GIS integration

on:
  push:
    branches: [work/gis]
    paths: [.github/workflows/main-gis-integration.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact code history for the existing GIS workspace
        env:
          MAIN: fa2ba8084453396bfde385d311c668dc4381b6c7
          GIS: 016df21a4373abcc573a250c515cd6b822cd01c3
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$GIS" HEAD
          mkdir -p build-native/gis-integration
          git update-ref refs/pando/integration/main "$MAIN"
          git update-ref refs/pando/integration/gis HEAD
          git bundle create build-native/gis-integration/source.bundle refs/pando/integration/main refs/pando/integration/gis
          git bundle verify build-native/gis-integration/source.bundle
          printf 'main=%s\ngis=%s\nsource=%s\n' "$MAIN" "$GIS" "$(git rev-parse HEAD)" > build-native/gis-integration/refs.txt
          sha256sum build-native/gis-integration/source.bundle > build-native/gis-integration/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: main-gis-integration-source
          path: build-native/gis-integration/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
