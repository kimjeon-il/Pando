name: GIS Hydro full OSM replacement — all 31 in one build, no deployment

# Past source migration or repository-history audit: manual, not a release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-osm-hydro-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all 31 independently sourced names or explicit neutral fallbacks at once
        run: |-
          node --test       tests/unit/geometry/hydro-name.test.mjs
      - name: Pin exact original HydroRIVERS v0.13.2 data commit
        id: data
        shell: bash
        run: |
          echo "sha=$(node -p "require('./config/library-data.json').revision")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: ${{ steps.data.outputs.sha }}
          path: .pando-hydro-source-pinned
          persist-credentials: false
          filter: blob:none
          sparse-checkout: assets/data/hydro/v0.13.2
      - name: Repack every original OSM name/relationship in a single immutable-geometry candidate
        shell: bash
        run: |
          set -euo pipefail
          input=".pando-hydro-source-pinned/assets/data/hydro/v0.13.2"
          node tools/gis/stage-hydro-all-nonosm.mjs \
            --manifest "$input/manifest.json" \
            --bundle "$input/hydro.bin" \
            --baseline-review "$input/hydro-independent-name-replacements.json" \
            --followup-review "tools/gis/hydro-followup-independent-name-replacements.json" \
            --remaining-review "tools/gis/hydro-bulk-independent-remaining29.json" \
            --inventory "tools/gis/osm-independent-river-source-inventory.json" \
            --output-dir "$RUNNER_TEMP/hydro-v0.13.4-nonosm"
      - name: Check zero OSM source metadata, unchanged index/shards and full package integrity
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {auditHydroOsm,auditOsmCreditRemoval} from './tools/gis/audit-osm-credit-removal.mjs';
          import {manifestRoles} from './tools/checks/check-current-hydro-layout.mjs';
          const root=process.env.RUNNER_TEMP+'/hydro-v0.13.4-nonosm';
          const manifest=JSON.parse(readFileSync(root+'/manifest.json','utf8'));
          const bundle=readFileSync(root+'/hydro.bin');
          const proof=JSON.parse(readFileSync(root+'.proof.json','utf8'));
          manifestRoles(manifest);
          const hydro=auditHydroOsm(manifest,bundle);
          assert.equal(hydro.remainingCount,0);
          assert.deepEqual(hydro.remainingSystemIds,[]);
          assert.deepEqual(hydro.inconsistentLabels,[]);
          assert.deepEqual(hydro.independentUrlOsmContamination,[]);
          assert.equal(hydro.staleManifestOsmSource,false);
          assert.equal(proof.sourceNamesScrubbed,31);
          assert.equal(proof.sourceIndependentByRegion.af,2);
          assert.equal(proof.sourceIndependentByRegion.eu,11);
          assert.equal(proof.sourceIndependentByRegion.si,1);
          assert.equal(proof.sourceIndependentByRegion.as,17);
          assert.equal(proof.remainingIndependentlyNamedCount,19);
          assert.equal(proof.neutralizedUnverifiedNameCount,10);
          assert.equal(proof.indexUnchanged,true);
          assert.equal(proof.geometryShardHashesUnchanged,true);
          assert.equal(manifest.sources.independentHydronymBulk.replacedSystems,29);
          assert.equal(manifest.sources.independentHydronymFollowup.replacedSystems,2);
          assert.equal(manifest.sources.independentHydronymReplacements.replacedSystems,42);
          assert.equal(manifest.stats.osmWaterwayMatchCount,0);
          assert(manifest.sources.hydroRivers.every(row=>row.osmMatches===0));
          assert.equal(proof.deployed,false);
          assert.equal(proof.mainMapOsmCreditRemoved,false);
          // Credit removal remains forbidden until Baikonur/non-Hydro OSM geometry is independently cleared.
          assert.equal(auditOsmCreditRemoval({hydro}).safeToRemoveMainMapOsmCredit,false);
          console.log('ZERO_OSM_HYDRO_CANDIDATE='+JSON.stringify({
            released:false,sourceSystemCount:31,remainingOsm:hydro.remainingCount,
            independentNames:19,neutralizedNames:10,
            unmodifiedIndex:true,unmodifiedGeometryShards:true,
            candidateSha256:proof.candidateSha256
          }));
          JS
      - name: Verify actual Viewer Hydro Worker reads both byte ranges and a full candidate pack
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {verifyWorker} from './tools/checks/check-current-hydro-layout.mjs';
          const path=process.env.RUNNER_TEMP+'/hydro-v0.13.4-nonosm/';
          const manifest=JSON.parse(readFileSync(path+'manifest.json','utf8'));
          const bundle=readFileSync(path+'hydro.bin');
          const ranged=await verifyWorker('.',manifest,bundle,{supportsRange:true});
          const full=await verifyWorker('.',manifest,bundle,{supportsRange:false});
          assert.equal(ranged.ready,true);
          assert.equal(full.ready,true);
          assert(ranged.requests.length>=3);
          assert.equal(full.requests.length,1);
          const corrupted=structuredClone(manifest);
          corrupted.sources.independentHydronymBulk.replacedSystems=28;
          await assert.rejects(()=>verifyWorker('.',corrupted,bundle,{supportsRange:true}),
            /통합 수계 형식 또는 버전이 올바르지 않습니다/);
          console.log('ZERO_OSM_HYDRO_WORKER_PARITY='+JSON.stringify({
            viewerWorkerReady:true,rangeRequests:ranged.requests.length,
            fullFileRequests:full.requests.length,
            candidateVersion:manifest.version,
          }));
          JS
      - name: Decode the complete new packed Hydro Worker input, not only the manifest
        shell: bash
        run: |
          set -euo pipefail
          node tools/gis/decode-hydro-connectivity.mjs \
            "$RUNNER_TEMP/hydro-v0.13.4-nonosm" "$RUNNER_TEMP/hydro-v0.13.4-decoded.json"
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const decoded=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/hydro-v0.13.4-decoded.json','utf8'));
          assert(Array.isArray(decoded.features));
          assert.equal(decoded.features.length,16548);
          let flagged=0;
          for(const feature of decoded.features){
            const meta=feature.metadata||{};
            if((meta.osmRelationIds||[]).length||/\bOSM waterway names\b/i.test(String(meta.source||'')))flagged++;
          }
          assert.equal(flagged,0);
          console.log('ZERO_OSM_HYDRO_DECODED_FEATURES='+decoded.features.length);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: gis-hydro-v0.13.4-all31-nonosm-CANDIDATE
          path: |
            ${{ runner.temp }}/hydro-v0.13.4-nonosm/
            ${{ runner.temp }}/hydro-v0.13.4-nonosm.proof.json
          retention-days: 30
          if-no-files-found: error
