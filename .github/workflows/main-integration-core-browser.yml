name: "[HISTORICAL] Source-matched core and focused Viewer roundtrip for main integration"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wasm-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/optimization-main-merge-20261110
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 3.31.6
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          build-native/emsdk/emsdk install 6.0.3
          build-native/emsdk/emsdk activate 6.0.3
          source build-native/emsdk/emsdk_env.sh
          emcc --version | sed -n '1p' | grep -F '6.0.3'
          port_file=build-native/emsdk/upstream/emscripten/tools/ports/zlib.py
          original='https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz'
          canonical='https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION}'
          grep -Fq "$original" "$port_file"
          sed -i "s|$original|$canonical|" "$port_file"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='build-native/emsdk/upstream/emscripten/tools/ports/__init__.py';
          const input=readFileSync(file,'utf8');
          const old="    ext = url_filename.split('.', 1)[1]";
          if(input.split(old).length!==2)throw Error('Unexpected pinned Emscripten port loader');
          const next="    ext = 'tar.gz' if name == 'zlib' and url.startswith('https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v') else url_filename.split('.', 1)[1]";
          writeFileSync(file,input.replace(old,next));
          NODE
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm --parallel 2
          mapfile -t outputs < <(find build-native/p1/pando-wasm -name pandoeditor-core.js -type f)
          test "${#outputs[@]}" -eq 1
          node tools/build/package-shared-core-assets.mjs --build-dir "$(dirname "${outputs[0]}")"
          node scripts/check-core-prerequisite.mjs
      - id: core-tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=30000 \
            tests/unit/document/project-domain-core-command.test.mjs \
            tests/unit/document/project-open-adapter.test.mjs \
            tests/unit/document/selection-domain-core.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/merge-core-tests.log"
      - id: publish-source-matched-artifact
        if: steps.build.outcome == 'success' && steps.core-tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wasm/pandoeditor-core.js assets/wasm/pandoeditor-core.wasm assets/wasm/pandoeditor-core.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(core): package source-matched WASM for main integration [skip ci]"
            git push origin HEAD:refs/heads/work/optimization-main-merge-20261110
          fi
      - id: browser
        if: steps.publish-source-matched-artifact.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium
          node tools/data/library-data.mjs --purpose=viewer
          pnpm exec playwright test tests/browser/document/viewer-project-runtime-roundtrip.spec.mjs \
            --workers=1 --reporter=list --timeout=180000 2>&1 | tee "$RUNNER_TEMP/merge-browser.log"
      - name: Upload failure diagnostics and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-integration-core-browser
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 5
      - name: Record source-matched core and real browser result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),branch='work/optimization-main-merge-20261110';
            const read=name=>{const path=process.env.RUNNER_TEMP+'/merge-'+name+'.log';
              return fs.existsSync(path)?fs.readFileSync(path,'utf8').slice(-22000):'not executed';};
            const result={sourceCommit:context.sha,install:'${{ steps.install.outcome }}',
              build:'${{ steps.build.outcome }}',coreTests:'${{ steps.core-tests.outcome }}',
              published:'${{ steps.publish-source-matched-artifact.outcome }}',
              browser:'${{ steps.browser.outcome }}',
              logs:{core:read('core-tests'),browser:read('browser')}};
            const path='validation-results/main-integration-core-browser.json';
            let sha;try{sha=(await github.rest.repos.getContent({
              owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha;}
            catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch,
              ...(sha?{sha}:{}),message:'test: record source-matched main integration validation',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')});
      - name: Require native and browser regression
        if: always()
        run: |
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.core-tests.outcome }}' = success
          test '${{ steps.publish-source-matched-artifact.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
