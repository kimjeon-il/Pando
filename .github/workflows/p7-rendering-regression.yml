name: P7 runtime rendering and timeline regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7-rendering-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  behavior-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Confirm existing shared WASM source identity
        run: node tools/build/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - name: Execute actual render, Canvas, DEM, timeline and document behavior
        run: |
          node --test --test-concurrency=1 \
            tests/unit/rendering/gpu-base-scene-order.test.mjs \
            tests/unit/rendering/gpu-scene-staging.test.mjs \
            tests/unit/rendering/gpu-resource-owners.test.mjs \
            tests/unit/rendering/gpu-stroke-renderer.test.mjs \
            tests/unit/rendering/gpu-helper-utils.test.mjs \
            tests/unit/rendering/canvas-country-geometry.test.mjs \
            tests/unit/rendering/gpu-canvas-worker.test.mjs \
            tests/unit/rendering/canvas-terrain-independence.test.mjs \
            tests/unit/rendering/gpu-terrain-preparation.test.mjs \
            tests/unit/rendering/map-presentation-readiness.test.mjs \
            tests/unit/rendering/map-surface-recovery.test.mjs \
            tests/unit/document/core-document-read-model.test.mjs \
            tests/unit/document/timeline-controls.test.mjs
  browser-regression:
    strategy:
      fail-fast: false
      matrix:
        suite: [webgl, canvas-dem, timeline]
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/build/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - run: pnpm exec playwright install --with-deps chromium
      # Reverify source-matched WASM, domain-relocated Canvas harnesses and first-paint recovery.
      # Run the same three independent backends after WASM source admission;
      # do not substitute a source-string probe for a presented frame.
      - name: Execute current Viewer in real Chromium backend
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.suite }}" in
            webgl) specs="tests/browser/rendering/viewer-renderer-recovery.spec.mjs tests/browser/rendering/terrain-dem-shader.spec.mjs tests/browser/rendering/viewer-gpu-backend-cross.spec.mjs" ;;
            canvas-dem) specs="tests/browser/rendering/terrain-zoom-continuity.spec.mjs tests/browser/rendering/canvas-globe-performance.spec.mjs tests/browser/geometry/viewer-startup-and-terrain.spec.mjs" ;;
            timeline) specs="tests/browser/document/viewer-calendar.spec.mjs tests/browser/ui/deferred-builtin-timeline.spec.mjs" ;;
          esac
          pnpm exec playwright test $specs --workers=1 --retries=0 --reporter=line
      - name: Upload actual browser failure and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-rendering-${{ matrix.suite }}-${{ github.sha }}
          path: |
            test-results/
            gpu-viewer-evidence/
          retention-days: 14
          if-no-files-found: warn
