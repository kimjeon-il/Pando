name: Integrated Windows WebView startup and memory (2-3F)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-windows-webview-startup-memory-20261016
  cancel-in-progress: false

jobs:
  windows-startup:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PANDOLAB_SHELL_PROFILE: map-data
      PANDOLAB_SHELL_VERIFICATION: "1"
      TAURI_CONFIG: '{"app":{"security":{"capabilities":["prototype-main","verification"]}}}'
      CARGO_TERM_COLOR: always
    steps:
      - name: Preserve Git byte-for-byte release resources
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/editor install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check map-data probe contracts
        shell: pwsh
        run: |
          node --test tests/unit/editor-resource-capabilities.test.mjs apps/editor/tests/full-world-probe.test.mjs apps/editor/tests/world-data-plan.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage the canonical world and physical resources
        shell: pwsh
        run: |
          node apps/editor/stage.mjs --profile=map-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Get-Content apps/editor/dist/shell/stage-evidence.json -Raw | ConvertFrom-Json
          if ($stage.profile -ne 'map-data' -or
              $stage.worldData.countryCount -ne 258 -or
              $stage.worldData.worldFileCount -ne 597 -or
              $stage.worldData.physicalFileCount -ne 13 -or
              $stage.worldData.fileCount -ne 610) {
            throw 'The immutable world and physical-resource package is not the expected test input.'
          }
      - name: Build the Windows verification executable
        shell: pwsh
        run: |
          pnpm --dir apps/editor exec tauri build --debug --no-bundle --target x86_64-pc-windows-msvc --features custom-protocol,verification --config src-tauri/tauri.verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native diagnostic and file transfer contracts
        shell: pwsh
        run: |
          cargo test --manifest-path apps/editor/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --features custom-protocol,verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure three isolated cold-profile runs
        shell: pwsh
        run: |
          ./apps/editor/measure-windows-startup.ps1 -BinaryPath 'apps/editor/src-tauri/target/x86_64-pc-windows-msvc/debug/pandolab-web-shell.exe' -HoldAfterReadyMs 30000 -TrialCount 3
          $data = Get-Content build-native/web-shell/startup-memory.json -Raw | ConvertFrom-Json
          if ($data.schema -ne 'pandolab-windows-webview-startup-memory' -or $data.summary.count -ne 3) {
            throw 'The Windows startup benchmark is incomplete.'
          }
          Write-Output ('STARTUP_MEMORY_MEDIANS ' + ($data.summary | ConvertTo-Json -Compress))
      - name: Preserve benchmark evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-windows-startup-memory-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-native/web-shell/startup-memory.json
            build-native/web-shell/world-startup-*.json
            apps/editor/dist/shell/stage-evidence.json
