name: Objects timeline regression
# P5-6 final integration: exercise calendar, timeline records, resolver and library parity against main 691ec5d source.

on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/object-timeline-regression.yml'
      - 'shared/frontend/static/wasm/pandoeditor-core.manifest.json'
      - 'assets/js/modules/temporal.js'
      - 'assets/js/modules/territorial-library.js'
      - 'assets/js/modules/timeline*.js'
      - 'assets/js/modules/project-state.js'
      - 'assets/js/modules/project-serializer.js'
      - 'shared/core/src/timeline*.cpp'
      - 'shared/core/include/**/timeline*.h'
      - 'tests/unit/temporal.test.mjs'
      - 'tests/unit/timeline-*.test.mjs'
      - 'tests/fixtures/timeline-*'
      - 'tests/fixtures/portability/timeline-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-timeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gate tests on the exact shared C++ source fingerprint
        id: core
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { sharedSourceManifest } from './tools/package-shared-core-assets.mjs';
          const source=sharedSourceManifest(process.cwd()).sourceSha256;
          const manifest=JSON.parse(readFileSync('shared/frontend/static/wasm/pandoeditor-core.manifest.json','utf8'));
          const ready=source===manifest.sourceSha256;
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if (!ready) {
            console.log('Generated WASM is source-stale; P2 will publish the matching pair.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              'Timeline JS tests deferred on this source-only commit; the P2-generated manifest push retriggers them.\n');
          }
          NODE
      - name: Check month-end, resolution and timeline edits
        if: steps.core.outputs.ready == 'true'
        run: |
          node --test \
            tests/unit/temporal.test.mjs \
            tests/unit/timeline-records.test.mjs \
            tests/unit/timeline-storage.test.mjs \
            tests/unit/project-timeline-domain.test.mjs \
            tests/unit/timeline-edit.test.mjs \
            tests/unit/timeline-resolver.test.mjs \
            tests/unit/timeline-objects-parity.test.mjs \
            tests/unit/territorial-library.test.mjs \
            tests/unit/territorial-library-service.test.mjs \
            tests/unit/territorial-timeline-storage.test.mjs
