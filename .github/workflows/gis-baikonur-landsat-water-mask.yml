name: GIS Baikonur independent Landsat riverbank reconstruction — stage 1

on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/gis-baikonur-landsat-water-mask.yml'
      - 'tools/gis/baikonur-landsat-water-mask.mjs'
      - 'tests/unit/gis-baikonur-landsat-water-mask.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gis-baikonur-landsat-bank-source-v1
  cancel-in-progress: true

jobs:
  public-domain-waterproof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source-only NDWI offsets, QA_PIXEL and bounding boxes
        run: |
          node --test tests/unit/gis-baikonur-landsat-water-mask.test.mjs \
            tests/unit/gis-baikonur-reference.test.mjs \
            tests/unit/gis-baikonur-2019-exclusions.test.mjs
      - name: Install GDAL C++ raster tools only (no Python build scripts or OSM)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gdal-bin
          gdalwarp --version
          gdalinfo --version
      - name: Reconstruct two 30 m river water masks from 2019 and 2025 USGS reflectance
        shell: bash
        run: |
          set -euo pipefail
          node tools/gis/baikonur-landsat-water-mask.mjs \
            --output-dir "$RUNNER_TEMP/baikonur-landsat-water-2019-2025"
      - name: Verify independent raster origin, do NOT promote an unverified bank
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,existsSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP+'/baikonur-landsat-water-2019-2025/';
          const d=JSON.parse(readFileSync(root+'manifest.json','utf8'));
          assert.equal(d.openStreetMapDataUsed,false);
          assert.equal(d.polygonApplied,false);
          assert.equal(d.bankSections.length,4);
          assert.equal(d.status,'RESEARCH_ONLY_NO_LEGAL_BANK_OR_PUBLISHED_GEOMETRY');
          for(const row of d.bankSections){
            assert(!JSON.stringify(row).match(/(?:openstreetmap|overpass)/i));
            if(!row.sourceGridFile)continue;
            const buffer=readFileSync(root+row.sourceGridFile);
            assert.equal(createHash('sha256').update(buffer).digest('hex'),
              row.sourceGridSha256);
            assert.equal(row.noLegalBankReconstructed,true);
            assert.equal(row.leasePolygonsReplaced,false);
          }
          const passed=d.bankSections.filter(x=>x.sceneId);
          console.log('USGS_INDEPENDENT_BAIKONUR_MASK_AUDIT='+JSON.stringify({
            clippedScenes:passed.length,
            connectedChannels:d.bankSections.filter(x=>x.connectsBothTreatyAnchors).length,
            result:d.bankSections.map(x=>({pair:x.treatyPointPair,epoch:x.epoch,
              acquired:x.acquiredAt||null,validCoverage:x.raster?.validCoverage||0,
              distances:x.anchorToWaterMeters||null,connected:x.connectsBothTreatyAnchors||false,
              error:x.errorClass||null})),noPublication:true,
          }));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baikonur-usgs-public-domain-water-masks-2019-2025
          path: ${{ runner.temp }}/baikonur-landsat-water-2019-2025/
          retention-days: 21
          if-no-files-found: warn
