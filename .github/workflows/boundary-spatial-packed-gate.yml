name: Packed boundary spatial index regression
on:
  push:
    branches: [work/perf-boundary-index-20261017]
    paths:
      - '.github/workflows/boundary-spatial-packed-gate.yml'
      - 'shared/frontend/js/modules/boundary-spatial-index.js'
      - 'shared/frontend/js/modules/boundary-topology.js'
      - 'tests/unit/boundary-source-row-compact.test.mjs'
      - 'shared/frontend/static/wasm/pandoeditor-core.manifest.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packed-boundary-unit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packed-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify packed spatial index, source identities, and code style
        run: |
          node --check shared/frontend/js/modules/boundary-spatial-index.js
          pnpm exec eslint shared/frontend/js/modules/boundary-spatial-index.js shared/frontend/js/modules/boundary-topology.js tests/unit/boundary-source-row-compact.test.mjs
          node --test tests/unit/boundary-source-row-compact.test.mjs
      - name: Verify unchanged country contact identities and incremental patches
        run: |
          node --test tests/unit/country-shared-boundary.test.mjs tests/unit/country-shared-boundary-state.test.mjs tests/unit/boundary-display-refinement.test.mjs
