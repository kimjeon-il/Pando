name: Objects cursor WASM baseline comparison
on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/objects-cursor-wasm-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            source_sha: 219b8726df6bfc26467257a19f0f358fa52353c5
          - label: after
            source_sha: 2e332b4cd443f8931a2d28ee865aba50c4696b41
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify source-compatible compiled WASM and run identical unmodified world/session tests
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/assets/wasm/pandoeditor-core.js
        run: |
          node tools/package-shared-core-assets.mjs --build-dir assets/wasm --check
          node --test tests/unit/core-document-world-wasm.test.mjs shared/tests/wasm-document-session.test.mjs
