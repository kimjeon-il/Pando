# Explicit reproduction produces an unpublished candidate, never an operating-data update.
name: Build German Empire 1914 modern-coast candidate

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
          persist-credentials: false
      - name: Check storage for the existing GIS toolchain
        shell: pwsh
        run: |
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          if ($drive.AvailableFreeSpace -lt 9GB) { throw 'Need estimated 4 GiB GIS SDK/build space plus 5 GiB headroom' }
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/cpp/territorial-recipe-environment.yml
          init-shell: bash
          cache-environment: true
          cache-downloads: true
      - name: Build selected native generator and candidate
        run: |
          cmake -S tools/cpp -B build-native/territorial-recipe -G Ninja -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=ON
          cmake --build build-native/territorial-recipe --target pando-territorial-recipe
          export PANDO_TERRITORIAL_RECIPE_BINARY="$PWD/build-native/territorial-recipe/pando-territorial-recipe"
          node tools/gis/build-german-1914-base.mjs --modern-coast --output build-native/territorial-recipe/german-1914-modern-coast-candidate.geojson --diagnostics build-native/territorial-recipe/german-1914-modern-coast-diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: german-1914-modern-coast-candidate-${{ github.sha }}
          path: |
            build-native/territorial-recipe/german-1914-modern-coast-candidate.geojson
            build-native/territorial-recipe/german-1914-modern-coast-diagnostics.json
          if-no-files-found: error
          retention-days: 7
