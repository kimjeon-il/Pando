name: Focused final project search regression lint
on:
  push:
    branches: [work/phase5-final-test-lint-20261109]
    paths: [.github/workflows/phase5-last-test-lint.yml]
permissions:
  contents: write
jobs:
  search-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: syntax
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node --check tests/unit/document/object-search-availability.test.mjs
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint tests/unit/document/object-search-availability.test.mjs 2>&1 | tee "$RUNNER_TEMP/phase5-final-eslint.log"
      - name: Save bounded result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),log=process.env.RUNNER_TEMP+'/phase5-final-eslint.log';
            const result={sourceCommit:context.sha,
              install:'${{ steps.install.outcome }}',syntax:'${{ steps.syntax.outcome }}',lint:'${{ steps.lint.outcome }}',
              output:fs.existsSync(log)?fs.readFileSync(log,'utf8').slice(-13000):'not executed'};
            const branch=context.ref.replace('refs/heads/','');
            let sha;
            try {
              const previous=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,
                path:'validation-results/phase5-final-search-lint.json',ref:branch});
              sha=previous.data.sha;
            }catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,branch,
              path:'validation-results/phase5-final-search-lint.json',
              ...(sha?{sha}:{}),
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),
              message:'test: record final project search scope regression lint'});
      - name: Require focused syntax and lint
        if: always()
        run: |
          test '${{ steps.syntax.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
