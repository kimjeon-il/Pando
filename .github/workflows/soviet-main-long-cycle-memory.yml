name: Soviet main-equivalent 12-cycle Worker/WASM retention
on:
  push:
    branches: [work/integration-ui-objects-20261016]
    paths:
      - '.github/workflows/soviet-main-long-cycle-memory.yml'
      - 'tests/browser/soviet-main-long-cycle.spec.mjs'
      - 'tests/browser/helpers/soviet-memory-attribution.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-long-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prove product source exactly equals pinned main
        env:
          MAIN_BASE: e85b3e158d5c02e4aa028283db5b83a1750f4b1a
        run: |
          test "$(git rev-parse HEAD^)" = "$MAIN_BASE"
          git diff --name-only HEAD^ HEAD | grep -Ev '^(\.github/workflows/soviet-main-long-cycle-memory\.yml|tests/browser/soviet-main-long-cycle\.spec\.mjs|tests/browser/helpers/soviet-memory-attribution\.mjs)$' > /tmp/non-test-change || true
          test ! -s /tmp/non-test-change || { cat /tmp/non-test-change; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check focused test syntax and ESLint
        run: |
          node --check tests/browser/soviet-main-long-cycle.spec.mjs
          pnpm exec eslint tests/browser/soviet-main-long-cycle.spec.mjs tests/browser/helpers/soviet-memory-attribution.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run 12 Soviet-to-modern cycles
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
          PANDOLAB_EXPECT_MAIN_SHA: e85b3e158d5c02e4aa028283db5b83a1750f4b1a
        run: pnpm exec playwright test tests/browser/soviet-main-long-cycle.spec.mjs --workers=1 --retries=0 --trace off
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soviet-main-12cycle-${{ github.sha }}
          path: test-results/soviet-main-long-cycle/
          if-no-files-found: warn
          retention-days: 14
