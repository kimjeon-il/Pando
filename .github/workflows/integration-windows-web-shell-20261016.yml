name: Integrated map-data Windows WebView verification

on:
  push:
    branches: ['work/integration-ui-objects-20261016']
    paths:
      - '.github/workflows/integration-windows-web-shell-20261016.yml'
      - 'apps/editor/**'
      - 'assets/js/modules/app-environment.js'
      - 'assets/js/modules/app-progressive-startup.js'
      - 'assets/js/modules/app-composition.js'
      - 'assets/js/modules/resource-capabilities.js'
      - 'tests/unit/editor-resource-capabilities.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pando-integrated-web-shell-windows-20261016
  cancel-in-progress: false

jobs:
  windows-full-world:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PANDOLAB_SHELL_PROFILE: map-data
      PANDOLAB_SHELL_VERIFICATION: "1"
      TAURI_CONFIG: '{"app":{"security":{"capabilities":["prototype-main","verification"]}}}'
      CARGO_TERM_COLOR: always
    steps:
      - name: Disable Windows Git line-ending conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies without installation scripts
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/editor install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run focused canonical shell and file tests
        shell: pwsh
        run: |
          node --test tests/unit/editor-resource-capabilities.test.mjs apps/editor/tests/full-world-probe.test.mjs apps/editor/tests/world-data-plan.test.mjs apps/editor/tests/stage-world.test.mjs apps/editor/tests/stage.test.mjs apps/editor/tests/network-guard.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage and hash the actual committed map data
        shell: pwsh
        run: |
          node apps/editor/stage.mjs --profile=map-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Get-Content apps/editor/dist/shell/stage-evidence.json -Raw | ConvertFrom-Json
          if ($stage.profile -ne 'map-data' -or $stage.worldData.countryCount -ne 258 -or
              $stage.worldData.modelEntityCount -ne 254 -or
              $stage.worldData.rootCount -ne 207 -or
              $stage.worldData.mergedSourceCount -ne 4 -or
              $stage.worldData.worldFileCount -ne 597 -or
              $stage.worldData.physicalFileCount -ne 13 -or
              $stage.worldData.fileCount -ne 610) {
            throw 'Full-world package must contain 258 source polygons, 254 entities, and 610 pinned files.'
          }
          foreach ($path in @('assets/data/hydro/v0.13.2/hydro.bin',
              'assets/data/places/places-v1.bin',
              'assets/data/terrain-preview/v0.13.3-p1/1/2-1.webp')) {
            if ($stage.files.Where({ $_.path -eq $path }).Count -ne 1) {
              throw "Missing required offline physical resource: $path"
            }
          }
          Write-Output "Verified $($stage.worldData.fileCount) pinned world files ($($stage.worldData.bytes) bytes)."
      - name: Build map-data Windows Tauri app using native MSVC
        shell: pwsh
        run: |
          pnpm --dir apps/editor exec tauri build --debug --no-bundle --target x86_64-pc-windows-msvc --features custom-protocol,verification --config src-tauri/tauri.verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native Rust storage and command contracts
        shell: pwsh
        run: |
          cargo test --manifest-path apps/editor/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --features custom-protocol,verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute the actual map-data Windows WebView app
        shell: pwsh
        run: |
          ./apps/editor/verify-world-windows.ps1 -BinaryPath 'apps/editor/src-tauri/target/x86_64-pc-windows-msvc/debug/pandolab-web-shell.exe'
      - name: Preserve proof even if GUI execution fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-windows-world-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            apps/editor/dist/shell/stage-evidence.json
            build-native/web-shell/world-windows.json
