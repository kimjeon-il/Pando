name: Integrated full-world Windows WebView verification

on:
  push:
    branches: ['work/integration-ui-objects-20261016']
    paths:
      - '.github/workflows/integration-windows-web-shell-20261016.yml'
      # One integration acceptance invocation; later pushes can use workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pando-integrated-web-shell-windows-20261016
  cancel-in-progress: false

jobs:
  windows-full-world:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PANDOLAB_SHELL_PROFILE: full-world
      CARGO_TERM_COLOR: always
    steps:
      - name: Disable Windows Git line-ending conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies without installation scripts
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/web-shell install --ignore-workspace --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run focused canonical shell and file tests
        shell: pwsh
        run: |
          node --test apps/web-shell/tests/full-world-probe.test.mjs apps/web-shell/tests/world-data-plan.test.mjs apps/web-shell/tests/stage-world.test.mjs apps/web-shell/tests/stage.test.mjs apps/web-shell/tests/network-guard.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage and hash the actual committed full-world data
        shell: pwsh
        run: |
          node apps/web-shell/stage.mjs --profile=full-world
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Get-Content apps/web-shell/dist/shell/stage-evidence.json -Raw | ConvertFrom-Json
          if ($stage.profile -ne 'full-world' -or $stage.worldData.countryCount -ne 258 -or
              $stage.worldData.modelEntityCount -ne 254 -or
              $stage.worldData.rootCount -ne 207 -or
              $stage.worldData.mergedSourceCount -ne 4 -or
              $stage.worldData.fileCount -ne 597) {
            throw 'Full-world package must contain 258 source polygons, 254 editable entities, and 597 pinned files.'
          }
          if ($stage.files.Where({ $_.path -match '^assets/data/(?:hydro|terrain|places)/' }).Count -ne 0) {
            throw 'Physical data unexpectedly entered the scoped full-world stage.'
          }
          Write-Output "Verified $($stage.worldData.fileCount) pinned world files ($($stage.worldData.bytes) bytes)."
      - name: Build full-world Windows Tauri app using native MSVC
        shell: pwsh
        run: |
          pnpm --dir apps/web-shell exec tauri build --debug --no-bundle --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native Rust storage and command contracts
        shell: pwsh
        run: |
          cargo test --manifest-path apps/web-shell/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute the actual full-world Windows WebView app
        shell: pwsh
        run: |
          ./apps/web-shell/verify-world-windows.ps1 -BinaryPath 'apps/web-shell/src-tauri/target/x86_64-pc-windows-msvc/debug/pandolab-web-shell.exe'
      - name: Preserve proof even if GUI execution fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-windows-world-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            apps/web-shell/dist/shell/stage-evidence.json
            build-native/web-shell/world-windows.json
