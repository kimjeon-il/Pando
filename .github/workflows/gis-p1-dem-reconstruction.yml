name: P1 DEM re-generate all 1280 raster tiles from NOAA original (no publication)
# Full source reconstruction is an explicit reproducibility audit, not routine CI.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dem-recreate:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned external source identity
        run: |
          node -e "const x=require('./config/library-data.json');if(x.revision!=='91c127ddbae902405de6e35b38940a59a8c0d021')throw Error('Wrong pinned source revision')"
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: 91c127ddbae902405de6e35b38940a59a8c0d021
          path: .pando-p1-dem-published
          persist-credentials: false
          filter: blob:none
          sparse-checkout: terrain/v0.13.3
      - name: Disk headroom check before whole original reconstruction
        run: |
          set -euo pipefail
          available=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          if [ "$available" -lt 9663676416 ]; then echo 'Need 4 GiB working data plus 5 GiB headroom' >&2; exit 1; fi
      - uses: mamba-org/setup-micromamba@v3
        id: p1-dem-gdal
        with:
          environment-name: pando-p1-dem-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build source-verified native GDAL, WebP, DEM encoder and gutter tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          gdal_sdk='${{ steps.p1-dem-gdal.outputs.environment-path }}'
          echo "LD_LIBRARY_PATH=$gdal_sdk/lib" >> "$GITHUB_ENV"
          cmake -S tools/cpp -B build-native/p1-map-image -G Ninja -DCMAKE_BUILD_TYPE=Release -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          cmake --build build-native/p1-map-image --target pando-map-image --parallel 2
          node tools/map-image/package-native.mjs --binary build-native/p1-map-image/pando-map-image --directory build-native/p1-map-image/artifact
          cmake -S tools/cpp/terrain-dem-raster -B build-native/p1-dem-raster -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$gdal_sdk"
          cmake --build build-native/p1-dem-raster --target pando-terrain-dem-raster --parallel 2
          node tools/gis/package-terrain-dem-raster.mjs --binary build-native/p1-dem-raster/pando-terrain-dem-raster --directory build-native/p1-dem-raster/artifact
          cmake -S tools/cpp/terrain-dem-encode -B build-native/p1-dem-encode -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native/p1-dem-encode --target pando-terrain-dem-encode --parallel 2
          node tools/gis/package-terrain-dem-encode.mjs --binary build-native/p1-dem-encode/pando-terrain-dem-encode --directory build-native/p1-dem-encode/artifact
          cmake -S tools/cpp/terrain-dem-gutters -B build-native/p1-dem-gutters -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native/p1-dem-gutters --target pando-terrain-dem-gutters --parallel 2
          node tools/gis/package-terrain-dem-gutters.mjs --binary build-native/p1-dem-gutters/pando-terrain-dem-gutters --directory build-native/p1-dem-gutters/artifact
      - name: Fetch original NOAA ETOPO and require exact source hash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --connect-timeout 30 --max-time 1800 --max-filesize 1700000000 \
            'https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO2022/data/30s/30s_surface_elev_gtif/ETOPO_2022_v1_30s_N90W180_surface.tif' \
            --output "$RUNNER_TEMP/ETOPO_2022_v1_30s_N90W180_surface.tif"
          echo '8630abc401cc6bdd30b507a68d3eb9eda5b65f5636f7199e4b1eefd476b5a9e2  '"$RUNNER_TEMP/ETOPO_2022_v1_30s_N90W180_surface.tif" | sha256sum -c -
      - name: Regenerate and pixel-compare all six LODs, including polar and tile gutters
        env:
          PANDO_MAP_IMAGE_ARTIFACT: build-native/p1-map-image/artifact
          PANDO_TERRAIN_DEM_RASTER_DIRECTORY: build-native/p1-dem-raster/artifact
          PANDO_TERRAIN_DEM_ENCODE_DIRECTORY: build-native/p1-dem-encode/artifact
          PANDO_TERRAIN_DEM_GUTTERS_DIRECTORY: build-native/p1-dem-gutters/artifact
        run: |
          set -euo pipefail
          mkdir -p p1-proof
          node --check tools/gis/verify-p1-dem-full-recreation.mjs
          node tools/gis/verify-p1-dem-full-recreation.mjs \
            --etopo "$RUNNER_TEMP/ETOPO_2022_v1_30s_N90W180_surface.tif" \
            --reference .pando-p1-dem-published/terrain/v0.13.3 \
            --output "$RUNNER_TEMP/p1-dem-recreated" \
            --proof p1-proof/dem-regeneration-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-dem-complete-source-regeneration-proof
          path: p1-proof/*.json
          if-no-files-found: warn
          retention-days: 21
