name: Performance baseline ownership and evidence contract
on:
  push:
    branches: [work/perf-baseline-20261017]
    paths:
      - '.github/workflows/performance-baseline-audit.yml'
      - 'config/performance-baseline-v1.json'
      - 'scripts/assemble-performance-evidence.mjs'
      - 'tests/unit/performance-baseline-contract.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/performance-baseline-audit.yml'
      - 'config/performance-baseline-v1.json'
      - 'scripts/assemble-performance-evidence.mjs'
      - 'tests/unit/performance-baseline-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perf-baseline-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reusable-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate metadata and existing measurement adapters
        run: |
          node --check scripts/assemble-performance-evidence.mjs
          node --check tests/unit/performance-baseline-contract.test.mjs
          pnpm exec eslint scripts/assemble-performance-evidence.mjs tests/unit/performance-baseline-contract.test.mjs
          node --test tests/unit/performance-baseline-contract.test.mjs tests/unit/soviet-memory-attribution.test.mjs tests/unit/runtime-performance-metrics.test.mjs
      - name: Verify retained object and country spatial-index contracts
        run: |
          node tools/package-shared-core-assets.mjs --build-dir assets/wasm --check
          node --test tests/unit/core-document-runtime.test.mjs tests/unit/boundary-spatial-index-packed.test.mjs tests/unit/country-contact-legacy-parity.test.mjs tests/unit/country-shared-boundary-state.test.mjs
