name: Unit scope source snapshot
on:
  push:
    branches: [work/optimization]
    paths: [.github/workflows/unit-scope-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked application sources only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/pando-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pando-unit-scope-source
          path: ${{ runner.temp }}/pando-source.tar.gz
          retention-days: 3
          if-no-files-found: error
