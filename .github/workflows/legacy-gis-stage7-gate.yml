name: GIS Archived URL and Release Safety Stage 7 Gate

on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/legacy-gis-stage7-gate.yml'
      - 'tools/audit-legacy-gis-assets.mjs'
      - 'tools/audit-legacy-release-consumers.mjs'
      - 'tests/unit/legacy-gis-assets-audit.test.mjs'
      - 'tests/unit/legacy-release-consumers.test.mjs'
      - 'assets/data/world/current.json'
      - 'assets/data/world/build-input.json'
      - 'assets/data/world-preview-v*.json'
      - 'assets/data/hydro/**/manifest.json'
      - 'assets/data/terrain/**/manifest.json'
      - 'assets/js/modules/app-environment.js'
      - 'assets/js/modules/terrain-manifest.js'
      - 'scripts/generate-build-metadata.mjs'
      - 'docs/validation/data-versioning-phase7.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-consumer-audit:
    name: Cross-branch consumers, public URL and release archive evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/**/*.mjs
            /tools/**/*.js
            /tools/**/*.py
            /tools/**/*.sh
            /tests/**/*.mjs
            /tests/**/*.js
            /tests/**/*.py
            /tests/**/*.ts
            /scripts/
            /.github/workflows/*.yml
            /assets/js/
            /assets/data/world/current.json
            /assets/data/world/build-input.json
            /assets/data/world-preview-v*.json
            /assets/data/hydro/*/manifest.json
            /assets/data/terrain/*/manifest.json
            /package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact tree metadata, without historical binary checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1" \
            -o reports/stage7-tree.json
      - name: Checkout fixed App provenance manifest only
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoEditor
          ref: 20e32516d81e1249db5ee5d8f4fe4c19a01bcdc0
          path: pinned-app
          persist-credentials: false
          sparse-checkout: |
            assets/world/manifest.json
      - name: Audit regressions on small synthetic repository
        run: |
          node --check tools/audit-legacy-gis-assets.mjs
          node --check tools/audit-legacy-release-consumers.mjs
          node --test tests/unit/legacy-gis-assets-audit.test.mjs tests/unit/legacy-release-consumers.test.mjs
      - name: Audit all Web/App branches, released native artifacts and public Pages URL samples
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/audit-legacy-release-consumers.mjs \
            --root . --tree-json reports/stage7-tree.json \
            --app-manifest pinned-app/assets/world/manifest.json \
            --out reports/legacy-gis-phase7.json \
            --evidence-out reports/legacy-release-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-legacy-gis-stage7-audit
          if-no-files-found: warn
          path: |
            reports/legacy-gis-phase7.json
            reports/legacy-release-evidence.json
