# Explicit GIS/source-data reproduction; lightweight source checks remain in gis-python-p4.yml.
name: Siachen km90 Sentinel-2 focus
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
          persist-credentials: true
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies and syntax
        run: |
          pip install --quiet rasterio requests numpy shapely pyproj matplotlib
          python -m py_compile scripts/research/siachen/compare_sentinel2_km90.py
      - name: Compare two pinned Sentinel-2 scenes with OSM/DEM
        run: python scripts/research/siachen/compare_sentinel2_km90.py
      - name: Verify scene IDs and deliverables
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from report_paths import report_path
          import json
          from pathlib import Path
          p=report_path("reports/borders/reconstruction/siachen", access="read")
          a=json.loads((p/'siachen_s2_km90_corridor.json').read_text())
          assert a['years']['2025']['item_id']=='S2B_43SFV_20250923_0_L2A'
          assert a['years']['2026']['item_id']=='S2B_43SFV_20260829_0_L2A'
          for v in a['years'].values():
              assert v['local_optical_quality']['clear_fraction']>.75
              assert (p/v['overlay_image']).stat().st_size>50000
          assert len(json.loads((p/'siachen_s2_km90_corridor.geojson').read_text())['features'])==12
          print('PASS: 2025 and 2026 comparison georeferenced and source-fixed')
          PY

      - name: Resolve branch report artifacts
        run: echo "PANDO_REPORT_ARTIFACTS=$(python tools/report_paths.py reports/borders/reconstruction/siachen --access read)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: siachen-km90-optical
          path: |
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_s2_*_km90_corridor.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_s2_km90_corridor.json
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_s2_km90_corridor.geojson
            ${{ env.PANDO_REPORT_ARTIFACTS }}/README_s2_km90.md

      - name: Commit research outputs with concurrent-branch retry
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/siachen_s2_*_km90_corridor.png reports/borders/reconstruction/siachen/siachen_s2_km90_corridor.* reports/borders/reconstruction/siachen/README_s2_km90.md
          if ! git diff --cached --quiet; then
            git commit -m "research: record optical km90 anomaly crosscheck"
            for attempt in 1 2 3 4 5; do
              git fetch origin work/gis
              git rebase FETCH_HEAD
              if git push origin HEAD:work/gis; then exit 0; fi
              sleep 3
            done
            echo "Research artifact uploaded, but current branch is being changed concurrently."
            exit 1
          fi
