# Explicit GIS/source-data reproduction; lightweight source checks remain in gis-python-p4.yml.
name: Siachen terrain continuity and saddle test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax and install scientific libraries
        run: |
          python -m py_compile scripts/research/siachen/review_saltoro_terrain_continuity.py
          pip install --quiet numpy scipy shapely rasterio pyproj requests matplotlib
      - name: Compare terrain profile maxima sensitivity and pass morphologies
        run: python scripts/research/siachen/review_saltoro_terrain_continuity.py
      - name: Validate source measurements and outputs
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from report_paths import report_path
          import json
          from pathlib import Path
          path=report_path("reports/borders/reconstruction/siachen", access="read")
          v=json.loads((path/'siachen_saltoro_ridge_terrain_diagnostics.json').read_text())
          assert set(v['studies'])=={'mid_ridge_90km','sia_la','bilafond_north'}
          assert len(v['saddle_site_points'])==5
          for k in v['studies']:
              assert v['studies'][k]['stations']>=15
          assert all((path / ('siachen_terrain_90km_profile_%05d.png'%s)).stat().st_size>10000 for s in [90525,90775,91025])
          g=json.loads((path/'siachen_saltoro_ridge_terrain_diagnostics.geojson').read_text())
          assert g['type']=='FeatureCollection'
          print('PASS ridge-sensitivity tests, saddle morphology, output integrity')
          PY
      - name: Commit independent research output
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/siachen_saltoro_ridge_terrain_diagnostics.json
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/siachen_saltoro_ridge_terrain_diagnostics.geojson
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/README_saltoro_terrain_continuity.md
          node tools/library-data.mjs --store-and-stage --push -- reports/borders/reconstruction/siachen/siachen_terrain_90km_profile_*.png
          if ! git diff --cached --quiet; then
            git commit -m "research: save Saltoro DEM crest and pass-saddle diagnostic"
            git fetch origin work/gis
            git rebase origin/work/gis
            git push origin HEAD:work/gis
          fi
      - name: Resolve branch report artifacts
        run: echo "PANDO_REPORT_ARTIFACTS=$(python tools/report_paths.py reports/borders/reconstruction/siachen --access read)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: siachen-ridge-saddle-review
          path: |
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_saltoro_ridge_terrain_diagnostics.*
            ${{ env.PANDO_REPORT_ARTIFACTS }}/siachen_terrain_90km_profile_*.png
            ${{ env.PANDO_REPORT_ARTIFACTS }}/README_saltoro_terrain_continuity.md
