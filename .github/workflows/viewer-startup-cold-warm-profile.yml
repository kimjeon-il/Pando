name: Viewer first visit vs reload startup performance profile
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/viewer-startup-cold-warm-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure three independent cold-browser and warm-reload pairs
        shell: bash
        run: |
          node --input-type=module <<'PANDO_STARTUP_PROFILE'
          import { chromium } from '@playwright/test';
          import { spawn, execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const pin=JSON.parse(readFileSync('config/library-data.json','utf8')).revision;
          const report={schema:'pando-startup-cold-warm-v1',sha,pin,environment:'Ubuntu/Chromium/SwiftShader WebGL2, 1280x800; local pinned test server; fresh browser per cold/warm pair; warm reload retains HTTP/CacheStorage',pairs:[]};
          const port=4173,addr='http://127.0.0.1:'+port+'/?debug=1&renderer=webgl2',round=n=>Number.isFinite(n)?Math.round(n*10)/10:null;
          const median=a=>{a=[...a].filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;return a.length%2?a[a.length>>1]:(a[a.length/2-1]+a[a.length/2])/2;};
          const init=()=>{
           const metrics={bootStartAt:performance.now(),coreReadyAt:null,amounts:{},events:[],add(k,ms,bytes){
             const s=(this.amounts[k]||={count:0,totalMs:0,bytes:0});
             s.count++;s.totalMs+=ms;if(Number.isFinite(bytes))s.bytes+=bytes;
           }};
           Object.defineProperty(globalThis,'__pandoPerfColdWarm',{value:metrics,configurable:true});
           let core;
           Object.defineProperty(globalThis,'PandoLabSphericalCore',{configurable:true,get(){return core},set(v){core=v;metrics.coreReadyAt=performance.now();}});
           for(const name of ['instantiate','instantiateStreaming','compile','compileStreaming']){
             const original=WebAssembly[name];if(typeof original!=='function')continue;
             WebAssembly[name]=async function(...args){const st=performance.now();try{return await original.apply(this,args);}finally{metrics.add('wasm-'+name,performance.now()-st);}};
           }
           const digest=SubtleCrypto.prototype.digest;
           SubtleCrypto.prototype.digest=async function(...args){const st=performance.now();try{return await digest.apply(this,args);}finally{metrics.add('integrity-hash',performance.now()-st,args[1]?.byteLength);}};
           if(globalThis.Cache?.prototype?.match){const nativeMatch=Cache.prototype.match;
             Cache.prototype.match=async function(...args){const st=performance.now(),v=await nativeMatch.apply(this,args);
               metrics.add(v?'cache-hit':'cache-miss',performance.now()-st);return v;};}
           const parse=JSON.parse;
           JSON.parse=function(value,...args){const st=performance.now(),out=parse.call(this,value,...args);
             if(typeof value==='string'&&value.length>4096)metrics.add('large-json-parse',performance.now()-st,value.length);
             return out;};
           const stringify=JSON.stringify;
           JSON.stringify=function(value,...args){const project=!!value&&typeof value==='object'&&Array.isArray(value.territorialEntities)&&!!value.timelineRecords;
             const st=performance.now(),out=stringify.call(this,value,...args);
             if(project)metrics.add('project-stringify',performance.now()-st,out?.length);return out;};
           const clone=globalThis.structuredClone;
           if(typeof clone==='function')globalThis.structuredClone=function(...args){const st=performance.now();
             try{return clone.apply(this,args);}finally{metrics.add('structured-clone',performance.now()-st);}};
           const encoded=TextEncoder.prototype.encode;
           TextEncoder.prototype.encode=function(arg){const st=performance.now(),v=encoded.call(this,arg);
             if(v.byteLength>1e6)metrics.add('large-text-encode',performance.now()-st,v.byteLength);return v;};
           const decodedStreams=new WeakSet(),decodedResponses=new WeakSet(),pipe=ReadableStream.prototype.pipeThrough;
           ReadableStream.prototype.pipeThrough=function(transform,...args){const v=pipe.call(this,transform,...args);
             if(typeof DecompressionStream==='function'&&transform instanceof DecompressionStream)decodedStreams.add(v);
             return v;};
           const ResponseClass=globalThis.Response;
           globalThis.Response=new Proxy(ResponseClass,{construct(target,args,newTarget){const v=Reflect.construct(target,args,newTarget);
             if(args[0]&&typeof args[0]==='object'&&decodedStreams.has(args[0]))decodedResponses.add(v);
             return v;}});
           const ab=ResponseClass.prototype.arrayBuffer;
           ResponseClass.prototype.arrayBuffer=async function(...args){if(!decodedResponses.has(this))return ab.apply(this,args);
             const st=performance.now();try{const v=await ab.apply(this,args);
               metrics.add('gzip-decompress-and-collect',performance.now()-st,v.byteLength);return v;
             }catch(e){metrics.add('gzip-failed',performance.now()-st);throw e;}};
           for(const Ctor of [globalThis.WebGLRenderingContext,globalThis.WebGL2RenderingContext]){
             if(!Ctor?.prototype)continue;
             for(const name of ['bufferData','bufferSubData']){
               const d=Object.getOwnPropertyDescriptor(Ctor.prototype,name);if(typeof d?.value!=='function'||!d.configurable)continue;
               Object.defineProperty(Ctor.prototype,name,{...d,value:function(...args){const st=performance.now();
                 try{return d.value.apply(this,args);}finally{const x=args[name==='bufferData'?1:2];
                   metrics.add('webgl-buffer-submit',performance.now()-st,typeof x==='number'?x:x?.byteLength);
                 }}});
             }
           }
          };
          async function startServer(){
           const s=spawn(process.execPath,['tests/browser/server.mjs'],{env:{...process.env,PANDOLAB_TEST_PORT:String(port)},stdio:['ignore','pipe','pipe']});
           let last='';
           for(const stream of [s.stdout,s.stderr])stream.on('data',c=>{last=(last+String(c)).slice(-3000)});
           for(let n=0;n<600;n++){
             if(s.exitCode!==null)throw Error('Server failed: '+last);
             try{const r=await fetch('http://127.0.0.1:'+port+'/',{signal:AbortSignal.timeout(1500)});if(r.ok)return s;}catch{}
             await sleep(350);
           }
           throw Error('Server timeout: '+last);
          }
          const ready=async page=>page.waitForFunction(()=>{
           const x=window.__PANDOLAB_VIEWER__,s=x?.rendererStats?.();
           return !!s&&s.projectGeneration>0&&s.canonicalMeshReady===true&&s.countriesPublishedGeneration===s.projectGeneration
            &&document.getElementById('viewerStatus')?.dataset.ready==='true';
          },null,{timeout:180000,polling:300});
          const snapshot=async(page,label,elapsedMs)=>page.evaluate(({label,elapsedMs})=>{
           const p=window.__pandoPerfColdWarm,rs=performance.getEntriesByType('resource'),s=window.__PANDOLAB_VIEWER__?.rendererStats?.()||{};
           const group=(filter)=>{
             const a=rs.filter(e=>filter(e.name));
             return {requests:a.length,transferredBytes:a.reduce((n,e)=>n+e.transferSize,0),
               firstMs:a.length?Math.min(...a.map(e=>e.startTime)):null,
               lastMs:a.length?Math.max(...a.map(e=>e.responseEnd)):null,
               example:a.slice(0,4).map(e=>e.name.split('/').slice(-3).join('/'))};
           };
           return {label,elapsedMs,coreReadyMs:p.coreReadyAt===null?null:p.coreReadyAt-p.bootStartAt,
             measurements:Object.fromEntries(Object.entries(p.amounts).map(([k,v])=>[k,{count:v.count,totalMs:v.totalMs,bytes:v.bytes}])),
             resources:{engine:group(x=>/pandoeditor-core\.(js|wasm|manifest\.json)/.test(x)),
               country:group(x=>/builtin-world|country-files|world-country|territorial-library/.test(x)),
               physical:group(x=>/hydro|terrain|physical-land|prepared-polygons/.test(x))},
             renderer:{backend:s.renderer,mesh:s.lastMeshPreparation||null,
               firstBackgroundMs:s.firstBackgroundFrameMs??null,firstCountryMs:s.firstCountryPublishedMs??null,
               canonicalMeshReady:s.canonicalMeshReady,readiness:s.mapReadiness?.status??null,
               firstCountryDrawCalls:s.webGlFirstCountrySceneDrawCalls??null},
             browserNavigation:performance.getEntriesByType('navigation').map(e=>({domInteractiveMs:e.domInteractive,responseEndMs:e.responseEnd})),
           };
          },{label,elapsedMs});
          let server;
          try{
           server=await startServer();
           for(let pair=1;pair<=3;pair++){
            let browser;
            try{
             browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-gpu-sandbox']});
             const context=await browser.newContext({viewport:{width:1280,height:800},locale:'ko-KR',timezoneId:'Asia/Seoul'});
             const page=await context.newPage(),errors=[],requests=[];
             page.on('requestfinished',req=>requests.push(req));
             page.on('pageerror',e=>errors.push(e.message));
             await page.addInitScript(init);
             await page.clock.setFixedTime(new Date('2026-11-08T03:00:00+09:00'));
             await page.emulateMedia({colorScheme:'light',reducedMotion:'reduce'});
             const result={pair,browser:browser.version(),samples:[],errors};
             for(const label of ['cold-first-visit','warm-reload']){
               const st=Date.now(),requestStart=requests.length;
               if(label==='cold-first-visit')await page.goto(addr,{waitUntil:'domcontentloaded',timeout:120000});
               else await page.reload({waitUntil:'domcontentloaded',timeout:120000});
               await ready(page);
               const row=await snapshot(page,label,Date.now()-st);
               const networkRows=await Promise.all(requests.slice(requestStart).map(async req=>{
                 let sizes=null;try{sizes=await req.sizes();}catch{}
                 return {path:new URL(req.url()).pathname,bodyBytes:sizes?.responseBodySize??null};
               }));
               const group=filter=>{const a=networkRows.filter(x=>filter(x.path));
                 return {requests:a.length,bodyBytes:a.every(x=>x.bodyBytes!==null)?a.reduce((n,x)=>n+x.bodyBytes,0):null,
                   examples:[...new Set(a.map(x=>x.path))].slice(0,8)};};
               row.network={allCount:networkRows.length,
                 engine:group(x=>/pandoeditor-core|\/wasm\//.test(x)),
                 country:group(x=>/builtin-world|country-files|world-country|\/countries\//.test(x)),
                 data:group(x=>/\/data\/|\.gz$/.test(x)),
                 otherDataSample:[...new Set(networkRows.filter(x=>/asset|data|world|country|wasm|core/i.test(x.path)).map(x=>x.path))].slice(0,15)};
               result.samples.push(row);
               console.log('PANDO_STARTUP_SAMPLE '+JSON.stringify({pair,label,totalMs:row.elapsedMs,
                 coreReadyMs:round(row.coreReadyMs),meshMs:round(row.renderer.mesh?.totalMs),
                 gzipMs:round(row.measurements['gzip-decompress-and-collect']?.totalMs),
                 parseMs:round(row.measurements['large-json-parse']?.totalMs),
                 projectStringifyMs:round(row.measurements['project-stringify']?.totalMs),
                 cloneMs:round(row.measurements['structured-clone']?.totalMs),
                 gpuBufferSubmitMs:round(row.measurements['webgl-buffer-submit']?.totalMs),
                 countryAssets:row.resources.country.requests,countryTransfer:row.resources.country.transferredBytes,
                 engineAssets:row.resources.engine.requests,engineTransfer:row.resources.engine.transferredBytes,
                 firstCountryMs:row.renderer.firstCountryMs,cacheHits:row.measurements['cache-hit']?.count??null,
                 cacheMisses:row.measurements['cache-miss']?.count??null,network:row.network}));
             }
             report.pairs.push(result);
             if(errors.length)throw Error('Browser errors: '+errors.join('; ').slice(0,500));
            }catch(e){report.pairs.push({pair,error:String(e?.stack||e).slice(0,1500)});}
            finally{try{await browser?.close()}catch{}}
           }
           const good=report.pairs.filter(x=>x.samples?.length===2);
           report.summary={validPairs:good.length,
             coldMedianMs:median(good.map(x=>x.samples[0].elapsedMs)),
             warmMedianMs:median(good.map(x=>x.samples[1].elapsedMs)),
             coldRangeMs:good.length?[Math.min(...good.map(x=>x.samples[0].elapsedMs)),Math.max(...good.map(x=>x.samples[0].elapsedMs))]:null,
             warmRangeMs:good.length?[Math.min(...good.map(x=>x.samples[1].elapsedMs)),Math.max(...good.map(x=>x.samples[1].elapsedMs))]:null};
           console.log('PANDO_STARTUP_SUMMARY '+JSON.stringify(report.summary));
           report.status=good.length===3?'passed':'incomplete';
          }catch(e){report.status='failed';report.error=String(e?.stack||e).slice(0,2000);}
          finally{
           writeFileSync(process.env.RUNNER_TEMP+'/startup-profile.json',JSON.stringify(report,null,2)+'\n');
           if(server){server.kill('SIGTERM');await Promise.race([new Promise(r=>server.once('exit',r)),sleep(5000)]);if(server.exitCode===null)server.kill('SIGKILL');}
          }
          if(report.status!=='passed')process.exitCode=1;
          PANDO_STARTUP_PROFILE
      - name: Preserve full measurements (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-cold-warm-${{ github.sha }}
          path: ${{ runner.temp }}/startup-profile.json
          if-no-files-found: warn
          retention-days: 14
