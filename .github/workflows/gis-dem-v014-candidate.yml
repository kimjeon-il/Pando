name: "[HISTORICAL] GIS v0.14.0 DEM sample compression then complete 1280-tile candidate"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pando-dem-v014-work-gis
  cancel-in-progress: false
jobs:
  sample-then-full:
    if: github.repository == 'kimjeon-il/Pando' && github.ref == 'refs/heads/work/gis'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check isolated work branch, write permission, source tooling and free space
        env:
          LIBRARY_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$LIBRARY_TOKEN" || { echo 'Missing scoped library writer credential'; exit 1; }
          test "$(git branch --show-current)" = 'work/gis'
          node --check tools/gis/terrain-dem-v014-candidate.mjs
          available=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          test "$available" -ge 10737418240 || { echo 'Need at least 10 GiB available'; exit 1; }
      - name: Check out immutable v0.13.3 baseline only
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: 5541047dca60bcb1a7cfac6f2b208ff91e8a5b19
          path: .pando-dem-baseline
          persist-credentials: false
          filter: blob:none
          sparse-checkout: terrain/v0.13.3
      - name: Pinned CI GDAL environment
        uses: mamba-org/setup-micromamba@v3
        id: gdal
        with:
          environment-name: terrain-v014-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build the existing source-verified DEM and WebP tools on CI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build gdal-bin
          gdal_sdk='${{ steps.gdal.outputs.environment-path }}'
          echo "LD_LIBRARY_PATH=$gdal_sdk/lib" >> "$GITHUB_ENV"
          cmake -S tools/cpp -B build-native/p1-map-image -G Ninja -DCMAKE_BUILD_TYPE=Release -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          cmake --build build-native/p1-map-image --target pando-map-image --parallel 2
          node tools/map-image/package-native.mjs --binary build-native/p1-map-image/pando-map-image --directory build-native/p1-map-image/artifact
          cmake -S tools/cpp/terrain-dem-raster -B build-native/p1-dem-raster -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$gdal_sdk"
          cmake --build build-native/p1-dem-raster --target pando-terrain-dem-raster --parallel 2
          node tools/gis/package-terrain-dem-raster.mjs --binary build-native/p1-dem-raster/pando-terrain-dem-raster --directory build-native/p1-dem-raster/artifact
          cmake -S tools/cpp/terrain-dem-encode -B build-native/p1-dem-encode -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native/p1-dem-encode --target pando-terrain-dem-encode --parallel 2
          node tools/gis/package-terrain-dem-encode.mjs --binary build-native/p1-dem-encode/pando-terrain-dem-encode --directory build-native/p1-dem-encode/artifact
          cmake -S tools/cpp/terrain-dem-check -B build-native/p1-dem-check -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native/p1-dem-check --target pando-terrain-dem-check --parallel 2
          node tools/gis/package-terrain-dem-check.mjs --binary build-native/p1-dem-check/pando-terrain-dem-check --directory build-native/p1-dem-check/artifact
      - name: Fetch NOAA float32 source and verify official SHA256
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --connect-timeout 30 --max-time 1800 --max-filesize 1700000000 \
            https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO2022/data/30s/30s_surface_elev_gtif/ETOPO_2022_v1_30s_N90W180_surface.tif \
            --output "$RUNNER_TEMP/etopo.tif"
          echo "8630abc401cc6bdd30b507a68d3eb9eda5b65f5636f7199e4b1eefd476b5a9e2  $RUNNER_TEMP/etopo.tif" | sha256sum -c -
      - name: Representative compression/quality test, eight tiles only
        env:
          PANDO_MAP_IMAGE_ARTIFACT: build-native/p1-map-image/artifact
          PANDO_TERRAIN_DEM_RASTER_DIRECTORY: build-native/p1-dem-raster/artifact
          PANDO_TERRAIN_DEM_ENCODE_DIRECTORY: build-native/p1-dem-encode/artifact
        run: |
          mkdir -p "$RUNNER_TEMP/terrain-v014-proof"
          node tools/gis/terrain-dem-v014-candidate.mjs \
            --mode sample --etopo "$RUNNER_TEMP/etopo.tif" \
            --baseline .pando-dem-baseline/terrain/v0.13.3 \
            --output "$RUNNER_TEMP/terrain-v014-sample" \
            --report "$RUNNER_TEMP/terrain-v014-proof/sample.json"
      - name: Produce LOD 0-5 complete candidate after successful sample
        env:
          PANDO_MAP_IMAGE_ARTIFACT: build-native/p1-map-image/artifact
          PANDO_TERRAIN_DEM_RASTER_DIRECTORY: build-native/p1-dem-raster/artifact
          PANDO_TERRAIN_DEM_ENCODE_DIRECTORY: build-native/p1-dem-encode/artifact
        run: |
          node tools/gis/terrain-dem-v014-candidate.mjs \
            --mode full --sample-report "$RUNNER_TEMP/terrain-v014-proof/sample.json" \
            --etopo "$RUNNER_TEMP/etopo.tif" \
            --baseline .pando-dem-baseline/terrain/v0.13.3 \
            --output "$RUNNER_TEMP/terrain-v014-full" \
            --report "$RUNNER_TEMP/terrain-v014-proof/full.json"
      - name: Final native 1280-tile SHA256, gutter, altitude and unchanged B-channel validation
        env:
          PANDO_MAP_IMAGE_ARTIFACT: build-native/p1-map-image/artifact
          PANDO_TERRAIN_DEM_CHECK_DIRECTORY: build-native/p1-dem-check/artifact
          PANDO_GDAL_LOCATIONINFO: gdallocationinfo
        run: |
          set -euo pipefail
          node tools/checks/verify-terrain-dem.mjs --etopo "$RUNNER_TEMP/etopo.tif" \
            --output "$RUNNER_TEMP/terrain-v014-full" \
            --reference-output .pando-dem-baseline/terrain/v0.13.3 \
            > "$RUNNER_TEMP/terrain-v014-proof/native-final.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {validateTerrainManifest} from './src/data/terrain-manifest.js';
          const root=process.env.RUNNER_TEMP;
          const m=validateTerrainManifest(JSON.parse(readFileSync(root+'/terrain-v014-full/manifest.json','utf8')));
          const r=JSON.parse(readFileSync(root+'/terrain-v014-proof/full.json','utf8'));
          if(m.version!=='0.14.0'||r.assetsSha256!==m.assetsSha256||r.stats.tiles!==1280)throw Error('Candidate integrity mismatch');
          console.log('FULL_CANDIDATE_SHA='+m.assetsSha256);
          JS
      - name: Check out library work/gis writing target without existing raster binaries
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: work/gis
          path: .pando-dem-writer
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: Store validated new edition only on library work/gis, never main
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          writer=.pando-dem-writer
          test -z "$(git -C "$writer" status --porcelain)"
          test ! -e "$writer/terrain/v0.14.0"
          mkdir -p "$writer/terrain"
          cp -a "$RUNNER_TEMP/terrain-v014-full" "$writer/terrain/v0.14.0"
          git -C "$writer" add --sparse -- terrain/v0.14.0
          test "$(git -C "$writer" diff --cached --name-only | wc -l)" -eq 1282
          git -C "$writer" diff --cached --check
          test "$(git -C "$writer" diff --cached --name-only | grep -vc '^terrain/v0.14.0/')" -eq 0
          git -C "$writer" -c user.name='Pando GIS candidate' -c user.email='pando-gis@users.noreply.github.com' \
            commit -m 'data(terrain): store complete verified DEM v0.14.0 candidate'
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const token=process.env.PANDOLAB_LIBRARY_WRITE_TOKEN;
          assert(token,'Library write permission missing');
          const env={...process.env,GIT_CONFIG_COUNT:'1',
            GIT_CONFIG_KEY_0:'http.https://github.com/.extraheader',
            GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+Buffer.from('x-access-token:'+token).toString('base64')};
          const git=args=>execFileSync('git',['-C','.pando-dem-writer',...args],{env,encoding:'utf8',timeout:300000}).trim();
          const head=git(['rev-parse','HEAD']);
          git(['push','origin','HEAD:refs/heads/work/gis']);
          const readback=git(['ls-remote','--exit-code','origin','refs/heads/work/gis']).split(/\s+/)[0];
          assert.equal(readback,head,'Published candidate data SHA mismatch');
          writeFileSync(process.env.RUNNER_TEMP+'/terrain-v014-proof/data-branch-sha.txt',head+'\n');
          console.log('VERIFIED_DATA_BRANCH_HEAD='+head);
          JS
      - name: Retain concise comparison and verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-v014-compression-and-full-candidate-proof
          path: ${{ runner.temp }}/terrain-v014-proof/*
          if-no-files-found: warn
          retention-days: 21
