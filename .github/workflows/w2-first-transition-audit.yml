name: W2 Windows first-switch trace retrospective
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/w2-first-transition-audit.yml
      - tools/w2-first-transition-audit.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w2-first-transition-audit-work-ui
  cancel-in-progress: true
jobs:
  retrospective:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      W2_ARCHIVE: .w2-library/reports/development/performance/w1-windows-gpu-2026-11-02/measurement
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout exact W1 Windows evidence revision read-only
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: fd58c91c2bb944e338c026add222788373ba2ffd
          path: .w2-library
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            reports/development/performance/w1-windows-gpu-2026-11-02/measurement
      - name: Require archived Windows trace and matching source/data pins
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/w2-first-transition-audit.mjs
          test -s "$W2_ARCHIVE/analysis.json"
          test -s "$W2_ARCHIVE/report-win32.json"
          test -s "$W2_ARCHIVE/default-trace.json.gz"
          test -s "$W2_ARCHIVE/default-retest-trace.json.gz"
          test -s "$W2_ARCHIVE/swiftshader-trace.json.gz"
      - name: Reconstruct exact first frame and Worker overlap
        shell: bash
        run: |
          node --max-old-space-size=4096 --expose-gc tools/w2-first-transition-audit.mjs "$W2_ARCHIVE" test-results/w2-retrospective
      - name: Keep bounded retrospective evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-first-transition-audit
          path: test-results/w2-retrospective/
          if-no-files-found: warn
          retention-days: 7
