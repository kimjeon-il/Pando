name: UI prebuilt mesh scoped verification
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/ui-prebuilt-mesh-focused.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ui-readonly-integration, cancel-in-progress: false}
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: work/ui, persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Connect the existing runtime and scheduler owners
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/ui-runtime"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-runtime/start"
          node tools/ui-runtime-integration.mjs
          git diff --check
      - name: Verify compiled identity, worker lifetime, cancellation and bounded uploads
        env:
          CHECK_SELECTION: '{"unitTests":["tests/unit/runtime/core-module-sharing.test.mjs","tests/unit/runtime/core-wasm-loader.test.mjs","tests/unit/runtime/background-startup-recovery.test.mjs","tests/unit/rendering/gpu-upload-budget.test.mjs","tests/unit/rendering/gpu-resource-owners.test.mjs","tests/unit/document/core-document-client.test.mjs","tests/unit/app/viewer-bootstrap-recovery.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase non-browser | tee "$RUNNER_TEMP/ui-runtime/unit.log"
      - name: Commit the verified runtime change without modifying data or main
        run: |
          test "$(git ls-remote origin refs/heads/work/ui | cut -f1)" = "$(cat "$RUNNER_TEMP/ui-runtime/start")"
          git add src/rendering/gpu-upload-scheduler.js src/rendering/gpu-worker-channels.js src/document/core-document-client.js src/app/viewer.js src/rendering/gpu-resource-lifecycle.js src/rendering/gpu-map-renderer.js tests/unit/rendering/gpu-resource-owners.test.mjs tests/browser/runtime/viewer-readonly-startup.spec.mjs
          git diff --cached --check
          git -c user.name='Pando Viewer implementation' -c user.email='viewer@users.noreply.github.com' commit -m 'perf(runtime): reuse compiled Core and consume bounded GPU upload budgets per frame'
          git push origin HEAD:refs/heads/work/ui
          test "$(git ls-remote origin refs/heads/work/ui | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-runtime/commit"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify actual startup, engine requests, GPU receipts and dated-map return
        env:
          CHECK_SELECTION: '{"unitTests":[],"browserSpecs":["tests/browser/runtime/viewer-readonly-startup.spec.mjs","tests/browser/rendering/country-prepared-scene.spec.mjs","tests/browser/rendering/viewer-gpu-backend-cross.spec.mjs"],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase browser | tee "$RUNNER_TEMP/ui-runtime/browser.log"
      - name: Retain exact source and meaningful measurement evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ui-runtime"
          git diff HEAD --binary > "$RUNNER_TEMP/ui-runtime/pending.patch"
          git bundle create "$RUNNER_TEMP/ui-runtime/increment.bundle" HEAD ^c55de747c224eeddea48d1bd6db7eb6f1a37f2df
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui-runtime/
            test-results/
          if-no-files-found: warn
          retention-days: 7
