name: UI prebuilt mesh scoped verification
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/ui-prebuilt-mesh-focused.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ui-readonly-prepared-scene
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ui
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/library-data
      - name: Apply the exact implementation already verified by 58 unit checks
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {parse} from 'yaml';
          import {execFileSync} from 'node:child_process';
          const workflow=parse(execFileSync('git',['show','420b76dd36872ec9850563ee771d1aa51e6908b2:.github/workflows/ui-prebuilt-mesh-focused.yml'],{encoding:'utf8'}));
          const step=workflow.jobs.implement.steps.find(x=>x.name==='Integrate reviewed existing scene implementation, replacing the ineffective UI guard');
          if(!step?.run)throw Error('Reviewed implementation script missing');
          execFileSync('bash',['-euo','pipefail','-c',step.run],{stdio:'inherit'});
          JS
      - name: Verify exact slot, geometry, packet, cancellation and existing mesh behavior
        env:
          CHECK_SELECTION: '{"unitTests":["tests/unit/rendering/prepared-country-scene.test.mjs","tests/unit/data/builtin-mesh-resource.test.mjs","tests/unit/rendering/country-mesh-preparation.test.mjs","tests/unit/rendering/gpu-country-mesh-variants.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase non-browser
      - name: Build only the initial scene derivative without regenerating GIS
        shell: bash
        run: |
          node scripts/check-core-prerequisite.mjs
          node tools/build/build-prepared-country-scene.mjs --month=2026-11 | tee "$RUNNER_TEMP/ui-stage0/generation.txt"
      - name: Reconcile reviewed archive history and publish only the prepared world scope
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        shell: bash
        run: |
          test -n "$PANDOLAB_LIBRARY_WRITE_TOKEN"
          node tools/review-ui-data-history.mjs --integrate
          node tools/data/library-data.mjs --store --push --include-prefix=assets/data/world
          cat config/library-data.json > "$RUNNER_TEMP/ui-stage0/paired-data.json"
      - name: Commit source and verified remote data pin on work/ui only
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/work/ui | cut -f1)" = "$(cat "$RUNNER_TEMP/ui-stage0/starting-head")"
          git add src/rendering/country-mesh-codec.js src/rendering/country-mesh-preparation.js src/rendering/country-mesh-content-key.js src/data/world-bundle-manifest.js src/data/builtin-mesh-resource.js src/data/workers/data-loader-worker.js src/rendering/gpu-map-renderer.js src/app/viewer-map.js tools/build/build-prepared-country-scene.mjs tools/build/build-world-bundle.mjs tests/unit/rendering/prepared-country-scene.test.mjs tests/unit/data/builtin-mesh-resource.test.mjs tests/unit/rendering/gpu-country-mesh-variants.test.mjs tests/browser/rendering/country-prepared-scene.spec.mjs docs/superpowers/plans/2026-11-08-prepared-country-scene.md config/library-data.json tests/unit/rendering/builtin-mesh-scene-selection.test.mjs tests/unit/rendering/prepared-country-part.test.mjs
          git diff --cached --check
          git -c user.name='Pando Viewer implementation' -c user.email='viewer@users.noreply.github.com' commit -m 'perf(viewer): consume exact precomputed initial mesh, shared borders and spatial index'
          git push origin HEAD:refs/heads/work/ui
          test "$(git ls-remote origin refs/heads/work/ui | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ui-stage0/committed-source"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify cold, cached reload and date return actually use the prepared scene
        env:
          CHECK_SELECTION: '{"unitTests":[],"browserSpecs":["tests/browser/runtime/viewer-readonly-startup.spec.mjs","tests/browser/rendering/country-prepared-scene.spec.mjs"],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase browser
      - name: Preserve exact task changes and test evidence even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-stage0"
          git diff HEAD --binary > "$RUNNER_TEMP/ui-stage0/pending.patch"
          git status --short > "$RUNNER_TEMP/ui-stage0/status.txt"
          git bundle create "$RUNNER_TEMP/ui-stage0/source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-stage0-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui-stage0/
            ${{ runner.temp }}/ui-data-history.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
