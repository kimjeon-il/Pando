name: UI prebuilt mesh scoped verification
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/ui-prebuilt-mesh-focused.yml']
  workflow_dispatch:
permissions: {contents: write}
defaults:
  run:
    shell: bash
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: work/ui, persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply exact regression fixes to current source and test ports
        run: |
          node --input-type=module <<'JS'
          import {parse} from 'yaml';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          const workflow=parse(execFileSync('git',['show','8dcddd9d4af01e588e565401ee014feb86b77651:.github/workflows/ui-prebuilt-mesh-focused.yml'],{encoding:'utf8'}));
          execFileSync('bash',['-euo','pipefail','-c',workflow.jobs.acceptance.steps.find(step=>step.name==='Update precise test ports without changing production expectations').run],{stdio:'inherit'});
          const replace=(file,before,after)=>{const s=readFileSync(file,'utf8');if(!s.includes(before))throw Error('Changed source: '+file);writeFileSync(file,s.replace(before,after));};
          replace('src/runtime/core-wasm-loader.js',"const enabled=typeof worker.document==='undefined'&&typeof worker.postMessage==='function'\n    &&new URL(worker.location.href)","const enabled=typeof worker.document==='undefined'&&typeof worker.postMessage==='function'\n    &&typeof worker.location?.href==='string'&&new URL(worker.location.href)");
          replace('tests/unit/app/viewer-bootstrap-recovery.test.mjs',`.replace("import('./modules/viewer-composition.js')",'importViewer()')`,`.replace('import("./viewer-composition.js")','importViewer()')`);
          replace('tests/unit/rendering/country-mesh-preparation.test.mjs','globalThis.Worker = class { constructor(){this.sent=[];workers.push(this);}','globalThis.Worker = class extends EventTarget { constructor(){super();this.sent=[];workers.push(this);}');
          replace('tests/unit/rendering/country-mesh-preparation.test.mjs','state, runtimeAssetUrl: path => path, scheduleGpuFrame:','state, runtimeAssetUrl: path => new URL(path,\'https://test.local/assets/js/\'), scheduleGpuFrame:');
          appendFileSync('tests/unit/runtime/core-module-sharing.test.mjs',`\ntest('Node transport postMessage without a browser worker URL never requests a shared module',async t=>{\n  const prior=Object.getOwnPropertyDescriptor(globalThis,'postMessage');\n  Object.defineProperty(globalThis,'postMessage',{configurable:true,value(){assert.fail('standalone Node worker requested a browser package');}});\n  t.after(()=>{if(prior)Object.defineProperty(globalThis,'postMessage',prior);else delete globalThis.postMessage;});\n  const f=await fixture();await loader.loadVerifiedCore(f.options);\n  assert.equal(f.instances.length,1);assert.equal(f.fetched.length,3);\n});\n`);
          JS
          git diff --check
      - name: Verify all affected mesh, read-index, worker and upload contracts
        env:
          CHECK_SELECTION: '{"unitTests":["tests/unit/rendering/prepared-country-scene.test.mjs","tests/unit/data/builtin-mesh-resource.test.mjs","tests/unit/rendering/country-mesh-preparation.test.mjs","tests/unit/rendering/gpu-country-mesh-variants.test.mjs","tests/unit/data/builtin-read-index.test.mjs","tests/unit/data/builtin-world-loader.test.mjs","tests/unit/data/builtin-country-loading.test.mjs","tests/unit/data/builtin-country-parts.test.mjs","tests/unit/runtime/core-module-sharing.test.mjs","tests/unit/runtime/core-wasm-loader.test.mjs","tests/unit/runtime/background-startup-recovery.test.mjs","tests/unit/rendering/gpu-upload-budget.test.mjs","tests/unit/rendering/gpu-resource-owners.test.mjs","tests/unit/document/core-document-client.test.mjs","tests/unit/app/viewer-bootstrap-recovery.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: |
          set -o pipefail
          node scripts/run-application-checks.mjs --phase non-browser | tee "$RUNNER_TEMP/ui-final/unit.log"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify real country and border frames, engine requests and date return
        env:
          CHECK_SELECTION: '{"unitTests":[],"browserSpecs":["tests/browser/runtime/viewer-readonly-startup.spec.mjs","tests/browser/rendering/country-prepared-scene.spec.mjs"],"commands":[],"prerequisites":[]}'
        run: |
          set -o pipefail
          node scripts/run-application-checks.mjs --phase browser | tee "$RUNNER_TEMP/ui-final/browser.log"
      - name: Commit verified fixes and retain only the fail-fast read-only acceptance workflow
        run: |
          test "$(git ls-remote origin refs/heads/work/ui | cut -f1)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const file='.github/workflows/ui-prebuilt-mesh-focused.yml';
          let source=execFileSync('git',['show','00001717ff698224e47664d1302066d29c8db087:'+file],{encoding:'utf8'});
          source=source.replace('permissions: {contents: read}','permissions: {contents: read}\ndefaults:\n  run:\n    shell: bash');
          writeFileSync(file,source);
          JS
          git add src/runtime/core-wasm-loader.js tests/unit/runtime/core-module-sharing.test.mjs tests/unit/rendering/country-mesh-preparation.test.mjs tests/unit/app/viewer-bootstrap-recovery.test.mjs tests/unit/rendering/gpu-resource-owners.test.mjs tests/unit/runtime/background-startup-recovery.test.mjs .github/workflows/ui-prebuilt-mesh-focused.yml
          git diff --cached --check
          git -c user.name='Pando Viewer implementation' -c user.email='viewer@users.noreply.github.com' commit -m 'fix(runtime): preserve standalone Node loading and verify all current Viewer test ports [skip ci]'
          git push origin HEAD:refs/heads/work/ui
          test "$(git ls-remote origin refs/heads/work/ui | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-final/commit"
          cat config/library-data.json > "$RUNNER_TEMP/ui-final/data-pin.json"
      - name: Preserve actual source and measurement evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ui-final"
          git diff HEAD --binary > "$RUNNER_TEMP/ui-final/pending.patch"
          git bundle create "$RUNNER_TEMP/ui-final/source.bundle" HEAD ^c55de747c224eeddea48d1bd6db7eb6f1a37f2df
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-final-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui-final/
            test-results/
          if-no-files-found: warn
          retention-days: 7
