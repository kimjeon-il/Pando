name: UI prebuilt mesh scoped verification
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/ui-prebuilt-mesh-focused.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact application history for the missing remote development workspace
        run: git bundle create "$RUNNER_TEMP/pando-ui.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ui-source-context
          path: ${{ runner.temp }}/pando-ui.bundle
          retention-days: 1
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure cold and warm actual country-frame presentation
        env:
          CHECK_SELECTION: '{"unitTests":[],"browserSpecs":["tests/browser/runtime/viewer-readonly-startup.spec.mjs"],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase browser
      - name: Preserve focused startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-baked-mesh-focused-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
