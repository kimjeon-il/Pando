name: UI prebuilt mesh scoped verification
on:
  workflow_dispatch:
permissions: {contents: read}
defaults:
  run:
    shell: bash
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare only the policy used by synthetic compiler fixtures
        run: node --input-type=module -e "import {readLibraryDataFile} from './tools/data/library-context.mjs';readLibraryDataFile('assets/data/builtin-world/display-policy-v1.json',{fetch:true});"
      - name: Verify the affected mesh, read-index, worker and upload contracts
        env:
          CHECK_SELECTION: '{"unitTests":["tests/unit/rendering/prepared-country-scene.test.mjs","tests/unit/data/builtin-mesh-resource.test.mjs","tests/unit/rendering/country-mesh-preparation.test.mjs","tests/unit/rendering/gpu-country-mesh-variants.test.mjs","tests/unit/data/builtin-read-index.test.mjs","tests/unit/data/builtin-world-loader.test.mjs","tests/unit/data/builtin-country-loading.test.mjs","tests/unit/data/builtin-country-parts.test.mjs","tests/unit/runtime/core-module-sharing.test.mjs","tests/unit/runtime/core-wasm-loader.test.mjs","tests/unit/runtime/background-startup-recovery.test.mjs","tests/unit/rendering/gpu-upload-budget.test.mjs","tests/unit/rendering/gpu-resource-owners.test.mjs","tests/unit/document/core-document-client.test.mjs","tests/unit/app/viewer-bootstrap-recovery.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase non-browser | tee "$RUNNER_TEMP/ui-contracts.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/ui-contracts.log
          retention-days: 7
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify current country and border frames, engine requests and date return
        env:
          CHECK_SELECTION: '{"unitTests":[],"browserSpecs":["tests/browser/runtime/viewer-readonly-startup.spec.mjs","tests/browser/rendering/country-prepared-scene.spec.mjs"],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase browser | tee "$RUNNER_TEMP/ui-presentation.log"
      - name: Preserve exact committed source delta and browser evidence
        if: always()
        run: git bundle create "$RUNNER_TEMP/ui-final.bundle" HEAD ^c55de747c224eeddea48d1bd6db7eb6f1a37f2df
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-presentation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui-presentation.log
            ${{ runner.temp }}/ui-final.bundle
            test-results/
          if-no-files-found: warn
          retention-days: 7
