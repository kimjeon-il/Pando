name: UI prebuilt mesh scoped verification
on:
  push:
    branches: [work/ui]
    paths: ['.github/workflows/ui-prebuilt-mesh-focused.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify compiled-code sharing, instance isolation and bounded uploads
        env:
          CHECK_SELECTION: '{"unitTests":["tests/unit/runtime/core-module-sharing.test.mjs","tests/unit/rendering/gpu-upload-budget.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs --phase non-browser
