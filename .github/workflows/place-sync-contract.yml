name: Place Sync Contract
on:
  workflow_dispatch:
  push:
    branches:
      - work/places
    paths:
      - 'reports/places/**'
      - 'contracts/places/**'
      - 'assets/js/modules/place-contract.js'
      - 'assets/js/modules/place-codec.js'
      - 'assets/js/modules/label-layout.js'
      - 'assets/js/modules/user-preferences.js'
      - 'assets/js/modules/app-map-settings.js'
      - 'tools/place-sync-cases.mjs'
      - 'tools/export-place-sync.mjs'
      - 'tests/unit/place-sync-contract.test.mjs'
      - 'package.json'
      - '.github/workflows/place-sync-contract.yml'
  pull_request:
    paths:
      - 'reports/places/**'
      - 'contracts/places/**'
      - 'assets/js/modules/place-contract.js'
      - 'assets/js/modules/place-codec.js'
      - 'assets/js/modules/label-layout.js'
      - 'assets/js/modules/user-preferences.js'
      - 'assets/js/modules/app-map-settings.js'
      - 'tools/place-sync-cases.mjs'
      - 'tools/export-place-sync.mjs'
      - 'tests/unit/place-sync-contract.test.mjs'
      - 'package.json'
      - '.github/workflows/place-sync-contract.yml'

permissions:
  contents: read

jobs:
  verify-place-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source provenance and portable wire contract
        run: npm run check:place-sync
