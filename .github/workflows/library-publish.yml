name: Publish independent library data

on:
  workflow_dispatch:
    inputs:
      sourceRepository:
        description: Private owner-library repository
        required: true
        default: kimjeon-il/Pando-library-data
        type: string
      sourceRevision:
        description: Immutable private Git commit (40 hex characters)
        required: true
        type: string
      revision:
        description: SHA-256 of the exact private library.json bytes
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate explicit pinned publication request and private read configuration
        env:
          SOURCE_REPOSITORY: ${{ inputs.sourceRepository }}
          SOURCE_REVISION: ${{ inputs.sourceRevision }}
          LIBRARY_REVISION: ${{ inputs.revision }}
          LIBRARY_READ_TOKEN: ${{ secrets.PANDO_LIBRARY_READ_TOKEN }}
        run: |
          test "$SOURCE_REPOSITORY" = 'kimjeon-il/Pando-library-data' || { echo 'Unexpected private source repository'; exit 1; }
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Source Git commit must be pinned'; exit 1; }
          [[ "$LIBRARY_REVISION" =~ ^[0-9a-f]{64}$ ]] || { echo 'Library content revision must be pinned'; exit 1; }
          test -n "$LIBRARY_READ_TOKEN" || { echo 'PANDO_LIBRARY_READ_TOKEN is not configured'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sourceRepository }}
          ref: ${{ inputs.sourceRevision }}
          token: ${{ secrets.PANDO_LIBRARY_READ_TOKEN }}
          persist-credentials: false
          path: private-library
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stage the committed public viewer before deriving data
        run: node tools/stage-monorepo-pages.mjs --root . --stage "$RUNNER_TEMP/pages-site" --manifest "$RUNNER_TEMP/pages-evidence.json"
      - name: Preserve the committed world solely for label anchor comparison
        run: git show HEAD:assets/data/territorial-entities/generated/current-world.geojson > "$RUNNER_TEMP/baseline-current-world.geojson"
      - name: Verify and materialize the pinned private source
        run: node tools/prepare-library-publication.mjs --source private-library --target "$RUNNER_TEMP/library-source" --revision '${{ inputs.revision }}' --source-revision '${{ inputs.sourceRevision }}'
      - name: Derive and validate the independent library release
        env:
          PANDOLAB_LIBRARY_SOURCE_ROOT: ${{ runner.temp }}/library-source
        run: |
          node tools/build-territorial-entity-chunks.mjs
          node tools/build-territorial-current-world.mjs
          node tools/publication-label-anchors.mjs --before "$RUNNER_TEMP/baseline-current-world.geojson" --after assets/data/territorial-entities/generated/current-world.geojson --anchors assets/data/country-label-anchors-v0.10.1.json
          node tools/build-historical-world-timeline.mjs
          node tools/build-world-mesh.mjs
          node tools/build-world-preview.mjs
          node tools/build-world-bundle.mjs
          node tools/build-country-shared-boundaries.mjs
          node tools/build-prepared-polygon-mesh.mjs
          node tools/build-territorial-entity-chunks.mjs --check
          node tools/build-territorial-current-world.mjs --check
          node tools/build-historical-world-timeline.mjs --check
          node tools/build-world-preview.mjs --check
          node tools/build-world-bundle.mjs --check
          node tools/build-country-shared-boundaries.mjs --check
      - name: Assemble and verify content-addressed public data
        run: |
          node tools/assemble-library-release.mjs --root . --output "$RUNNER_TEMP/library-release" --revision '${{ inputs.revision }}' --source-revision '${{ inputs.sourceRevision }}'
          node tools/assemble-library-release.mjs --verify --output "$RUNNER_TEMP/library-release" --revision '${{ inputs.revision }}'
      - name: Load and verify every previous public data release
        run: |
          git worktree add --detach "$RUNNER_TEMP/library-branch" HEAD
          if git ls-remote --exit-code origin refs/heads/library-data >/dev/null; then
            git fetch origin refs/heads/library-data:refs/remotes/origin/library-data
            git -C "$RUNNER_TEMP/library-branch" switch -c library-data origin/library-data
            node tools/assemble-library-release.mjs --verify-archive --output "$RUNNER_TEMP/library-branch"
            mkdir -p "$RUNNER_TEMP/pages-site/assets/data/library-releases"
            cp -a "$RUNNER_TEMP/library-branch/assets/data/library-releases/." "$RUNNER_TEMP/pages-site/assets/data/library-releases/"
          else
            git -C "$RUNNER_TEMP/library-branch" switch --orphan library-data
          fi
      - name: Verify the complete staged viewer and release compatibility
        run: |
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-channel" "$RUNNER_TEMP/pages-site/assets/data/"
          mkdir -p "$RUNNER_TEMP/pages-site/assets/data/library-releases"
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-releases/." "$RUNNER_TEMP/pages-site/assets/data/library-releases/"
          node tools/assemble-library-release.mjs --verify-archive --output "$RUNNER_TEMP/pages-site"
          node tools/check-library-release-code.mjs --site "$RUNNER_TEMP/pages-site"
      - name: Record the verified release on the public data branch
        run: |
          if test -e "$RUNNER_TEMP/library-branch/assets/data/library-releases/${{ inputs.revision }}"; then
            diff -qr "$RUNNER_TEMP/library-release/assets/data/library-releases/${{ inputs.revision }}" "$RUNNER_TEMP/library-branch/assets/data/library-releases/${{ inputs.revision }}" || { echo 'Immutable library release differs from existing publication'; exit 1; }
          fi
          mkdir -p "$RUNNER_TEMP/library-branch/assets/data/library-releases"
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-channel" "$RUNNER_TEMP/library-branch/assets/data/"
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-releases/." "$RUNNER_TEMP/library-branch/assets/data/library-releases/"
          node tools/assemble-library-release.mjs --verify-archive --output "$RUNNER_TEMP/library-branch"
          git -C "$RUNNER_TEMP/library-branch" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/library-branch" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/library-branch" add assets/data/library-channel assets/data/library-releases
          if ! git -C "$RUNNER_TEMP/library-branch" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/library-branch" commit -m "Publish library data ${{ inputs.revision }}"
            git -C "$RUNNER_TEMP/library-branch" push origin library-data:library-data
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - uses: actions/upload-artifact@v4
        with:
          name: library-publication-evidence-${{ inputs.revision }}
          path: ${{ runner.temp }}/pages-evidence.json
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
