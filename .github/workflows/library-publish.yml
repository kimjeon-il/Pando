name: Publish independent library data

on:
  workflow_dispatch:
    inputs:
      sourceRepository:
        description: Storage repository (must match config/library-data.json)
        required: true
        default: kimjeon-il/PandoLab-library-data
        type: string
      sourceRevision:
        description: Immutable source Git commit (40 hex characters)
        required: true
        type: string
      revision:
        description: SHA-256 of the exact library.json bytes
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate pinned publication request and storage write configuration
        env:
          SOURCE_REPOSITORY: ${{ inputs.sourceRepository }}
          SOURCE_REVISION: ${{ inputs.sourceRevision }}
          LIBRARY_REVISION: ${{ inputs.revision }}
          LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          test "$SOURCE_REPOSITORY" = "$(node -p 'require("./config/library-data.json").repository')" || { echo 'Unexpected library source repository'; exit 1; }
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Source Git commit must be pinned'; exit 1; }
          [[ "$LIBRARY_REVISION" =~ ^[0-9a-f]{64}$ ]] || { echo 'Library content revision must be pinned'; exit 1; }
          test -n "$LIBRARY_WRITE_TOKEN" || { echo 'PANDOLAB_LIBRARY_WRITE_TOKEN (write access to storage repository only) is not configured'; exit 1; }
      - name: Prepare paired baseline data
        uses: ./.github/actions/library-data
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sourceRepository }}
          ref: ${{ inputs.sourceRevision }}
          token: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            objects
            assets/data/library-channel
            assets/data/library-releases
          path: publication-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stage the committed public viewer before deriving data
        run: node tools/stage-monorepo-pages.mjs --root . --stage "$RUNNER_TEMP/pages-site" --manifest "$RUNNER_TEMP/pages-evidence.json"
      - name: Preserve the committed world solely for label anchor comparison
        run: cp assets/data/territorial-entities/generated/current-world.geojson "$RUNNER_TEMP/baseline-current-world.geojson"
      - name: Materialize the pinned editable source
        run: node tools/prepare-library-publication.mjs --source publication-source --target "$RUNNER_TEMP/library-source" --revision '${{ inputs.revision }}' --source-revision '${{ inputs.sourceRevision }}'
      - name: Derive the independent library release in Pando (storage has no jobs)
        env:
          PANDOLAB_LIBRARY_SOURCE_ROOT: ${{ runner.temp }}/library-source
        run: |
          node tools/build-territorial-entity-chunks.mjs
          node tools/build-territorial-current-world.mjs
          node tools/publication-label-anchors.mjs --before "$RUNNER_TEMP/baseline-current-world.geojson" --after assets/data/territorial-entities/generated/current-world.geojson --anchors assets/data/country-label-anchors-v0.10.1.json
          node tools/build-builtin-world.mjs
          node tools/build-world-mesh.mjs
          node tools/build-world-preview.mjs
          node tools/build-world-bundle.mjs
          node tools/build-country-shared-boundaries.mjs
          node tools/build-prepared-polygon-mesh.mjs
          node tools/build-territorial-entity-chunks.mjs --check
          node tools/build-territorial-current-world.mjs --check
          node tools/build-world-preview.mjs --check
          node tools/build-world-bundle.mjs --check
          node tools/build-country-shared-boundaries.mjs --check
      - name: Assemble and verify content-addressed public data
        run: |
          node tools/assemble-library-release.mjs --root . --output "$RUNNER_TEMP/library-release" --revision '${{ inputs.revision }}' --source-revision '${{ inputs.sourceRevision }}'
          node tools/assemble-library-release.mjs --verify --output "$RUNNER_TEMP/library-release" --revision '${{ inputs.revision }}'
      - name: Preserve previously published immutable releases
        run: |
          if test -d publication-source/assets/data/library-releases; then
            mkdir -p "$RUNNER_TEMP/pages-site/assets/data/library-releases"
            cp -a publication-source/assets/data/library-releases/. "$RUNNER_TEMP/pages-site/assets/data/library-releases/"
          fi
      - name: Verify the complete staged viewer and release compatibility
        run: |
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-channel" "$RUNNER_TEMP/pages-site/assets/data/"
          mkdir -p "$RUNNER_TEMP/pages-site/assets/data/library-releases"
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-releases/." "$RUNNER_TEMP/pages-site/assets/data/library-releases/"
          node tools/assemble-library-release.mjs --verify-archive --output "$RUNNER_TEMP/pages-site"
          node tools/check-library-release-code.mjs --site "$RUNNER_TEMP/pages-site"
      - name: Store the derived release in the external repository
        run: |
          DEST="publication-source/assets/data"
          if test -e "$DEST/library-releases/${{ inputs.revision }}"; then
            diff -qr "$RUNNER_TEMP/library-release/assets/data/library-releases/${{ inputs.revision }}" "$DEST/library-releases/${{ inputs.revision }}" || { echo 'Immutable release differs'; exit 1; }
          fi
          mkdir -p "$DEST/library-releases"
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-channel" "$DEST/"
          cp -a "$RUNNER_TEMP/library-release/assets/data/library-releases/." "$DEST/library-releases/"
          git -C publication-source config user.name 'github-actions[bot]'
          git -C publication-source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publication-source add --sparse assets/data/library-channel assets/data/library-releases
          if ! git -C publication-source diff --cached --quiet; then
            git -C publication-source commit -m "Store published library ${{ inputs.revision }}"
            git -C publication-source push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - uses: actions/upload-artifact@v4
        with:
          name: library-publication-evidence-${{ inputs.revision }}
          path: ${{ runner.temp }}/pages-evidence.json
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
