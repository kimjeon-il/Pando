name: German Empire 1914 historic-coast microtile evidence
on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/probe_german_empire_coast_microtiles.py
      - .github/workflows/german-empire-coast-microtiles.yml
      - tools/build_german_cecilienkoog_1905_provisional.py
      - tools/render_german_cecilienkoog_1905_qa.py
      - tools/historical-library/sources/german-coastline/cecilienkoog-1905-dyke-manual-source.json
      - tests/unit/historical-german-coastline-cecilienkoog.test.mjs
permissions:
  contents: write
concurrency:
  group: german-empire-coast-microtiles
  cancel-in-progress: false
jobs:
  review-microtile-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pillow shapely
      - name: Pin unmodified German Empire working polygon
        run: sha256sum tools/historical-library/working/german-empire-1914-base.geojson > /tmp/micro-original.sha
      - name: Obtain period-raster cropped coastal symbols
        env:
          GIS_LOG_BELTRING_MICRO_IMAGE: "1"
        run: python tools/probe_german_empire_coast_microtiles.py
      - name: Verify source-only contract
        run: |
          sha256sum -c /tmp/micro-original.sha
          python - <<'PY'
          import json
          f='tools/historical-library/sources/german-coastline/sh-coast-microtile-source-probe.json'
          x=json.load(open(f))
          assert x["sourceEpochNotExactSurveyYear"] is True
          assert x["historic1914ShorelineDigitized"] is False
          assert x["historicScreenDeviationMeasured"] is False
          assert x["doNotModifyCountryPolygon"] is True
          assert len(x["tiles"])==2
          print("PASS: microtile probe cannot promote 1914 shoreline accuracy")
          PY
      - name: Derive independent-period protective dyke LINE only (not a 1914 shoreline)
        run: |
          python tools/build_german_cecilienkoog_1905_provisional.py
          python tools/build_german_cecilienkoog_1905_provisional.py --check
      - name: Verify output is explicitly non-final and old/new linework remains separate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('tools/historical-library/working')
          prefix='german-empire-1914-cecilienkoog-1905-seaward-dyke-candidate'
          geo=json.loads((folder/(prefix+'.geojson')).read_text())
          qa=json.loads((folder/(prefix+'.qa.json')).read_text())
          assert len(geo['features'])==1
          f=geo['features'][0]
          assert f['geometry']['type']=='LineString'
          assert len(f['geometry']['coordinates'])>=20
          assert f['properties']['doNotPromote'] is True
          assert f['properties']['notAHistoricalLegalSeaCoast'] is True
          assert f['properties']['isNotCountryPolygon'] is True
          assert qa['historicallyVerified1914Geometry'] is False
          assert qa['independent1914CoastlineDigitized'] is False
          assert qa['individualSheetRevisionDateVerified'] is False
          assert qa['shouldUpdateMasterOrTimeline'] is False
          assert qa['screenSpace']['notMeasured1914ToPresentShorelineDeviation'] is True
          print('PASS: period-dyke-only line, reproducible; 1914 coastline still unverified.')
          PY
      - name: Render independently sourced WMS with manual dyke trace for visual QA
        env:
          GIS_LOG_CECILIEN_QA_IMAGE: "1"
        run: python tools/render_german_cecilienkoog_1905_qa.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source chronology, geometry provenance and independent QA
        run: |
          node --test \
            tests/unit/historical-german-coastline-events.test.mjs \
            tests/unit/historical-german-coastline-cecilienkoog.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sh-german-coast-microtile-period-originals
          path: tools/historical-library/review-output/german-coastline-microtiles/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit source metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/historical-library/sources/german-coastline/sh-coast-microtile-source-probe.json \
            tools/historical-library/working/german-empire-1914-cecilienkoog-1905-seaward-dyke-candidate.geojson \
            tools/historical-library/working/german-empire-1914-cecilienkoog-1905-seaward-dyke-candidate.qa.json
          if git diff --cached --quiet; then
            echo "no metadata changes"
          else
            git commit -m "data(gis): record high-resolution historic-coast microtile raster provenance"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
