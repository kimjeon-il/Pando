name: German Empire 1914 historic-coast microtile evidence
on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - tools/probe_german_empire_coast_microtiles.py
      - .github/workflows/german-empire-coast-microtiles.yml
permissions:
  contents: write
concurrency:
  group: german-empire-coast-microtiles
  cancel-in-progress: false
jobs:
  review-microtile-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pillow shapely
      - name: Pin unmodified German Empire working polygon
        run: sha256sum tools/historical-library/working/german-empire-1914-base.geojson > /tmp/micro-original.sha
      - name: Obtain period-raster cropped coastal symbols
        env:
          GIS_LOG_BELTRING_MICRO_IMAGE: "1"
        run: python tools/probe_german_empire_coast_microtiles.py
      - name: Verify source-only contract
        run: |
          sha256sum -c /tmp/micro-original.sha
          python - <<'PY'
          import json
          f='tools/historical-library/sources/german-coastline/sh-coast-microtile-source-probe.json'
          x=json.load(open(f))
          assert x["sourceEpochNotExactSurveyYear"] is True
          assert x["historic1914ShorelineDigitized"] is False
          assert x["historicScreenDeviationMeasured"] is False
          assert x["doNotModifyCountryPolygon"] is True
          assert len(x["tiles"])==2
          print("PASS: microtile probe cannot promote 1914 shoreline accuracy")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sh-german-coast-microtile-period-originals
          path: tools/historical-library/review-output/german-coastline-microtiles/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit source metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/historical-library/sources/german-coastline/sh-coast-microtile-source-probe.json
          if git diff --cached --quiet; then
            echo "no metadata changes"
          else
            git commit -m "data(gis): record high-resolution historic-coast microtile raster provenance"
            git pull --rebase origin work/gis
            git push origin HEAD:work/gis
          fi
