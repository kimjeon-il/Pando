name: Focused stage 2 C++ country project regression
on:
  push:
    branches: [work/map-project-stage2-core-check-20261109]
    paths: [.github/workflows/stage2-focused-core-check.yml]
permissions:
  contents: write
jobs:
  core-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: data
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/data/library-data.mjs --purpose=gis --include-prefix=assets/data/builtin-world/display-policy-v1.json 2>&1 | tee "$RUNNER_TEMP/stage2-library.log"
      - id: prerequisite
        if: steps.install.outcome == 'success' && steps.data.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-core-prerequisite.mjs
      - id: test
        if: steps.prerequisite.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=15000 tests/unit/data/builtin-world-loader.test.mjs tests/unit/document/builtin-resource-core-wasm.test.mjs 2>&1 | tee "$RUNNER_TEMP/stage2-core-test.log"
      - name: Record exact C++ regression outcomes on this isolated validation branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logPath = process.env.RUNNER_TEMP + '/stage2-core-test.log';
            const output = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8').slice(-18000) : 'test did not execute';
            const dataLogPath = process.env.RUNNER_TEMP + '/stage2-library.log';
            const dataOutput = fs.existsSync(dataLogPath) ? fs.readFileSync(dataLogPath, 'utf8').slice(-9000) : 'library preparation did not execute';
            const result = {
              schema: 'pando-stage2-core-validation-v1',
              output,
              dataOutput,
              sourceCommit: context.sha,
              install: '${{ steps.install.outcome }}',
              library: '${{ steps.data.outcome }}',
              prerequisite: '${{ steps.prerequisite.outcome }}',
              regression: '${{ steps.test.outcome }}',
              verified: '${{ steps.test.outcome }}' === 'success',
            };
            const content = Buffer.from(JSON.stringify(result, null, 2) + '\n').toString('base64');
            const branch = context.ref.replace('refs/heads/', '');
            let sha;
            try {
              const previous = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'validation-results/stage2-core-validation.json', ref: branch,
              });
              sha = previous.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: 'validation-results/stage2-core-validation.json',
              message: 'test: record focused C++ country project validation result',
              content, branch, ...(sha ? {sha} : {}),
            });
      - name: Fail if the focused C++ regression did not pass
        if: always()
        run: test '${{ steps.test.outcome }}' = 'success'
