name: Inspect viewer recovery evidence (no browser rerun)
on:
  push:
    branches: [work/ui]
    paths: [.github/workflows/gpu-recovery-viewer-inspect.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: kimjeon-il/Pando
          run-id: 41165813606
          name: gpu-viewer-followup-ea3d4f993e32a8bc098d9b16fd3f68281302acf1
          path: evidence
      - name: Print final approval records and publication entrypoints
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          for(const backend of ['webgl2','webgl1']){
            const r=JSON.parse(readFileSync(`evidence/${backend}/result.json`));console.log('COUNTS '+backend+' '+JSON.stringify(r.final.trace.counts));
            for(const [name,row]of Object.entries(r.final.trace.latest))console.log('LATEST '+backend+' '+name+' '+JSON.stringify(row));
          }
          const source=readFileSync('evidence/viewer-fixed-renderer.js','utf8');
          for(const name of ['recordMapPresentation','recordGpuRecoveryFrame','claimCanvasRecoveryFrame','syncGpuRecoveryAvailability','markPreviewFramePresented','commitGpuRecoveryFrame']){
            const start=source.indexOf('    function '+name+'(');assert.ok(start>=0,name);
            const next=source.slice(start+1).search(/\n    (?:async )?function /);
            console.log('SOURCE '+name+'\n'+source.slice(start,next<0?start+12000:start+1+next));
          }
          const start=source.indexOf('      commitVisualFrame:');console.log('COMMIT_PORT '+source.slice(start,start+1900));
          NODE
