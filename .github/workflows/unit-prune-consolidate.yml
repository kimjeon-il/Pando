name: One-shot focused third unit consolidation
on:
  push:
    branches: ['work/optimization']
    paths:
      - '.github/workflows/unit-prune-consolidate.yml'
      - 'scripts/maintenance/reduce-unit-duplicates-phase3.mjs'
permissions:
  contents: write
concurrency:
  group: unit-prune-third-reviewed
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply exact AST-reviewed deletions
        run: node scripts/maintenance/reduce-unit-duplicates-phase3.mjs
      - name: Check JavaScript syntax and changed test lint
        run: |
          node --check tests/unit/rendering/gpu-helper-utils.test.mjs
          node --check tests/unit/rendering/map-presentation-readiness.test.mjs
          node --check tests/unit/ui/ui-state-controllers.test.mjs
          node --check tests/unit/geometry/hydro-source-reader.test.mjs
          node --check tests/unit/build/p2-artifact-plan.test.mjs
          pnpm exec eslint tests/unit/rendering/gpu-helper-utils.test.mjs tests/unit/rendering/map-presentation-readiness.test.mjs tests/unit/ui/ui-state-controllers.test.mjs tests/unit/geometry/hydro-source-reader.test.mjs tests/unit/build/p2-artifact-plan.test.mjs
      - name: Exercise remaining focused unit behavior
        run: >-
          node --test
          tests/unit/rendering/gpu-helper-utils.test.mjs
          tests/unit/rendering/map-presentation-readiness.test.mjs
          tests/unit/ui/ui-state-controllers.test.mjs
          tests/unit/geometry/hydro-source-reader.test.mjs
          tests/unit/build/p2-artifact-plan.test.mjs
      - name: Preserve recoverable actual Git patch
        if: always()
        run: git diff --binary > /tmp/pando-unit-phase3-verified.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-phase3-reviewed-patch
          path: /tmp/pando-unit-phase3-verified.patch
          retention-days: 30
          if-no-files-found: error
      - name: Commit and push only selected test files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/unit/rendering/gpu-helper-utils.test.mjs tests/unit/rendering/map-presentation-readiness.test.mjs tests/unit/ui/ui-state-controllers.test.mjs tests/unit/geometry/hydro-source-reader.test.mjs tests/unit/build/p2-artifact-plan.test.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'test: consolidate repeated GPU Canvas, Hydro, hover and artifact cases'
          git push origin HEAD:refs/heads/work/optimization
