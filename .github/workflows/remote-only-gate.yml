name: Remote-only development contract

on:
  push:
    branches: [work/remote-only]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-only-contract
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.plan.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Plan source-aware acceptance without installing toolchains
        id: plan
        env:
          PANDO_REMOTE_ONLY_BASE_SHA: ${{ github.event.before || '' }}
        run: node scripts/remote-only-ci-scope.mjs --github-output

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify browser-only developer setup and remote CI routing
        run: node --test tests/unit/remote-only-contract.test.mjs tests/unit/codespaces-acceptance-contract.test.mjs tests/unit/remote-only-native-policy.test.mjs tests/unit/remote-only-artifact-cache.test.mjs

  wasm-compile-and-smoke:
    needs: scope
    if: needs.scope.outputs.run_heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMCC_CORES: "1"
      BINARYEN_CORES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'
      - name: Install CI-only native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Compile and test native GIS spherical polygon on the same source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-native/remote-only-integration
          cmake --preset pando-gis-tools
          cmake --build --preset pando-gis-tools
          ctest --preset pando-gis-tools --output-junit "$GITHUB_WORKSPACE/build-native/remote-only-integration/native-gis.xml" --output-on-failure
      - name: Compute source and toolchain digest for the WASM reuse cache
        id: wasm-identity
        run: node scripts/remote-only-wasm-cache.mjs --identity --github-output
      - name: Restore only the matching immutable WASM output
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: build-native/remote-only-wasm-cache
          key: ${{ steps.wasm-identity.outputs.cache_key }}
      - name: Verify and restore ABI/source-hashed cache without recompiling
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        run: node scripts/remote-only-wasm-cache.mjs --restore
      - uses: actions/checkout@v4
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - name: Compile actual shared C++ WASM in GitHub Actions
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          build-native/emsdk/emsdk install 6.0.3
          build-native/emsdk/emsdk activate 6.0.3
          source build-native/emsdk/emsdk_env.sh
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm
          test -s build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.wasm
          test -s build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
      - uses: pnpm/action-setup@v4
      - name: Install locked Node integration test dependencies on runner
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify compiled C++ WASM through GIS adapters and frozen geometry fixtures
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/unit/p6-polygon-core.test.mjs tests/unit/gis-math-contract.test.mjs tests/unit/r4c-spatial-boundaries.test.mjs | tee build-native/remote-only-integration/wasm-gis.tap
      - name: Record verified input-specific WASM cache after passing GIS tests
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: node scripts/remote-only-wasm-cache.mjs --record
      - name: Save validated WASM bytes once per exact source/toolchain identity
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-native/remote-only-wasm-cache
          key: ${{ steps.wasm-identity.outputs.cache_key }}
      - name: Archive native GIS and fresh WASM integration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-only-gis-wasm-integration-${{ github.sha }}
          path: build-native/remote-only-integration/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload compiled WASM evidence without committing generated output
        uses: actions/upload-artifact@v4
        with:
          name: remote-only-wasm-${{ github.sha }}
          path: |
            build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.wasm
            build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
          if-no-files-found: error
          retention-days: 7

  viewer-map-integration:
    needs: wasm-compile-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Prepare browser runner only
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: remote-only-wasm-${{ github.sha }}
          path: ${{ runner.temp }}/pando-remote-only-wasm
      - name: Install compiled, source-bound WASM in temporary CI checkout
        run: node tools/package-shared-core-assets.mjs --build-dir "${{ runner.temp }}/pando-remote-only-wasm"
      - name: Run browser against the rebuilt WASM and pinned GIS runtime data
        env:
          PANDO_P3_BRANCH: work/remote-only
        run: pnpm exec playwright test tests/browser/p3-remote-preview.spec.mjs --workers=1 --retries=0 --reporter=list
      - name: Preserve actual Viewer screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-only-viewer-gis-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  # Browser-only Viewer acceptance; native source checks use their own gate.
  # GIS and shared C++/WASM compilation remain separate and source-pinned.
  viewer-web-regression:
    needs: scope
    # Automatic Viewer/Node checks are delegated through P3 to the reusable
    # application gate. Preserve this focused acceptance as a manual diagnostic.
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.run_heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install locked Web-only test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify source-pinned Viewer publication and inspection ownership
        run: >-
          node --test
          tests/unit/library-data.test.mjs
          tests/unit/p2-artifact-plan.test.mjs
          tests/unit/remote-only-contract.test.mjs
          tests/unit/viewer-inspector-controller.test.mjs
          tests/unit/viewer-inspector.test.mjs
          tests/unit/reviewer-ui-contracts.test.mjs
      - name: Install Chromium only for real Web browser acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify hidden inspector, change review, desktop/mobile Viewer and controls
        env:
          PANDO_P3_BRANCH: work/remote-only
        run: >-
          pnpm exec playwright test
          tests/browser/viewer-review-e4.spec.mjs
          tests/browser/web-viewer.spec.mjs
          tests/browser/viewer-project-open.spec.mjs
          --workers=1 --retries=0 --reporter=list
      - name: Archive post-retirement Web test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-only-post-windows-web-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
