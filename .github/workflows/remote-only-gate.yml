name: Remote-only development contract

on:
  push:
    branches: [work/remote-only]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-only-contract
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify browser-only developer setup and remote CI routing
        run: node --test tests/unit/remote-only-contract.test.mjs
