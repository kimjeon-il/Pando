name: Builtin temporal transition
on:
  push:
    branches: [work/objects]
    paths: ['.github/workflows/builtin-temporal-transition.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: builtin-temporal-transition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline-ui:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Unmodified production source and unmodified original UI tests
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/temporal-baseline"
          git rev-parse HEAD > "$RUNNER_TEMP/temporal-baseline/head.txt"
          git hash-object shared/core/src/document-session.cpp apps/viewer/js/modules/viewer-composition.js tests/browser/timeline-controls.spec.mjs > "$RUNNER_TEMP/temporal-baseline/objects.txt"
          pnpm exec playwright test tests/browser/timeline-controls.spec.mjs --workers=1 --retries=0 --trace off | tee "$RUNNER_TEMP/temporal-baseline/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-baseline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/temporal-baseline/
            test-results/
          retention-days: 2
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore exact reviewed candidate and source-matched build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/work/objects' ]
          mkdir -p "$RUNNER_TEMP/temporal-evidence"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          for name,sha in [('prepare','3d6cf6c78e9f6d8719ceffe2babe84dfa034dee1'),('publish','5e8c5311cbe0952390720cafdd15bb47458ab6de')]:
              data=json.loads(subprocess.check_output(['gh','api','repos/kimjeon-il/Pando/git/blobs/'+sha]))
              raw=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              pathlib.Path(os.environ['RUNNER_TEMP'],'temporal-'+name+'.py').write_bytes(raw)
          PY
          python3 "$RUNNER_TEMP/temporal-prepare.py"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          path='tests/browser/builtin-temporal-transition.spec.mjs';expected='09cbbb8ee681af897f0552ab2dbee22e65021ac6'
          assert subprocess.check_output(['git','hash-object',path],text=True).strip()==expected
          manifest=pathlib.Path(os.environ['RUNNER_TEMP'],'temporal-input.json');data=json.loads(manifest.read_text());data[path]=expected;manifest.write_text(json.dumps(data))
          PY
      - uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require source-matched WASM
        run: node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
      - name: Verify source, rollback, transport and file contracts
        run: |
          set -euo pipefail
          node --test tests/unit/builtin-month-clock.test.mjs tests/unit/viewer-temporal-boundary.test.mjs tests/unit/builtin-world-loader.test.mjs tests/unit/builtin-temporal-transition.test.mjs tests/unit/app-builtin-session.test.mjs tests/unit/core-document-runtime.test.mjs tests/unit/core-document-client.test.mjs tests/unit/core-worker-ownership.test.mjs tests/unit/core-document-read-model.test.mjs tests/unit/project-opening.test.mjs tests/unit/core-project-replacement-wasm.test.mjs tests/unit/project-product-surface.test.mjs | tee "$RUNNER_TEMP/temporal-evidence/unit.log"
      - name: Lint changed executable sources
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {execFileSync} from 'node:child_process';
          const files=Object.keys(JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/temporal-input.json','utf8'))).filter(p=>/\.(m?js)$/.test(p));
          execFileSync('pnpm',['exec','eslint',...files],{stdio:'inherit'});
          NODE
      - name: Check existing command and Worker boundaries
        run: |
          node scripts/check-command-architecture.mjs
          node scripts/check-worker-architecture.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify isolated native desktop and mobile input on both renderers
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: |
          set -euo pipefail
          pnpm exec playwright test tests/browser/builtin-temporal-transition.spec.mjs --workers=1 --retries=0 --trace off | tee "$RUNNER_TEMP/temporal-evidence/browser.log"
      - name: Create detached verified candidate without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/temporal-publish.py"
      - name: Collect verification evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/temporal-evidence"
          git diff --cached --binary > "$RUNNER_TEMP/temporal-evidence/source.patch"
          cp "$RUNNER_TEMP/temporal-input.json" "$RUNNER_TEMP/temporal-evidence/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-verified-${{ github.sha }}
          path: |
            ${{ runner.temp }}/temporal-evidence/
            shared/frontend/static/wasm/pandoeditor-core.*
            test-results/
          retention-days: 2
