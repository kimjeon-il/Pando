name: Builtin temporal transition
on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/builtin-temporal-transition.yml'
      - 'shared/core/**'
      - 'shared/wasm/session-bindings.cpp'
      - 'shared/frontend/static/wasm/**'
      - 'shared/frontend/js/modules/builtin-*.js'
      - 'shared/frontend/js/modules/core-document-*.js'
      - 'shared/frontend/js/modules/core-worker-runtime.js'
      - 'shared/frontend/js/modules/product-mode-policy.js'
      - 'shared/frontend/js/modules/project-domain.js'
      - 'apps/viewer/js/modules/viewer-*.js'
      - 'tests/unit/builtin-*.test.mjs'
      - 'tests/unit/viewer-temporal-boundary.test.mjs'
      - 'tests/unit/app-builtin-session.test.mjs'
      - 'tests/unit/core-document-*.test.mjs'
      - 'tests/browser/timeline-controls.spec.mjs'
      - 'tests/browser/builtin-temporal-transition.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builtin-temporal-transition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require source-matched WASM
        run: node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
      - name: Verify temporal source, transaction, transport and user-file contracts
        run: >-
          node --test tests/unit/builtin-month-clock.test.mjs tests/unit/viewer-temporal-boundary.test.mjs
          tests/unit/builtin-world-loader.test.mjs tests/unit/builtin-temporal-transition.test.mjs
          tests/unit/app-builtin-session.test.mjs tests/unit/core-document-runtime.test.mjs
          tests/unit/core-document-client.test.mjs tests/unit/core-worker-ownership.test.mjs
          tests/unit/core-document-read-model.test.mjs tests/unit/project-opening.test.mjs
          tests/unit/core-project-replacement-wasm.test.mjs tests/unit/project-product-surface.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify dedicated desktop/mobile WebGL and Canvas transitions
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: pnpm exec playwright test tests/browser/builtin-temporal-transition.spec.mjs --workers=1 --retries=0 --trace off
      - name: Preserve the existing wider UI regression gate
        if: always()
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: pnpm exec playwright test tests/browser/timeline-controls.spec.mjs --workers=1 --retries=0 --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: builtin-temporal-failure-${{ github.sha }}
          path: test-results/
          retention-days: 3
