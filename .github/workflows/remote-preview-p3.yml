name: P3 Remote preview and Web verification
on:
  push:
    branches:
      - work/**
      - '!work/optimization'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Verified artifact result SHA (empty uses selected branch)
        type: string
        required: false
      original_source_sha:
        description: Source SHA that produced the verified artifact result
        type: string
        required: false
      base_sha:
        description: Source change base before artifact publication
        type: string
        required: false
      retry_failed:
        description: Resume browser and calculation acceptance using completed evidence
        type: boolean
        required: false
        default: false
      browser_tests:
        description: Optional Playwright grep for remaining browser acceptance cases
        type: string
        required: false
      browser_flows:
        description: Run editing flows; disable only to measure performance after
          reusing flow evidence
        type: boolean
        required: false
        default: true
      scope:
        description: Run changed scopes only (auto), or select a diagnostic
        type: choice
        required: false
        default: auto
        options:
          - auto
          - all
          - acceptance
          - preview
          - browser
          - off
permissions:
  contents: read
concurrency:
  group: p3-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      preview: ${{ steps.scope.outputs.preview }}
      browser: ${{ steps.scope.outputs.browser }}
      contracts: ${{ steps.scope.outputs.contracts }}
      ui: ${{ steps.scope.outputs.ui }}
      objects: ${{ steps.scope.outputs.objects }}
      gis: ${{ steps.scope.outputs.gis }}
      places: ${{ steps.scope.outputs.places }}
      slug: ${{ steps.scope.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check preview and build plan without installing SDKs
        run: node --test tests/unit/p3-remote-plan.test.mjs
          tests/unit/p3-preview-server.test.mjs
          tests/unit/p3-presentation.test.mjs
      - name: Fetch source-change base for artifact result verification
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha ||
            github.event.before || '' }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          ORIGINAL_SOURCE_SHA: ${{ inputs.original_source_sha || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ -n "$ORIGINAL_SOURCE_SHA" ]; then
            [[ "$ORIGINAL_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --deepen=10 origin "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$ORIGINAL_SOURCE_SHA" HEAD
          fi
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0{40}$ ]]; then
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
      - name: Resolve changed scopes using the actual Git history
        id: scope
        env:
          PANDO_P3_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha ||
            github.event.before || '' }}
          PANDO_P3_BRANCH: ${{ github.head_ref || github.ref_name }}
          PANDO_P3_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/p3-plan-remote.mjs --github-output
  web-contracts:
    needs: plan
    if: needs.plan.outputs.contracts == 'true' && github.event_name !=
      'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select current application checks
        id: plan
        env: &a1
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha ||
            github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ inputs.source_sha || github.sha }}
          CHECK_PROFILE: p3
          CHECK_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/run-application-checks.mjs --list --github-output
      - name: Install native GIS prerequisites only for selected data checks
        if: steps.plan.outputs.gis_native == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev zlib1g-dev
          pkg-config cmake
      - name: Prepare selected native test prerequisites
        uses: ./.github/actions/native-test-prerequisites
        with:
          requirements: ${{ steps.plan.outputs.native_requirements }}
      - name: Execute selected non-browser application contracts
        env: *a1
        run: node scripts/run-application-checks.mjs --phase non-browser --output
          "$RUNNER_TEMP/application-checks.json"
      - name: Upload application check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-application-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-checks.json
          if-no-files-found: warn
  web-contracts-browser:
    name: web-contracts-browser-${{ matrix.index }}
    needs: plan
    if: needs.plan.outputs.contracts == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { index: 1, shard: '1/4' }
          - { index: 2, shard: '2/4' }
          - { index: 3, shard: '3/4' }
          - { index: 4, shard: '4/4' }
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select affected browser checks on the same exact source
        id: plan
        env: &browser-check-env
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ inputs.source_sha || github.sha }}
          CHECK_PROFILE: p3
          CHECK_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/run-application-checks.mjs --list --phase browser --github-output
      - name: Install Chromium only for selected browser checks
        if: steps.plan.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare selected browser prerequisites
        if: steps.plan.outputs.browser == 'true'
        uses: ./.github/actions/native-test-prerequisites
        with:
          requirements: ${{ steps.plan.outputs.native_requirements }}
      - name: Execute browser application contracts without reducing coverage
        if: steps.plan.outputs.browser == 'true'
        env: *browser-check-env
        run: node scripts/run-application-checks.mjs --phase browser --shard "${{ matrix.shard }}" --output
          "$RUNNER_TEMP/application-browser-${{ matrix.index }}.json"
      - name: Upload per-shard browser contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-application-browser-${{ matrix.index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-browser-${{ matrix.index }}.json
          if-no-files-found: warn
  web-snapshot:
    needs: plan
    if: needs.plan.outputs.preview == 'true' && !inputs.retry_failed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stage a reproducible branch Web snapshot without deploying Pages
        env:
          PREVIEW_PATH: ${{ runner.temp }}/p3-preview/${{ needs.plan.outputs.slug }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          node scripts/p3-stage-preview.mjs --root . --output "$PREVIEW_PATH" --branch "$PREVIEW_BRANCH"
      - name: Upload runnable static Web preview for this branch
        uses: actions/upload-artifact@v4
        with:
          name: p3-web-${{ needs.plan.outputs.slug }}-${{ inputs.source_sha || github.sha
            }}
          path: ${{ runner.temp }}/p3-preview/${{ needs.plan.outputs.slug }}
          retention-days: 5
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Point developers to the branch-specific preview artifact
        env:
          P3_SLUG: ${{ needs.plan.outputs.slug }}
        run: |
          echo "### Branch Web preview: $P3_SLUG" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **p3-web-$P3_SLUG-$GITHUB_SHA** from this run's Artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "This is an offline-served static snapshot, not a live Pages URL; production Pages remains unchanged." >> "$GITHUB_STEP_SUMMARY"
  browser-regression:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.scope == 'acceptance' || (inputs.scope == 'browser'
      && inputs.retry_failed)) && 40 || 18 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install JS test framework only for browser regression
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the active built-in world mesh decoder and GPU capability wiring
        if: ${{ !inputs.retry_failed }}
        run: node --test tests/unit/country-mesh-codec-runtime.test.mjs
      - name: Verify C++ area, shared-border packet, and canonical GIS boundaries
        if: ${{ !inputs.retry_failed }}
        run: node --test tests/unit/p5-spherical-area-delegation.test.mjs
          tests/unit/r4c-spatial-boundaries.test.mjs
          tests/unit/country-shared-boundary-state.test.mjs
          tests/unit/country-shared-boundary-generator.test.mjs
      - name: Verify consecutive country merges and current Worker contracts
        if: inputs.scope == 'acceptance'
        env:
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: |
          if [ "$RETRY_FAILED" = true ]; then
            node --test tests/unit/r4c-spatial-boundaries.test.mjs
            node --test tests/unit/p6-polygon-core.test.mjs tests/unit/river-territory-partition.test.mjs
          else
            node --test tests/unit/r4c-spatial-boundaries.test.mjs tests/unit/gis-geometry-worker.test.mjs tests/unit/current-hydro-layout.test.mjs tests/unit/hydro-packfile.test.mjs
          fi
      - name: Record final committed artifact identity and current hydro consumption
        id: acceptance_inputs
        if: inputs.scope == 'acceptance' || (inputs.scope == 'browser' &&
          inputs.retry_failed)
        run: |
          mkdir -p test-results/p9-artifacts
          source_sha="$(git rev-parse HEAD)"
          node scripts/p2-artifact-plan.mjs --evidence --result-sha "$source_sha" --expected-source-sha "$source_sha" --evidence-file test-results/p9-artifacts/generated.json
          if [ '${{ inputs.scope }}' = acceptance ]; then node tools/check-current-hydro-layout.mjs --root . --allow-retired false --out test-results/p9-artifacts/hydro.json; fi
      - name: Run real desktop and emulated mobile screenshots plus startup
          observability
        if: inputs.browser_tests == ''
        shell: bash
        env:
          PANDO_P3_BRANCH: ${{ github.head_ref || github.ref_name }}
          PANDOLAB_BROWSER_CHANNEL: chromium
          PANDO_P9_ACCEPTANCE: ${{ inputs.scope == 'acceptance' || (inputs.scope ==
            'browser' && inputs.retry_failed) }}
        run: |
          set -euo pipefail
          mkdir -p test-results/p3-browser
          pnpm exec playwright test \
            tests/browser/p3-remote-preview.spec.mjs \
            tests/browser/hydro-sdf-webgl.spec.mjs \
            --workers=1 --retries=0 --max-failures=1 --output=test-results/p3-browser \
            2>&1 | tee test-results/p3-browser.log
      - name: Verify current Viewer map boundaries and temporal presentation
        if: inputs.browser_flows != false && (inputs.scope == 'acceptance' ||
          (inputs.scope == 'browser' && inputs.retry_failed))
        shell: bash
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
          PANDOLAB_TEST_PROFILING: off
          RETRY_FAILED: ${{ inputs.retry_failed }}
          PANDO_BROWSER_TESTS: ${{ inputs.browser_tests }}
        run: |
          mkdir -p test-results/p9-browser
          filters=()
          if [ -n "$PANDO_BROWSER_TESTS" ]; then filters+=(--grep "$PANDO_BROWSER_TESTS"); fi
          pnpm exec playwright test tests/browser/viewer-boundary-p4-5.spec.mjs tests/browser/temporal-map-presentation.spec.mjs "${filters[@]}" --workers=1 --retries=0 --output=test-results/p9-browser
      - name: Archive screenshots, test output and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-browser-${{ needs.plan.outputs.slug }}-${{ inputs.source_sha ||
            github.sha }}
          path: |
            test-results/p3-browser
            test-results/p9-browser
            test-results/p9-artifacts
            test-results/p3-browser.log
            playwright-report
          if-no-files-found: warn
          retention-days: 10
  calculation-performance:
    if: inputs.scope == 'acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/checkout@v4
        with:
          ref: d57e235cc4b8c7f94a603d4352556f11b28bc735
          path: build-native/p9/baseline
          persist-credentials: false
      - name: Mount selected baseline inputs from library storage
        id: library_baseline_2
        uses: kimjeon-il/Pando/.github/actions/library-data@main
        with:
          inputs-revision: 4bed5bac671c5bfe28e1e54cbcc237f6c10a95aa
          inputs-target: build-native/p9/baseline
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compare changed calculations on the same runner with alternating samples
        env:
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: |
          if [ "$RETRY_FAILED" = true ]; then
            node tools/p6-calculation-performance.mjs --baseline build-native/p9/baseline --candidate . --operations river,reference --output build-native/p9/calculation-performance.json
          else
            node tools/p6-calculation-performance.mjs --baseline build-native/p9/baseline --candidate . --output build-native/p9/calculation-performance.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p9-calculation-performance-${{ inputs.source_sha || github.sha }}
          path: build-native/p9/calculation-performance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify selected library input bytes remain unchanged
        if: always() && steps.library_baseline_2.outcome == 'success'
        shell: bash
        env:
          INPUT_CHECKOUT: .pando-inputs/build-native/p9/baseline
        run: >
          dirty="$(git -C "$GITHUB_WORKSPACE/$INPUT_CHECKOUT" status --porcelain
          --untracked-files=all -- assets/data)"

          test -z "$dirty" || { printf '%s\n' "$dirty"; exit 1; }
