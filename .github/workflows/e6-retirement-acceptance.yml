name: E6 editor retirement and reviewer-only acceptance
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/e6-retirement-acceptance.yml
      - apps/editor/stage.mjs
      - apps/editor/src-tauri/**
      - apps/editor/native-contract.mjs
      - apps/editor/native-producer.mjs
      - apps/editor/dev.mjs
      - apps/editor/packaged-artifacts.mjs
      - apps/editor/tests/stage.test.mjs
      - apps/editor/tests/stage-world.test.mjs
      - apps/editor/tests/helpers/world-fixture.mjs
      - apps/editor/check-stage.mjs
      - scripts/lib/frontend-layout.mjs
      - scripts/lib/frontend-build.mjs
      - scripts/lib/product-html.mjs
      - scripts/lib/product-assets.mjs
      - tests/unit/frontend-build.test.mjs
      - tests/unit/frontend-layout.test.mjs
      - tests/unit/brand-icons.test.mjs
      - tests/unit/brand-platforms.test.mjs
      - tests/browser/server.mjs
      - tests/browser/viewer-review-e4.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e6-acceptance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reviewer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-core-prerequisite.mjs
      - name: Lint active review and platform build boundaries
        run: >-
          pnpm exec eslint
          scripts/lib/frontend-build.mjs
          scripts/lib/frontend-layout.mjs
          scripts/lib/product-html.mjs
          scripts/lib/product-assets.mjs
          apps/editor/stage.mjs
          apps/editor/native-contract.mjs
          apps/editor/native-producer.mjs
          apps/editor/dev.mjs
          apps/editor/packaged-artifacts.mjs
          apps/editor/check-stage.mjs
          tests/unit/frontend-build.test.mjs
          tests/unit/frontend-layout.test.mjs
          tests/unit/brand-icons.test.mjs
          tests/unit/brand-platforms.test.mjs
      - name: Verify review-only compilation, source isolation and Windows contracts
        run: >-
          node --test --test-concurrency=2
          tests/unit/frontend-build.test.mjs
          tests/unit/frontend-layout.test.mjs
          tests/unit/brand-icons.test.mjs
          tests/unit/brand-platforms.test.mjs
          apps/editor/tests/stage.test.mjs
          apps/editor/tests/stage-world.test.mjs
          apps/editor/tests/native-contract.test.mjs
          apps/editor/tests/native-build.test.mjs
          apps/editor/tests/native-launch.test.mjs
          tests/unit/e5-windows-review.test.mjs
          tests/unit/review-inspection.test.mjs
      - name: Confirm Viewer closure excludes editor and native Android
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/editor/src-tauri/android
          test ! -e apps/editor/src-tauri/gen/android
          test ! -e apps/editor/src-tauri/src/library_commands.rs
          test ! -e apps/editor/src-tauri/src/document_transfer.rs
          node --input-type=module <<'NODE'
          import {buildFrontendIndex} from './scripts/lib/frontend-layout.mjs';
          import assert from 'node:assert/strict';
          const paths=[...buildFrontendIndex(process.cwd()).keys()];
          assert.ok(paths.includes('assets/js/viewer.js'));
          assert.equal(paths.some(x=>x.startsWith('shell/')||x==='assets/js/bootstrap.js'||x==='assets/js/app.js'),false);
          assert.equal(paths.some(x=>x.includes('gis-gpkg-worker.js')||x.includes('map-edit-worker.js')),false);
          console.log('E6 source graph: '+paths.length+' viewer/shared assets; retired entries 0');
          NODE
  reviewer-browser:
    needs: reviewer-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise Web viewer and Windows read-only reviewer
        run: >-
          pnpm exec playwright test
          tests/browser/windows-review-e5.spec.mjs
          tests/browser/viewer-review-e4.spec.mjs
          --workers=1 --retries=0 --reporter=list
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e6-reviewer-browser-failure-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
