          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          node --test tests/unit/document/map-native-preview.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native preview differs from original' }
          node --test --test-name-pattern='macro diagnostics refuse|reviewed diagnostics refuse|corpus diagnostics reject'
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic scope refusal failed' }

          if ($LASTEXITCODE -ne 0) { throw 'Map review workflow failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-map-preview-${{ matrix.os }}-${{ github.sha }}
          path: build-native/map-preview/artifact/
          if-no-files-found: ignore
