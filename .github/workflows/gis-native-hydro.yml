          cmake --build build-native/terrain-dem-encode --config Release --target pando-terrain-dem-fill
          if ($LASTEXITCODE -ne 0) { throw 'GDAL tint tool build failed' }
          node tools/gis/package-terrain-dem-fill.mjs --binary build-native/terrain-dem-encode/Release/pando-terrain-dem-fill.exe --directory build-native/terrain-dem-encode/fill-artifact
          if ($LASTEXITCODE -ne 0) { throw 'GDAL tint tool packaging failed' }
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'terrain-dem-fill-windows'
        with:
          name: terrain-dem-fill-windows-${{ github.sha }}
          path: build-native/terrain-dem-encode/fill-artifact/
          if-no-files-found: error
          retention-days: 7
