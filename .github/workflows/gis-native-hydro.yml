            $image = 'build-native/map-image/Release/pando-map-image.exe'
          } else {
            $pdf = 'build-native/map-pdf/native/pando-map-pdf'
            $image = 'build-native/map-image/pando-map-image'
          }
          node tools/map-image/package-pdf.mjs --binary $pdf --directory build-native/map-pdf/artifact --sdk build-native/map-pdf/sdk/pymupdf
