          node tools/map-image/package-preview.mjs --binary $preview --directory build-native/map-preview/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Preview packaging failed' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Image packaging failed' }
