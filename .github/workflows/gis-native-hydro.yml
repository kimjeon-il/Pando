name: GIS native Hydro junction contracts

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/cpp/CMakeLists.txt'
      - 'tools/cpp/hydro/connectivity-junctions.cpp'
      - 'tests/unit/hydro-connectivity-native.test.mjs'
      - 'tools/hydro_connectivity.py'
      - 'tools/build-hydro-tiles.py'
      - 'tools/repair-hydro-connectivity.mjs'
      - 'tests/test_hydro_connectivity.py'
      - '.github/workflows/gis-native-hydro.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Standalone native tool to build and verify
        type: choice
        options: [hydro, hydro-encoding, hydro-encoding-integrated, hydro-point-screen, hydro-batch01, hydro-batch02, hydro-batch03, hydro-yarra, hydro-point-windows, pc-allocation, reference-loss, reference-windows, reference-step, reference-ordered, qgis-windows, map-image, map-training-overview, map-pdf, map-preview, map-review, map-evaluation, terrain-preview, terrain-preview-integrated, terrain-dem-check, terrain-dem-check-integrated, terrain-dem-encode]
        default: hydro

permissions:
  contents: read

jobs:
  terrain-dem-encode:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'terrain-dem-encode'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and check only the DEM elevation encoder
        shell: pwsh
        run: |
          cmake -S tools/cpp/terrain-dem-encode -B build-native/terrain-dem-encode -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder configuration failed' }
          cmake --build build-native/terrain-dem-encode --config Release --target pando-terrain-dem-encode
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder build failed' }
          if ($IsWindows) { $binary = 'build-native/terrain-dem-encode/Release/pando-terrain-dem-encode.exe' }
          else { $binary = 'build-native/terrain-dem-encode/pando-terrain-dem-encode' }
          Add-Content -Path $env:GITHUB_ENV -Value "PANDO_TERRAIN_DEM_ENCODE_BINARY=$env:GITHUB_WORKSPACE/$binary"
          node tools/gis/package-terrain-dem-encode.mjs --binary $binary --directory build-native/terrain-dem-encode/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder packaging failed' }
          $env:PANDO_TERRAIN_DEM_ENCODE_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-encode/artifact"
          node --test tests/unit/terrain-dem-encode.test.mjs tests/unit/terrain-dem-tint-native.test.mjs tests/unit/terrain-dem-assets.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoding differs from the Python oracle' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check only the DEM producer's native encoding calls
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0 numpy==2.3.5 'rasterio>=1.4,<2'
          if ($LASTEXITCODE -ne 0) { throw 'DEM producer test dependencies failed' }
          python -m unittest tests.python.test_build_terrain_dem.TerrainDemTest.test_signed_elevation_and_byte_boundary tests.python.test_build_terrain_dem.TerrainDemTest.test_webp_roundtrip_and_reproducibility tests.python.test_build_terrain_dem.TerrainDemTest.test_shade_quantization_preserves_elevation_and_limits_error tests.python.test_build_terrain_dem.TerrainDemTest.test_coarse_polar_gutter_clamps_adjacent_shade tests.python.test_build_terrain_dem.TerrainDemTest.test_range_and_nodata_are_not_silently_zeroed
          if ($LASTEXITCODE -ne 0) { throw 'DEM producer native encoding calls failed' }
          python -m unittest tests.python.test_build_terrain_dem.TerrainDemTest.test_tint_keeps_white_ice_and_excludes_white_water tests.python.test_build_terrain_dem.TerrainDemTest.test_nearly_white_water_is_not_a_land_donor_but_real_snow_is_kept tests.python.test_build_terrain_dem.TerrainDemTest.test_tint_average_does_not_dilute_a_small_island_with_white_sea tests.python.test_build_terrain_dem.TerrainDemTest.test_asset_summary_uses_shared_node_digest
          if ($LASTEXITCODE -ne 0) { throw 'DEM producer tint masking differs from its source contract' }
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-encode-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-encode/artifact/
          retention-days: 7
  terrain-dem-check:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'terrain-dem-check' || inputs.target == 'terrain-dem-check-integrated')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native GDAL for the selected synthetic source
        if: inputs.target == 'terrain-dem-check-integrated' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          echo 'PANDO_GDAL_LOCATIONINFO=gdallocationinfo' >> "$GITHUB_ENV"
      - name: Build the image codec used by the integrated verifier
        if: inputs.target == 'terrain-dem-check-integrated'
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Image codec configuration failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Image codec build failed' }
          if ($IsWindows) { $image = 'build-native/map-image/Release/pando-map-image.exe' }
          else { $image = 'build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Image codec packaging failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "PANDO_MAP_IMAGE_ARTIFACT=$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
      - name: Build and check only the DEM tile verifier
        shell: pwsh
        run: |
          cmake -S tools/cpp/terrain-dem-check -B build-native/terrain-dem-check -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM verifier configuration failed' }
          cmake --build build-native/terrain-dem-check --config Release --target pando-terrain-dem-check
          if ($LASTEXITCODE -ne 0) { throw 'DEM verifier build failed' }
          if ($IsWindows) { $binary = 'build-native/terrain-dem-check/Release/pando-terrain-dem-check.exe' }
          else { $binary = 'build-native/terrain-dem-check/pando-terrain-dem-check' }
          node tools/gis/package-terrain-dem-check.mjs --binary $binary --directory build-native/terrain-dem-check/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM verifier packaging failed' }
          $env:PANDO_TERRAIN_DEM_CHECK_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-check/artifact"
          node --test tests/unit/terrain-dem-check.test.mjs tests/unit/terrain-dem-level.test.mjs tests/unit/terrain-dem-source.test.mjs tests/unit/terrain-dem-cli.test.mjs tests/unit/terrain-dem-assets.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DEM tile checks differ from the Python oracle' }
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-check-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-check/artifact/
          retention-days: 7
  hydro-encoding:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'hydro-encoding' || inputs.target == 'hydro-encoding-integrated')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the Hydro connector for the integrated repair check
        if: inputs.target == 'hydro-encoding-integrated'
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/hydro -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          if ($LASTEXITCODE -ne 0) { throw 'Hydro connector configuration failed' }
          cmake --build build-native/hydro --config Release --target pando-hydro-connectivity --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Hydro connector build failed' }
          if ($IsWindows) { $connector = 'build-native/hydro/Release/pando-hydro-connectivity.exe' }
          else { $connector = 'build-native/hydro/pando-hydro-connectivity' }
          node tools/gis/package-hydro-connectivity.mjs --binary $connector --directory build-native/hydro/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Hydro connector packaging failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "PANDO_HYDRO_CONNECTIVITY_DIRECTORY=$env:GITHUB_WORKSPACE/build-native/hydro/artifact"
      - name: Build and check only the Hydro feature encoder
        shell: pwsh
        run: |
          cmake -S tools/cpp/hydro-encoding -B build-native/hydro-encoding -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Hydro encoder configuration failed' }
          cmake --build build-native/hydro-encoding --config Release --target pando-hydro-encoding
          if ($LASTEXITCODE -ne 0) { throw 'Hydro encoder build failed' }
          if ($IsWindows) { $env:PANDO_HYDRO_ENCODING_BINARY = "$env:GITHUB_WORKSPACE/build-native/hydro-encoding/Release/pando-hydro-encoding.exe" }
          else { $env:PANDO_HYDRO_ENCODING_BINARY = "$env:GITHUB_WORKSPACE/build-native/hydro-encoding/pando-hydro-encoding" }
          node tools/gis/package-hydro-encoding.mjs --binary $env:PANDO_HYDRO_ENCODING_BINARY --directory build-native/hydro-encoding/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Hydro encoder packaging failed' }
          $env:PANDO_HYDRO_ENCODING_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/hydro-encoding/artifact"
          node --test tests/unit/hydro-encoding-native.test.mjs tests/unit/hydro-pack-layout.test.mjs tests/unit/hydro-repair-pipeline.test.mjs tests/unit/hydro-repair-cli.test.mjs tests/unit/hydro-fingerprint.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Hydro feature bytes differ from the Python oracle' }
      - uses: actions/upload-artifact@v4
        with:
          name: hydro-encoding-${{ matrix.os }}-${{ github.sha }}
          path: build-native/hydro-encoding/artifact/
          retention-days: 7
  terrain-preview:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'terrain-preview' || inputs.target == 'terrain-preview-integrated')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the image codec needed by the integrated terrain workflow
        if: inputs.target == 'terrain-preview-integrated'
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Image codec configure failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Image codec build failed' }
          if ($IsWindows) { $image = 'build-native/map-image/Release/pando-map-image.exe' }
          else { $image = 'build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Image codec packaging failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "PANDO_MAP_IMAGE_ARTIFACT=$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
      - name: Build and verify only the terrain preview compositor
        shell: pwsh
        run: |
          cmake -S tools/cpp/terrain -B build-native/terrain-preview -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Terrain preview configure failed' }
          cmake --build build-native/terrain-preview --config Release --target pando-terrain-preview
          if ($LASTEXITCODE -ne 0) { throw 'Terrain preview build failed' }
          if ($IsWindows) { $env:PANDO_TERRAIN_PREVIEW_BINARY = "$env:GITHUB_WORKSPACE/build-native/terrain-preview/Release/pando-terrain-preview.exe" }
          else { $env:PANDO_TERRAIN_PREVIEW_BINARY = "$env:GITHUB_WORKSPACE/build-native/terrain-preview/pando-terrain-preview" }
          Add-Content -Path $env:GITHUB_ENV -Value "PANDO_TERRAIN_PREVIEW_BINARY=$env:PANDO_TERRAIN_PREVIEW_BINARY"
          node tools/gis/package-terrain-preview.mjs --binary $env:PANDO_TERRAIN_PREVIEW_BINARY --directory build-native/terrain-preview/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Terrain preview packaging failed' }
          $env:PANDO_TERRAIN_PREVIEW_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-preview/artifact"
          node --test tests/unit/terrain-preview-native.test.mjs tests/unit/terrain-preview-sources.test.mjs tests/unit/terrain-preview-grid.test.mjs tests/unit/terrain-preview-builder.test.mjs tests/unit/terrain-preview-cli.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Terrain preview differs from frozen source pixels' }
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-preview-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-preview/artifact/
          retention-days: 7
  reference-step:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'reference-step' || inputs.target == 'reference-ordered')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Acquire fixed Windows LibTorch SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-PSDrive -Name C).Free -lt 9GB) { throw 'Need estimated 4 GiB SDK/build space plus 5 GiB headroom' }
          New-Item -ItemType Directory -Path build-native/reference-analysis -ErrorAction SilentlyContinue | Out-Null
          curl.exe --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 180 --max-filesize 220000000 'https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.14.1%2Bcpu.zip' --output build-native/reference-analysis/libtorch.zip
          if ($LASTEXITCODE -ne 0) { throw 'LibTorch SDK download failed' }
          if ((Get-FileHash build-native/reference-analysis/libtorch.zip -Algorithm SHA256).Hash -ne '28FFDDE0A7FF3B431139709B4A91B8B6D59FDE3BE67B76FD88D0C913EF8973F7') { throw 'LibTorch SDK SHA-256 mismatch' }
          Expand-Archive -Path build-native/reference-analysis/libtorch.zip -DestinationPath build-native/reference-analysis
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/build-native/reference-analysis/libtorch/lib"
      - name: Acquire fixed Linux LibTorch SDK
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          available=$(df -PB1 . | awk 'NR==2 {print $4}')
          if [ "$available" -lt 9663676416 ]; then echo 'Need estimated 4 GiB SDK/build space plus 5 GiB headroom'; exit 1; fi
          mkdir -p build-native/reference-analysis
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 180 --max-filesize 200000000 'https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.7.1%2Bcpu.zip' --output build-native/reference-analysis/libtorch.zip
          echo '63d572598c8d532128a335018913e795c1bbb32602ce378896dc8cfbb5590976  build-native/reference-analysis/libtorch.zip' | sha256sum -c -
          unzip -q build-native/reference-analysis/libtorch.zip -d build-native/reference-analysis
      - name: Build and compare the affected training step
        shell: pwsh
        run: |
          $torch = "$env:GITHUB_WORKSPACE/build-native/reference-analysis/libtorch"
          cmake -S tools/cpp/reference-analysis/training-step-test -B build-native/reference-analysis/step-test -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$torch"
          if ($LASTEXITCODE -ne 0) { throw 'Training step configure failed' }
          cmake --build build-native/reference-analysis/step-test --config Release --target reference-training-step-test reference-training-ordered-test reference-training-amp-test pando-reference-training-batch --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'Training step build failed' }
          if ($IsWindows) { $binary = 'build-native/reference-analysis/step-test/Release/reference-training-step-test.exe' }
          else { $binary = 'build-native/reference-analysis/step-test/reference-training-step-test' }
          & $binary
          if ($LASTEXITCODE -ne 0) { throw 'Training step differs from original' }
          if ($IsWindows) { $ordered = 'build-native/reference-analysis/step-test/Release/reference-training-ordered-test.exe' }
          else { $ordered = 'build-native/reference-analysis/step-test/reference-training-ordered-test' }
          & $ordered
          if ($LASTEXITCODE -ne 0) { throw 'Ordered checkpoint resume differs' }
          if ($IsWindows) { $amp = 'build-native/reference-analysis/step-test/Release/reference-training-amp-test.exe' }
          else { $amp = 'build-native/reference-analysis/step-test/reference-training-amp-test' }
          & $amp
          if ($LASTEXITCODE -ne 0) { throw 'Training AMP scaling differs' }
          if ($IsWindows) { $env:PANDO_REFERENCE_BATCH_BINARY = "$env:GITHUB_WORKSPACE/build-native/reference-analysis/step-test/Release/pando-reference-training-batch.exe" }
          else { $env:PANDO_REFERENCE_BATCH_BINARY = "$env:GITHUB_WORKSPACE/build-native/reference-analysis/step-test/pando-reference-training-batch" }
          node --test tests/unit/reference-training-batch-refusal.test.mjs tests/unit/reference-training-batch-manager.test.mjs tests/unit/reference-training-progress.test.mjs tests/unit/reference-training-validation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Training batch refusal check failed' }
      - name: Package the training batch engine
        shell: pwsh
        run: |
          if ($IsWindows) { $batch = 'build-native/reference-analysis/step-test/Release/pando-reference-training-batch.exe' }
          else { $batch = 'build-native/reference-analysis/step-test/pando-reference-training-batch' }
          node tools/reference-analysis/package-native-reference.mjs --kind training-batch --binary $batch --directory build-native/reference-analysis/artifact-batch
          if ($LASTEXITCODE -ne 0) { throw 'Training batch packaging failed' }
          $env:PANDO_REFERENCE_BATCH_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/reference-analysis/artifact-batch"
          $env:PANDO_REFERENCE_TORCH_LIBRARY = "$env:GITHUB_WORKSPACE/build-native/reference-analysis/libtorch/lib"
          node --test tests/unit/reference-training-order.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source-bound balanced training order failed' }
          if (-not $IsWindows) {
            node --input-type=module -e "import {matchingTorchLibrary} from './tools/reference-analysis/native-infer.mjs'; matchingTorchLibrary(process.env.GITHUB_WORKSPACE+'/build-native/reference-analysis/libtorch/lib',{runtimeVersion:'2.7.1'})"
            if ($LASTEXITCODE -ne 0) { throw 'Linux LibTorch runtime identity failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reference-training-batch-${{ matrix.os }}-${{ github.sha }}
          path: build-native/reference-analysis/artifact-batch/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and package the existing Windows resume proof
        if: runner.os == 'Windows' && inputs.target == 'reference-step'
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/reference-analysis/native -A x64 -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/build-native/reference-analysis/libtorch" -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_REFERENCE_MODEL=ON
          if ($LASTEXITCODE -ne 0) { throw 'Reference proof configure failed' }
          cmake --build build-native/reference-analysis/native --config Release --target pando-reference-training-proof --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'Reference proof build failed' }
          node tools/reference-analysis/package-native-reference.mjs --kind training-proof --binary build-native/reference-analysis/native/Release/pando-reference-training-proof.exe --directory build-native/reference-analysis/artifact-proof
          if ($LASTEXITCODE -ne 0) { throw 'Reference proof packaging failed' }
          $env:PANDO_REFERENCE_TRAINING_PROOF_BINARY = "$env:GITHUB_WORKSPACE/build-native/reference-analysis/native/Release/pando-reference-training-proof.exe"
          node --test tests/unit/reference-training-proof.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reference proof refusal check failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && inputs.target == 'reference-step' && always()
        with:
          name: native-reference-training-proof-${{ github.sha }}
          path: build-native/reference-analysis/artifact-proof/
          if-no-files-found: ignore
          retention-days: 7
  map-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'map-evaluation'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build evaluation and reviewed-mask tools
        shell: pwsh
        run: |
          cmake -S tools/cpp/map-review -B build-native/map-review/native
          if ($LASTEXITCODE -ne 0) { throw 'Review configure failed' }
          cmake --build build-native/map-review/native --config Release --target pando-map-review --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Review build failed' }
          cmake -S tools/cpp/map-evaluation -B build-native/map-evaluation/native
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation configure failed' }
          cmake --build build-native/map-evaluation/native --config Release --target pando-map-evaluation --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation build failed' }
      - name: Compare evaluation with the original Python results
        shell: pwsh
        run: |
          if ($IsWindows) {
            $review = 'build-native/map-review/native/Release/pando-map-review.exe'
            $evaluation = 'build-native/map-evaluation/native/Release/pando-map-evaluation.exe'
          } else {
            $review = 'build-native/map-review/native/pando-map-review'
            $evaluation = 'build-native/map-evaluation/native/pando-map-evaluation'
          }
          node tools/reference-analysis/package-native-review.mjs --binary $review --directory build-native/map-review/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Review packaging failed' }
          node tools/reference-analysis/package-native-evaluation.mjs --binary $evaluation --directory build-native/map-evaluation/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation packaging failed' }
          $env:PANDO_MAP_EVALUATION_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-evaluation/artifact"
          node --test tests/unit/reference-native-evaluation.test.mjs tests/unit/reference-native-diagnostic.test.mjs tests/unit/reference-training-lineage.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation differs from original' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-map-evaluation-${{ matrix.os }}-${{ github.sha }}
          path: build-native/map-evaluation/artifact/
          if-no-files-found: ignore
          retention-days: 7
  map-review:
