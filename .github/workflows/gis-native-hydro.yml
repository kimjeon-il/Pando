          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Image resize packaging failed' }
          $env:PANDO_MAP_PDF_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-pdf/artifact"
          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          node --test tests/unit/document/map-native-pdf.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF input differs from original' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-map-pdf-${{ matrix.os }}-${{ github.sha }}
          path: build-native/map-pdf/artifact/
          if-no-files-found: error
