  hydro-point-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'hydro-point-windows'
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the matching GEOS and PROJ development SDK
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/hydro-point-sdk"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $packages = @(
            @{name='geos'; path='geos/geos-devel/geos-devel-3.15.0-1.tar.bz2'; sha='6D62956B904C0BC5B2825F2EADFBD1DCD2342B82F1881E79AAE6561CE1EE2021'},
            @{name='proj'; path='proj/proj-devel/proj-devel-9.8.1-1.tar.bz2'; sha='B8A6F4DBB800F019BE4F4C45849B53818F2074213B850DFC38681CC99D0E3889'}
          )
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          foreach ($package in $packages) {
            $archive = Join-Path $sdk ($package.name + '.tar.bz2')
            $url = 'https://download-cache.osgeo.org/osgeo4w/v2/x86_64/release/' + $package.path
            curl.exe --proto '=https' --tlsv1.2 --fail --location --max-time 120 --max-filesize 3000000 $url --output $archive
            if ($LASTEXITCODE -ne 0) { throw "SDK download failed: $($package.name)" }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $package.sha) { throw "SDK digest mismatch: $($package.name)" }
            & $zip x -y $archive "-o$sdk/packed" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "SDK decompression failed: $($package.name)" }
            & $zip x -y "$sdk/packed/$($package.name).tar" "-o$sdk" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "SDK extraction failed: $($package.name)" }
          }
      - name: Build and package the Windows point screen
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/hydro-point-screen -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON -DPANDO_QGIS_SDK_ROOT="$env:GITHUB_WORKSPACE/build-native/hydro-point-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Hydro point-screen configure failed' }
          cmake --build build-native/hydro-point-screen --config Release --target pando-hydro-point-screen --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'Hydro point-screen build failed' }
          node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/Release/pando-hydro-point-screen.exe --directory build-native/hydro-point-screen/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Hydro point-screen packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-hydro-point-screen-windows-x64-${{ github.sha }}
          path: build-native/hydro-point-screen/artifact/
          if-no-files-found: error
          retention-days: 7
  hydro-point-screen:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'hydro-point-screen' || inputs.target == 'hydro-batch01' || inputs.target == 'hydro-batch02' || inputs.target == 'hydro-batch03' || inputs.target == 'hydro-yarra')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only native geometry development dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev ninja-build
      - name: Build the point screen
        run: |
          cmake -S tools/cpp -B build-native/hydro-point-screen -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON
          cmake --build build-native/hydro-point-screen --target pando-hydro-point-screen
      - name: Verify small point-screen cases
        env:
          PANDO_HYDRO_POINT_SCREEN_BINARY: ${{ github.workspace }}/build-native/hydro-point-screen/pando-hydro-point-screen
        run: node --test tests/unit/geometry/hydro-connectivity-native.test.mjs tests/unit/geometry/hydro-source-selection.test.mjs
      - name: Package the source-bound point screen
        run: node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/pando-hydro-point-screen --directory build-native/hydro-point-screen/artifact
      - name: Read the paired data revision
        id: hydro-data-pin
        run: node -e "console.log('revision='+require('./config/library-data.json').revision)" >> "$GITHUB_OUTPUT"
      - name: Fetch only the pinned Hydro bundle
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: ${{ steps.hydro-data-pin.outputs.revision }}
          path: .pando-hydro-input
          persist-credentials: false
          filter: blob:none
          sparse-checkout: assets/data/hydro/v0.13.2
      - name: Compare the five selected real Hydro systems
        if: inputs.target == 'hydro-point-screen'
        run: |
          node tools/gis/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-point-decoded.json
          node tools/gis/verify-independent-river-point-anchors.mjs --decoded /tmp/pando-point-decoded.json --output /tmp/pando-point-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const oldResult=JSON.parse(readFileSync('tests/fixtures/hydro-independent-point-screen-v0132-expected.json','utf8'));
          const newResult=JSON.parse(readFileSync('/tmp/pando-point-native.json','utf8'));
          assert.deepEqual(newResult,oldResult);
          console.log('All five real system screens match the frozen source-verified baseline');
          JS
      - name: Compare the ten selected systems with the frozen original audit
        if: inputs.target == 'hydro-batch01'
        run: |
          node tools/gis/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-batch01-decoded.json
          node tools/gis/verify-osm-hydro-batch01-anchors.mjs --decoded /tmp/pando-batch01-decoded.json --output /tmp/pando-batch01-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const baseline=JSON.parse(readFileSync('tests/fixtures/hydro-osm-batch01-v0132-expected.json','utf8'));
          const native=JSON.parse(readFileSync('/tmp/pando-batch01-native.json','utf8'));
          assert.deepEqual(native,baseline);
          console.log('All ten real system screens match the source-verified baseline');
          JS
      - name: Compare second-ten audit with and without optional sources against the frozen baseline
        if: inputs.target == 'hydro-batch02'
        run: |
          node tools/gis/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-batch02-decoded.json
          node tools/gis/verify-osm-hydro-batch02-points.mjs --decoded /tmp/pando-batch02-decoded.json --output /tmp/batch02-native-default.json
          node tools/gis/verify-osm-hydro-batch02-points.mjs --decoded /tmp/pando-batch02-decoded.json --external-gauges tests/fixtures/hydro-osm-batch02-gauges-fixture.json --nga tests/fixtures/hydro-osm-batch02-nga-fixture.json --output /tmp/batch02-native-sources.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          for(const suffix of ['default','sources'])assert.deepEqual(
            JSON.parse(readFileSync(`/tmp/batch02-native-${suffix}.json`,'utf8')),
            JSON.parse(readFileSync(`tests/fixtures/hydro-osm-batch02-${suffix}-v0132-expected.json`,'utf8')));
          console.log('Second-ten results match the frozen baseline with and without optional sources');
          JS
      - name: Compare last-eleven audit against the frozen baseline using fixed NGA responses
        if: inputs.target == 'hydro-batch03'
        run: |
          node tools/gis/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-batch03-decoded.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {probeNgaBatch03} from './tools/gis/probe-nga-streams.mjs';
          import {screenHydroPoints} from './tools/gis/hydro-point-screen-native.mjs';
          import {buildBatch03Screen} from './tools/gis/verify-osm-hydro-batch03-points.mjs';
          const bytes=readFileSync('tests/fixtures/hydro-osm-batch03-nga-response.json');
          const receipts=await probeNgaBatch03({fetcher:async()=>new Response(bytes,{status:200})});
          const decoded=JSON.parse(readFileSync('/tmp/pando-batch03-decoded.json','utf8'));
          const native=await buildBatch03Screen(decoded,{receipts,screen:screenHydroPoints});
          writeFileSync('/tmp/batch03-native.json',JSON.stringify(native,null,2)+'\n',{flag:'wx'});
          assert.deepEqual(native,JSON.parse(readFileSync('tests/fixtures/hydro-osm-batch03-v0132-expected.json','utf8')));
          console.log('All eleven real systems match the frozen baseline with fixed NGA responses');
          JS
      - name: Compare real Yarra source with the frozen original audit
        if: inputs.target == 'hydro-yarra'
        run: |
          node tools/gis/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-yarra-decoded.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {fetchYarraVector} from './tools/gis/verify-victorian-yarra-source.mjs';
          const bytes=await fetchYarraVector();
          assert.equal(createHash('sha256').update(bytes).digest('hex'),'70a2b0c84e9094258c64514d1392f7ef712fbaa7312754a7b80296e3dbb50fb6');
          writeFileSync('/tmp/pando-yarra-reference.json',bytes,{flag:'wx'});
          JS
          node tools/gis/verify-victorian-yarra-source.mjs --decoded /tmp/pando-yarra-decoded.json --reference /tmp/pando-yarra-reference.json --expected-sha256 70a2b0c84e9094258c64514d1392f7ef712fbaa7312754a7b80296e3dbb50fb6 --output /tmp/pando-yarra-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          assert.deepEqual(JSON.parse(readFileSync('/tmp/pando-yarra-native.json','utf8')),JSON.parse(readFileSync('tests/fixtures/hydro-yarra-v0132-expected.json','utf8')));
          console.log('The real Yarra source matches the frozen bidirectional screen');
          JS
  qgis-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'qgis-windows'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install locked MCP test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reuse pinned QGIS SDK archives
        id: qgis-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: build-native/qgis-sdk/*.tar.bz2
          key: qgis-sdk-${{ runner.os }}-qgis-3.44.15-qt-5.15.13-gdal-3.13.3-geos-3.15.0-proj-9.8.1-v1
      - name: Download and verify the matching OSGeo4W development packages
        shell: pwsh
        run: |
          if ((Get-PSDrive -Name C).Free -lt 7GB) { throw 'Need estimated 2 GiB SDK/build space plus 5 GiB headroom' }
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $packages = @(
            @{name='qgis'; path='qgis/qgis-ltr/qgis-ltr-devel/qgis-ltr-devel-3.44.15-1.tar.bz2'; sha='D55BA2C310AAEEE31C075AE049CF4ADDD51701988534616F4ECB475FC3097897'},
            @{name='qt'; path='qt5/qt5-devel/qt5-devel-5.15.13-2.tar.bz2'; sha='D3F70B83B9BBEB7F6EDE7054D7DC3607F2C5DBE02DC316C79C33BD6ED3B6389C'},
            @{name='gdal'; path='gdal/gdal-devel/gdal-devel-3.13.3-3.tar.bz2'; sha='2475B7AB14A8437B925D1E96908AD5E22B8296ADF01E00B9ECA3EF0816B736C2'},
            @{name='geos'; path='geos/geos-devel/geos-devel-3.15.0-1.tar.bz2'; sha='6D62956B904C0BC5B2825F2EADFBD1DCD2342B82F1881E79AAE6561CE1EE2021'},
            @{name='proj'; path='proj/proj-devel/proj-devel-9.8.1-1.tar.bz2'; sha='B8A6F4DBB800F019BE4F4C45849B53818F2074213B850DFC38681CC99D0E3889'}
          )
          foreach ($package in $packages) {
            $archive = Join-Path $sdk ($package.name + '.tar.bz2')
            if ((Test-Path -LiteralPath $archive -PathType Leaf) -and (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -eq $package.sha) {
              Write-Output "Reusing verified $($package.name) SDK archive"
              continue
            }
            Write-Output "Downloading $($package.name) SDK"
            $url = 'https://download-cache.osgeo.org/osgeo4w/v2/x86_64/release/' + $package.path
            curl.exe --proto '=https' --tlsv1.2 --fail --location --max-time 180 --max-filesize 30000000 $url --output $archive
            if ($LASTEXITCODE -ne 0) { throw "SDK download failed: $($package.name)" }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $package.sha) { throw "SDK digest mismatch: $($package.name)" }
          }
      - name: Cache verified QGIS SDK archives
        if: steps.qgis-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-native/qgis-sdk/*.tar.bz2
          key: ${{ steps.qgis-sdk-cache.outputs.cache-primary-key }}
      - name: Extract QGIS headers and import libraries
        timeout-minutes: 4
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $zip x -y "$sdk/qgis.tar.bz2" "-o$sdk/packed" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'QGIS SDK decompression failed' }
          & $zip x -y "$sdk/packed/qgis.tar" "-o$sdk" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'QGIS SDK extraction failed' }
      - name: Extract Qt headers and import libraries
        timeout-minutes: 6
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $zip x -y "$sdk/qt.tar.bz2" "-o$sdk/packed" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK decompression failed' }
          & $zip x -y "$sdk/packed/qt.tar" "-o$sdk" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK extraction failed' }
      - name: Extract GIS development headers
        timeout-minutes: 4
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          foreach ($name in @('gdal','geos','proj')) {
            & $zip x -y "$sdk/$name.tar.bz2" "-o$sdk/packed" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name SDK decompression failed" }
            & $zip x -y "$sdk/packed/$name.tar" "-o$sdk" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name SDK extraction failed" }
          }
      - name: Build the optional native QGIS bridge
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/qgis/native -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_QGIS_BRIDGE=ON -DPANDO_QGIS_SDK_ROOT="$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'QGIS CMake configure failed' }
          cmake --build build-native/qgis/native --config Release --target pando-qgis-bridge --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'QGIS native bridge build failed' }
      - name: Test authenticated client transport
        run: node --test tests/unit/geometry/qgis-native-client.test.mjs tests/unit/geometry/qgis-native-export.test.mjs  tests/unit/geometry/qgis-native-mcp.test.mjs
      - name: Package the source-bound bridge
        shell: pwsh
        run: |
          node tools/qgis/package-native-plugin.mjs --binary build-native/qgis/native/Release/pando_qgis_bridge.dll --directory build-native/qgis/artifact
          if ($LASTEXITCODE -ne 0) { throw 'QGIS bridge packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-qgis-bridge-windows-x64-${{ github.sha }}
          path: build-native/qgis/artifact/
          if-no-files-found: error
          retention-days: 7
  native-hydro:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'hydro'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build only the standalone C++ Hydro junction engine
        run: |
          cmake -S tools/cpp -B build-native/hydro -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF \
            -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF \
            -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          cmake --build build-native/hydro --target pando-hydro-connectivity
      - name: Package source-bound Hydro connectivity engine
        run: node tools/gis/package-hydro-connectivity.mjs --binary build-native/hydro/pando-hydro-connectivity --directory build-native/hydro/artifact
      - name: Verify source-proven confluence and border-alignment invariants
        env:
          PANDO_HYDRO_CONNECTIVITY_BINARY: ./build-native/hydro/pando-hydro-connectivity
          PANDO_HYDRO_CONNECTIVITY_DIRECTORY: ${{ github.workspace }}/build-native/hydro/artifact
        run: node --test tests/unit/geometry/hydro-connectivity-native.test.mjs tests/unit/geometry/hydro-outlets.test.mjs tests/unit/geometry/hydro-source-reader.test.mjs tests/unit/geometry/hydro-repair-cli.test.mjs tests/unit/geometry/hydro-source-reader.test.mjs tests/unit/geometry/hydro-name.test.mjs tests/unit/geometry/hydro-system-names.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hydro-connectivity-linux-${{ github.sha }}
          path: build-native/hydro/artifact/
          retention-days: 7
  native-hydro-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'hydro'
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and package the Windows Hydro connectivity engine
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/hydro -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          if ($LASTEXITCODE -ne 0) { throw 'Hydro configuration failed' }
          cmake --build build-native/hydro --config Release --target pando-hydro-connectivity
          if ($LASTEXITCODE -ne 0) { throw 'Hydro build failed' }
          node tools/gis/package-hydro-connectivity.mjs --binary build-native/hydro/Release/pando-hydro-connectivity.exe --directory build-native/hydro/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Hydro packaging failed' }
      - name: Verify Windows Hydro connectivity and audit
        shell: pwsh
        run: |
          $env:PANDO_HYDRO_CONNECTIVITY_BINARY = "$env:GITHUB_WORKSPACE/build-native/hydro/Release/pando-hydro-connectivity.exe"
          $env:PANDO_HYDRO_CONNECTIVITY_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/hydro/artifact"
          node --test tests/unit/geometry/hydro-connectivity-native.test.mjs tests/unit/geometry/hydro-outlets.test.mjs tests/unit/geometry/hydro-source-reader.test.mjs tests/unit/geometry/hydro-repair-cli.test.mjs tests/unit/geometry/hydro-source-reader.test.mjs tests/unit/geometry/hydro-name.test.mjs tests/unit/geometry/hydro-system-names.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Hydro connectivity checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: hydro-connectivity-windows-${{ github.sha }}
          path: build-native/hydro/artifact/
          retention-days: 7
  pc-allocation:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pc-allocation'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build only the standalone Windows allocation auditor
        run: |
          cmake -S tools/cpp -B build-native/pc-allocation -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_CONNECTIVITY=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF -DPANDO_BUILD_PC_ALLOCATION=ON
          cmake --build build-native/pc-allocation --config Release --target pando-pc-file-allocation
      - name: Verify real Windows file identities and allocation
        env:
          PANDO_PC_ALLOCATION_BINARY: ${{ github.workspace }}/build-native/pc-allocation/Release/pando-pc-file-allocation.exe
        run: node --test tests/unit/data/worktree-storage.test.mjs tests/unit/document/native-tool.test.mjs
      - name: Package source and binary identities
        run: node tools/build/package-native-allocation.mjs --binary build-native/pc-allocation/Release/pando-pc-file-allocation.exe --directory build-native/pc-allocation
      - name: Verify the downloaded-tool invocation contract in the real cleanup owner
        run: node --test tests/unit/data/worktree-storage.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-pc-allocation-windows-x64-${{ github.sha }}
          path: |
            build-native/pc-allocation/pando-pc-file-allocation.exe
            build-native/pc-allocation/native-tool.manifest.json
          if-no-files-found: error
          retention-days: 7
