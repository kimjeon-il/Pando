        run: node --test tests/unit/hydro-point-screen-native.test.mjs tests/unit/hydro-independent-point-screen.test.mjs tests/unit/hydro-osm-batch01-screen.test.mjs tests/unit/hydro-osm-batch02-screen.test.mjs tests/unit/hydro-osm-batch03-screen.test.mjs tests/unit/hydro-batch03-nga-probe.test.mjs tests/unit/hydro-yarra-vector-screen.test.mjs
      - name: Package the source-bound point screen
        run: node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/pando-hydro-point-screen --directory build-native/hydro-point-screen/artifact
      - name: Read the paired data revision
        id: hydro-data-pin
        run: node -e "console.log('revision='+require('./config/library-data.json').revision)" >> "$GITHUB_OUTPUT"
      - name: Fetch only the pinned Hydro bundle
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: ${{ steps.hydro-data-pin.outputs.revision }}
          path: .pando-hydro-input
          persist-credentials: false
          filter: blob:none
          sparse-checkout: assets/data/hydro/v0.13.2
      - name: Compare the five selected real Hydro systems
        if: inputs.target == 'hydro-point-screen'
        run: |
          node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-point-decoded.json
          node tools/gis/verify-independent-river-point-anchors.mjs --decoded /tmp/pando-point-decoded.json --output /tmp/pando-point-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const oldResult=JSON.parse(readFileSync('tests/fixtures/hydro-independent-point-screen-v0132-expected.json','utf8'));
          const newResult=JSON.parse(readFileSync('/tmp/pando-point-native.json','utf8'));
          assert.deepEqual(newResult,oldResult);
          console.log('All five real system screens match the frozen source-verified baseline');
          JS
      - name: Compare the ten selected systems with the frozen original audit
        if: inputs.target == 'hydro-batch01'
        run: |
          node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-batch01-decoded.json
          node tools/gis/verify-osm-hydro-batch01-anchors.mjs --decoded /tmp/pando-batch01-decoded.json --output /tmp/pando-batch01-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const baseline=JSON.parse(readFileSync('tests/fixtures/hydro-osm-batch01-v0132-expected.json','utf8'));
          const native=JSON.parse(readFileSync('/tmp/pando-batch01-native.json','utf8'));
          assert.deepEqual(native,baseline);
