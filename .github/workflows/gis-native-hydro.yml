name: GIS native Hydro junction contracts

on:
  push:
    branches: [ work/gis ]
    paths:
      - 'tools/cpp/CMakeLists.txt'
      - 'tools/cpp/hydro/connectivity-junctions.cpp'
      - 'tools/gis/hydro-connectivity-native.mjs'
      - 'tests/unit/geometry/hydro-connectivity-native.test.mjs'
      - 'tools/gis/build-hydro.mjs'
      - 'tools/gis/repair-hydro-connectivity.mjs'
      - 'tests/unit/geometry/hydro-canonical-chains.test.mjs'
      - '.github/workflows/gis-native-hydro.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Standalone native tool to build and verify
        type: choice
        options: [ hydro, hydro-chains, hydro-outlets, hydro-encoding, hydro-encoding-integrated, hydro-point-screen, hydro-shared-boundary, hydro-batch01, hydro-batch02, hydro-batch03, hydro-yarra, hydro-point-windows, physical-hydro, physical-raster, pc-allocation, qgis-windows, map-image, map-pdf, map-preview, terrain-dem-check, terrain-dem-check-integrated, terrain-dem-raster, terrain-dem-path, terrain-dem-gutters, terrain-dem-gutters-integrated, terrain-dem-tint, terrain-dem-encode, terrain-dem-fill-windows ]
        default: hydro

permissions:
  contents: read

jobs:
  hydro-outlets:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'hydro-outlets'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check space for the existing GDAL SDK
        run: |
          available=$(df -PB1 . | awk 'NR==2 {print $4}')
          if [ "$available" -lt 7516192768 ]; then echo 'Need 2 GiB SDK/build space plus 5 GiB headroom'; exit 1; fi
      - uses: mamba-org/setup-micromamba@v3
        id: hydro-outlet-gdal
        with:
          environment-name: pando-dem-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build only Hydro outlet geometry and connectivity
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev zlib1g-dev ninja-build
          cmake -S tools/cpp -B build-native/hydro-outlets -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          cmake --build build-native/hydro-outlets --target pando-hydro-point-screen pando-hydro-connectivity
          node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-outlets/pando-hydro-point-screen --directory build-native/hydro-outlets/point-artifact
          node tools/gis/package-hydro-connectivity.mjs --binary build-native/hydro-outlets/pando-hydro-connectivity --directory build-native/hydro-outlets/connectivity-artifact
          cmake -S tools/cpp/hydro-encoding -B build-native/hydro-outlets/encoding -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native/hydro-outlets/encoding --target pando-hydro-encoding
          node tools/gis/package-hydro-encoding.mjs --binary build-native/hydro-outlets/encoding/pando-hydro-encoding --directory build-native/hydro-outlets/encoding-artifact
          cmake -S tools/cpp/physical-raster -B build-native/hydro-outlets/raster -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH='${{ steps.hydro-outlet-gdal.outputs.environment-path }}'
          cmake --build build-native/hydro-outlets/raster --target pando-physical-raster
          node tools/gis/package-physical-raster.mjs --binary build-native/hydro-outlets/raster/pando-physical-raster --directory build-native/hydro-outlets/raster-artifact
          echo 'LD_LIBRARY_PATH=${{ steps.hydro-outlet-gdal.outputs.environment-path }}/lib' >> "$GITHUB_ENV"
      - name: Check outlet geometry, selection and classification
        env:
          PANDO_HYDRO_POINT_SCREEN_BINARY: ${{ github.workspace }}/build-native/hydro-outlets/pando-hydro-point-screen
          PANDO_HYDRO_POINT_SCREEN_DIRECTORY: ${{ github.workspace }}/build-native/hydro-outlets/point-artifact
          PANDO_HYDRO_CONNECTIVITY_BINARY: ${{ github.workspace }}/build-native/hydro-outlets/pando-hydro-connectivity
          PANDO_HYDRO_CONNECTIVITY_DIRECTORY: ${{ github.workspace }}/build-native/hydro-outlets/connectivity-artifact
          PANDO_HYDRO_ENCODING_DIRECTORY: ${{ github.workspace }}/build-native/hydro-outlets/encoding-artifact
          PANDO_PHYSICAL_RASTER_DIRECTORY: ${{ github.workspace }}/build-native/hydro-outlets/raster-artifact
        run: node --test --test-name-pattern='Hydro metadata|Hydro shard|generation command|generation manifest|selected Hydro source flows|river source discovery|official Rhine source|regional Hydro pipeline|river feature assembly|Natural Earth lake features|system fragments retain|reference river name candidates|reference naming|border candidate|shared country borders|whole border alignment|partial border|short consecutive reaches|complete and partial border|different border pairs|chain normalization|network normalization|outlet observations|outlet pipeline|water raster sampling|verified indexed source selection' tests/unit/geometry/hydro-connectivity-native.test.mjs tests/unit/geometry/hydro-outlets.test.mjs tests/unit/geometry/hydro-source-selection.test.mjs tests/unit/geometry/hydro-border-alignment.test.mjs tests/unit/geometry/hydro-canonical-chains.test.mjs  tests/unit/data/hydro-river-features.test.mjs  tests/unit/geometry/hydro-generation-command.test.mjs tests/unit/data/hydro-packfile.test.mjs
  hydro-chains:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'hydro-chains'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify Hydro chain and junction logic
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/hydro -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          if ($LASTEXITCODE -ne 0) { throw 'Hydro configure failed' }
          cmake --build build-native/hydro --config Release --target pando-hydro-connectivity --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Hydro build failed' }
          if ($IsWindows) { $env:PANDO_HYDRO_CONNECTIVITY_BINARY = "$env:GITHUB_WORKSPACE/build-native/hydro/Release/pando-hydro-connectivity.exe" }
          else { $env:PANDO_HYDRO_CONNECTIVITY_BINARY = "$env:GITHUB_WORKSPACE/build-native/hydro/pando-hydro-connectivity" }
          node --test --test-name-pattern='chain endpoint normalization|border grouping|border substrings|streaming source selection|logical river chains|river systems select|river width profiles|hydro visibility|terminal decisions|outlet sample|native audits|native repairs' tests/unit/geometry/hydro-connectivity-native.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Hydro chain or junction check failed' }
          node tools/gis/package-hydro-connectivity.mjs --binary "$env:PANDO_HYDRO_CONNECTIVITY_BINARY" --directory build-native/hydro/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Hydro packaging failed' }
          $env:PANDO_HYDRO_CONNECTIVITY_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/hydro/artifact"
          node --test --test-name-pattern='verified source selection exposes' tests/unit/geometry/hydro-source-reader.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Hydro streamed selection check failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: hydro-selection-${{ matrix.os }}-${{ github.sha }}
          path: build-native/hydro/artifact/
          if-no-files-found: error
          retention-days: 7
  hydro-shared-boundary:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'hydro-shared-boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the GEOS point screen and Hydro chain engine
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev ninja-build
          cmake -S tools/cpp -B build-native/hydro-point-screen -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          cmake --build build-native/hydro-point-screen --target pando-hydro-point-screen pando-hydro-connectivity
          node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/pando-hydro-point-screen --directory build-native/hydro-point-screen/artifact
          node tools/gis/package-hydro-connectivity.mjs --binary build-native/hydro-point-screen/pando-hydro-connectivity --directory build-native/hydro-point-screen/connectivity-artifact
          cmake -S tools/cpp/hydro-calibration -B build-native/hydro-point-screen/calibration -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native/hydro-point-screen/calibration --target pando-hydro-calibration
          node tools/gis/package-hydro-calibration.mjs --binary build-native/hydro-point-screen/calibration/pando-hydro-calibration --directory build-native/hydro-point-screen/calibration-artifact
      - name: Check exact shared-boundary and existing point-screen cases
        env:
          PANDO_HYDRO_POINT_SCREEN_BINARY: ${{ github.workspace }}/build-native/hydro-point-screen/pando-hydro-point-screen
          PANDO_HYDRO_POINT_SCREEN_DIRECTORY: ${{ github.workspace }}/build-native/hydro-point-screen/artifact
          PANDO_HYDRO_CONNECTIVITY_DIRECTORY: ${{ github.workspace }}/build-native/hydro-point-screen/connectivity-artifact
          PANDO_HYDRO_CALIBRATION_ARTIFACT: ${{ github.workspace }}/build-native/hydro-point-screen/calibration-artifact
        run: node --test tests/unit/geometry/hydro-shared-boundary.test.mjs tests/unit/geometry/hydro-connectivity-native.test.mjs tests/unit/geometry/hydro-source-selection.test.mjs tests/unit/geometry/hydro-canonical-chains.test.mjs tests/unit/geometry/hydro-source-reader.test.mjs tests/unit/geometry/hydro-osm-waterway.test.mjs tests/unit/geometry/hydro-system-names.test.mjs    tests/unit/data/hydro-packfile.test.mjs tests/unit/geometry/hydro-river-groups.test.mjs
  terrain-dem-path:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'terrain-dem-path'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/unit/geometry/terrain-dem-path.test.mjs
  terrain-dem-tint:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'terrain-dem-tint'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check space for the focused GDAL SDK
        shell: pwsh
        run: |
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          if ($drive.AvailableFreeSpace -lt 7GB) { throw 'Need estimated 2 GiB SDK/build space plus 5 GiB headroom' }
      - uses: mamba-org/setup-micromamba@v3
        id: tint-gdal
        with:
          environment-name: pando-dem-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build tint sampler and fill tool; compare frozen pixels
        shell: pwsh
        run: |
          $prefix = '${{ steps.tint-gdal.outputs.environment-path }}'
          if ($IsWindows) { $sdk = "$prefix/Library"; $env:PATH = "$sdk/bin$([IO.Path]::PathSeparator)$env:PATH" }
          else { $sdk = $prefix; $env:LD_LIBRARY_PATH = "$sdk/lib$([IO.Path]::PathSeparator)$env:LD_LIBRARY_PATH" }
          cmake -S tools/cpp/terrain-dem-tint -B build-native/terrain-dem-tint "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Tint sampling configuration failed' }
          cmake --build build-native/terrain-dem-tint --config Release --target pando-terrain-dem-tint
          if ($LASTEXITCODE -ne 0) { throw 'Tint sampler build failed' }
          cmake -S tools/cpp/terrain-dem-fill -B build-native/terrain-dem-encode "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Tint fill configuration failed' }
          cmake --build build-native/terrain-dem-encode --config Release --target pando-terrain-dem-fill
          if ($LASTEXITCODE -ne 0) { throw 'Tint fill build failed' }
          if ($IsWindows) { $tint='build-native/terrain-dem-tint/Release/pando-terrain-dem-tint.exe'; $fill='build-native/terrain-dem-encode/Release/pando-terrain-dem-fill.exe' }
          else { $tint='build-native/terrain-dem-tint/pando-terrain-dem-tint'; $fill='build-native/terrain-dem-encode/pando-terrain-dem-fill' }
          node tools/gis/package-terrain-dem-tint.mjs --binary $tint --directory build-native/terrain-dem-tint/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Tint sampler packaging failed' }
          node tools/gis/package-terrain-dem-fill.mjs --binary $fill --directory build-native/terrain-dem-encode/fill-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Tint fill packaging failed' }
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Tint image configuration failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Tint image build failed' }
          if ($IsWindows) { $image='build-native/map-image/Release/pando-map-image.exe' }
          else { $image='build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Tint image packaging failed' }
          $env:PANDO_TERRAIN_DEM_TINT_DIRECTORY="$env:GITHUB_WORKSPACE/build-native/terrain-dem-tint/artifact"
          $env:PANDO_TERRAIN_DEM_FILL_DIRECTORY="$env:GITHUB_WORKSPACE/build-native/terrain-dem-encode/fill-artifact"
          $env:PANDO_MAP_IMAGE_ARTIFACT="$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          node --test tests/unit/geometry/terrain-dem-tint.test.mjs tests/unit/geometry/terrain-dem-fill.test.mjs tests/unit/geometry/terrain-dem-webp.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Tint pixels differ from the frozen Python oracle' }
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-tint-conda-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-tint/artifact/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-fill-conda-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-encode/fill-artifact/
          if-no-files-found: error
          retention-days: 7
  terrain-dem-gutters:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'terrain-dem-gutters' || inputs.target == 'terrain-dem-gutters-integrated')
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify DEM gutter pixels
        shell: pwsh
        run: |
          cmake -S tools/cpp/terrain-dem-gutters -B build-native/terrain-dem-gutters -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter configuration failed' }
          cmake --build build-native/terrain-dem-gutters --config Release --target pando-terrain-dem-gutters
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter build failed' }
          if ($IsWindows) { $binary = 'build-native/terrain-dem-gutters/Release/pando-terrain-dem-gutters.exe' }
          else { $binary = 'build-native/terrain-dem-gutters/pando-terrain-dem-gutters' }
          node tools/gis/package-terrain-dem-gutters.mjs --binary $binary --directory build-native/terrain-dem-gutters/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter packaging failed' }
          $env:PANDO_TERRAIN_DEM_GUTTERS_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-gutters/artifact"
          node --test --test-name-pattern 'gutter pixels' tests/unit/geometry/terrain-dem-gutters.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter pixels differ from the Python oracle' }
      - name: Build and verify DEM lossless WebP integration
        if: inputs.target == 'terrain-dem-gutters-integrated'
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'DEM image configuration failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'DEM image build failed' }
          if ($IsWindows) { $binary = 'build-native/map-image/Release/pando-map-image.exe' }
          else { $binary = 'build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $binary --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM image packaging failed' }
          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          $env:PANDO_TERRAIN_DEM_GUTTERS_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-gutters/artifact"
          node --test tests/unit/geometry/terrain-dem-webp.test.mjs tests/unit/geometry/terrain-dem-gutters.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DEM WebP or launcher integration failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-gutters-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-gutters/artifact/
          if-no-files-found: error
          retention-days: 7
  terrain-dem-raster:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'terrain-dem-raster'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check space for the existing GDAL SDK
        shell: pwsh
        run: |
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          if ($drive.AvailableFreeSpace -lt 7GB) { throw 'Need estimated 2 GiB SDK/build space plus 5 GiB headroom' }
      - uses: mamba-org/setup-micromamba@v3
        id: dem-raster-gdal
        with:
          environment-name: pando-dem-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build and compare selected DEM windows
        shell: pwsh
        run: |
          $prefix = '${{ steps.dem-raster-gdal.outputs.environment-path }}'
          if ($IsWindows) { $sdk = "$prefix/Library"; $env:PATH = "$sdk/bin$([IO.Path]::PathSeparator)$env:PATH" }
          else { $sdk = $prefix; $env:LD_LIBRARY_PATH = "$sdk/lib$([IO.Path]::PathSeparator)$env:LD_LIBRARY_PATH" }
          cmake -S tools/cpp/terrain-dem-raster -B build-native/terrain-dem-raster "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM window reader configuration failed' }
          cmake --build build-native/terrain-dem-raster --config Release --target pando-terrain-dem-raster
          if ($LASTEXITCODE -ne 0) { throw 'DEM window reader build failed' }
          if ($IsWindows) { $env:PANDO_TERRAIN_DEM_RASTER_BINARY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-raster/Release/pando-terrain-dem-raster.exe" }
          else { $env:PANDO_TERRAIN_DEM_RASTER_BINARY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-raster/pando-terrain-dem-raster" }
          node tools/gis/package-terrain-dem-raster.mjs --binary $env:PANDO_TERRAIN_DEM_RASTER_BINARY --directory build-native/terrain-dem-raster/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM window reader packaging failed' }
          $env:PANDO_TERRAIN_DEM_RASTER_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-raster/artifact"
          cmake -S tools/cpp/terrain-dem-encode -B build-native/terrain-dem-encode -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder configuration failed' }
          cmake --build build-native/terrain-dem-encode --config Release --target pando-terrain-dem-encode
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder build failed' }
          if ($IsWindows) { $encoder='build-native/terrain-dem-encode/Release/pando-terrain-dem-encode.exe' }
          else { $encoder='build-native/terrain-dem-encode/pando-terrain-dem-encode' }
          node tools/gis/package-terrain-dem-encode.mjs --binary $encoder --directory build-native/terrain-dem-encode/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder packaging failed' }
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'DEM image configuration failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'DEM image build failed' }
          if ($IsWindows) { $image='build-native/map-image/Release/pando-map-image.exe' }
          else { $image='build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM image packaging failed' }
          cmake -S tools/cpp/terrain-dem-gutters -B build-native/terrain-dem-gutters -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter configuration failed' }
          cmake --build build-native/terrain-dem-gutters --config Release --target pando-terrain-dem-gutters
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter build failed' }
          if ($IsWindows) { $gutter='build-native/terrain-dem-gutters/Release/pando-terrain-dem-gutters.exe' }
          else { $gutter='build-native/terrain-dem-gutters/pando-terrain-dem-gutters' }
          node tools/gis/package-terrain-dem-gutters.mjs --binary $gutter --directory build-native/terrain-dem-gutters/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter packaging failed' }
          cmake -S tools/cpp/terrain-dem-tint -B build-native/terrain-dem-tint "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint configuration failed' }
          cmake --build build-native/terrain-dem-tint --config Release --target pando-terrain-dem-tint
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint build failed' }
          cmake -S tools/cpp/terrain-dem-fill -B build-native/terrain-dem-fill "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint fill configuration failed' }
          cmake --build build-native/terrain-dem-fill --config Release --target pando-terrain-dem-fill
