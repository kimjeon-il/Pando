          if ($LASTEXITCODE -ne 0) { throw 'PDF reader configure failed' }
          cmake --build build-native/map-pdf/native --config Release --target pando-map-pdf --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'PDF reader build failed' }
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Image resize configure failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Image resize build failed' }
