          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Image build failed' }
      - name: Compare review overlays with the original pixels
        shell: pwsh
        run: |
          if ($IsWindows) {
            $preview = 'build-native/map-preview/native/Release/pando-map-preview.exe'
            $image = 'build-native/map-image/Release/pando-map-image.exe'
          } else {
            $preview = 'build-native/map-preview/native/pando-map-preview'
            $image = 'build-native/map-image/pando-map-image'
