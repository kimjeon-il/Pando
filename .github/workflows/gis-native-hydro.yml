          node-version: '24'
      - name: Obtain the pinned MuPDF SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-native/map-pdf/sdk | Out-Null
          if ($IsWindows) {
            $url = 'https://files.pythonhosted.org/packages/f9/e8/989f4eaa369c7166dc24f0eaa3023f13788c40ff1b96701f7047421554a8/pymupdf-1.26.6-cp310-abi3-win_amd64.whl'
            $expected = 'ce02ca96ed0d1acfd00331a4d41a34c98584d034155b06fd4ec0f051718de7ba'
          } else {
            $url = 'https://files.pythonhosted.org/packages/4f/bf/6e02e3d84b32c137c71a0a3dcdba8f2f6e9950619a3bc272245c7c06a051/pymupdf-1.26.6-cp310-abi3-manylinux_2_28_x86_64.whl'
            $expected = '7777d0b7124c2ebc94849536b6a1fb85d158df3b9d873935e63036559391534c'
          }
          $wheel = 'build-native/map-pdf/mupdf-sdk.zip'
          Invoke-WebRequest -Uri $url -OutFile $wheel
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $wheel).Hash.ToLowerInvariant() -ne $expected) { throw 'MuPDF SDK hash mismatch' }
          Expand-Archive -LiteralPath $wheel -DestinationPath build-native/map-pdf/sdk
      - name: Build the PDF reader and required image resize tool
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/map-pdf/sdk/pymupdf"
