            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF \
            -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF \
            -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          cmake --build build-native/hydro --target pando-hydro-connectivity
      - name: Package source-bound Hydro connectivity engine
        run: node tools/gis/package-hydro-connectivity.mjs --binary build-native/hydro/pando-hydro-connectivity --directory build-native/hydro/artifact
      - uses: actions/upload-artifact@v4
        with:
          name: hydro-connectivity-linux-${{ github.sha }}
          path: build-native/hydro/artifact/
          retention-days: 7
  native-hydro-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'hydro'
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and package the Windows Hydro connectivity engine
        shell: pwsh
        run: |-
          cmake -S tools/cpp -B build-native/hydro -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          if ($LASTEXITCODE -ne 0) { throw 'Hydro configuration failed' }
          cmake --build build-native/hydro --config Release --target pando-hydro-connectivity
          if ($LASTEXITCODE -ne 0) { throw 'Hydro build failed' }
          node tools/gis/package-hydro-connectivity.mjs --binary build-native/hydro/Release/pando-hydro-connectivity.exe --directory build-native/hydro/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Hydro packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: hydro-connectivity-windows-${{ github.sha }}
          path: build-native/hydro/artifact/
          retention-days: 7
  pc-allocation:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pc-allocation'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build only the standalone Windows allocation auditor
        run: |-
          cmake -S tools/cpp -B build-native/pc-allocation -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_CONNECTIVITY=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF -DPANDO_BUILD_PC_ALLOCATION=ON
          cmake --build build-native/pc-allocation --config Release --target pando-pc-file-allocation
      - name: Package source and binary identities
        run: node tools/build/package-native-allocation.mjs --binary build-native/pc-allocation/Release/pando-pc-file-allocation.exe --directory build-native/pc-allocation
      - uses: actions/upload-artifact@v4
        with:
          name: native-pc-allocation-windows-x64-${{ github.sha }}
          path: |
            build-native/pc-allocation/pando-pc-file-allocation.exe
            build-native/pc-allocation/native-tool.manifest.json
          if-no-files-found: error
          retention-days: 7
