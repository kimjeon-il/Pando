name: GIS native Hydro junction contracts
on:
  push:
    branches:
      - work/gis
    paths:
      - tools/cpp/CMakeLists.txt
      - tools/cpp/hydro/connectivity-junctions.cpp
      - tools/gis/hydro-connectivity-native.mjs
      - tools/gis/build-hydro.mjs
      - tools/gis/repair-hydro-connectivity.mjs
      - .github/workflows/gis-native-hydro.yml
  workflow_dispatch:
    inputs:
      target:
        description: Standalone native tool to build and verify
        type: choice
        options:
          - hydro
          - hydro-outlets
          - hydro-encoding
          - hydro-encoding-integrated
          - hydro-point-screen
          - hydro-shared-boundary
          - hydro-point-windows
          - physical-hydro
          - physical-raster
          - pc-allocation
          - map-image
          - map-pdf
          - map-preview
          - terrain-dem-check
          - terrain-dem-check-integrated
          - terrain-dem-raster
          - terrain-dem-path
          - terrain-dem-gutters
          - terrain-dem-gutters-integrated
          - terrain-dem-tint
          - terrain-dem-encode
          - terrain-dem-fill-windows
        default: hydro
permissions:
  contents: read
jobs:
  terrain-dem-tint:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'terrain-dem-tint'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check space for the focused GDAL SDK
        shell: pwsh
        run: |-
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          if ($drive.AvailableFreeSpace -lt 7GB) { throw 'Need estimated 2 GiB SDK/build space plus 5 GiB headroom' }
      - uses: mamba-org/setup-micromamba@v3
        id: tint-gdal
        with:
          environment-name: pando-dem-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build tint sampler and fill tool; compare frozen pixels
        shell: pwsh
        run: |-
          $prefix = '${{ steps.tint-gdal.outputs.environment-path }}'
          if ($IsWindows) { $sdk = "$prefix/Library"; $env:PATH = "$sdk/bin$([IO.Path]::PathSeparator)$env:PATH" }
          else { $sdk = $prefix; $env:LD_LIBRARY_PATH = "$sdk/lib$([IO.Path]::PathSeparator)$env:LD_LIBRARY_PATH" }
          cmake -S tools/cpp/terrain-dem-tint -B build-native/terrain-dem-tint "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Tint sampling configuration failed' }
          cmake --build build-native/terrain-dem-tint --config Release --target pando-terrain-dem-tint
          if ($LASTEXITCODE -ne 0) { throw 'Tint sampler build failed' }
          cmake -S tools/cpp/terrain-dem-fill -B build-native/terrain-dem-encode "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Tint fill configuration failed' }
          cmake --build build-native/terrain-dem-encode --config Release --target pando-terrain-dem-fill
          if ($LASTEXITCODE -ne 0) { throw 'Tint fill build failed' }
          if ($IsWindows) { $tint='build-native/terrain-dem-tint/Release/pando-terrain-dem-tint.exe'; $fill='build-native/terrain-dem-encode/Release/pando-terrain-dem-fill.exe' }
          else { $tint='build-native/terrain-dem-tint/pando-terrain-dem-tint'; $fill='build-native/terrain-dem-encode/pando-terrain-dem-fill' }
          node tools/gis/package-terrain-dem-tint.mjs --binary $tint --directory build-native/terrain-dem-tint/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Tint sampler packaging failed' }
          node tools/gis/package-terrain-dem-fill.mjs --binary $fill --directory build-native/terrain-dem-encode/fill-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Tint fill packaging failed' }
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Tint image configuration failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Tint image build failed' }
          if ($IsWindows) { $image='build-native/map-image/Release/pando-map-image.exe' }
          else { $image='build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Tint image packaging failed' }
          $env:PANDO_TERRAIN_DEM_TINT_DIRECTORY="$env:GITHUB_WORKSPACE/build-native/terrain-dem-tint/artifact"
          $env:PANDO_TERRAIN_DEM_FILL_DIRECTORY="$env:GITHUB_WORKSPACE/build-native/terrain-dem-encode/fill-artifact"
          $env:PANDO_MAP_IMAGE_ARTIFACT="$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-tint-conda-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-tint/artifact/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-fill-conda-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-encode/fill-artifact/
          if-no-files-found: error
          retention-days: 7
  terrain-dem-gutters:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'terrain-dem-gutters' || inputs.target == 'terrain-dem-gutters-integrated')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and verify DEM gutter pixels
        shell: pwsh
        run: |-
          cmake -S tools/cpp/terrain-dem-gutters -B build-native/terrain-dem-gutters -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter configuration failed' }
          cmake --build build-native/terrain-dem-gutters --config Release --target pando-terrain-dem-gutters
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter build failed' }
          if ($IsWindows) { $binary = 'build-native/terrain-dem-gutters/Release/pando-terrain-dem-gutters.exe' }
          else { $binary = 'build-native/terrain-dem-gutters/pando-terrain-dem-gutters' }
          node tools/gis/package-terrain-dem-gutters.mjs --binary $binary --directory build-native/terrain-dem-gutters/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter packaging failed' }
          $env:PANDO_TERRAIN_DEM_GUTTERS_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-gutters/artifact"
      - name: Build and verify DEM lossless WebP integration
        if: inputs.target == 'terrain-dem-gutters-integrated'
        shell: pwsh
        run: |-
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'DEM image configuration failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'DEM image build failed' }
          if ($IsWindows) { $binary = 'build-native/map-image/Release/pando-map-image.exe' }
          else { $binary = 'build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $binary --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM image packaging failed' }
          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          $env:PANDO_TERRAIN_DEM_GUTTERS_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-gutters/artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-gutters-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-gutters/artifact/
          if-no-files-found: error
          retention-days: 7
  terrain-dem-raster:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'terrain-dem-raster'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check space for the existing GDAL SDK
        shell: pwsh
        run: |-
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          if ($drive.AvailableFreeSpace -lt 7GB) { throw 'Need estimated 2 GiB SDK/build space plus 5 GiB headroom' }
      - uses: mamba-org/setup-micromamba@v3
        id: dem-raster-gdal
        with:
          environment-name: pando-dem-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build and compare selected DEM windows
        shell: pwsh
        run: |-
          $prefix = '${{ steps.dem-raster-gdal.outputs.environment-path }}'
          if ($IsWindows) { $sdk = "$prefix/Library"; $env:PATH = "$sdk/bin$([IO.Path]::PathSeparator)$env:PATH" }
          else { $sdk = $prefix; $env:LD_LIBRARY_PATH = "$sdk/lib$([IO.Path]::PathSeparator)$env:LD_LIBRARY_PATH" }
          cmake -S tools/cpp/terrain-dem-raster -B build-native/terrain-dem-raster "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM window reader configuration failed' }
          cmake --build build-native/terrain-dem-raster --config Release --target pando-terrain-dem-raster
          if ($LASTEXITCODE -ne 0) { throw 'DEM window reader build failed' }
          if ($IsWindows) { $env:PANDO_TERRAIN_DEM_RASTER_BINARY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-raster/Release/pando-terrain-dem-raster.exe" }
          else { $env:PANDO_TERRAIN_DEM_RASTER_BINARY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-raster/pando-terrain-dem-raster" }
          node tools/gis/package-terrain-dem-raster.mjs --binary $env:PANDO_TERRAIN_DEM_RASTER_BINARY --directory build-native/terrain-dem-raster/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM window reader packaging failed' }
          $env:PANDO_TERRAIN_DEM_RASTER_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-raster/artifact"
          cmake -S tools/cpp/terrain-dem-encode -B build-native/terrain-dem-encode -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder configuration failed' }
          cmake --build build-native/terrain-dem-encode --config Release --target pando-terrain-dem-encode
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder build failed' }
          if ($IsWindows) { $encoder='build-native/terrain-dem-encode/Release/pando-terrain-dem-encode.exe' }
          else { $encoder='build-native/terrain-dem-encode/pando-terrain-dem-encode' }
          node tools/gis/package-terrain-dem-encode.mjs --binary $encoder --directory build-native/terrain-dem-encode/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM encoder packaging failed' }
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'DEM image configuration failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'DEM image build failed' }
          if ($IsWindows) { $image='build-native/map-image/Release/pando-map-image.exe' }
          else { $image='build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM image packaging failed' }
          cmake -S tools/cpp/terrain-dem-gutters -B build-native/terrain-dem-gutters -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter configuration failed' }
          cmake --build build-native/terrain-dem-gutters --config Release --target pando-terrain-dem-gutters
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter build failed' }
          if ($IsWindows) { $gutter='build-native/terrain-dem-gutters/Release/pando-terrain-dem-gutters.exe' }
          else { $gutter='build-native/terrain-dem-gutters/pando-terrain-dem-gutters' }
          node tools/gis/package-terrain-dem-gutters.mjs --binary $gutter --directory build-native/terrain-dem-gutters/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM gutter packaging failed' }
          cmake -S tools/cpp/terrain-dem-tint -B build-native/terrain-dem-tint "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint configuration failed' }
          cmake --build build-native/terrain-dem-tint --config Release --target pando-terrain-dem-tint
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint build failed' }
          cmake -S tools/cpp/terrain-dem-fill -B build-native/terrain-dem-fill "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint fill configuration failed' }
          cmake --build build-native/terrain-dem-fill --config Release --target pando-terrain-dem-fill
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint fill build failed' }
          if ($IsWindows) { $tint='build-native/terrain-dem-tint/Release/pando-terrain-dem-tint.exe'; $fill='build-native/terrain-dem-fill/Release/pando-terrain-dem-fill.exe' }
          else { $tint='build-native/terrain-dem-tint/pando-terrain-dem-tint'; $fill='build-native/terrain-dem-fill/pando-terrain-dem-fill' }
          node tools/gis/package-terrain-dem-tint.mjs --binary $tint --directory build-native/terrain-dem-tint/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint packaging failed' }
          node tools/gis/package-terrain-dem-fill.mjs --binary $fill --directory build-native/terrain-dem-fill/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM tint fill packaging failed' }
          $env:PANDO_TERRAIN_DEM_ENCODE_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-encode/artifact"
          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          $env:PANDO_TERRAIN_DEM_GUTTERS_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-gutters/artifact"
          $env:PANDO_TERRAIN_DEM_TINT_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-tint/artifact"
          $env:PANDO_TERRAIN_DEM_FILL_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/terrain-dem-fill/artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-dem-raster-${{ matrix.os }}-${{ github.sha }}
          path: build-native/terrain-dem-raster/artifact/
          if-no-files-found: error
          retention-days: 7
  physical-raster:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'physical-raster'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check space for the existing GDAL SDK
        shell: pwsh
        run: |-
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          if ($drive.AvailableFreeSpace -lt 7GB) { throw 'Need estimated 2 GiB SDK/build space plus 5 GiB headroom' }
      - uses: mamba-org/setup-micromamba@v3
        id: physical-gdal
        with:
          environment-name: pando-dem-gdal
          create-args: libgdal-core=3.13.3
          cache-environment: true
          cache-downloads: true
          init-shell: none
      - name: Build and verify only the physical source reader
        shell: pwsh
        run: |-
          $prefix = '${{ steps.physical-gdal.outputs.environment-path }}'
          if ($IsWindows) { $sdk = "$prefix/Library"; $env:PATH = "$sdk/bin$([IO.Path]::PathSeparator)$env:PATH" }
          else { $sdk = $prefix; $env:LD_LIBRARY_PATH = "$sdk/lib$([IO.Path]::PathSeparator)$env:LD_LIBRARY_PATH" }
          cmake -S tools/cpp/physical-raster -B build-native/physical-raster "-DCMAKE_PREFIX_PATH=$sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Physical source reader configuration failed' }
          cmake --build build-native/physical-raster --config Release --target pando-physical-raster
          if ($LASTEXITCODE -ne 0) { throw 'Physical source reader build failed' }
          if ($IsWindows) { $env:PANDO_PHYSICAL_RASTER_BINARY = "$env:GITHUB_WORKSPACE/build-native/physical-raster/Release/pando-physical-raster.exe" }
          else { $env:PANDO_PHYSICAL_RASTER_BINARY = "$env:GITHUB_WORKSPACE/build-native/physical-raster/pando-physical-raster" }
          node tools/gis/package-physical-raster.mjs --binary $env:PANDO_PHYSICAL_RASTER_BINARY --directory build-native/physical-raster/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Physical source reader packaging failed' }
          $env:PANDO_PHYSICAL_RASTER_DIRECTORY = "$env:GITHUB_WORKSPACE/build-native/physical-raster/artifact"
          if ($LASTEXITCODE -ne 0) { throw 'Physical TIFF source pixels differ' }
      - uses: actions/upload-artifact@v4
        with:
          name: physical-raster-${{ matrix.os }}-${{ github.sha }}
          path: build-native/physical-raster/artifact/
          if-no-files-found: error
          retention-days: 7
  terrain-dem-fill-windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'terrain-dem-fill-windows' || inputs.target == 'physical-raster' || inputs.target == 'terrain-dem-raster' || inputs.target == 'terrain-dem-tint')
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reuse pinned QGIS SDK archives
        uses: actions/cache/restore@v4
        with:
          path: build-native/qgis-sdk/*.tar.bz2
          key: qgis-sdk-${{ runner.os }}-qgis-3.44.15-qt-5.15.13-gdal-3.13.3-geos-3.15.0-proj-9.8.1-v1
      - name: Prepare the pinned GDAL development SDK
        timeout-minutes: 4
        shell: pwsh
        run: |-
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $archive = "$sdk/gdal.tar.bz2"
          $hash = '2475B7AB14A8437B925D1E96908AD5E22B8296ADF01E00B9ECA3EF0816B736C2'
          if (-not (Test-Path -LiteralPath $archive) -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $hash) {
            curl.exe --proto '=https' --tlsv1.2 --fail --location --max-time 180 --max-filesize 30000000 'https://download-cache.osgeo.org/osgeo4w/v2/x86_64/release/gdal/gdal-devel/gdal-devel-3.13.3-3.tar.bz2' --output $archive
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $hash) { throw 'GDAL SDK download or digest failed' }
          }
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $zip x -y $archive "-o$sdk/packed" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GDAL SDK decompression failed' }
          & $zip x -y "$sdk/packed/gdal.tar" "-o$sdk" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GDAL SDK extraction failed' }
      - name: Build the selected GDAL tint tool
        if: inputs.target == 'terrain-dem-fill-windows'
        shell: pwsh
        run: |-
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          cmake -S tools/cpp/terrain-dem-fill -B build-native/terrain-dem-encode -A x64 "-DGDAL_INCLUDE_DIR=$sdk/include" "-DGDAL_LIBRARY=$sdk/lib/gdal_i.lib"
          if ($LASTEXITCODE -ne 0) { throw 'GDAL tint tool configuration failed' }
          cmake --build build-native/terrain-dem-encode --config Release --target pando-terrain-dem-fill
          if ($LASTEXITCODE -ne 0) { throw 'GDAL tint tool build failed' }
          node tools/gis/package-terrain-dem-fill.mjs --binary build-native/terrain-dem-encode/Release/pando-terrain-dem-fill.exe --directory build-native/terrain-dem-encode/fill-artifact
          if ($LASTEXITCODE -ne 0) { throw 'GDAL tint tool packaging failed' }
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'terrain-dem-fill-windows'
        with:
          name: terrain-dem-fill-windows-${{ github.sha }}
          path: build-native/terrain-dem-encode/fill-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Build the physical TIFF reader against the OSGeo4W runtime ABI
        if: inputs.target == 'physical-raster'
        shell: pwsh
        run: |-
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          cmake -S tools/cpp/physical-raster -B build-native/physical-raster -A x64 "-DGDAL_INCLUDE_DIR=$sdk/include" "-DGDAL_LIBRARY=$sdk/lib/gdal_i.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Physical TIFF reader SDK configuration failed' }
          cmake --build build-native/physical-raster --config Release --target pando-physical-raster
          if ($LASTEXITCODE -ne 0) { throw 'Physical TIFF reader SDK build failed' }
          node tools/gis/package-physical-raster.mjs --binary build-native/physical-raster/Release/pando-physical-raster.exe --directory build-native/physical-raster/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Physical TIFF reader SDK packaging failed' }
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'physical-raster'
        with:
          name: physical-raster-osgeo-windows-${{ github.sha }}
          path: build-native/physical-raster/artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Build the DEM window reader against the OSGeo4W runtime ABI
        if: inputs.target == 'terrain-dem-raster'
        shell: pwsh
        run: |-
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          cmake -S tools/cpp/terrain-dem-raster -B build-native/terrain-dem-raster -A x64 "-DGDAL_INCLUDE_DIR=$sdk/include" "-DGDAL_LIBRARY=$sdk/lib/gdal_i.lib"
          if ($LASTEXITCODE -ne 0) { throw 'DEM reader SDK configuration failed' }
          cmake --build build-native/terrain-dem-raster --config Release --target pando-terrain-dem-raster
          if ($LASTEXITCODE -ne 0) { throw 'DEM reader SDK build failed' }
          node tools/gis/package-terrain-dem-raster.mjs --binary build-native/terrain-dem-raster/Release/pando-terrain-dem-raster.exe --directory build-native/terrain-dem-raster/artifact
          if ($LASTEXITCODE -ne 0) { throw 'DEM reader SDK packaging failed' }
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'terrain-dem-raster'
        with:
          name: terrain-dem-raster-osgeo-windows-${{ github.sha }}
