name: GIS native Hydro junction contracts

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/cpp/CMakeLists.txt'
      - 'tools/cpp/hydro/connectivity-junctions.cpp'
      - 'tests/unit/hydro-connectivity-native.test.mjs'
      - 'tools/hydro_connectivity.py'
      - 'tools/build-hydro-tiles.py'
      - 'tools/repair-hydro-connectivity.py'
      - 'tests/test_hydro_connectivity.py'
      - '.github/workflows/gis-native-hydro.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Standalone native tool to build and verify
        type: choice
        options: [hydro, hydro-point-screen, hydro-batch01, hydro-batch02, hydro-batch03, hydro-yarra, hydro-point-windows, pc-allocation, reference-loss, reference-windows, qgis-windows, map-image, map-pdf, map-preview]
        default: hydro

permissions:
  contents: read

jobs:
  map-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'map-preview'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build preview and its image input and output tool
        shell: pwsh
        run: |
          cmake -S tools/cpp/map-preview -B build-native/map-preview/native
          if ($LASTEXITCODE -ne 0) { throw 'Preview configure failed' }
          cmake --build build-native/map-preview/native --config Release --target pando-map-preview --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Preview build failed' }
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Image configure failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Image build failed' }
      - name: Compare review overlays with the original pixels
        shell: pwsh
        run: |
          if ($IsWindows) {
            $preview = 'build-native/map-preview/native/Release/pando-map-preview.exe'
            $image = 'build-native/map-image/Release/pando-map-image.exe'
          } else {
            $preview = 'build-native/map-preview/native/pando-map-preview'
            $image = 'build-native/map-image/pando-map-image'
          }
          node tools/map-image/package-preview.mjs --binary $preview --directory build-native/map-preview/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Preview packaging failed' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Image packaging failed' }
          $env:PANDO_MAP_PREVIEW_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-preview/artifact"
          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          node --test tests/unit/map-plugin-native-preview.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native preview differs from original' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-map-preview-${{ matrix.os }}-${{ github.sha }}
          path: build-native/map-preview/artifact/
          if-no-files-found: error
          retention-days: 7
  map-pdf:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'map-pdf'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Obtain the pinned MuPDF SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-native/map-pdf/sdk | Out-Null
          if ($IsWindows) {
            $url = 'https://files.pythonhosted.org/packages/f9/e8/989f4eaa369c7166dc24f0eaa3023f13788c40ff1b96701f7047421554a8/pymupdf-1.26.6-cp310-abi3-win_amd64.whl'
            $expected = 'ce02ca96ed0d1acfd00331a4d41a34c98584d034155b06fd4ec0f051718de7ba'
          } else {
            $url = 'https://files.pythonhosted.org/packages/4f/bf/6e02e3d84b32c137c71a0a3dcdba8f2f6e9950619a3bc272245c7c06a051/pymupdf-1.26.6-cp310-abi3-manylinux_2_28_x86_64.whl'
            $expected = '7777d0b7124c2ebc94849536b6a1fb85d158df3b9d873935e63036559391534c'
          }
          $wheel = 'build-native/map-pdf/mupdf-sdk.zip'
          Invoke-WebRequest -Uri $url -OutFile $wheel
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $wheel).Hash.ToLowerInvariant() -ne $expected) { throw 'MuPDF SDK hash mismatch' }
          Expand-Archive -LiteralPath $wheel -DestinationPath build-native/map-pdf/sdk
      - name: Build the PDF reader and required image resize tool
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/map-pdf/sdk/pymupdf"
          cmake -S tools/cpp/map-pdf -B build-native/map-pdf/native "-DPANDO_MUPDF_SDK_ROOT=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'PDF reader configure failed' }
          cmake --build build-native/map-pdf/native --config Release --target pando-map-pdf --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'PDF reader build failed' }
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Image resize configure failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Image resize build failed' }
      - name: Compare PDF pages, georeference and rejection paths
        shell: pwsh
        run: |
          if ($IsWindows) {
            $pdf = 'build-native/map-pdf/native/Release/pando-map-pdf.exe'
            $image = 'build-native/map-image/Release/pando-map-image.exe'
          } else {
            $pdf = 'build-native/map-pdf/native/pando-map-pdf'
            $image = 'build-native/map-image/pando-map-image'
          }
          node tools/map-image/package-pdf.mjs --binary $pdf --directory build-native/map-pdf/artifact --sdk build-native/map-pdf/sdk/pymupdf
          if ($LASTEXITCODE -ne 0) { throw 'PDF reader packaging failed' }
          node tools/map-image/package-native.mjs --binary $image --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Image resize packaging failed' }
          $env:PANDO_MAP_PDF_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-pdf/artifact"
          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          node --test tests/unit/map-plugin-native-pdf-read.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native PDF input differs from original' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-map-pdf-${{ matrix.os }}-${{ github.sha }}
          path: build-native/map-pdf/artifact/
          if-no-files-found: error
          retention-days: 7
  map-image:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'map-image'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the isolated map image resampling test
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/map-image -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_MAP_IMAGE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Map image configure failed' }
          cmake --build build-native/map-image --config Release --target pando-map-image-resample-tests pando-map-image --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Map image build failed' }
      - name: Compare small fixed pixel oracles
        shell: pwsh
        run: |
          if ($IsWindows) { $binary = 'build-native/map-image/Release/pando-map-image-resample-tests.exe' }
          else { $binary = 'build-native/map-image/pando-map-image-resample-tests' }
          & $binary tests/fixtures/map-image
          if ($LASTEXITCODE -ne 0) { throw 'Map image oracle mismatch' }
      - name: Package and exercise the actual Node-to-native resize path
        shell: pwsh
        run: |
          if ($IsWindows) { $binary = 'build-native/map-image/Release/pando-map-image.exe' }
          else { $binary = 'build-native/map-image/pando-map-image' }
          node tools/map-image/package-native.mjs --binary $binary --directory build-native/map-image/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Map image packaging failed' }
          $env:PANDO_MAP_IMAGE_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/map-image/artifact"
          node --test tests/unit/map-native-resize.test.mjs tests/unit/map-native-packaging.test.mjs tests/unit/map-plugin-native-resize.test.mjs tests/unit/map-plugin-native-png-read.test.mjs tests/unit/map-plugin-native-jpeg-read.test.mjs tests/unit/map-plugin-native-webp-read.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Map image native integration failed' }
          $env:PANDO_MAP_PYTHON = "$env:GITHUB_WORKSPACE/no-python"
          node --test --test-name-pattern='native rotation works|Live-Wire preserves' tests/unit/map-plugin.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Map image workflow failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-map-image-${{ matrix.os }}-${{ github.sha }}
          path: build-native/map-image/artifact/
          if-no-files-found: error
          retention-days: 7
  hydro-point-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'hydro-point-windows'
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the matching GEOS and PROJ development SDK
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/hydro-point-sdk"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $packages = @(
            @{name='geos'; path='geos/geos-devel/geos-devel-3.15.0-1.tar.bz2'; sha='6D62956B904C0BC5B2825F2EADFBD1DCD2342B82F1881E79AAE6561CE1EE2021'},
            @{name='proj'; path='proj/proj-devel/proj-devel-9.8.1-1.tar.bz2'; sha='B8A6F4DBB800F019BE4F4C45849B53818F2074213B850DFC38681CC99D0E3889'}
          )
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          foreach ($package in $packages) {
            $archive = Join-Path $sdk ($package.name + '.tar.bz2')
            $url = 'https://download-cache.osgeo.org/osgeo4w/v2/x86_64/release/' + $package.path
            curl.exe --proto '=https' --tlsv1.2 --fail --location --max-time 120 --max-filesize 3000000 $url --output $archive
            if ($LASTEXITCODE -ne 0) { throw "SDK download failed: $($package.name)" }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $package.sha) { throw "SDK digest mismatch: $($package.name)" }
            & $zip x -y $archive "-o$sdk/packed" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "SDK decompression failed: $($package.name)" }
            & $zip x -y "$sdk/packed/$($package.name).tar" "-o$sdk" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "SDK extraction failed: $($package.name)" }
          }
      - name: Build and package the Windows point screen
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/hydro-point-screen -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON -DPANDO_QGIS_SDK_ROOT="$env:GITHUB_WORKSPACE/build-native/hydro-point-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Hydro point-screen configure failed' }
          cmake --build build-native/hydro-point-screen --config Release --target pando-hydro-point-screen --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'Hydro point-screen build failed' }
          node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/Release/pando-hydro-point-screen.exe --directory build-native/hydro-point-screen/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Hydro point-screen packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-hydro-point-screen-windows-x64-${{ github.sha }}
          path: build-native/hydro-point-screen/artifact/
          if-no-files-found: error
          retention-days: 7
  hydro-point-screen:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'hydro-point-screen' || inputs.target == 'hydro-batch01' || inputs.target == 'hydro-batch02' || inputs.target == 'hydro-batch03' || inputs.target == 'hydro-yarra')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only native geometry development dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev ninja-build
      - name: Build the point screen
        run: |
          cmake -S tools/cpp -B build-native/hydro-point-screen -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON
          cmake --build build-native/hydro-point-screen --target pando-hydro-point-screen
      - name: Verify small point-screen cases
        env:
          PANDO_HYDRO_POINT_SCREEN_BINARY: ${{ github.workspace }}/build-native/hydro-point-screen/pando-hydro-point-screen
        run: node --test tests/unit/hydro-point-screen-native.test.mjs tests/unit/hydro-independent-point-screen.test.mjs tests/unit/hydro-osm-batch01-screen.test.mjs tests/unit/hydro-osm-batch02-screen.test.mjs tests/unit/hydro-osm-batch03-screen.test.mjs tests/unit/hydro-batch03-nga-probe.test.mjs tests/unit/hydro-yarra-vector-screen.test.mjs
      - name: Package the source-bound point screen
        run: node tools/gis/package-hydro-point-screen.mjs --binary build-native/hydro-point-screen/pando-hydro-point-screen --directory build-native/hydro-point-screen/artifact
      - name: Read the paired data revision
        id: hydro-data-pin
        run: node -e "console.log('revision='+require('./config/library-data.json').revision)" >> "$GITHUB_OUTPUT"
      - name: Fetch only the pinned Hydro bundle
        uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: ${{ steps.hydro-data-pin.outputs.revision }}
          path: .pando-hydro-input
          persist-credentials: false
          filter: blob:none
          sparse-checkout: assets/data/hydro/v0.13.2
      - name: Compare the five selected real Hydro systems
        if: inputs.target == 'hydro-point-screen'
        run: |
          node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-point-decoded.json
          node tools/gis/verify-independent-river-point-anchors.mjs --decoded /tmp/pando-point-decoded.json --output /tmp/pando-point-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const oldResult=JSON.parse(readFileSync('tests/fixtures/hydro-independent-point-screen-v0132-expected.json','utf8'));
          const newResult=JSON.parse(readFileSync('/tmp/pando-point-native.json','utf8'));
          assert.deepEqual(newResult,oldResult);
          console.log('All five real system screens match the frozen source-verified baseline');
          JS
      - name: Compare the ten selected systems with the frozen original audit
        if: inputs.target == 'hydro-batch01'
        run: |
          node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-batch01-decoded.json
          node tools/gis/verify-osm-hydro-batch01-anchors.mjs --decoded /tmp/pando-batch01-decoded.json --output /tmp/pando-batch01-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const baseline=JSON.parse(readFileSync('tests/fixtures/hydro-osm-batch01-v0132-expected.json','utf8'));
          const native=JSON.parse(readFileSync('/tmp/pando-batch01-native.json','utf8'));
          assert.deepEqual(native,baseline);
          console.log('All ten real system screens match the source-verified baseline');
          JS
      - name: Compare second-ten audit with and without optional sources against the frozen baseline
        if: inputs.target == 'hydro-batch02'
        run: |
          node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-batch02-decoded.json
          node tools/gis/verify-osm-hydro-batch02-points.mjs --decoded /tmp/pando-batch02-decoded.json --output /tmp/batch02-native-default.json
          node tools/gis/verify-osm-hydro-batch02-points.mjs --decoded /tmp/pando-batch02-decoded.json --external-gauges tests/fixtures/hydro-osm-batch02-gauges-fixture.json --nga tests/fixtures/hydro-osm-batch02-nga-fixture.json --output /tmp/batch02-native-sources.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          for(const suffix of ['default','sources'])assert.deepEqual(
            JSON.parse(readFileSync(`/tmp/batch02-native-${suffix}.json`,'utf8')),
            JSON.parse(readFileSync(`tests/fixtures/hydro-osm-batch02-${suffix}-v0132-expected.json`,'utf8')));
          console.log('Second-ten results match the frozen baseline with and without optional sources');
          JS
      - name: Compare last-eleven audit against the frozen baseline using fixed NGA responses
        if: inputs.target == 'hydro-batch03'
        run: |
          node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-batch03-decoded.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {probeNgaBatch03} from './tools/gis/probe-nga-streams.mjs';
          import {screenHydroPoints} from './tools/gis/hydro-point-screen-native.mjs';
          import {buildBatch03Screen} from './tools/gis/verify-osm-hydro-batch03-points.mjs';
          const bytes=readFileSync('tests/fixtures/hydro-osm-batch03-nga-response.json');
          const receipts=await probeNgaBatch03({fetcher:async()=>new Response(bytes,{status:200})});
          const decoded=JSON.parse(readFileSync('/tmp/pando-batch03-decoded.json','utf8'));
          const native=await buildBatch03Screen(decoded,{receipts,screen:screenHydroPoints});
          writeFileSync('/tmp/batch03-native.json',JSON.stringify(native,null,2)+'\n',{flag:'wx'});
          assert.deepEqual(native,JSON.parse(readFileSync('tests/fixtures/hydro-osm-batch03-v0132-expected.json','utf8')));
          console.log('All eleven real systems match the frozen baseline with fixed NGA responses');
          JS
      - name: Compare real Yarra source with the frozen original audit
        if: inputs.target == 'hydro-yarra'
        run: |
          node tools/decode-hydro-connectivity.mjs .pando-hydro-input/assets/data/hydro/v0.13.2 /tmp/pando-yarra-decoded.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {fetchYarraVector} from './tools/gis/verify-victorian-yarra-source.mjs';
          const bytes=await fetchYarraVector();
          assert.equal(createHash('sha256').update(bytes).digest('hex'),'70a2b0c84e9094258c64514d1392f7ef712fbaa7312754a7b80296e3dbb50fb6');
          writeFileSync('/tmp/pando-yarra-reference.json',bytes,{flag:'wx'});
          JS
          node tools/gis/verify-victorian-yarra-source.mjs --decoded /tmp/pando-yarra-decoded.json --reference /tmp/pando-yarra-reference.json --expected-sha256 70a2b0c84e9094258c64514d1392f7ef712fbaa7312754a7b80296e3dbb50fb6 --output /tmp/pando-yarra-native.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          assert.deepEqual(JSON.parse(readFileSync('/tmp/pando-yarra-native.json','utf8')),JSON.parse(readFileSync('tests/fixtures/hydro-yarra-v0132-expected.json','utf8')));
          console.log('The real Yarra source matches the frozen bidirectional screen');
          JS
  qgis-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'qgis-windows'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify the matching OSGeo4W development packages
        shell: pwsh
        run: |
          if ((Get-PSDrive -Name C).Free -lt 7GB) { throw 'Need estimated 2 GiB SDK/build space plus 5 GiB headroom' }
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $packages = @(
            @{name='qgis'; path='qgis/qgis-ltr/qgis-ltr-devel/qgis-ltr-devel-3.44.15-1.tar.bz2'; sha='D55BA2C310AAEEE31C075AE049CF4ADDD51701988534616F4ECB475FC3097897'},
            @{name='qt'; path='qt5/qt5-devel/qt5-devel-5.15.13-2.tar.bz2'; sha='D3F70B83B9BBEB7F6EDE7054D7DC3607F2C5DBE02DC316C79C33BD6ED3B6389C'},
            @{name='gdal'; path='gdal/gdal-devel/gdal-devel-3.13.3-3.tar.bz2'; sha='2475B7AB14A8437B925D1E96908AD5E22B8296ADF01E00B9ECA3EF0816B736C2'},
            @{name='geos'; path='geos/geos-devel/geos-devel-3.15.0-1.tar.bz2'; sha='6D62956B904C0BC5B2825F2EADFBD1DCD2342B82F1881E79AAE6561CE1EE2021'},
            @{name='proj'; path='proj/proj-devel/proj-devel-9.8.1-1.tar.bz2'; sha='B8A6F4DBB800F019BE4F4C45849B53818F2074213B850DFC38681CC99D0E3889'}
          )
          foreach ($package in $packages) {
            Write-Output "Downloading $($package.name) SDK"
            $archive = Join-Path $sdk ($package.name + '.tar.bz2')
            $url = 'https://download-cache.osgeo.org/osgeo4w/v2/x86_64/release/' + $package.path
            curl.exe --proto '=https' --tlsv1.2 --fail --location --max-time 180 --max-filesize 30000000 $url --output $archive
            if ($LASTEXITCODE -ne 0) { throw "SDK download failed: $($package.name)" }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $package.sha) { throw "SDK digest mismatch: $($package.name)" }
          }
      - name: Extract QGIS headers and import libraries
        timeout-minutes: 4
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $zip x -y "$sdk/qgis.tar.bz2" "-o$sdk/packed" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'QGIS SDK decompression failed' }
          & $zip x -y "$sdk/packed/qgis.tar" "-o$sdk" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'QGIS SDK extraction failed' }
      - name: Extract Qt headers and import libraries
        timeout-minutes: 6
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $zip x -y "$sdk/qt.tar.bz2" "-o$sdk/packed" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK decompression failed' }
          & $zip x -y "$sdk/packed/qt.tar" "-o$sdk" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK extraction failed' }
      - name: Extract GIS development headers
        timeout-minutes: 4
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          foreach ($name in @('gdal','geos','proj')) {
            & $zip x -y "$sdk/$name.tar.bz2" "-o$sdk/packed" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name SDK decompression failed" }
            & $zip x -y "$sdk/packed/$name.tar" "-o$sdk" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name SDK extraction failed" }
          }
      - name: Build the optional native QGIS bridge
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/qgis/native -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_QGIS_BRIDGE=ON -DPANDO_QGIS_SDK_ROOT="$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'QGIS CMake configure failed' }
          cmake --build build-native/qgis/native --config Release --target pando-qgis-bridge --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'QGIS native bridge build failed' }
      - name: Test authenticated client transport
        run: node --test tests/unit/qgis-native-client.test.mjs tests/unit/qgis-native-export.test.mjs
      - name: Package the source-bound bridge
        shell: pwsh
        run: |
          node tools/qgis/package-native-plugin.mjs --binary build-native/qgis/native/Release/pando_qgis_bridge.dll --directory build-native/qgis/artifact
          if ($LASTEXITCODE -ne 0) { throw 'QGIS bridge packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-qgis-bridge-windows-x64-${{ github.sha }}
          path: build-native/qgis/artifact/
          if-no-files-found: error
          retention-days: 7
  reference-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'reference-windows'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check space and acquire the matching Windows LibTorch SDK
        shell: pwsh
        run: |
          if ((Get-PSDrive -Name C).Free -lt 9GB) { throw 'Need estimated 4 GiB SDK/build space plus 5 GiB headroom' }
          New-Item -ItemType Directory -Force -Path build-native/reference-analysis | Out-Null
          curl.exe --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 180 --max-filesize 220000000 'https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.14.1%2Bcpu.zip' --output build-native/reference-analysis/libtorch.zip
          if ($LASTEXITCODE -ne 0) { throw 'LibTorch SDK download failed' }
          Get-FileHash build-native/reference-analysis/libtorch.zip -Algorithm SHA256
          if ((Get-FileHash build-native/reference-analysis/libtorch.zip -Algorithm SHA256).Hash -ne '28FFDDE0A7FF3B431139709B4A91B8B6D59FDE3BE67B76FD88D0C913EF8973F7') { throw 'LibTorch SDK SHA-256 mismatch' }
          Expand-Archive -Path build-native/reference-analysis/libtorch.zip -DestinationPath build-native/reference-analysis
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/build-native/reference-analysis/libtorch/lib"
      - name: Build the optional reference inference tools
        shell: pwsh
        run: |
          cmake -S tools/cpp -B build-native/reference-analysis/native -A x64 -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/build-native/reference-analysis/libtorch" -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_REFERENCE_MODEL=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build-native/reference-analysis/native --config Release --target pando-reference-loss-tests pando-reference-model-tests pando-safetensors-tests pando-training-checkpoint-tests pando-reference-infer pando-reference-training-proof pando-reference-onnx-tests pando-reference-onnx-export --parallel 1
          if ($LASTEXITCODE -ne 0) { throw 'Native reference build failed' }
      - name: Verify Windows loss behavior
        timeout-minutes: 3
        shell: pwsh
        run: |
          & build-native/reference-analysis/native/Release/pando-reference-loss-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Loss test failed' }
      - name: Verify Windows model inference against every original output
        timeout-minutes: 3
        shell: pwsh
        run: |
          & build-native/reference-analysis/native/Release/pando-reference-model-tests.exe tests/fixtures/reference-model-synthetic-logits.f32 --inference-only
          if ($LASTEXITCODE -ne 0) { throw 'Model test failed' }
      - name: Verify Windows Safetensors behavior
        timeout-minutes: 3
        shell: pwsh
        run: |
          & build-native/reference-analysis/native/Release/pando-safetensors-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Safetensors test failed' }
      - name: Verify Windows inference rejects invalid requests
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:PANDO_REFERENCE_INFER_BINARY="$env:GITHUB_WORKSPACE/build-native/reference-analysis/native/Release/pando-reference-infer.exe"
          node --test tests/unit/reference-infer-cli.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Inference CLI test failed' }
      - name: Verify Windows checkpoint preserves optimizer, RNG and sampling
        timeout-minutes: 3
        shell: pwsh
        run: |
          & build-native/reference-analysis/native/Release/pando-training-checkpoint-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint resume test failed' }
      - name: Verify real-input proof rejects unsafe requests
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:PANDO_REFERENCE_TRAINING_PROOF_BINARY="$env:GITHUB_WORKSPACE/build-native/reference-analysis/native/Release/pando-reference-training-proof.exe"
          node --test tests/unit/reference-training-proof.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Training proof refusal test failed' }
      - name: Verify ONNX export rejects unsafe requests
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:PANDO_REFERENCE_ONNX_EXPORT_BINARY="$env:GITHUB_WORKSPACE/build-native/reference-analysis/native/Release/pando-reference-onnx-export.exe"
          node --test tests/unit/reference-onnx-export-refusal.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ONNX export refusal test failed' }
      - name: Verify a frozen encoder AdamW update separately
        timeout-minutes: 2
        shell: pwsh
        run: |
          & build-native/reference-analysis/native/Release/pando-reference-model-tests.exe tests/fixtures/reference-model-synthetic-logits.f32
          if ($LASTEXITCODE -ne 0) { throw 'Frozen encoder training test failed' }
      - name: Package only the source-bound native executable
        shell: pwsh
        run: |
          node tools/reference-analysis/package-native-reference.mjs --binary build-native/reference-analysis/native/Release/pando-reference-infer.exe --directory build-native/reference-analysis/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Artifact packaging failed' }
          Copy-Item build-native/reference-analysis/native/Release/pando-reference-model-tests.exe build-native/reference-analysis/artifact/pando-reference-model-tests.exe
          node tools/reference-analysis/package-native-reference.mjs --kind training-proof --binary build-native/reference-analysis/native/Release/pando-reference-training-proof.exe --directory build-native/reference-analysis/artifact-proof
          if ($LASTEXITCODE -ne 0) { throw 'Training proof artifact packaging failed' }
          node tools/reference-analysis/package-native-reference.mjs --kind onnx-test --binary build-native/reference-analysis/native/Release/pando-reference-onnx-tests.exe --directory build-native/reference-analysis/artifact-onnx-test
          if ($LASTEXITCODE -ne 0) { throw 'ONNX test artifact packaging failed' }
          node tools/reference-analysis/package-native-reference.mjs --kind onnx-export --binary build-native/reference-analysis/native/Release/pando-reference-onnx-export.exe --directory build-native/reference-analysis/artifact-onnx-export
          if ($LASTEXITCODE -ne 0) { throw 'ONNX export artifact packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-reference-windows-x64-${{ github.sha }}
          path: build-native/reference-analysis/artifact/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-reference-training-proof-windows-x64-${{ github.sha }}
          path: build-native/reference-analysis/artifact-proof/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-reference-onnx-test-windows-x64-${{ github.sha }}
          path: build-native/reference-analysis/artifact-onnx-test/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-reference-onnx-export-windows-x64-${{ github.sha }}
          path: build-native/reference-analysis/artifact-onnx-export/
          if-no-files-found: error
          retention-days: 7
  reference-loss:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'reference-loss'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check space and acquire the fixed LibTorch CPU SDK
        run: |
          set -euo pipefail
          available=$(df -PB1 . | awk 'NR==2 {print $4}')
          if [ "$available" -lt 9663676416 ]; then echo 'Need estimated 4 GiB SDK/build space plus 5 GiB headroom'; exit 1; fi
          mkdir -p build-native/reference-analysis
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 180 --max-filesize 200000000 \
            'https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.7.1%2Bcpu.zip' \
            --output build-native/reference-analysis/libtorch.zip
          sha256sum build-native/reference-analysis/libtorch.zip
          echo '63d572598c8d532128a335018913e795c1bbb32602ce378896dc8cfbb5590976  build-native/reference-analysis/libtorch.zip' | sha256sum -c -
          unzip -q build-native/reference-analysis/libtorch.zip -d build-native/reference-analysis
      - name: Build the native boundary loss and model tests
        run: |
          cmake -S tools/cpp -B build-native/reference-analysis/native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build-native/reference-analysis/libtorch" \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_REFERENCE_MODEL=ON
          cmake --build build-native/reference-analysis/native --target pando-reference-loss-tests pando-reference-model-tests pando-safetensors-tests pando-training-checkpoint-tests pando-reference-infer pando-reference-training-proof pando-reference-onnx-tests pando-reference-onnx-export --parallel 1
      - name: Compare original loss, model fixtures and Safetensors validation
        run: |
          build-native/reference-analysis/native/pando-reference-loss-tests
          build-native/reference-analysis/native/pando-reference-model-tests tests/fixtures/reference-model-synthetic-logits.f32
          build-native/reference-analysis/native/pando-safetensors-tests
          build-native/reference-analysis/native/pando-training-checkpoint-tests
      - name: Verify native inference command rejects invalid requests
        env:
          PANDO_REFERENCE_INFER_BINARY: ${{ github.workspace }}/build-native/reference-analysis/native/pando-reference-infer
        run: node --test tests/unit/reference-infer-cli.test.mjs
      - name: Verify real-input proof rejects unsafe requests
        env:
          PANDO_REFERENCE_TRAINING_PROOF_BINARY: ${{ github.workspace }}/build-native/reference-analysis/native/pando-reference-training-proof
        run: node --test tests/unit/reference-training-proof.test.mjs
      - name: Verify ONNX export rejects unsafe requests
        env:
          PANDO_REFERENCE_ONNX_EXPORT_BINARY: ${{ github.workspace }}/build-native/reference-analysis/native/pando-reference-onnx-export
        run: node --test tests/unit/reference-onnx-export-refusal.test.mjs
  native-hydro:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'hydro'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build only the standalone C++ Hydro junction engine
        run: |
          cmake -S tools/cpp -B build-native/hydro -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF \
            -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF \
            -DPANDO_BUILD_HYDRO_CONNECTIVITY=ON
          cmake --build build-native/hydro --target pando-hydro-connectivity
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install temporary source-oracle and producer dependencies
        run: python -m pip install -r tools/requirements-hydro-tiles.txt
      - name: Verify source-proven confluence and border-alignment invariants
        env:
          PANDO_HYDRO_CONNECTIVITY_BINARY: ./build-native/hydro/pando-hydro-connectivity
        run: node --test tests/unit/hydro-connectivity-native.test.mjs
      - name: Compare Python source oracle and native C++ generator on fixed junctions
        env:
          PANDO_HYDRO_CONNECTIVITY_BINARY: ${{ github.workspace }}/build-native/hydro/pando-hydro-connectivity
        run: python -m unittest discover -s tests -p 'test_hydro_connectivity.py' -v
  pc-allocation:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pc-allocation'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build only the standalone Windows allocation auditor
        run: |
          cmake -S tools/cpp -B build-native/pc-allocation -A x64 -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_CONNECTIVITY=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=OFF -DPANDO_BUILD_PC_ALLOCATION=ON
          cmake --build build-native/pc-allocation --config Release --target pando-pc-file-allocation
      - name: Verify real Windows file identities and allocation
        env:
          PANDO_PC_ALLOCATION_BINARY: ${{ github.workspace }}/build-native/pc-allocation/Release/pando-pc-file-allocation.exe
        run: node --test tests/unit/pc-file-allocation-native.test.mjs tests/unit/native-tool.test.mjs
      - name: Package source and binary identities
        run: node tools/package-native-allocation.mjs --binary build-native/pc-allocation/Release/pando-pc-file-allocation.exe --directory build-native/pc-allocation
      - name: Verify the downloaded-tool invocation contract in the real cleanup owner
        run: node --test tests/unit/pc-cleanup.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-pc-allocation-windows-x64-${{ github.sha }}
          path: |
            build-native/pc-allocation/pando-pc-file-allocation.exe
            build-native/pc-allocation/native-tool.manifest.json
          if-no-files-found: error
          retention-days: 7
