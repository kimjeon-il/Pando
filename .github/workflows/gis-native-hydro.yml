          writeFileSync('/tmp/batch03-native.json',JSON.stringify(native,null,2)+'\n',{flag:'wx'});
          assert.deepEqual(native,JSON.parse(readFileSync('tests/fixtures/hydro-osm-batch03-v0132-expected.json','utf8')));
