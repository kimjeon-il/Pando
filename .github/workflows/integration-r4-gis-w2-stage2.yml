name: Integration R4 GIS W2 - Stage 2 country loading profile
on:
  push:
    branches: [integration/r4-gis-w2-20261103]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-r4-gis-w2-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Source syntax and lint
        run: |
          node --check shared/frontend/js/modules/country-shared-boundary-packet.js
          node --check shared/frontend/js/workers/country-shared-boundary-worker.js
          node --check shared/frontend/js/modules/country-boundary-geometry-transport.js
          node --check tests/browser/viewer-p6-stage2-worker-profile.spec.mjs
          pnpm exec eslint shared/frontend/js/modules/country-shared-boundary-packet.js shared/frontend/js/workers/country-shared-boundary-worker.js shared/frontend/js/modules/country-boundary-geometry-transport.js tests/unit/country-shared-boundary-state.test.mjs tests/unit/country-boundary-geometry-transport.test.mjs tests/browser/viewer-p6-stage2-worker-profile.spec.mjs scripts/p3-plan-remote.mjs tests/unit/p3-remote-plan.test.mjs
      - name: Real C++ Worker full/delta and per-phase diagnostic contracts
        run: |
          node --test --test-concurrency=1 --test-timeout=120000 \
            tests/unit/country-shared-boundary-state.test.mjs \
            tests/unit/country-boundary-geometry-transport.test.mjs \
            tests/unit/p3-remote-plan.test.mjs

  history-browser-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Profile 1991/1992 real Viewer date changes, retain document hashes
        run: pnpm exec playwright test tests/browser/viewer-p6-stage2-worker-profile.spec.mjs --workers=1 --retries=0 --trace=off
      - name: Capture actual profile and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-p6-stage2-worker-phase-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
