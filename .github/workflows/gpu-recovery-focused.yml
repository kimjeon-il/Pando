name: P6-4 focused recovery validation

on:
  push:
    branches: [gpu-recovery-fix]
    paths:
      - .github/workflows/gpu-recovery-focused.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-4-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Network, late Worker acknowledgement, and GPU recovery contracts
        run: >
          node --test --test-concurrency=1 --test-timeout=120000
          tests/unit/background-network-recovery.test.mjs
          tests/unit/viewer-composition-recovery.test.mjs
          tests/unit/core-temporal-transport-p5-5.test.mjs
          tests/helpers/gpu-recovery-viewer-progress.test.mjs
          tests/helpers/gpu-recovery-viewer-presentation.test.mjs
          tests/helpers/gpu-recovery-viewer-admission.test.mjs
          tests/unit/gpu-shared-pass-initialization.test.mjs
          tests/unit/gpu-resource-owners.test.mjs

      - name: Install Chromium only for the real GPU recovery check
        run: pnpm exec playwright install --with-deps chromium

      - name: Real WebGL2 context loss keeps the accepted document and map state
        env:
          G4_EVIDENCE: test-results/p6-4-gpu
        run: >
          pnpm exec playwright test tests/browser/viewer-recovery-acceptance.spec.mjs
          --grep "viewer acceptance webgl2"
          --workers=1 --retries=0 --trace=off --reporter=list

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-4-recovery-${{ github.sha }}
          path: test-results/p6-4-gpu
          if-no-files-found: ignore
          retention-days: 3
