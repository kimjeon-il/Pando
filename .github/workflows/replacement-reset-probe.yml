name: C++ replacement_.reset exact timing (diagnostic only)
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/replacement-reset-probe.yml
      - tests/helpers/patch-replacement-reset-probe.mjs
      - tests/browser/replacement-reset-benchmark.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-replacement-reset-probe-work-ui
  cancel-in-progress: true
jobs:
  precise-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EMCC_CORES: '1'
      BINARYEN_CORES: '1'
      NODE_OPTIONS: '--max-old-space-size=1024'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Mount exact pinned world assets
        uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Inject steady_clock around only replacement_.reset in ephemeral CI checkout
        run: |
          node --check tests/helpers/patch-replacement-reset-probe.mjs
          node --check tests/browser/replacement-reset-benchmark.spec.mjs
          node tests/helpers/patch-replacement-reset-probe.mjs
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - name: Compile source-matched WASM for the diagnostic runner only
        shell: bash
        run: |
          set -euo pipefail
          build-native/emsdk/emsdk install 6.0.3
          build-native/emsdk/emsdk activate 6.0.3
          source build-native/emsdk/emsdk_env.sh
          emcmake cmake -S shared -B build-native/p5-6 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-native/p5-6 --target pandoeditor_wasm --parallel 1
          node tools/package-shared-core-assets.mjs --build-dir build-native/p5-6/wasm
          node tools/package-shared-core-assets.mjs --build-dir build-native/p5-6/wasm --check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Measure real dated switches and exact C++ reset duration
        run: pnpm exec playwright test tests/browser/replacement-reset-benchmark.spec.mjs --workers=1 --retries=0 --trace=off --reporter=list
      - name: Preserve bounded timing and failure artifacts (no app deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-cpp-reset-probe-${{ github.sha }}
          path: |
            test-results/replacement-reset/
            test-results/replacement-reset-benchmark*/
          if-no-files-found: warn
          retention-days: 7
