name: GIS Node migration focused contracts
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  offline-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check migrated Node implementations
        run: |-
          node --check tools/build/build-hydro-packfile.mjs
          node --check tools/gis/download-terrain-source.mjs
          node --check tools/gis/hydro-independent-name-policy.mjs
          node --check tools/gis/check-official-usgs-hydro-gauges.mjs
          node --check tools/gis/compare-osm-hydro-natural-earth.mjs
          node --check scripts/gis/run-source.mjs
          node --check scripts/summarize-boundary-capture-evidence.mjs
          node --check tools/lib/geonames-zip.mjs
          node --check tools/lib/geonames-policy.mjs
          node --test tests/unit/data/hydro-packfile.test.mjs tests/unit/geometry/download-terrain-source.test.mjs  tests/unit/document/place-candidates.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs tests/unit/data/library-report-publication.test.mjs  tests/unit/ui/product-assets.test.mjs
          node --test   tests/unit/geometry/hydro-source-selection.test.mjs  tests/unit/geometry/hydro-name.test.mjs   tests/unit/geometry/gis-math-contract.test.mjs tests/unit/geometry/annex-slivers.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs
          pnpm exec eslint     tests/unit/geometry/hydro-source-selection.test.mjs tools/gis/compare-osm-hydro-natural-earth.mjs tests/unit/geometry/hydro-source-selection.test.mjs  tests/unit/geometry/hydro-name.test.mjs tools/gis/check-official-usgs-hydro-gauges.mjs  tools/gis/hydro-independent-name-policy.mjs    tools/lib/geonames-zip.mjs tools/lib/geonames-policy.mjs    tools/gis/download-terrain-source.mjs tools/build/build-hydro-packfile.mjs tools/data/report-paths.mjs scripts/gis/run-source.mjs scripts/summarize-boundary-capture-evidence.mjs tests/helpers/geonames-fixtures.mjs tests/unit/document/place-candidates.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs  tests/unit/ui/product-assets.test.mjs tests/unit/geometry/gis-math-contract.test.mjs tests/unit/geometry/annex-slivers.test.mjs
