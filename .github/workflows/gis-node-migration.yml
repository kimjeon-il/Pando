name: GIS Node migration focused contracts
on:
  push:
    branches: [work/gis]
    paths:
      - '.github/workflows/gis-node-migration.yml'
      - 'tools/build-hydro-packfile.mjs'
      - 'tools/download-terrain-source.mjs'
      - 'tools/place-batch-pipeline.mjs'
      - 'tools/build-place-candidates.mjs'
      - 'tools/inventory-osm-hydronyms.mjs'
      - 'tools/gis/hydro-independent-name-policy.mjs'
      - 'tests/unit/hydro-independent-name-policy.test.mjs'
      - 'tests/unit/osm-hydro-inventory.test.mjs'
      - 'tools/lib/geonames-zip.mjs'
      - 'tools/lib/geonames-policy.mjs'
      - 'tools/lib/geonames-review.mjs'
      - 'tools/lib/geonames-statistics.mjs'
      - 'tests/helpers/geonames-fixtures.mjs'
      - 'tools/report-paths.mjs'
      - 'scripts/gis/run-source.mjs'
      - 'scripts/summarize-boundary-capture-evidence.mjs'
      - 'tests/unit/hydro-packfile-builder.test.mjs'
      - 'tests/unit/download-terrain-source.test.mjs'
      - 'tests/unit/place-batch-pipeline.test.mjs'
      - 'tests/unit/place-candidates.test.mjs'
      - 'tests/unit/gis-source-launcher.test.mjs'
      - 'tests/unit/report-paths.test.mjs'
      - 'tests/unit/boundary-capture-comparison.test.mjs'
      - 'tests/unit/boundary-capture-evidence.test.mjs'
      - 'tests/unit/font-assets.test.mjs'
      - 'tests/unit/application-source-extraction.test.mjs'
      - 'tests/unit/layer-lock-sync.test.mjs'
      - 'tests/unit/python-bridge-retirement.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check migrated Node implementations
        run: |
          node --check tools/build-hydro-packfile.mjs
          node --check tools/download-terrain-source.mjs
          node --check tools/place-batch-pipeline.mjs
          node --check tools/build-place-candidates.mjs
          node --check tools/inventory-osm-hydronyms.mjs
          node --check tools/gis/hydro-independent-name-policy.mjs
          node --check scripts/gis/run-source.mjs
          node --check scripts/summarize-boundary-capture-evidence.mjs
          node --check tools/lib/geonames-zip.mjs
          node --check tools/lib/geonames-policy.mjs
          node --check tools/lib/geonames-review.mjs
          node --check tools/lib/geonames-statistics.mjs
          node --test tests/unit/hydro-packfile-builder.test.mjs tests/unit/download-terrain-source.test.mjs tests/unit/place-batch-pipeline.test.mjs tests/unit/place-candidates.test.mjs tests/unit/gis-source-launcher.test.mjs tests/unit/report-paths.test.mjs tests/unit/boundary-capture-evidence.test.mjs tests/unit/font-assets.test.mjs
          node --test tests/unit/hydro-independent-name-policy.test.mjs tests/unit/osm-hydro-inventory.test.mjs tests/unit/application-source-extraction.test.mjs tests/unit/layer-lock-sync.test.mjs tests/unit/python-bridge-retirement.test.mjs tests/unit/p4-python-isolation.test.mjs tests/unit/boundary-capture-comparison.test.mjs
          pnpm exec eslint tools/gis/hydro-independent-name-policy.mjs tests/unit/hydro-independent-name-policy.test.mjs tools/inventory-osm-hydronyms.mjs tests/unit/osm-hydro-inventory.test.mjs tools/build-place-candidates.mjs tools/lib/geonames-zip.mjs tools/lib/geonames-policy.mjs tools/lib/geonames-review.mjs tools/lib/geonames-statistics.mjs tools/place-batch-pipeline.mjs tools/download-terrain-source.mjs tools/build-hydro-packfile.mjs tools/report-paths.mjs scripts/gis/run-source.mjs scripts/summarize-boundary-capture-evidence.mjs tests/helpers/geonames-fixtures.mjs tests/unit/place-candidates.test.mjs tests/unit/gis-source-launcher.test.mjs tests/unit/boundary-capture-evidence.test.mjs tests/unit/font-assets.test.mjs tests/unit/application-source-extraction.test.mjs tests/unit/layer-lock-sync.test.mjs tests/unit/python-bridge-retirement.test.mjs
