name: GIS Node migration focused contracts
on:
  push:
    branches: [ work/gis ]
    paths:
      - '.github/workflows/gis-node-migration.yml'
      - 'tools/build/build-hydro-packfile.mjs'
      - 'tools/gis/download-terrain-source.mjs'
      - 'tools/gis/place-batch-pipeline.mjs'
      - 'tools/build/build-place-candidates.mjs'
      - 'tools/gis/inventory-hydro-names.mjs'
      - 'tests/unit/geometry/hydro-name.test.mjs'
      - 'tools/gis/baikonur-official-reference.mjs'
      - 'tools/gis/inventory-osm-hydronyms.mjs'
      - 'tools/gis/verify-published-hydro-independent-names.mjs'
      - 'tests/unit/geometry/hydro-source-selection.test.mjs'
      - 'tools/gis/compare-osm-hydro-natural-earth.mjs'
      - 'tests/unit/geometry/hydro-source-selection.test.mjs'
      - 'tools/gis/check-official-usgs-hydro-gauges.mjs'
      - 'tools/gis/hydro-independent-name-policy.mjs'
      - 'tools/gis/fetch-german-empire-1914-source.mjs'
      - 'tools/gis/fetch-east-germany-sources.mjs'
      - 'tests/unit/geometry/hydro-source-selection.test.mjs'
      - 'tools/lib/geonames-zip.mjs'
      - 'tools/lib/geonames-policy.mjs'
      - 'tools/lib/geonames-review.mjs'
      - 'tools/lib/geonames-statistics.mjs'
      - 'tests/helpers/geonames-fixtures.mjs'
      - 'tools/data/report-paths.mjs'
      - 'scripts/gis/run-source.mjs'
      - 'scripts/summarize-boundary-capture-evidence.mjs'
      - 'tests/unit/data/hydro-packfile.test.mjs'
      - 'tests/unit/geometry/download-terrain-source.test.mjs'
      - 'tests/unit/document/place-batch-pipeline.test.mjs'
      - 'tests/unit/document/place-candidates.test.mjs'
      - 'tests/unit/geometry/gis-source-launcher.test.mjs'
      - 'tests/unit/data/report-paths.test.mjs'
      - 'tests/unit/ui/ui-source-catalog.test.mjs'
      - 'tests/unit/geometry/gis-math-contract.test.mjs'
      - 'tests/unit/geometry/annex-slivers.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check migrated Node implementations
        run: |-
          node --check tools/build/build-hydro-packfile.mjs
          node --check tools/gis/download-terrain-source.mjs
          node --check tools/gis/place-batch-pipeline.mjs
          node --check tools/build/build-place-candidates.mjs
          node --check tools/gis/inventory-hydro-names.mjs
          node --check tools/gis/baikonur-official-reference.mjs
          node --check tools/gis/inventory-osm-hydronyms.mjs
          node --check tools/gis/hydro-independent-name-policy.mjs
          node --check tools/gis/fetch-german-empire-1914-source.mjs
          node --check tools/gis/fetch-east-germany-sources.mjs
          node --check tools/gis/check-official-usgs-hydro-gauges.mjs
          node --check tools/gis/compare-osm-hydro-natural-earth.mjs
          node --check tools/gis/verify-published-hydro-independent-names.mjs
          node --check scripts/gis/run-source.mjs
          node --check scripts/summarize-boundary-capture-evidence.mjs
          node --check tools/lib/geonames-zip.mjs
          node --check tools/lib/geonames-policy.mjs
          node --check tools/lib/geonames-review.mjs
          node --check tools/lib/geonames-statistics.mjs
          node --test tests/unit/data/hydro-packfile.test.mjs tests/unit/geometry/download-terrain-source.test.mjs tests/unit/document/place-batch-pipeline.test.mjs tests/unit/document/place-candidates.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs tests/unit/data/report-paths.test.mjs  tests/unit/ui/ui-source-catalog.test.mjs
          node --test   tests/unit/geometry/hydro-source-selection.test.mjs  tests/unit/geometry/hydro-name.test.mjs   tests/unit/geometry/gis-math-contract.test.mjs tests/unit/geometry/annex-slivers.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs
          pnpm exec eslint tools/gis/fetch-east-germany-sources.mjs  tools/gis/baikonur-official-reference.mjs  tools/gis/fetch-german-empire-1914-source.mjs  tools/gis/verify-published-hydro-independent-names.mjs tests/unit/geometry/hydro-source-selection.test.mjs tools/gis/compare-osm-hydro-natural-earth.mjs tests/unit/geometry/hydro-source-selection.test.mjs tools/gis/inventory-hydro-names.mjs tests/unit/geometry/hydro-name.test.mjs tools/gis/check-official-usgs-hydro-gauges.mjs  tools/gis/hydro-independent-name-policy.mjs tools/gis/inventory-osm-hydronyms.mjs  tools/build/build-place-candidates.mjs tools/lib/geonames-zip.mjs tools/lib/geonames-policy.mjs tools/lib/geonames-review.mjs tools/lib/geonames-statistics.mjs tools/gis/place-batch-pipeline.mjs tools/gis/download-terrain-source.mjs tools/build/build-hydro-packfile.mjs tools/data/report-paths.mjs scripts/gis/run-source.mjs scripts/summarize-boundary-capture-evidence.mjs tests/helpers/geonames-fixtures.mjs tests/unit/document/place-candidates.test.mjs tests/unit/geometry/gis-source-launcher.test.mjs  tests/unit/ui/ui-source-catalog.test.mjs tests/unit/geometry/gis-math-contract.test.mjs tests/unit/geometry/annex-slivers.test.mjs
