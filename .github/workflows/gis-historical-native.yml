name: Historical GIS native recipe contracts

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/cpp/build-territorial-recipe.cpp'
      - 'tools/cpp/historical-linework-audit.inc'
      - 'tools/cpp/historical-caspian-generalization.inc'
      - 'tests/unit/gis-caspian-generalize-native.test.mjs'
      - 'tools/gis/generalize-approved-caspian-display.mjs'
      - 'tests/unit/gis-caspian-display-packaging.test.mjs'
      - 'tools/gis/verify-historical-linework.mjs'
      - 'tests/unit/gis-historical-linework-native.test.mjs'
      - 'tools/gis/verify-approved-caspian-network.mjs'
      - 'tests/unit/gis-caspian-source-zip.test.mjs'
      - 'tools/historical-library/german-empire-1914-base.recipe.json'
      - 'tests/unit/gis-german-base-native.test.mjs'
      - '.github/workflows/gis-historical-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-hgis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/cpp/territorial-recipe-environment.yml
          init-shell: bash
      - name: Build canonical GEOS/PROJ recipe engine
        run: |
          cmake -S tools/cpp -B build-native/territorial-recipe -G Ninja \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF \
            -DPANDO_BUILD_TERRITORIAL_RECIPE=ON
          cmake --build build-native/territorial-recipe --target pando-territorial-recipe
      - name: Test native axis correction, island selection and protected recipe status
        run: |
          export PANDO_TERRITORIAL_RECIPE_BINARY="$PWD/build-native/territorial-recipe/pando-territorial-recipe"
          node --test tests/unit/gis-german-base-native.test.mjs tests/unit/gis-historical-linework-native.test.mjs
          node --test tests/unit/gis-caspian-source-zip.test.mjs
          node --test tests/unit/gis-caspian-generalize-native.test.mjs
          node --test tests/unit/gis-caspian-display-packaging.test.mjs

      - name: Fetch only immutable Caspian 1922 approved source archive
        run: |
          mkdir -p build-native/historical
          node --input-type=module - <<'JS'
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {gunzipSync} from 'node:zlib';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const pin=JSON.parse(readFileSync('config/library-data.json','utf8')).revision;
          const base='https://raw.githubusercontent.com/kimjeon-il/PandoLab-library-data/'+pin+'/';
          const get=async path=>{
            const result=await fetch(base+path,{signal:AbortSignal.timeout(120000)});
            if(!result.ok)throw Error('Pinned source archive HTTP '+result.status);
            return Buffer.from(await result.arrayBuffer());
          };
          const index=JSON.parse((await get('archive/index.json')).toString('utf8'));
          const logical='tools/historical-library/sources/ussr-1922-approved/caspian-shoreline-completed-candidate-20261024.zip';
          const entry=index.files?.[logical];
          const approved='3df45ab6e7d3a4b1dfac42b29f28cc1c932c3b1be9f866ccd7df6bb769b9a5b4';
          if(!entry||entry.bytes!==13323018||entry.sha256!==approved||
            !/^archive\/blobs\/[a-f0-9]{64}\.(?:gz|bin)$/.test(entry.stored))
            throw Error('Pinned Caspian master source or SHA receipt changed');
          const stored=await get(entry.stored);
          const original=entry.encoding==='gzip'?gunzipSync(stored):
            (entry.encoding==='raw'||entry.encoding==='none')?stored:null;
          if(!original||original.length!==entry.bytes||sha(original)!==approved)
            throw Error('Caspian source archive integrity mismatch');
          writeFileSync('build-native/historical/approved-caspian-1922.zip',
            original,{flag:'wx'});
          console.log('CASPIAN_PINNED_SOURCE='+JSON.stringify({
            libraryRevision:pin,logical,sha256:sha(original),bytes:original.length}));
          JS
      - name: Compare actual 266-reach approved source with the native GEOS topology owner
        run: |
          export PANDO_TERRITORIAL_RECIPE_BINARY="$PWD/build-native/territorial-recipe/pando-territorial-recipe"
          node tools/gis/verify-approved-caspian-network.mjs \
            --zip build-native/historical/approved-caspian-1922.zip \
            | tee build-native/historical/caspian-1922-native-receipt.jsonl
      - name: Generalize the actual 266-reach Caspian display in C++ without touching masters
        run: |
          export PANDO_TERRITORIAL_RECIPE_BINARY="$PWD/build-native/territorial-recipe/pando-territorial-recipe"
          node tools/gis/generalize-approved-caspian-display.mjs \
            --zip build-native/historical/approved-caspian-1922.zip \
            --output build-native/historical/caspian-1922-native-candidate.json \
            | tee build-native/historical/caspian-1922-native-display-receipt.jsonl

      - name: Compare approved 1922 Caspian Python oracle and native GEOS display candidate
        run: |
          python3 -m venv build-native/historical/python-parity-oracle
          build-native/historical/python-parity-oracle/bin/python -m pip install --quiet \
            'shapely==2.1.2' 'pyproj==3.7.2'
          build-native/historical/python-parity-oracle/bin/python - <<'PY'
          import importlib.util,json,math,zipfile
          from pathlib import Path
          from shapely.geometry import shape
          from shapely.ops import transform
          root=Path.cwd()
          spec=importlib.util.spec_from_file_location('approved_caspian',
            root/'tools/gis/apply_ussr_1922_caspian.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          base=root/'build-native/historical'
          z=zipfile.ZipFile(base/'approved-caspian-1922.zip')
          stem='caspian-completion/assembled-completion-candidate/'
          network=json.loads(z.read(stem+'waterbody-boundary-network.geojson'))
          approved_water=module.geometry(json.loads(z.read(
            stem+'polygon-check/waterbody-polygon-candidate.geojson')))
          python=module.generalize_caspian({'network':network,'water':approved_water})
          native=json.loads((base/'caspian-1922-native-candidate.json').read_text())
          py_network=python['network']['features']
          cpp_network=native['network']['features']
          mismatched_lengths=[]
          max_coordinate_difference=0.0
          mismatch_tol=[]
          for i,(left,right) in enumerate(zip(py_network,cpp_network)):
            assert left['properties']==right['properties'],('provenance',i)
            a,b=left['geometry']['coordinates'],right['geometry']['coordinates']
            if len(a)!=len(b):
              mismatched_lengths.append({'reach':i,'python':len(a),'cpp':len(b)})
              continue
            for p,q in zip(a,b):
              max_coordinate_difference=max(max_coordinate_difference,
                abs(p[0]-q[0]),abs(p[1]-q[1]))
          for i,(left,right) in enumerate(zip(python['metrics']['perFeatureToleranceMeters'],
              native['metrics']['perFeatureToleranceMeters'])):
            if left['id']!=right['id'] or abs(left['tolerance']-right['tolerance'])>1e-8:
              mismatch_tol.append({'reach':i,'python':left,'cpp':right})
          python_water=python['water']
          cpp_water=shape(native['water'])
          symmetric_area_km2=transform(module.TO_METRIC,
              python_water.symmetric_difference(cpp_water)).area/1e6
          outcome={
            'sourceFeatures':len(py_network),
            'pythonVerticesAfter':python['metrics']['verticesAfter'],
            'cppVerticesAfter':native['metrics']['verticesAfter'],
            'pythonAdaptiveRepairs':python['metrics']['adaptiveLocalRepairs'],
            'cppAdaptiveRepairs':native['metrics']['adaptiveLocalRepairs'],
            'pythonWaterHoles':len(python_water.interiors),
            'cppWaterPolygons':len(cpp_water.geoms),
            'cppWaterHoles':sum(len(p.interiors) for p in cpp_water.geoms),
            'featureVertexMismatches':mismatched_lengths[:12],
            'toleranceMismatches':mismatch_tol[:12],
            'maxCoordinateDifferenceDegrees':max_coordinate_difference,
            'symmetricDifferenceKm2':symmetric_area_km2,
          }
          print('APPROVED_CASPIAN_PYTHON_NATIVE_PARITY='+json.dumps(outcome,sort_keys=True))
          (base/'caspian-1922-python-native-comparison.json').write_text(
            json.dumps(outcome,indent=2)+'\n')
          assert len(py_network)==len(cpp_network)==266
          assert not mismatched_lengths and not mismatch_tol
          assert python['metrics']['verticesAfter']==native['metrics']['verticesAfter']
          assert python['metrics']['adaptiveLocalRepairs']==native['metrics']['adaptiveLocalRepairs']
          assert len(python_water.interiors)==68
          assert len(cpp_water.geoms)==1 and len(cpp_water.geoms[0].interiors)==68
          assert max_coordinate_difference<=2e-9
          assert symmetric_area_km2<=0.001
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caspian-1922-native-source-parity
          path: |
            build-native/historical/caspian-1922-native-receipt.jsonl
            build-native/historical/caspian-1922-native-display-receipt.jsonl
            build-native/historical/caspian-1922-python-native-comparison.json
          retention-days: 14
          if-no-files-found: warn
