name: One-shot historical country identity consolidation

on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/country-identity-consolidation-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: country-identity-consolidation-one-shot
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore all 278 untouched country chunks exactly
        run: |
          node tools/restore-unchanged-country-chunks.mjs
          node tools/build-territorial-entity-chunks.mjs --check
      - name: Rebuild missing Web history publication and verify native parity
        run: |
          node tools/build-historical-world-timeline.mjs
          node native/tools/sync-historical-world-timeline.mjs --web-root . --check
          node scripts/generate-build-metadata.mjs
      - name: Validate corrected catalog and historical publication
        run: |
          node tools/build-territorial-entity-chunks.mjs --check
          node tools/build-historical-world-timeline.mjs --check
          node --test --test-concurrency=1 tests/unit/territorial-library.test.mjs tests/unit/country-lineage-preservation.test.mjs tests/unit/historical-world-publication.test.mjs
          node scripts/check-version.mjs
      - name: Commit web assets and byte-identical untouched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/data/territorial-entities/generated/v2 assets/data/historical-world/generated/v1
          git add assets/js/build-meta.js index.html README.md
          git diff --cached --check
          if git diff --cached --quiet; then echo "No output to commit"; exit 1; fi
          git commit -m "fix(history): publish canonical timeline and preserve untouched chunks"
          git push origin HEAD:work/objects
