name: One-shot historical country identity consolidation

on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/country-identity-consolidation-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: country-identity-consolidation-one-shot
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Consolidate guarded source records and product consumers
        run: node tools/consolidate-country-geometry-identities.mjs
      - name: Rebuild catalog and shared historical timeline
        run: |
          node tools/build-territorial-entity-chunks.mjs
          node tools/build-historical-world-timeline.mjs
          node native/tools/sync-historical-world-timeline.mjs --web-root .
          node scripts/generate-build-metadata.mjs
      - name: Validate only affected contracts and web/native asset parity
        run: |
          node tools/build-territorial-entity-chunks.mjs --check
          node tools/build-historical-world-timeline.mjs --check
          node native/tools/sync-historical-world-timeline.mjs --web-root . --check
          node --test tests/unit/territorial-library.test.mjs tests/unit/country-lineage-preservation.test.mjs tests/unit/historical-world-publication.test.mjs
          node scripts/check-version.mjs
      - name: Commit verified consolidated data to work/objects only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/territorial-entities/source/countries/indonesia.json assets/data/territorial-entities/source/countries/ukraine.json assets/data/territorial-entities/source/countries/sudan.json
          git add -A assets/data/territorial-entities/generated/v2
          git add assets/data/historical-world/policy.json assets/data/historical-world/generated/v1 assets/world/historical-world 2>/dev/null || true
          git add -A native/assets/world/historical-world/v1 native/assets/world/manifest.json
          git add assets/js/modules/territorial-library.js native/app/territoriallibrarycatalog.cpp tools/historical-world-timeline.mjs scripts/check-territorial-library.mjs
          git add tests/unit/country-lineage-preservation.test.mjs tests/unit/historical-world-publication.test.mjs native/tests/historical_world_timeline_tests.cpp native/tests/historical_world_ui_tests.cpp tests/browser/historical-world-timeline.spec.mjs
          git add reports/geography/country-geometry-identity-consolidation-2026-10-13.md reports/README.md
          git add assets/js/build-meta.js index.html README.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No output to commit" && exit 1; } || true
          git commit -m "fix(history): unify Indonesia Ukraine Sudan geometry under canonical IDs"
          git push origin HEAD:work/objects
