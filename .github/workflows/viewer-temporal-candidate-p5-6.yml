name: Viewer P5-6 native temporal adoption and benchmark
on:
  push:
    branches: [work/ui]
    paths:
      - apps/viewer/js/modules/viewer-map.js
      - shared/frontend/js/modules/builtin-session.js
      - shared/frontend/js/modules/project-domain.js
      - shared/frontend/js/modules/core-document-client.js
      - shared/frontend/js/modules/core-document-read-model.js
      - shared/wasm/session-bindings.cpp
      - tests/unit/core-temporal-viewer-p5-6.test.mjs
      - tests/browser/map-transition-p5-6.spec.mjs
      - tests/browser/map-transition-p5-6.config.mjs
      - .github/workflows/viewer-temporal-candidate-p5-6.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: viewer-p5-6-work-ui
  cancel-in-progress: true
jobs:
  viewer-temporal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EMCC_CORES: '1'
      BINARYEN_CORES: '1'
      NODE_OPTIONS: '--max-old-space-size=1024'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Checkout fixed Emscripten 6.0.3
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - name: Compile matching C++ WASM and stage verified browser runtime pair
        shell: bash
        run: |
          build-native/emsdk/emsdk install 6.0.3
          build-native/emsdk/emsdk activate 6.0.3
          source build-native/emsdk/emsdk_env.sh
          emcmake cmake -S shared -B build-native/p5-6 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-native/p5-6 --target pandoeditor_wasm --parallel 1
          node tools/package-shared-core-assets.mjs --build-dir build-native/p5-6/wasm
          node tools/package-shared-core-assets.mjs --build-dir build-native/p5-6/wasm --check
      - name: P5-6 native candidate integration and existing source contracts
        run: node --test tests/unit/core-temporal-viewer-p5-6.test.mjs tests/unit/builtin-source-cache.test.mjs tests/unit/core-temporal-transport-p5-5.test.mjs
      - name: Install only Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real Viewer year transition, exact A-B-A consistency and timing
        run: pnpm exec playwright test --config tests/browser/map-transition-p5-6.config.mjs
      - name: Promote only the tested Core JS/WASM pair on work/ui
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/ui'
        shell: bash
        env:
          PANDO_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add shared/frontend/static/wasm/pandoeditor-core.js shared/frontend/static/wasm/pandoeditor-core.wasm shared/frontend/static/wasm/pandoeditor-core.manifest.json
          if git diff --cached --quiet; then
            echo 'P5-6 source-matched artifacts already committed'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(core): stage verified P5-6 temporal WASM pair on work/ui'
          git push "https://x-access-token:${PANDO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/work/ui
      - name: Save bounded browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-p5-6-${{ github.sha }}
          path: test-results/map-transition-p5-6/
          if-no-files-found: ignore
          retention-days: 7
