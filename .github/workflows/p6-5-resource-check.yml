name: P6-5 repeated transition resource check

on:
  push:
    branches: [p6-5-resource-check]
    paths:
      - tests/browser/p6-5-resource-check.spec.mjs
      - .github/workflows/p6-5-resource-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-5-resource-check
  cancel-in-progress: true

jobs:
  resource-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/library-data
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check only the P6-5 probe
        run: |
          node --check tests/browser/p6-5-resource-check.spec.mjs
          pnpm exec eslint tests/browser/p6-5-resource-check.spec.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run three bounded two-cycle resource batches
        run: pnpm exec playwright test tests/browser/p6-5-resource-check.spec.mjs --workers=1 --retries=0 --trace=off --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-5-resource-check-${{ github.sha }}
          path: test-results/p6-5-resources/
          if-no-files-found: warn
          retention-days: 7
