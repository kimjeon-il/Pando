name: W2-P6-6 test-only boundary WASM packet stage profiling
on:
  push:
    branches: [work/ui]
    paths:
      - tools/w2-p6-6-packet-stage-benchmark.mjs
      - .github/workflows/w2-p6-6-packet-stage-profile.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w2-p6-6-packet-stage-work-ui
  cancel-in-progress: true
jobs:
  wasm-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EMCC_CORES: '1'
      BINARYEN_CORES: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
      PANDO_P66_OUTPUT: test-results/w2-p6-6
      PANDOEDITOR_WASM_MODULE: build-native/p66/wasm/pandoeditor-core.js
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm fixed P6-3 B packet implementation identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object shared/wasm/boundary-bindings.cpp)" = b4288d45fda8ef71944071396c17671f73a2da79
          test "$(git hash-object shared/frontend/js/modules/gpu-stroke-geometry.js)" = 5cf46f288cc6d3288387309de29aeb3fb4972cbf
          test "$(git hash-object shared/frontend/js/modules/country-shared-boundary-packet.js)" = b6f44251be138c9b07c69ca4a59a07bac5a9dbca
          node --check tools/w2-p6-6-packet-stage-benchmark.mjs
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Checkout fixed Emscripten 6.0.3
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - name: Compile independent instrumented diagnostic WASM without touching product assets
        shell: bash
        run: |
          set -euo pipefail
          build-native/emsdk/emsdk install 6.0.3
          build-native/emsdk/emsdk activate 6.0.3
          source build-native/emsdk/emsdk_env.sh
          # Canonical codeload bytes when Github tag-archive endpoint is unavailable.
          port_file=build-native/emsdk/upstream/emscripten/tools/ports/zlib.py
          original='https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz'
          canonical='https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION}'
          if grep -Fq "$original" "$port_file"; then
            sed -i "s|$original|$canonical|" "$port_file"
            node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='build-native/emsdk/upstream/emscripten/tools/ports/__init__.py';
          const input=readFileSync(file,'utf8');
          const old="    ext = url_filename.split('.', 1)[1]";
          if(input.split(old).length!==2)throw Error('Unexpected pinned port loader');
          writeFileSync(file,input.replace(old,"    ext = 'tar.gz' if name == 'zlib' and url.startswith('https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v') else url_filename.split('.', 1)[1]"));
          NODE
          fi
          node tools/w2-p6-6-packet-stage-benchmark.mjs patch
          emcmake cmake -S shared -B build-native/p66 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-native/p66 --target pandoeditor_wasm --parallel 1
      - name: Measure real compiled C++ assembly / Embind conversions / original JS instance builder
        shell: bash
        run: |
          node tools/w2-p6-6-packet-stage-benchmark.mjs measure | tee test-results/w2-p6-6/measure.log
          test -s test-results/w2-p6-6/measurements.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('test-results/w2-p6-6/measurements.json','utf8'));
          for(const kind of ['shared','outline']){
            const g=r.groups[kind];
            if(g.runs!==10||g.inputRows!==75205||g.metrics.nativeAssemblyMs.n!==10)throw Error('Incomplete packet stage group '+kind);
          }
          if(r.actualWindowsD3D11||r.actualP6HistoryInput)throw Error('Synthetic test mislabeled');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p66-wasm-stage-measurements
          path: test-results/w2-p6-6/
          if-no-files-found: warn
          retention-days: 14
