name: E1 read-only map acceptance (Web and Windows)

on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/e1-map-readonly-acceptance.yml
      - shared/frontend/js/modules/product-mode-policy.js
      - shared/frontend/js/modules/core-document-client.js
      - shared/frontend/js/modules/document-session.js
      - shared/frontend/js/modules/project-domain.js
      - shared/frontend/js/modules/project-session.js
      - shared/frontend/js/modules/map-owner-composition.js
      - shared/frontend/js/modules/map-workspace-host.js
      - shared/frontend/js/modules/rendering-domain.js
      - apps/viewer/js/modules/viewer-map.js
      - apps/viewer/js/modules/viewer-composition.js
      - tests/unit/viewer-composition-recovery.test.mjs
      - tests/browser/viewer-project-open.spec.mjs
      - tests/unit/core-product-mode.test.mjs
      - tests/unit/map-readonly-flat-boundary.test.mjs
      - tests/unit/project-product-surface.test.mjs
      - tests/unit/viewer-globe-only.test.mjs
  workflow_dispatch:

permissions:
  contents: read

# Source SHA-based concurrency preserves evidence despite unrelated concurrent pushes.
concurrency:
  group: e1-readonly-${{ github.sha }}
  cancel-in-progress: false

jobs:
  canonical-read-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the existing source-matched C++/WASM prerequisite
        run: node scripts/check-core-prerequisite.mjs
      - name: Lint E1 source and focused assertions
        run: >-
          pnpm exec eslint
          shared/frontend/js/modules/product-mode-policy.js
          shared/frontend/js/modules/core-document-client.js
          shared/frontend/js/modules/document-session.js
          shared/frontend/js/modules/project-domain.js
          shared/frontend/js/modules/project-session.js
          shared/frontend/js/modules/map-owner-composition.js
          shared/frontend/js/modules/map-workspace-host.js
          shared/frontend/js/modules/rendering-domain.js
          apps/viewer/js/modules/viewer-map.js
          tests/unit/core-product-mode.test.mjs
          tests/unit/map-readonly-flat-boundary.test.mjs
          tests/unit/project-product-surface.test.mjs
          tests/unit/viewer-globe-only.test.mjs
      - name: Verify Core read access, project ownership and editing isolation
        run: >-
          node --test --test-concurrency=2
          tests/unit/core-product-mode.test.mjs
          tests/unit/project-product-surface.test.mjs
          tests/unit/viewer-globe-only.test.mjs
          tests/unit/map-readonly-flat-boundary.test.mjs
          tests/unit/viewer-composition-recovery.test.mjs
      - name: Verify existing runtime module boundaries
        run: node scripts/check-runtime-boundaries.mjs

  windows-shared-contract:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Preserve checked-in source line identities
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Windows flat read-only projection, selection and file transports
        run: >-
          node --test --test-concurrency=2
          tests/unit/viewer-globe-only.test.mjs
          tests/unit/project-product-surface.test.mjs
          tests/unit/map-readonly-flat-boundary.test.mjs
          tests/unit/file-access-contract.test.mjs
          tests/unit/native-document-transfer-contract.test.mjs
          apps/editor/tests/stage.test.mjs

  web-editor-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify real viewer/editor map rendering, selection and project open
        run: >-
          pnpm exec playwright test
          tests/browser/viewer-review-e4.spec.mjs
          tests/browser/viewer-project-open.spec.mjs
          tests/browser/viewer-review-e4.spec.mjs
          --workers=1 --retries=0 --reporter=list
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e1-readonly-browser-failure-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
