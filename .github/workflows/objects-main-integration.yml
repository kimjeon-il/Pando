name: Objects main integration
on:
  push:
    branches: [work/objects]
    paths: [.github/workflows/objects-main-integration.yml]
permissions:
  contents: read
  actions: read
jobs:
  canvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NODE_OPTIONS: '--max-old-space-size=1536'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: objects-stage2-verification-41287621774
          run-id: 41287621774
          github-token: ${{ github.token }}
          path: build-native/objects-stage2-prior
      - name: Observe the exact failed candidate without changing production files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git bundle verify build-native/objects-stage2-prior/candidate.bundle
          git fetch build-native/objects-stage2-prior/candidate.bundle refs/pando/objects-stage2-candidate
          test "$(git rev-parse FETCH_HEAD)" = fda2f1b692149dbb58b0e3bf80fd56fabe20725a
          git checkout --detach fda2f1b692149dbb58b0e3bf80fd56fabe20725a
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const id='9fbb714338ad1a9a6e1a4e4ff6b209505ec18de7';
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${id}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Read-only probe unavailable');
          const bytes=Buffer.from((await r.json()).content,'base64');
          if(createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex')!==id)throw Error('Probe identity mismatch');
          writeFileSync('/tmp/objects-canvas-probe.mjs',bytes);
          NODE
          node /tmp/objects-canvas-probe.mjs
          node --check tests/browser/builtin-temporal-transition.spec.mjs
          git diff --quiet -- shared apps config/library-data.json
          mkdir -p test-results/objects-stage2
          cp build-native/objects-stage2-prior/{native-tests.log,parity.json,parity.log,unit.log,actual-wasm.log,web-app-assets.log,transport-lint-fix.log} test-results/objects-stage2/
          cp build-native/objects-stage2-prior/browser.log test-results/objects-stage2/previous-browser.log
          cp build-native/objects-stage2-prior/{candidate.bundle,candidate-commit.txt} test-results/objects-stage2/
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/library-data
      - run: pnpm exec playwright install --with-deps chromium
      - name: Only the failed desktop Canvas scenario, with bounded frame and readiness evidence
        run: |
          set -o pipefail
          pnpm exec playwright test tests/browser/builtin-temporal-transition.spec.mjs --grep='canvas 1280px' --workers=1 --retries=0 --trace=off --output=test-results/objects-stage2/browser | tee test-results/objects-stage2/canvas-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objects-stage2-canvas-${{ github.run_id }}
          path: test-results/objects-stage2/
          if-no-files-found: warn
          retention-days: 7
