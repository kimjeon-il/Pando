name: Preserve stage-2 implementation pending Canvas acceptance
on:
  push:
    branches: [work/objects]
    paths: [.github/workflows/objects-main-integration.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: objects-stage2-canvas-41288545729
          run-id: 41288545729
          github-token: ${{ github.token }}
          path: build-native/objects-stage2-prior
      - name: Preserve exact implementation, known passing evidence and unresolved failure
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b167cb3efc395f8864de9ee31253b22de8f3fd6a
          test "$(git rev-parse origin/main)" = 502cc3014db2657c430819a249b9a724f3cb5880
          git bundle verify build-native/objects-stage2-prior/candidate.bundle
          git fetch build-native/objects-stage2-prior/candidate.bundle refs/pando/objects-stage2-candidate
          test "$(git rev-parse FETCH_HEAD)" = fda2f1b692149dbb58b0e3bf80fd56fabe20725a
          git checkout --detach fda2f1b692149dbb58b0e3bf80fd56fabe20725a
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          const evidence=JSON.parse(readFileSync('build-native/objects-stage2-prior/parity.json','utf8'));
          if(!evidence.passed||evidence.pairedCalls!==351||evidence.cases.length!==6)throw Error('Native/WASM evidence identity changed');
          const previous=readFileSync('build-native/objects-stage2-prior/previous-browser.log','utf8');
          if(!previous.includes('5 passed')||!previous.includes('1 failed')||!previous.includes('canvas 1280px'))throw Error('Original browser blocker must remain documented');
          const probe=readFileSync('build-native/objects-stage2-prior/canvas-probe.log','utf8');
          if(!probe.includes('1 passed')||!probe.includes('"renderer":"canvas2d"'))throw Error('Unexpected diagnostic renderer');
          const old=`Local native document_session_tests and temporal_adopt_tests passed with the new
          rejection and delta/rollback regressions. Source-matched WASM and browser gates
          remain pending until the stage-2 integration workflow records their results.
          No performance latency claim is made. No independent agent reviewer is available;
          final review is an explicit author review, separate from implementation.`;
          const update=`## Current acceptance: WIP, do not merge main

          The implementation and source-matched WASM below are preserved for review, not
          accepted for production. Main remains 502cc301; its stage-0 repair and stage-1
          country loader/data pairing are unchanged.

          Verified: four focused native targets; six native/WASM scenarios with 351 exact
          paired calls; 85 affected JavaScript contracts; three actual-data WASM tests;
          affected ESLint; independent Web/App country assets (278 countries, 291 physical
          files, maximum 524288 bytes, no aggregate transport requests). Runs 41286450388,
          41286848158 and 41287252232 retain those outputs. Test-harness corrections did
          not modify the compiled source or weaken functional assertions.

          Browser run 41287621774: five passed, one failed, retries=0. WebGL desktop and
          mobile, Canvas mobile, failed/superseded source reads, and Canvas user-file
          opening passed. Desktop Canvas stalled after Core adopted 2025-12: the displayed
          month stayed 2026-10 and viewerStatus.ready stayed false for 90 seconds.
          This is an unresolved presentation-acceptance failure, not a source-read or
          delta transport failure. Its exact cause and baseline status are not proven.

          Read-only diagnostic run 41288545729 passed the desktop case after startup
          selected the canvas2d fallback (15 stale Worker frames). That pass is NOT a
          production fix or proof that the initial failure is resolved. Production
          renderer files are unchanged; no timeout, input or acceptance assertion was
          relaxed, and the failing browser case remains enabled. Do not disable Worker
          rendering to obtain acceptance.

          Reproduce only the remaining desktop case using
          pnpm exec playwright test tests/browser/builtin-temporal-transition.spec.mjs
          --grep='canvas 1280px' --workers=1 --retries=0. Separate canvas-worker from
          canvas2d when examining frame/scene provenance. Keep passed unchanged native
          and source/data checks; rerun affected gates after an actual correction.

          Author self-review only; no independent agent reviewer was available. No
          latency target, full native-platform matrix or main/production deployment
          success is claimed. The temporary write-enabled workflow is removed; unique
          evidence and the original branch history remain retained.`;
          for(const name of ['2026-10-31-builtin-temporal-transition.md','2026-10-31-builtin-temporal-transition-acceptance.md']){
            const path='docs/superpowers/plans/'+name;let s=readFileSync(path,'utf8');
            if(!s.includes(old))throw Error('Acceptance ledger source changed');
            writeFileSync(path,s.replace(old,update));
          }
          if(existsSync('.github/workflows/objects-main-integration.yml'))throw Error('Temporary write-enabled workflow must not remain');
          if(JSON.parse(readFileSync('config/library-data.json','utf8')).revision!=='5eb7be55208efaafe39bd5a65ec2f111d70b9053')throw Error('Data pin changed');
          NODE
          git diff --check
          git diff --quiet fda2f1b692149dbb58b0e3bf80fd56fabe20725a -- shared apps tests config
          git diff --quiet 502cc3014db2657c430819a249b9a724f3cb5880 -- config/library-data.json shared/frontend/js/modules/builtin-world-loader.js shared/core/src/webobjectcommands.cpp shared/tests/web-content-codec-tests.cpp shared/tests/web-content-command-tests.cpp shared/tests/web-object-command-tests.cpp
          node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
          git add docs/superpowers/plans/2026-10-31-builtin-temporal-transition*.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          final=$(git commit-tree "$(git write-tree)" -p "$GITHUB_SHA" -p fda2f1b692149dbb58b0e3bf80fd56fabe20725a -m 'wip(objects): preserve integrated temporal delta and verified WASM; desktop Canvas acceptance blocked')
          git checkout --detach "$final"
      - name: Publish only WIP work/objects with exact-head guards, never main
        env:
          PANDO_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          remote="https://x-access-token:${PANDO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$remote" refs/heads/work/objects | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = 502cc3014db2657c430819a249b9a724f3cb5880
          git push "$remote" HEAD:refs/heads/work/objects
          test "$(git ls-remote "$remote" refs/heads/work/objects | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = 502cc3014db2657c430819a249b9a724f3cb5880
          echo "WIP_COMMIT=$(git rev-parse HEAD)"
          git diff --stat 502cc3014db2657c430819a249b9a724f3cb5880 HEAD
