name: Objects main integration
on:
  push:
    branches: [work/objects]
    paths: [.github/workflows/objects-main-integration.yml]
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: '--max-old-space-size=1536'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve the completed native-WASM build and stop only its broken test harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const base=`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          const get=async path=>{const r=await fetch(base+path,{headers});if(!r.ok)throw Error(`${path}: ${r.status}`);return r.json();};
          const run=await get('/actions/runs/41286450388');
          if(run.head_sha!=='95383c378ac9b8dddaf88787e83e0baf85a47347')throw Error('Unexpected prior run identity');
          const jobs=await get('/actions/runs/41286450388/jobs');
          const job=jobs.jobs.find(x=>x.id===124788616066);
          if(!job?.steps.some(s=>s.name==='Build only affected native contracts and source-matched WASM'&&s.conclusion==='success'))throw Error('Do not cancel or discard an incomplete compiled candidate');
          if(run.status!=='completed'){
            const r=await fetch(base+'/actions/runs/41286450388/cancel',{method:'POST',headers});
            if(!r.ok&&r.status!==409)throw Error(`Cannot stop the known test-only harness failure: ${r.status}`);
          }
          let available=false;
          for(let i=0;i<60;i++){
            const artifacts=await get('/actions/runs/41286450388/artifacts');
            if(artifacts.artifacts.some(x=>x.name==='objects-stage2-verification-41286450388'&&!x.expired)){available=true;break;}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!available)throw Error('Compiled candidate was not preserved; do not rebuild or publish blindly');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: objects-stage2-verification-41286450388
          run-id: 41286450388
          github-token: ${{ github.token }}
          path: build-native/objects-stage2-prior
      - name: Reuse the exact built candidate and fix only duplicated test registration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 95383c378ac9b8dddaf88787e83e0baf85a47347
          git bundle verify build-native/objects-stage2-prior/candidate.bundle
          git fetch build-native/objects-stage2-prior/candidate.bundle refs/pando/objects-stage2-candidate
          candidate=$(cat build-native/objects-stage2-prior/candidate-commit.txt)
          test "$(git rev-parse FETCH_HEAD)" = "$candidate"
          git merge-base --is-ancestor 95383c378ac9b8dddaf88787e83e0baf85a47347 "$candidate"
          git merge-base --is-ancestor 502cc3014db2657c430819a249b9a724f3cb5880 "$candidate"
          git checkout --detach "$candidate"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='tests/native/temporal-parity-p5-7.test.mjs';let s=readFileSync(path,'utf8');
          const anchor="  t.scenario('Stage 2 native/WASM builtin delta";
          const start=s.indexOf(anchor),end=s.indexOf('after(async () => {',start);
          if(start<0||end<start||(s.match(/scenario\('Stage 2 native\/WASM builtin delta/g)||[]).length!==2)throw Error('Unexpected test registration source');
          s=s.slice(0,start)+'  t.'+s.slice(end);writeFileSync(path,s);
          NODE
          git diff --check
          git diff --quiet -- shared config/library-data.json
          git add tests/native/temporal-parity-p5-7.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fixed=$(git commit-tree "$(git write-tree)" -p "$GITHUB_SHA" -p "$candidate" -m 'fix(test): retain top-level delta scenario and per-test native cleanup')
          git checkout --detach "$fixed"
          mkdir -p test-results/objects-stage2
          cp build-native/objects-stage2-prior/native-tests.log test-results/objects-stage2/native-tests.log
          node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check | tee test-results/objects-stage2/wasm-identity.log
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile only the native parity probe, reusing already verified WASM
        run: |
          cmake -S shared -B build-native/core-session -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-native/core-session --target pandoeditor_core --parallel 2 > test-results/objects-stage2/native-build.log 2>&1
          c++ -std=c++17 -O2 -Ishared/core/include tests/native/temporal-parity-probe.cpp build-native/core-session/core/libpandoeditor_core.a -lz -o build-native/core-session/temporal-parity-probe
      - name: Exact native-WASM parity and affected Worker/model/cache contracts
        timeout-minutes: 5
        env:
          PANDO_TEMPORAL_NATIVE: build-native/core-session/temporal-parity-probe
          PANDO_P5_7_EVIDENCE: test-results/objects-stage2/parity.json
        run: |
          set -euo pipefail
          node --test tests/native/temporal-parity-p5-7.test.mjs | tee test-results/objects-stage2/parity.log
          node --test --test-concurrency=1 tests/unit/core-temporal-delta.test.mjs tests/unit/core-temporal-transport-p5-5.test.mjs tests/unit/core-temporal-viewer-p5-6.test.mjs tests/unit/core-document-read-model.test.mjs tests/unit/core-document-runtime.test.mjs tests/unit/core-document-client.test.mjs tests/unit/builtin-source-cache.test.mjs tests/unit/builtin-country-loading.test.mjs | tee test-results/objects-stage2/unit.log
          pnpm exec eslint apps/viewer/js/modules/viewer-composition.js shared/frontend/js/modules/builtin-session.js shared/frontend/js/modules/core-document-read-model.js shared/frontend/js/modules/core-document-runtime.js shared/frontend/js/modules/project-domain.js tests/unit/core-temporal-delta.test.mjs tests/unit/core-temporal-transport-p5-5.test.mjs tests/browser/builtin-temporal-transition.spec.mjs tests/browser/deferred-builtin-timeline.spec.mjs tests/native/temporal-parity-p5-7.test.mjs
      - uses: ./.github/actions/library-data
      - name: Actual WASM admission and independent Web-App packaging
        env:
          PANDOEDITOR_WASM_MODULE: shared/frontend/static/wasm/pandoeditor-core.js
        run: |
          node --test shared/tests/temporal-transport-p5-5.test.mjs
          node tests/integration/builtin-country-deployment.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Desktop-mobile WebGL and Canvas delta, rollback, cancellation and file opening
        run: pnpm exec playwright test tests/browser/builtin-temporal-transition.spec.mjs --workers=1 --retries=0 --trace=off --output=test-results/objects-stage2/browser
      - name: Publish verified work/objects only, never main
        env:
          PANDO_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p 'JSON.parse(require("fs").readFileSync("config/library-data.json")).revision')" = 5eb7be55208efaafe39bd5a65ec2f111d70b9053
          test -z "$(git status --porcelain --untracked-files=no)"
          remote="https://x-access-token:${PANDO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$remote" refs/heads/work/objects | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = 502cc3014db2657c430819a249b9a724f3cb5880
          git push "$remote" HEAD:refs/heads/work/objects
          git rev-parse HEAD > test-results/objects-stage2/verified-commit.txt
      - name: Preserve bounded candidate and evidence
        if: always()
        run: |
          mkdir -p test-results/objects-stage2
          git rev-parse HEAD > test-results/objects-stage2/candidate-commit.txt
          git update-ref refs/pando/objects-stage2-candidate HEAD
          git bundle create test-results/objects-stage2/candidate.bundle refs/pando/objects-stage2-candidate ^"$GITHUB_SHA" ^95383c378ac9b8dddaf88787e83e0baf85a47347 ^502cc3014db2657c430819a249b9a724f3cb5880 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objects-stage2-verification-${{ github.run_id }}
          path: test-results/objects-stage2/
          if-no-files-found: warn
          retention-days: 7
