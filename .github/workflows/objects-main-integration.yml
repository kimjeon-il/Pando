name: Objects main integration
on:
  push:
    branches: [work/objects]
    paths: [.github/workflows/objects-main-integration.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: '--max-old-space-size=1536'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: objects-stage2-verification-41286848158
          run-id: 41286848158
          github-token: ${{ github.token }}
          path: build-native/objects-stage2-prior
      - name: Reuse accepted native-WASM candidate and qualify existing Node test globals
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4872f218ce2049d7f6f3a8bc842f1ba664da7687
          git bundle verify build-native/objects-stage2-prior/candidate.bundle
          git fetch build-native/objects-stage2-prior/candidate.bundle refs/pando/objects-stage2-candidate
          candidate=$(cat build-native/objects-stage2-prior/candidate-commit.txt)
          test "$(git rev-parse FETCH_HEAD)" = "$candidate"
          git merge-base --is-ancestor 4872f218ce2049d7f6f3a8bc842f1ba664da7687 "$candidate"
          git merge-base --is-ancestor 502cc3014db2657c430819a249b9a724f3cb5880 "$candidate"
          git checkout --detach "$candidate"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const evidence=JSON.parse(readFileSync('build-native/objects-stage2-prior/parity.json','utf8'));
          if(!evidence.passed||evidence.pairedCalls!==351||evidence.cases.length!==6)throw Error('Native/WASM evidence is not accepted');
          const path='tests/unit/core-temporal-transport-p5-5.test.mjs';let s=readFileSync(path,'utf8');
          const importLine="import {createProductModePolicy} from '../../shared/frontend/js/modules/product-mode-policy.js';\n";
          if(!s.includes(importLine)||s.includes('globalThis.setImmediate'))throw Error('Unexpected transport test source');
          s=s.replace(importLine,'').replaceAll('setImmediate(resolve)','globalThis.setImmediate(resolve)').replaceAll('queueMicrotask(','globalThis.queueMicrotask(').replaceAll('new AbortController(','new globalThis.AbortController(');
          writeFileSync(path,s);
          NODE
          git diff --check
          git diff --quiet -- shared apps config/library-data.json
          git add tests/unit/core-temporal-transport-p5-5.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fixed=$(git commit-tree "$(git write-tree)" -p "$GITHUB_SHA" -p "$candidate" -m 'test(core): qualify Node globals without changing temporal transport assertions')
          git checkout --detach "$fixed"
          mkdir -p test-results/objects-stage2
          cp build-native/objects-stage2-prior/{native-tests.log,parity.json,parity.log,unit.log} test-results/objects-stage2/
          node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check | tee test-results/objects-stage2/wasm-identity.log
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recheck only corrected transport tests and affected lint; retain passed native matrix
        run: |
          set -euo pipefail
          node --test tests/unit/core-temporal-transport-p5-5.test.mjs | tee test-results/objects-stage2/transport-lint-fix.log
          pnpm exec eslint apps/viewer/js/modules/viewer-composition.js shared/frontend/js/modules/builtin-session.js shared/frontend/js/modules/core-document-read-model.js shared/frontend/js/modules/core-document-runtime.js shared/frontend/js/modules/project-domain.js tests/unit/core-temporal-delta.test.mjs tests/unit/core-temporal-transport-p5-5.test.mjs tests/browser/builtin-temporal-transition.spec.mjs tests/browser/deferred-builtin-timeline.spec.mjs tests/native/temporal-parity-p5-7.test.mjs
      - uses: ./.github/actions/library-data
      - name: Actual WASM admission and independent Web-App packaging
        env:
          PANDOEDITOR_WASM_MODULE: shared/frontend/static/wasm/pandoeditor-core.js
        run: |
          set -euo pipefail
          node --test shared/tests/temporal-transport-p5-5.test.mjs | tee test-results/objects-stage2/actual-wasm.log
          node tests/integration/builtin-country-deployment.mjs | tee test-results/objects-stage2/web-app-assets.log
      - run: pnpm exec playwright install --with-deps chromium
      - name: Desktop-mobile WebGL and Canvas delta, rollback, cancellation and file opening
        run: pnpm exec playwright test tests/browser/builtin-temporal-transition.spec.mjs --workers=1 --retries=0 --trace=off --output=test-results/objects-stage2/browser
      - name: Publish verified work/objects only, never main
        env:
          PANDO_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p 'JSON.parse(require("fs").readFileSync("config/library-data.json")).revision')" = 5eb7be55208efaafe39bd5a65ec2f111d70b9053
          test -z "$(git status --porcelain --untracked-files=no)"
          remote="https://x-access-token:${PANDO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$remote" refs/heads/work/objects | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = 502cc3014db2657c430819a249b9a724f3cb5880
          git push "$remote" HEAD:refs/heads/work/objects
          git rev-parse HEAD > test-results/objects-stage2/verified-commit.txt
      - name: Preserve bounded candidate and evidence
        if: always()
        run: |
          mkdir -p test-results/objects-stage2
          git rev-parse HEAD > test-results/objects-stage2/candidate-commit.txt
          git update-ref refs/pando/objects-stage2-candidate HEAD
          git bundle create test-results/objects-stage2/candidate.bundle refs/pando/objects-stage2-candidate ^"$GITHUB_SHA" ^4872f218ce2049d7f6f3a8bc842f1ba664da7687 ^502cc3014db2657c430819a249b9a724f3cb5880 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objects-stage2-verification-${{ github.run_id }}
          path: test-results/objects-stage2/
          if-no-files-found: warn
          retention-days: 7
