name: SLUB North Schleswig historic map catalog (read-only)

on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/discover-north-schleswig-map-services.mjs'
      - 'tests/unit/north-schleswig-map-services.test.mjs'
      - '.github/workflows/north-schleswig-1914-map-services.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  north-schleswig-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline source-proven catalogue tests
        run: node --test tests/unit/north-schleswig-map-services.test.mjs
      - name: Prepare only pinned external GIS source descriptors
        uses: ./.github/actions/library-data
      - name: Query public index only, preserving original report bytes
        run: |
          mkdir -p build-native/gis
          node tools/discover-north-schleswig-map-services.mjs \
            --sheets tools/historical-library/land-borders/german-denmark-1914-north-schleswig-001-026.sheets.json \
            --output build-native/gis/north-schleswig-slub-catalogue.json --execute
      - name: Reject claims of historical map acquisition or border verification
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('build-native/gis/north-schleswig-slub-catalogue.json','utf8'));
          if(x.historicRasterObtained!==false||x.historicRasterComparedWithLine!==false)
            throw Error('Catalogue discovery cannot certify any historical border');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: north-schleswig-slub-catalogue-receipt
          path: build-native/gis/north-schleswig-slub-catalogue.json
          retention-days: 14
          if-no-files-found: warn
