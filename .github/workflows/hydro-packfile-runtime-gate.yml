name: Hydro v0.13.2 packfile fidelity and Range regression

on:
  push:
    branches: [ work/gis ]
    paths:
      - 'shared/frontend/js/workers/hydro-shard-store.js'
      - 'shared/frontend/js/workers/hydro-tile-worker.js'
      - 'tools/build-hydro-packfile.mjs'
      - 'tests/unit/hydro-packfile.test.mjs'
      - '.github/workflows/hydro-packfile-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shared/frontend/js/workers/hydro-shard-store.js
            /shared/frontend/js/workers/hydro-tile-worker.js
            /assets/data/hydro/v0.13.2/
            /tools/build-hydro-packfile.mjs
            /tests/unit/hydro-packfile.test.mjs
            /tests/unit/hydro-packfile-builder.test.mjs
            /tools/library-*.mjs
            /scripts/lib/frontend-layout.mjs
            /tools/library-report-layout.mjs
            /tools/library-content.mjs
            /config/library-data.json
            /.github/actions/library-data/action.yml
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library-data
          ref: 81c45d11d1265e287dd21aaf0127c1112aca1176
          path: historical-hydro
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/data/hydro/v0.13.0/
            /assets/data/hydro/v0.13.1/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify byte-equivalent package and atomic HTTP Range behavior
        run: |
          node tools/build-hydro-packfile.mjs --source historical-hydro/assets/data/hydro/v0.13.1 --output "$RUNNER_TEMP/hydro-pinned" 
          node tools/build-hydro-packfile.mjs --source historical-hydro/assets/data/hydro/v0.13.1 --output "$RUNNER_TEMP/hydro-pinned" --check
          node --test tests/unit/hydro-packfile-builder.test.mjs
          node --check shared/frontend/js/workers/hydro-tile-worker.js
          node --check shared/frontend/js/workers/hydro-shard-store.js
          node --test tests/unit/hydro-packfile.test.mjs
