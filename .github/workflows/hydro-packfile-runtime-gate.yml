name: Hydro v0.13.2 packfile fidelity and Range regression

on:
  push:
    branches: [work/gis]
    paths:
      - 'assets/js/workers/hydro-shard-store.js'
      - 'assets/js/workers/hydro-tile-worker.js'
      - 'tools/build-hydro-packfile.py'
      - 'tests/unit/hydro-packfile.test.mjs'
      - '.github/workflows/hydro-packfile-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/js/workers/hydro-shard-store.js
            /assets/js/workers/hydro-tile-worker.js
            /assets/data/hydro/v0.13.0/
            /assets/data/hydro/v0.13.1/
            /assets/data/hydro/v0.13.2/
            /tools/build-hydro-packfile.py
            /tests/unit/hydro-packfile.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify byte-equivalent package and atomic HTTP Range behavior
        run: |
          python3 tools/build-hydro-packfile.py --check
          node --check assets/js/workers/hydro-tile-worker.js
          node --check assets/js/workers/hydro-shard-store.js
          node --test tests/unit/hydro-packfile.test.mjs
