name: Stage 0 prepared mesh focused workbench
on:
  push:
    branches: [work/optimization]
    paths: ['.github/workflows/stage0-mesh-workbench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/library-data
      - name: Inspect pinned identities and mesh manifest without regenerating GIS
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stage0"
          node --input-type=module <<'JS'
          import {readdirSync,readFileSync,statSync,writeFileSync,existsSync} from 'node:fs';
          import {join} from 'node:path';
          import {gunzipSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          const out=process.env.RUNNER_TEMP+'/stage0/',paths=[];
          function scan(root,depth=0){if(depth>5)return;for(const e of readdirSync(root,{withFileTypes:true})){const p=join(root,e.name);if(e.isDirectory())scan(p,depth+1);else if(/mesh|bundle|manifest|world|prepared|country/.test(p))paths.push({path:p,bytes:statSync(p).size});}}
          scan('assets/data');
          writeFileSync(out+'assets.json',JSON.stringify(paths,null,2));
          const read=p=>JSON.parse(p.endsWith('.gz')?gunzipSync(readFileSync(p)):readFileSync(p,'utf8'));
          const digest=g=>createHash('sha256').update(JSON.stringify([g.type,g.coordinates])).digest('hex');
          for(const p of ['assets/data/world/current.json','assets/data/world/build-input.json','assets/data/builtin-world/generated/v1/index.json','assets/data/prepared-polygons/generated/v2/manifest.json'])
            if(existsSync(p))writeFileSync(out+p.replaceAll('/','__'),readFileSync(p));
          const source=read('assets/data/territorial-entities/generated/current-world.geojson');
          writeFileSync(out+'current-world-identity.json',JSON.stringify(source.features.map(f=>({id:f.id,properties:f.properties,digest:digest(f.geometry)})),null,2));
          const index=read('assets/data/builtin-world/generated/v1/index.json'),rows=[];
          for(const entry of index.entities){
            let country;
            if(entry.parts){const raw=Buffer.concat(entry.parts.map(p=>readFileSync('assets/data/builtin-world/generated/v1/'+p.file)));country=JSON.parse(gunzipSync(raw));}
            else country=read('assets/data/builtin-world/generated/v1/'+entry.file);
            rows.push({id:entry.entityId,identity:country.identity,timelineRecords:country.timelineRecords,geometries:country.geometries.map(g=>({id:g.id,version:g.version,digest:digest(g.geojson)}))});
          }
          writeFileSync(out+'builtin-identity.json',JSON.stringify(rows,null,2));
          console.log('MESH_AUDIT_COUNTS',JSON.stringify({world:source.features.length,builtin:rows.length}));
          JS
      - name: Retain relevant source dependencies
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/stage0/tool-sources.tar.gz" tools/build tools/data tests/helpers src/ui/object-presentation.js 2>/dev/null || tar -czf "$RUNNER_TEMP/stage0/tool-sources.tar.gz" tools/build tools/data tests/helpers
          git rev-parse HEAD > "$RUNNER_TEMP/stage0/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-mesh-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/stage0/
          retention-days: 7
          if-no-files-found: warn
