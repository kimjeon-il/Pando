name: Stage 0 prepared mesh focused workbench
on:
  push:
    branches: [work/optimization]
    paths: ['.github/workflows/stage0-mesh-workbench.yml','tools/stage0-workbench-fix.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage0-prepared-country-scene
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/optimization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/library-data
      - name: Execute the reviewed scoped workbench with corrected prerequisite selection
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {parse} from 'yaml';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const helper='tools/stage0-workbench-fix.mjs';let text=readFileSync(helper,'utf8');
          const guard="if(changed.some(key=>key!=='template'))throw Error('Concurrent catalog change exceeds reviewed template-only scope');";
          if(!text.includes(guard))throw Error('Correction context changed');
          text=text.replace(guard,`if(changed.some(key=>!['template','geometryAssets'].includes(key)))throw Error('Unexpected concurrent catalog fields');
          if(changed.includes('geometryAssets')){
            const key=row=>JSON.stringify([row.id,row.version]);
            const old=new Map(before.geometryAssets.map(row=>[key(row),row]));
            if(old.size!==after.geometryAssets.length)throw Error('Concurrent geometry identity membership changed');
            const deltas=[];
            for(const row of after.geometryAssets){const prior=old.get(key(row));
              const fields=prior?[...new Set([...Object.keys(prior),...Object.keys(row)])].filter(k=>JSON.stringify(prior[k])!==JSON.stringify(row[k])):['missing'];
              if(fields.length)deltas.push({id:row.id,version:row.version,fields,before:prior,after:row});
            }
            console.log('CONCURRENT_GEOMETRY_DESCRIPTORS',JSON.stringify(deltas));
            if(deltas.some(d=>!d.before||d.before.sha256!==d.after.sha256))throw Error('Concurrent geometry bytes changed; review before combining');
          }`);
          writeFileSync(helper,text);
          const definition=parse(execFileSync('git',['show','83691b590669d2db5f03865fce7e876fcf0d2fb9:.github/workflows/stage0-mesh-workbench.yml'],{encoding:'utf8'}));
          for(const step of definition.jobs.implement.steps){
            if(!step.run||step.run==='pnpm install --frozen-lockfile --ignore-scripts')continue;
            const env={...process.env};
            if(step.env?.CHECK_SELECTION){const selection=JSON.parse(step.env.CHECK_SELECTION);selection.prerequisites=[];env.CHECK_SELECTION=JSON.stringify(selection);}
            console.log('STAGE0_STEP',step.name||step.run.split('\n')[0]);
            execFileSync('bash',['--noprofile','--norc','-e','-o','pipefail','-c',step.run],{env,stdio:'inherit'});
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-prepared-scene-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stage0/
            test-results/
          retention-days: 7
          if-no-files-found: warn
