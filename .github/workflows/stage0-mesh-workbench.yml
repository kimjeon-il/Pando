name: Stage 0 prepared mesh focused workbench
on:
  push:
    branches: [work/optimization]
    paths: ['.github/workflows/stage0-mesh-workbench.yml','tools/stage0-workbench-fix.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage0-prepared-country-scene
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/optimization
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/library-data
      - name: Determine whether concurrent C++ changes need their paired WASM
        id: core
        shell: bash
        run: |
          if node scripts/check-core-prerequisite.mjs; then echo 'build=false' >> "$GITHUB_OUTPUT"; else echo 'build=true' >> "$GITHUB_OUTPUT"; fi
      - uses: jwlawson/actions-setup-cmake@v2
        if: steps.core.outputs.build == 'true'
        with:
          cmake-version: '3.31.6'
      - uses: actions/checkout@v4
        if: steps.core.outputs.build == 'true'
        with:
          repository: emscripten-core/emsdk
          ref: db04e88298d9916fc51fcd3743045ca3eb695127
          path: build-native/emsdk
          persist-credentials: false
      - name: Run the existing source-matched WASM build owner only
        if: steps.core.outputs.build == 'true'
        env:
          EMSDK_VERSION: '6.0.3'
          EMCC_CORES: '1'
          BINARYEN_CORES: '1'
        run: |
          node --input-type=module <<'JS'
          import {parse} from 'yaml';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const wf=parse(readFileSync('.github/workflows/generated-artifacts-p2.yml','utf8'));
          const step=wf.jobs.generate.steps.find(s=>s.name==='Build the pinned C++ WASM and verify its actual source identity');
          if(!step?.run)throw Error('Canonical WASM build owner changed');
          execFileSync('bash',['--noprofile','--norc','-e','-o','pipefail','-c',step.run],{stdio:'inherit'});
          JS
      - name: Execute the reviewed scoped workbench
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {parse} from 'yaml';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const definition=parse(execFileSync('git',['show','83691b590669d2db5f03865fce7e876fcf0d2fb9:.github/workflows/stage0-mesh-workbench.yml'],{encoding:'utf8'}));
          for(const step of definition.jobs.implement.steps){
            if(!step.run||step.run==='pnpm install --frozen-lockfile --ignore-scripts')continue;
            const env={...process.env};
            if(step.env?.CHECK_SELECTION){const selection=JSON.parse(step.env.CHECK_SELECTION);selection.prerequisites=[];env.CHECK_SELECTION=JSON.stringify(selection);}
            let command=step.run;
            if(step.name?.startsWith('Commit verified'))command=command.replace('git diff --cached --check','git add assets/wasm/pandoeditor-core.js assets/wasm/pandoeditor-core.wasm assets/wasm/pandoeditor-core.manifest.json\ngit diff --cached --check');
            console.log('STAGE0_STEP',step.name||command.split('\n')[0]);
            execFileSync('bash',['--noprofile','--norc','-e','-o','pipefail','-c',command],{env,stdio:'inherit'});
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-prepared-scene-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stage0/
            test-results/
            assets/wasm/pandoeditor-core.manifest.json
          retention-days: 7
          if-no-files-found: warn
