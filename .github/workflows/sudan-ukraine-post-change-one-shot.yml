name: Sudan and Ukraine historical transition - one shot
# Re-run with exact snapshot-day geometry selection and updated Web/native regressions.

on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/sudan-ukraine-post-change-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: sudan-ukraine-transition-one-shot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source-only guarded repair
        run: node tools/fill-sudan-ukraine-post-change-geometry.mjs
      - name: Regenerate exact Web and native timeline sources
        run: |
          node tools/build-territorial-entity-chunks.mjs
          node tools/restore-untouched-chunks-post-transition.mjs
          node tools/build-historical-world-timeline.mjs
          node native/tools/sync-historical-world-timeline.mjs --web-root .
          node scripts/generate-build-metadata.mjs
      - name: Validate source geometry, continuity, original blobs and publication
        run: |
          node tools/build-territorial-entity-chunks.mjs --check
          node tools/build-historical-world-timeline.mjs --check
          node native/tools/sync-historical-world-timeline.mjs --web-root . --check
          node --test --test-concurrency=1 tests/unit/territorial-library.test.mjs tests/unit/country-lineage-preservation.test.mjs tests/unit/sudan-ukraine-transition.test.mjs tests/unit/historical-world-publication.test.mjs
          node scripts/check-territorial-library.mjs
          node scripts/check-version.mjs
      - name: Commit and push verified Web/native update on work/objects only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/territorial-entities/source/countries/sudan.json assets/data/territorial-entities/source/countries/sds.json assets/data/territorial-entities/source/countries/ukraine.json
          git add -A assets/data/territorial-entities/generated/v2
          git add -A assets/data/historical-world/generated/v1 native/assets/world/historical-world/v1
          git add native/assets/world/manifest.json assets/js/build-meta.js index.html README.md
          git add tools/build-historical-world-timeline.mjs native/tests/historical_world_timeline_tests.cpp
          git add tests/unit/country-lineage-preservation.test.mjs tests/unit/sudan-ukraine-transition.test.mjs tests/unit/historical-world-publication.test.mjs
          git add reports/geography/sudan-ukraine-post-transition-2026-10-13.md reports/README.md
          git diff --cached --check
          if git diff --cached --quiet; then echo "Expected generated output was not staged"; exit 1; fi
          git commit -m "fix(history): connect post-2011 Sudan and post-2014 Ukraine without new country IDs"
          git push origin HEAD:work/objects
