name: Native Hydro calibration
on:
  workflow_dispatch:
  push:
    branches: [work/gis]
    paths:
      - 'tools/cpp/hydro-calibration/**'
      - 'tools/cpp/hydro/calibration.cpp'
      - 'tools/gis/hydro-calibration-native.mjs'
      - 'tools/gis/package-hydro-calibration.mjs'
      - 'tests/unit/hydro-calibration-native.test.mjs'
      - 'tests/fixtures/hydro-calibration-chain-oracle.json'
      - '.github/workflows/hydro-calibration-native.yml'
permissions:
  contents: read
jobs:
  calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and package the calibration engine
        shell: pwsh
        run: |
          cmake -S tools/cpp/hydro-calibration -B build-native/hydro-calibration/native -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Calibration configuration failed' }
          cmake --build build-native/hydro-calibration/native --config Release --target pando-hydro-calibration --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Calibration build failed' }
          if ($IsWindows) { $binary = 'build-native/hydro-calibration/native/Release/pando-hydro-calibration.exe' }
          else { $binary = 'build-native/hydro-calibration/native/pando-hydro-calibration' }
          node tools/gis/package-hydro-calibration.mjs --binary $binary --directory build-native/hydro-calibration/artifact
          if ($LASTEXITCODE -ne 0) { throw 'Calibration packaging failed' }
      - name: Compare chain counts with the frozen original
        shell: pwsh
        run: |
          $env:PANDO_HYDRO_CALIBRATION_ARTIFACT = "$env:GITHUB_WORKSPACE/build-native/hydro-calibration/artifact"
          node --test tests/unit/hydro-calibration-native.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Calibration oracle differs' }
      - uses: actions/upload-artifact@v4
        with:
          name: hydro-calibration-${{ matrix.os }}-${{ github.sha }}
          path: build-native/hydro-calibration/artifact/
          retention-days: 7
