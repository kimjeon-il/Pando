name: Read-only geographic source evidence audit
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Source evidence category to review without changing map data
        type: choice
        required: true
        options:
          - historic-scenes
          - signed-source-access
          - lease-exclusions
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit selected source evidence (no publication or GIS writes)
        env:
          AUDIT_SCOPE: ${{ inputs.scope }}
        run: node tools/checks/audit-source-evidence.mjs --scope "$AUDIT_SCOPE" --output "$RUNNER_TEMP/source-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geographic-source-evidence
          path: ${{ runner.temp }}/source-evidence.json
          if-no-files-found: warn
          retention-days: 21
