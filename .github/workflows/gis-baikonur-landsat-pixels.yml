name: GIS Baikonur USGS Landsat historical pixel preflight
on:
  push:
    branches: [work/gis]
    paths:
      - 'tools/gis/baikonur-landsat-pixel-preflight.py'
      - '.github/workflows/gis-baikonur-landsat-pixels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-independent-1994-2020-spectral-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific pixel-only dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 rasterio==1.5.0 requests==2.32.5
      - name: Prove water-mask filtering does not rely on OSM
        run: python tools/gis/baikonur-landsat-pixel-preflight.py --self-test
      - name: Build two read-only areas from official Kazakhstan treaty vertices
        run: |
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          import {TREATY_BANK_BOXES} from './tools/gis/probe-baikonur-government-hydrography.mjs';
          import {ANCHORS,decimalDegrees} from './tools/gis/baikonur-official-reference.mjs';
          const point=n=>{
            const [lat,lon]=ANCHORS[n-1];
            return [decimalDegrees(lon),decimalDegrees(lat)];
          };
          const areas=TREATY_BANK_BOXES.map(({treatyPointPair,bbox})=>({
            pair:treatyPointPair,bbox,start:point(treatyPointPair[0]),
            end:point(treatyPointPair[1]),
          }));
          writeFileSync(process.env.RUNNER_TEMP+'/official-lease-bank-windows.json',
            JSON.stringify({areas},null,2)+'\n');
          JS
      - name: Read cropped original green, near-IR and cloud QA pixel blocks for both eras
        run: |
          python tools/gis/baikonur-landsat-pixel-preflight.py             --treaty-areas "$RUNNER_TEMP/official-lease-bank-windows.json"             --output "$RUNNER_TEMP/baikonur-satellite-pixel-preflight.json"
      - name: Enforce no substitution or fake legal accuracy from satellite scenes
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const doc=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
            '/baikonur-satellite-pixel-preflight.json','utf8'));
          assert.equal(doc.schema,'pando-baikonur-independent-historic-spectral-preflight-v1');
          assert.equal(doc.areas.length,6);
          assert.equal(doc.osmDataUsed,false);
          assert.equal(doc.riverRightBankDigitized,false);
          assert.equal(doc.legalBoundaryVerified,false);
          assert.equal(doc.originalTreatyDatumVerified,false);
          assert.equal(doc.publishedGeometryModified,false);
          for(const row of doc.areas){
            assert.equal(row.pair.length,2);
            assert([1994,1995,2020].includes(row.year));
            assert(row.examined.every(e=>e.status==='PIXEL_OBSERVATION_ONLY_NOT_LEGAL_BOUNDARY'));
          }
          console.log('BAIKONUR_INDEPENDENT_PIXEL_EVIDENCE='+JSON.stringify(doc.areas.map(x=>({
            pair:x.pair.join('-'),year:x.year,
            rasterCount:x.examined.length,
            anchorToWaterMeters:x.examined.map(e=>e.nearestWaterPixelToTreatyAnchorsMeters),
            localCleanPercent:x.examined.map(e=>e.usableCloudFreePercent),
            unavailable:x.errors
          }))));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baikonur-usgs-1994-and-2020-real-pixel-preflight-no-osm
          path: |
            ${{ runner.temp }}/official-lease-bank-windows.json
            ${{ runner.temp }}/baikonur-satellite-pixel-preflight.json
          retention-days: 30
          if-no-files-found: warn
