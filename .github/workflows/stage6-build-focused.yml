name: Focused project runtime build contract
on:
  push:
    branches: [work/stage6-build-validation-20261109]
    paths: [.github/workflows/stage6-build-focused.yml]
permissions:
  contents: write
jobs:
  project-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: syntax
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node --check scripts/lib/frontend-build.mjs
          node --check src/data/map-project-runtime.js
          node --check src/app/viewer-composition.js
          node --check src/document/builtin-session.js
          node --check src/data/workers/data-loader-worker.js
          node --check src/rendering/workers/gpu-mesh-worker.js
          node --check src/rendering/physical-map-controller.js
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint scripts/lib/frontend-build.mjs src/data/map-project-runtime.js \
            src/app/viewer-composition.js src/document/builtin-session.js \
            src/data/workers/data-loader-worker.js src/rendering/workers/gpu-mesh-worker.js \
            src/rendering/physical-map-controller.js tests/unit/build/frontend-build.test.mjs \
            tests/unit/data/map-project-runtime.test.mjs 2>&1 | tee "$RUNNER_TEMP/stage6-lint.log"
      - id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=2 --test-timeout=15000 \
            tests/unit/build/frontend-build.test.mjs \
            tests/unit/data/map-project-runtime.test.mjs \
            tests/unit/data/map-project-manifest.test.mjs \
            tests/unit/data/physical-source-project.test.mjs \
            tests/unit/data/physical-asset-reader.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/stage6-tests.log"
      - name: Record focused results outside pinned library mounts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const read=name=>{const path=process.env.RUNNER_TEMP+'/stage6-'+name+'.log';
              return fs.existsSync(path)?fs.readFileSync(path,'utf8').slice(-20000):'not executed';};
            const result={sourceCommit:context.sha,
              install:'${{ steps.install.outcome }}',syntax:'${{ steps.syntax.outcome }}',
              lint:'${{ steps.lint.outcome }}',tests:'${{ steps.test.outcome }}',
              lintLog:read('lint'),testLog:read('tests')};
            const path='validation-results/stage6-build.json',branch=context.ref.replace('refs/heads/','');
            let sha;try{sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch,...(sha?{sha}:{}),
              message:'test: capture scoped stage6 project runtime checks',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')});
      - name: Require narrowly selected checks
        if: always()
        run: |
          test '${{ steps.syntax.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.test.outcome }}' = success
