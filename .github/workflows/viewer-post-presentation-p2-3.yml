name: Viewer P2-3 map and deferred search presentation
on:
  push:
    branches: [work/ui]
    paths:
      - apps/viewer/js/modules/viewer-composition.js
      - apps/viewer/js/modules/viewer-post-presentation.js
      - shared/frontend/js/modules/object-search-controller.js
      - tests/unit/viewer-initial-composition.test.mjs
      - tests/unit/viewer-post-presentation.test.mjs
      - tests/browser/viewer-post-presentation-p2.spec.mjs
      - tests/helpers/map-transition-baseline.mjs
      - .github/workflows/viewer-post-presentation-p2-3.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-p2-3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  viewer-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile
      - name: Focused map/search and P0 observer contract tests
        run: node --test tests/unit/viewer-initial-composition.test.mjs tests/unit/viewer-composition-recovery.test.mjs tests/unit/viewer-load-status.test.mjs tests/unit/map-transition-baseline.test.mjs tests/unit/object-search-controller.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check real map publication ahead of delayed search
        run: pnpm exec playwright test tests/browser/viewer-post-presentation-p2.spec.mjs --workers=1
      - name: Preserve focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-p2-3
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
