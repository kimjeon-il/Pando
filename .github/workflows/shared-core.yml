name: Shared C++ core and bounded WASM contracts

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'assets/wasm/**'
      - 'assets/js/modules/**'
      - 'assets/js/vendor/**'
      - 'assets/js/workers/core-session-worker.js'
      - 'tests/helpers/core-*.mjs'
      - 'tests/helpers/web-*-contract.mjs'
      - 'tests/helpers/web-oracle.mjs'
      - 'tests/unit/builtin-resource-*.test.mjs'
      - 'tests/helpers/web-hydro-create-oracle.mjs'
      - 'tests/helpers/web-hydro-hidden-oracle.mjs'
      - 'tests/helpers/gis-core-fixture.mjs'
      - 'tests/helpers/editable-history-fixture.mjs'
      - 'tests/fixtures/portability/web-*.json'
      - 'tests/fixtures/portability/web-9300609-oracle/**'
      - 'tests/fixtures/portability/web-9300609-removal-oracle/**'
      - 'tests/fixtures/portability/web-9300609-hydro-create/**'
      - 'tests/fixtures/portability/web-9300609-hydro-hidden/**'
      - 'tests/fixtures/portability/web-9300609-hydro-copy/**'
      - 'tests/unit/map-hover-*.test.mjs'
      - 'tests/unit/r4c-spatial-boundaries.test.mjs'
      - 'tests/unit/selection-*.test.mjs'
      - 'tests/unit/*core*.test.mjs'
      - 'tests/unit/native-*.test.mjs'
      - 'tests/unit/web-*-contract.test.mjs'
      - 'tests/unit/project-creation-contract.test.mjs'
      - 'tests/unit/r4b-data-module-boundaries.test.mjs'
      - 'tests/unit/project-preview-policy.test.mjs'
      - 'tools/package-shared-core-assets.mjs'
      - 'tools/reference-fixtures/**'
      - 'tools/lib/checkout-identity.mjs'
      - 'tools/stage-monorepo-pages.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/shared-core.yml'
  push:
    branches: [main, work/optimization, work/ui, work/objects, work/gis, work/places, work/remote-only]
    paths:
      - 'shared/**'
      - 'assets/wasm/**'
      - 'assets/js/modules/**'
      - 'assets/js/vendor/**'
      - 'assets/js/workers/core-session-worker.js'
      - 'tests/helpers/core-*.mjs'
      - 'tests/helpers/web-*-contract.mjs'
      - 'tests/helpers/web-oracle.mjs'
      - 'tests/helpers/web-hydro-create-oracle.mjs'
      - 'tests/helpers/web-hydro-hidden-oracle.mjs'
      - 'tests/helpers/gis-core-fixture.mjs'
      - 'tests/unit/builtin-resource-*.test.mjs'
      - 'tests/helpers/editable-history-fixture.mjs'
      - 'tests/fixtures/portability/web-*.json'
      - 'tests/fixtures/portability/web-9300609-oracle/**'
      - 'tests/fixtures/portability/web-9300609-removal-oracle/**'
      - 'tests/fixtures/portability/web-9300609-hydro-create/**'
      - 'tests/fixtures/portability/web-9300609-hydro-hidden/**'
      - 'tests/fixtures/portability/web-9300609-hydro-copy/**'
      - 'tests/unit/map-hover-*.test.mjs'
      - 'tests/unit/r4c-spatial-boundaries.test.mjs'
      - 'tests/unit/selection-*.test.mjs'
      - 'tests/unit/*core*.test.mjs'
      - 'tests/unit/native-*.test.mjs'
      - 'tests/unit/web-*-contract.test.mjs'
      - 'tests/unit/project-creation-contract.test.mjs'
      - 'tests/unit/r4b-data-module-boundaries.test.mjs'
      - 'tests/unit/project-preview-policy.test.mjs'
      - 'tools/package-shared-core-assets.mjs'
      - 'tools/reference-fixtures/**'
      - 'tools/lib/checkout-identity.mjs'
      - 'tools/stage-monorepo-pages.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/shared-core.yml'
      - 'tools/cpp/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.nvmrc'
      - 'config/toolchain-versions.json'
      - 'scripts/lib/check-changes.mjs'
  workflow_dispatch:
    inputs:
      scope:
        description: Focused shared calculation verification
        type: choice
        options: [all, p6-polygon, p6-calculations, geometry, temporal, temporal-source, temporal-candidate, temporal-transport, temporal-parity, native-core, native-gis, native-all]
        default: all

permissions:
  contents: read

jobs:
  native-branch-impact:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.scope, 'native-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      core: ${{ steps.scope.outputs.core }}
      gis: ${{ steps.scope.outputs.gis }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select source-built native contracts
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          MANUAL_NATIVE_SCOPE: ${{ inputs.scope || 'auto' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { collectChanges, selectNativeBuilds } from './scripts/lib/check-changes.mjs';
          const manual=process.env.GITHUB_EVENT_NAME==='workflow_dispatch'?process.env.MANUAL_NATIVE_SCOPE:'auto';
          let paths=[];
          if(manual==='auto') {
            try {
              paths=collectChanges({base:process.env.BASE_SHA||'HEAD^',head:'HEAD',event:'push'}).files;
            } catch (error) {
              paths=['CMakePresets.json'];
              console.warn('Native source comparison unavailable; selecting both contracts:',error.message);
            }
          }
          const selected=selectNativeBuilds(paths,manual);
          for(const [key,value] of Object.entries(selected))
            appendFileSync(process.env.GITHUB_OUTPUT,key+'='+value+'\n');
          console.log(JSON.stringify({nativeBuilds:selected,files:paths}));
          NODE
  native-branch-core:
    needs: native-branch-impact
    if: needs.native-branch-impact.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Verify source-built Core C++ contracts
        run: |
          cmake --preset pando-core
          cmake --build --preset pando-core
          ctest --preset pando-core --output-on-failure
  native-branch-gis:
    needs: native-branch-impact
    if: needs.native-branch-impact.outputs.gis == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Verify source-built GIS C++ tools
        run: |
          cmake --preset pando-gis-tools
          cmake --build --preset pando-gis-tools
          ctest --preset pando-gis-tools --output-on-failure
  temporal:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'temporal'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - name: Build only the changed temporal command contracts
        run: |
          cmake -S shared -B build-native/temporal-core -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native/temporal-core --target temporal_editing_tests --parallel 2
          ctest --test-dir build-native/temporal-core -R '^temporal_editing_tests$' --output-on-failure --no-tests=error
  geometry:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'geometry'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - name: Build the changed contact, split and fill-mesh kernels
        run: |
          cmake -S shared -B build-native/geometry-core -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native/geometry-core --target country_contact_tests boundary_split_tests polygon_mesh_tests --parallel 2
          ctest --test-dir build-native/geometry-core -R '^(country_contact_tests|boundary_split_tests|polygon_mesh_tests)$' --output-on-failure --no-tests=error
  p6-polygon:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'p6-polygon' || inputs.scope == 'p6-calculations')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compile native polygon kernel and current contract probe
        id: compile
        run: |
          cmake -S shared -B build-native/p6-core -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native/p6-core --target polygon_clipping_probe cut_geometry_probe reference_image_core_tests river_partition_probe --parallel 2
      - name: Compare pinned polygon behavior
        run: |
          node tools/p6-polygon-parity.mjs build-native/p6-core/tests/polygon_clipping_probe
      - name: Compare frozen cut behavior
        run: node tools/p6-cut-parity.mjs build-native/p6-core/tests/cut_geometry_probe
      - name: Compare frozen river behavior
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: node shared/tests/river-partition-parity.mjs build-native/p6-core/tests/river_partition_probe
      - name: Compare frozen reference behavior
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: ctest --test-dir build-native/p6-core -R '^reference_image_core_tests$' --output-on-failure
  contracts:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/work/optimization' && contains(github.event.head_commit.message, '[pando-full-verify]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EMCC_CORES: '1'
      BINARYEN_CORES: '1'
      NODE_OPTIONS: '--max-old-space-size=512'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install only the standalone native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Build only the small native core, codec and document tests
        run: |
          cmake -S shared -B build-native/core-session -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native/core-session --target project_codec_tests document_session_tests geometry_draft_tests web_content_codec_tests web_content_command_tests web_territorial_command_tests source_admission_tests web_storage_tests web_object_command_tests --parallel 1
          ctest --test-dir build-native/core-session -R '^(project_codec_tests|document_session_tests|geometry_draft_tests|web_content_codec_tests|web_content_command_tests|web_territorial_command_tests|source_admission_tests|web_storage_tests|web_object_command_tests)$' --output-on-failure --timeout 10
      - name: Read the same pinned build toolchain as the artifact producer
        id: toolchain
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { pinnedToolchain } from './scripts/lib/check-changes.mjs';
          const pin = pinnedToolchain();
          appendFileSync(process.env.GITHUB_OUTPUT, [
            'cmake_version=' + pin.cmake,
            'emscripten_version=' + pin.emscripten,
            'emsdk_ref=' + pin.emsdkCommit,
          ].join('\n') + '\n');
          NODE
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ steps.toolchain.outputs.cmake_version }}
      - name: Get the pinned official Emscripten SDK
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: ${{ steps.toolchain.outputs.emsdk_ref }}
          path: build-native/emsdk
          persist-credentials: false
      - name: Rebuild with the artifact producer's exact WASM preset and SDK
        shell: bash
        env:
          EMSDK_VERSION: ${{ steps.toolchain.outputs.emscripten_version }}
        run: |
          set -euo pipefail
          # emsdk_env.sh may clear EMSDK_VERSION; preserve the pinned value.
          required_version="$EMSDK_VERSION"
          build-native/emsdk/emsdk install "$required_version"
          build-native/emsdk/emsdk activate "$required_version"
          source build-native/emsdk/emsdk_env.sh
          emcc --version | sed -n '1p' | grep -F "$required_version"
          # GitHub's /archive/ endpoint has intermittently returned HTTP 404
          # for the pinned zlib 1.3.2 tag. Use its canonical codeload host,
          # which serves the identical bytes; Emscripten's SHA-512 validation
          # remains unchanged. Refuse an unrecognized SDK port definition.
          port_file=build-native/emsdk/upstream/emscripten/tools/ports/zlib.py
          original='https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz'
          canonical='https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION}'
          grep -Fq "$original" "$port_file"
          sed -i "s|$original|$canonical|" "$port_file"
          grep -Fq "$canonical" "$port_file"
          # Emscripten 6.0.3 derives the archive suffix from the last
          # URL component. Codeload ends in v1.3.2, not .tar.gz, although its
          # content is the same SHA-512 verified gzip archive. Fix only zlib's
          # suffix inference; do not weaken fetch or integrity verification.
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='build-native/emsdk/upstream/emscripten/tools/ports/__init__.py';
          const input=readFileSync(file,'utf8');
          const old="    ext = url_filename.split('.', 1)[1]";
          if(input.split(old).length!==2)throw Error('Unexpected pinned Emscripten port loader');
          const next="    ext = 'tar.gz' if name == 'zlib' and url.startswith('https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v') else url_filename.split('.', 1)[1]";
          writeFileSync(file,input.replace(old,next));
          NODE
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm
      - name: Verify the compiled source and committed runtime pair
        run: node tools/package-shared-core-assets.mjs --build-dir build-native/p1/pando-wasm/shared/wasm --check
      - name: Actual native/WASM month contracts and required Worker lifecycle
        env:
          PANDOEDITOR_WASM_MODULE: build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
        run: >-
          node --test --test-concurrency=1 --test-timeout=15000 shared/tests/wasm-document-session.test.mjs
          tests/unit/core-wasm-loader.test.mjs tests/unit/web-core-contract.test.mjs
          tests/unit/core-document-client.test.mjs tests/unit/core-document-runtime.test.mjs
          tests/unit/core-document-read-model.test.mjs tests/unit/core-document-wasm.test.mjs
          tests/unit/core-document-selection-wasm.test.mjs
          tests/unit/core-document-world-wasm.test.mjs
           tests/unit/core-codec-unicode-wasm.test.mjs
          tests/unit/core-codec-unicode-ids-wasm.test.mjs
           tests/unit/core-project-command-wasm.test.mjs
          tests/unit/core-map-presentation-wasm.test.mjs tests/unit/core-object-catalog-wasm.test.mjs
          tests/unit/core-delete-selection-wasm.test.mjs
          tests/unit/core-distribution-array-metadata-wasm.test.mjs
          tests/unit/core-direct-object-writers-wasm.test.mjs
          tests/unit/core-hydro-create-wasm.test.mjs tests/unit/core-web-history-limit-wasm.test.mjs
           tests/unit/core-label-gesture-wasm.test.mjs
          tests/unit/timeline-geopackage.test.mjs
          tests/unit/core-project-file-save-wasm.test.mjs
          tests/unit/core-territorial-service-wasm.test.mjs
          tests/unit/core-territorial-store-wasm.test.mjs
          tests/unit/core-save-state-projection.test.mjs
          tests/unit/timeline-controls.test.mjs tests/unit/core-temporal-viewer-p5-6.test.mjs tests/unit/shared-core-assets.test.mjs
           tests/unit/core-worker-ownership.test.mjs
      - name: Ordered storage snapshot and project replacement boundaries
        env:
          PANDOEDITOR_WASM_MODULE: build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
        run: >-
          node --test --test-concurrency=1 --test-timeout=15000
          tests/unit/project-creation-contract.test.mjs tests/unit/r4b-data-module-boundaries.test.mjs
          tests/unit/project-preview-policy.test.mjs
      - name: Retired attachment contracts
        run: >-
          node --test --test-concurrency=1 --test-timeout=15000
          tests/unit/map-plugin-cutover.test.mjs
      - name: Core-owned generic and distribution service contracts
        run: >-
          node --test --test-concurrency=1 --test-timeout=15000
          tests/unit/generic-feature-service.test.mjs tests/unit/territorial-entity-repository.test.mjs
          tests/unit/core-service-writer-clock-wasm.test.mjs
      - name: Accepted selection and input presentation boundaries
        run: >-
          node --test --test-concurrency=1 --test-timeout=15000
          tests/unit/selection-domain-core.test.mjs
          tests/unit/selection-emphasis.test.mjs
          tests/unit/layer-footer-contract.test.mjs
          tests/unit/builtin-resource-admission.test.mjs tests/unit/builtin-resource-core-wasm.test.mjs tests/unit/place-runtime.test.mjs
          tests/unit/map-hover-async-boundary.test.mjs
          tests/unit/r4c-spatial-boundaries.test.mjs
      - name: Pages source exclusion and complete required runtime
        run: node --test tests/unit/monorepo-pages-staging.test.mjs
      - name: Record the bounded native and WASM source evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { sourceIdentity, sha256 } from './tools/lib/checkout-identity.mjs';
          import { sharedSourceManifest } from './tools/package-shared-core-assets.mjs';
          const source = sourceIdentity(process.cwd());
          if (!source.clean) throw Error('Official shared-core evidence requires a clean checkout');
          const manifest = JSON.parse(readFileSync('assets/wasm/pandoeditor-core.manifest.json'));
          const shared = sharedSourceManifest(process.cwd());
          if (shared.sourceSha256 !== manifest.sourceSha256) throw Error('Compiled shared source mismatch');
          const hashFile = path => ({ path, sha256: sha256(readFileSync(resolve(path))) });
          const artifacts = [
            'build-native/core-session/tests/project_codec_tests',
            'build-native/core-session/tests/document_session_tests',
            'build-native/core-session/tests/geometry_draft_tests',
            'build-native/core-session/tests/web_content_codec_tests',
            'build-native/core-session/tests/web_content_command_tests',
            'build-native/core-session/tests/web_territorial_command_tests',
            'build-native/core-session/tests/source_admission_tests',
            'build-native/core-session/tests/web_storage_tests',
            'build-native/core-session/tests/web_object_command_tests',
            'build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js',
            'build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.wasm',
          ].map(hashFile);
          const fixtures = readdirSync('tests/fixtures/portability')
            .filter(name => /^web-.*\.json$/.test(name)).sort()
            .map(name => hashFile('tests/fixtures/portability/' + name));
          if (!fixtures.length) throw Error('Shared-core fixture evidence is missing');
          writeFileSync('build-native/shared-core-evidence.json', JSON.stringify({
            schema: 'pandoeditor-bounded-shared-core-evidence', commit: source.head,
            source, shared, fixtures, artifacts, environment: {
              os: process.platform, arch: process.arch, node: process.version,
              compiler: manifest.compiler,
            }, scope: 'bounded non-GUI contracts; not entire behavioral parity',
            applicationExecuted: false,
            notRun: ['app responsiveness', 'full-world performance', 'browser UI', 'native UI', 'entire parity'],
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-shared-core-${{ github.sha }}
          path: |
            build-native/shared-core-evidence.json
            build-native/core-session/Testing/Temporary/
            build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.js
            build-native/p1/pando-wasm/shared/wasm/pandoeditor-core.wasm
          if-no-files-found: error



  native-source:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'temporal-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure only the native Core and tests
        run: cmake -S shared -B build-native/p5-2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile immutable source and existing document admission tests
        run: cmake --build build-native/p5-2 --target temporal_source_tests source_admission_tests document_session_tests --parallel 2
      - name: Verify bounded registry and existing Core state contracts
        run: ctest --test-dir build-native/p5-2 --output-on-failure -R '^(temporal_source_tests|source_admission_tests|document_session_tests)$'


  native-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'temporal-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure existing native Core
        run: cmake -S shared -B build-native/p5-3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile candidate, adoption, source and existing Core contracts
        run: cmake --build build-native/p5-3 --target temporal_adopt_tests temporal_candidate_tests temporal_source_tests document_session_tests --parallel 2
      - name: Verify P5-4 adoption and rollback
        run: ctest --test-dir build-native/p5-3 --output-on-failure -R temporal_adopt_tests
      - name: Verify P5-3 prepared candidate
        run: ctest --test-dir build-native/p5-3 --output-on-failure -R temporal_candidate_tests
      - name: Verify P5-2 source cache
        run: ctest --test-dir build-native/p5-3 --output-on-failure -R temporal_source_tests
      - name: Verify existing document session
        run: ctest --test-dir build-native/p5-3 --output-on-failure -R document_session_tests


  temporal-transport:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'temporal-transport'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EMCC_CORES: '1'
      BINARYEN_CORES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ordered Worker transport, late acknowledgement and existing client contracts
        run: node --test tests/unit/core-temporal-transport-p5-5.test.mjs tests/unit/core-document-client.test.mjs tests/unit/core-document-runtime.test.mjs tests/unit/core-worker-ownership.test.mjs
      - name: Prepare exact pinned builtin-world comparison data
        uses: ./.github/actions/library-data
      - name: Checkout exact pinned Emscripten SDK
