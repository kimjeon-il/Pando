name: Focused stage 6-7 runtime and publication contracts (mesh cache recheck)
on:
  push:
    branches: [work/stage6-7-final-recheck-20261109]
    paths: [.github/workflows/stage6-7-focused.yml]
permissions:
  contents: write
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint scripts/lib/map-catalog-coherence.mjs \
            scripts/lib/frontend-build.mjs src/data/map-project-runtime.js \
            src/app/viewer-composition.js src/document/builtin-session.js \
            src/document/calendar-month.js src/document/project-month-clock.js \
            src/ui/timeline-controls.js src/data/workers/data-loader-worker.js \
            src/rendering/workers/gpu-mesh-worker.js src/rendering/physical-map-controller.js \
            tests/unit/build/frontend-build.test.mjs tests/unit/data/map-project-runtime.test.mjs \
            tests/browser/document/viewer-calendar.spec.mjs 2>&1 | tee "$RUNNER_TEMP/stage67-lint.log"
      - id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=2 --test-timeout=15000 \
            tests/unit/build/frontend-build.test.mjs \
            tests/unit/data/map-project-runtime.test.mjs \
            tests/unit/data/map-project-manifest.test.mjs \
            tests/unit/data/physical-source-project.test.mjs \
            tests/unit/data/physical-asset-reader.test.mjs \
            tests/unit/document/monorepo-pages-staging.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/stage67-tests.log"
      - name: Record narrow results without publishing pages
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),read=name=>{
              const file=process.env.RUNNER_TEMP+'/stage67-'+name+'.log';
              return fs.existsSync(file)?fs.readFileSync(file,'utf8').slice(-27000):'not executed';
            };
            const result={sourceCommit:context.sha,install:'${{ steps.install.outcome }}',
              lint:'${{ steps.lint.outcome }}',tests:'${{ steps.test.outcome }}',
              lintLog:read('lint'),testLog:read('tests')};
            const path='validation-results/stage6-7-focused.json',branch=context.ref.replace('refs/heads/','');
            let sha;try{sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch})).data.sha}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch,...(sha?{sha}:{}),
              message:'test: retain narrow project runtime build and Pages contract results',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64')});
      - name: Require related tests and lint
        if: always()
        run: |
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.test.outcome }}' = success
