name: Optimization stage 6 generation and immutable reuse contracts
# Verify only immutable source reuse, project-specific generator mapping and Viewer closure.
# Synthetic catalogs are validated against the production descriptor layout.
# Only selected generator tests and lint; no complete GIS or mesh build.
# Final source-level rerun includes previous-index reuse in full builtin compilation.
on:
  push:
    branches: [work/optimization]
    paths: ['.github/workflows/optimization-stage6-generation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Immutable coordinate metadata and private project input contracts
        run: >-
          node --test --test-timeout=30000
          tests/unit/data/territorial-metadata-projection.test.mjs
          tests/unit/build/project-generation-context.test.mjs
          tests/unit/build/prepared-scene-reuse.test.mjs
          tests/unit/data/builtin-geometry-reuse.test.mjs
      - name: Only the changed generator sources must parse
        run: |
          node --check tools/build/build-territorial-entity-chunks.mjs
          node --check tools/gis/territorial-index-entry.js
          node --check tools/build/project-generation-context.mjs
          node --check tools/build/build-builtin-world.mjs
          node --check tools/build/build-prepared-country-scene.mjs
          node --check tools/build/build-prepared-polygon-mesh.mjs
          node --check tools/build/prepared-scene-reuse.mjs
      - name: Lint only the stage 6 source and contract changes
        run: >-
          pnpm exec eslint
          tools/data/territorial-metadata-projection.mjs
          tools/gis/territorial-index-entry.js
          tools/build/project-generation-context.mjs
          tools/build/prepared-scene-reuse.mjs
          tools/build/build-territorial-entity-chunks.mjs
          tools/build/build-builtin-world.mjs
          tools/build/build-prepared-country-scene.mjs
          tools/build/build-prepared-polygon-mesh.mjs
          tests/unit/data/territorial-metadata-projection.test.mjs
          tests/unit/build/project-generation-context.test.mjs
          tests/unit/build/prepared-scene-reuse.test.mjs
          tests/unit/data/builtin-geometry-reuse.test.mjs
      - name: Confirm workflow owner summary accepts a flag without a path
        run: node tools/checks/audit-workflow-check-owners.mjs --summary
