name: P2 Source-matched generated artifacts
# Source-matched generation is allowed only on dedicated work/* branches, never on main.
# First publication to a new work branch uses a complete refs/heads destination;
# all runtime inputs stay pinned, and remote updates remain non-forced.
on:
  push:
    branches: ['work/**']
    # Trigger generation planning only when a declared runtime source, producer,
    # immutable artifact/pin, or its build toolchain changes.
    # Presentation-only src/, tests, docs, reports and unrelated configuration
    # are handled by their own focused checks, not a P2 generator run.
    paths:
      - 'src/**/native/**'
      - 'src/rendering/workers/gpu-mesh-core.js'
      - 'src/rendering/workers/polygon-raster-contract.js'
      - 'src/rendering/polygon-mesh-codec.js'
      - 'src/rendering/canonical-country-packet.js'
      - 'tools/build/**'
      - 'tools/data/**'
      - 'tools/gis/**'
      - 'tools/cpp/**'
      - 'tools/lib/**'
      - 'assets/wasm/**'
      - 'assets/data/**'
      - 'scripts/p2-*.mjs'
      - 'scripts/lib/p2-*.mjs'
      - 'scripts/generate-build-metadata.mjs'
      - 'projects/**/generation-inputs.json'
      - 'projects/**/manifest.json'
      - '.gitattributes'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'config/library-data.json'
      - 'config/generated-artifacts.json'
      - 'config/core-source-roots.json'
      - 'config/toolchain-versions.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/library-data/**'
      - '.github/workflows/generated-artifacts-p2.yml'
  # Opt-in, per-push compiled-core-only publication; avoids unrelated stale data families.
  # Include [p2-wasm-only] in a work-branch commit message for a focused rebuild.
  workflow_dispatch:
    inputs:
      scope:
        description: Which generator to run; auto only builds stale outputs
        type: choice
        options: [auto, wasm, all, verify]
        required: false
        default: auto
      verification:
        description: Run minimal publication checks or the consolidated P9 calculation suites
        type: choice
        options: [minimal, full, temporal, geometry-resources]
        required: false
        default: minimal
      skip_preview:
        description: Skip automatic broad preview dispatch when a focused verification follows
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pando-generated-artifacts-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'publication' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      wasm: ${{ steps.scopes.outputs.wasm }}
      selected_families: ${{ steps.scopes.outputs.selected_families }}
      blocked_families: ${{ steps.scopes.outputs.blocked_families }}
      pnpm_version: ${{ steps.scopes.outputs.pnpm_version }}
      cmake_version: ${{ steps.scopes.outputs.cmake_version }}
      emscripten_version: ${{ steps.scopes.outputs.emscripten_version }}
      emsdk_ref: ${{ steps.scopes.outputs.emsdk_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Test source fingerprint, rebuild selection, publication guard
        if: github.event_name == 'push' || inputs.verification == 'full'
        run: node --test tests/unit/build/p2-artifact-plan.test.mjs tests/unit/document/shared-core-assets.test.mjs tests/unit/data/p2-publication-paths.test.mjs tests/unit/data/library-data.test.mjs
      - name: Read the declared place-report generation inputs
        run: node tools/data/report-paths.mjs reports/places read
      - name: Select only stale source-derived assets
        id: scopes
        env:
          PANDO_P2_BASE_SHA: ${{ github.event.before || '' }}
          PANDO_P2_SCOPE: ${{ inputs.scope || (contains(github.event.head_commit.message, '[p2-wasm-only]') && 'wasm' || 'auto') }}
        run: node scripts/p2-artifact-plan.mjs --github-output

  generate:
    needs: plan
    if: >-
      needs.plan.outputs.wasm == 'true' || needs.plan.outputs.selected_families != '[]' ||
      needs.plan.outputs.blocked_families != '[]' ||
      inputs.scope == 'verify' || inputs.verification == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    env:
      EMCC_CORES: '1'
      BINARYEN_CORES: '1'
      PANDO_P2_SCOPE: ${{ inputs.scope || (contains(github.event.head_commit.message, '[p2-wasm-only]') && 'wasm' || 'auto') }}
      PANDO_P2_WASM: ${{ needs.plan.outputs.wasm }}
      PANDO_P2_BASE_SHA: ${{ github.event.before || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned package manager only for selected data-family owners
        uses: pnpm/action-setup@v4
        if: needs.plan.outputs.wasm == 'true' || needs.plan.outputs.selected_families != '[]' || inputs.scope == 'verify' || inputs.verification == 'full'
        with:
          version: ${{ needs.plan.outputs.pnpm_version }}
          run_install: false
      - name: Install frozen dependencies for current data generators
        if: needs.plan.outputs.wasm == 'true' || needs.plan.outputs.selected_families != '[]' || inputs.scope == 'verify' || inputs.verification == 'full'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read the declared place-report generation inputs
        run: node tools/data/report-paths.mjs reports/places read
      - uses: jwlawson/actions-setup-cmake@v2
        if: needs.plan.outputs.wasm == 'true'
        with:
          cmake-version: ${{ needs.plan.outputs.cmake_version }}
      - name: Install compiler prerequisites only for WASM
        if: needs.plan.outputs.wasm == 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/checkout@v4
        if: needs.plan.outputs.wasm == 'true'
        with:
          repository: emscripten-core/emsdk
          ref: ${{ needs.plan.outputs.emsdk_ref }}
          path: build-native/emsdk
          persist-credentials: false
      - name: Build the pinned C++ WASM and verify its actual source identity
        if: needs.plan.outputs.wasm == 'true'
        shell: bash
        env:
          EMSDK_VERSION: ${{ needs.plan.outputs.emscripten_version }}
        run: |
          set -euo pipefail
          # emsdk_env.sh may clear EMSDK_VERSION; preserve the pinned value.
          required_version="$EMSDK_VERSION"
          build-native/emsdk/emsdk install "$required_version"
          build-native/emsdk/emsdk activate "$required_version"
          source build-native/emsdk/emsdk_env.sh
          emcc --version | sed -n '1p' | grep -F "$required_version"
          # GitHub's /archive/ endpoint has intermittently returned HTTP 404
          # for the pinned zlib 1.3.2 tag. Use its canonical codeload host,
          # which serves the identical bytes; Emscripten's SHA-512 validation
          # remains unchanged. Refuse an unrecognized SDK port definition.
          port_file=build-native/emsdk/upstream/emscripten/tools/ports/zlib.py
          original='https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz'
          canonical='https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION}'
          grep -Fq "$original" "$port_file"
          sed -i "s|$original|$canonical|" "$port_file"
          grep -Fq "$canonical" "$port_file"
          # Emscripten 6.0.3 derives the archive suffix from the last
          # URL component. Codeload ends in v1.3.2, not .tar.gz, although its
          # content is the same SHA-512 verified gzip archive. Fix only zlib's
          # suffix inference; do not weaken fetch or integrity verification.
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='build-native/emsdk/upstream/emscripten/tools/ports/__init__.py';
          const input=readFileSync(file,'utf8');
          const old="    ext = url_filename.split('.', 1)[1]";
          if(input.split(old).length!==2)throw Error('Unexpected pinned Emscripten port loader');
          const next="    ext = 'tar.gz' if name == 'zlib' and url.startswith('https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v') else url_filename.split('.', 1)[1]";
          writeFileSync(file,input.replace(old,next));
          NODE
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm
          node tools/build/package-shared-core-assets.mjs --build-dir build-native/p1/pando-wasm/shared/wasm
      - name: Verify published compiled identity and package hashes
        id: verified_core
        run: node tools/build/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - name: Verify the changed geographic contact and common fill kernels
        if: needs.plan.outputs.wasm == 'true' && inputs.verification != 'full' && inputs.verification != 'temporal' && inputs.verification != 'geometry-resources'
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/assets/wasm/pandoeditor-core.js
          CHECK_SELECTION: '{"unitTests":["tests/unit/geometry/country-shared-boundary.test.mjs","tests/unit/geometry/boundary-lines.test.mjs"],"browserSpecs":[],"commands":["wasm-domain-geometry"],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs
      - name: Prepare only the display policy used by synthetic source fixtures
        if: inputs.verification == 'geometry-resources'
        run: node --input-type=module -e "import {readLibraryDataFile} from './tools/data/library-context.mjs';readLibraryDataFile('assets/data/builtin-world/display-policy-v1.json',{fetch:true});"
      - name: Verify immutable admission and affected synthetic GIS contracts
        if: inputs.verification == 'geometry-resources'
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/assets/wasm/pandoeditor-core.js
          CHECK_SELECTION: '{"unitTests":["tests/unit/document/core-geometry-resources-wasm.test.mjs","tests/unit/document/historical-world-territories.test.mjs","tests/unit/data/current-world-source-pairing.test.mjs","tests/unit/data/territorial-retirement.test.mjs"],"browserSpecs":[],"commands":[],"prerequisites":[]}'
        run: node scripts/run-application-checks.mjs
      - name: Verify changed temporal editing and place naming
        if: inputs.verification == 'temporal'
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/assets/wasm/pandoeditor-core.js
        run: >-
          node --test tests/native/document/temporal-editing.test.mjs
          tests/unit/document/place-names.test.mjs tests/unit/document/territorial-entity-repository.test.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.verification == 'temporal'
        with:
          name: temporal-wasm-${{ github.sha }}
          path: |
            assets/wasm/pandoeditor-core.js
            assets/wasm/pandoeditor-core.wasm
            assets/wasm/pandoeditor-core.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Test the compiled runtime ABI and bounded document session
        if: inputs.verification == 'full'
        shell: bash
        run: |
          node --test tests/unit/document/shared-core-assets.test.mjs tests/unit/runtime/core-wasm-loader.test.mjs
          PANDOEDITOR_WASM_MODULE="$PWD/assets/wasm/pandoeditor-core.js" node --test tests/native/document/wasm-document-session.test.mjs tests/native/document/p5-spherical-area-wasm.test.mjs tests/native/document/p5-temporal-wasm.test.mjs tests/native/document/p5-timeline-wasm.test.mjs tests/native/document/p5-boundary-chains-wasm.test.mjs tests/native/document/p5-boundary-packet-wasm.test.mjs tests/native/document/p5-boundary-interiors-wasm.test.mjs tests/native/document/p5-boundary-overlap-wasm.test.mjs tests/native/document/p5-boundary-refinement-wasm.test.mjs tests/native/document/p5-boundary-split-wasm.test.mjs tests/native/document/p5-country-contact-wasm.test.mjs tests/unit/geometry/boundary-lines.test.mjs

      - name: Verify P6 product calculation adapters
        if: inputs.verification == 'full'
        run: >-
          node --test tests/unit/geometry/polygon-geometry.test.mjs
          tests/unit/geometry/gis-math-contract.test.mjs tests/unit/geometry/annex-slivers.test.mjs
          tests/unit/document/river-territory-partition.test.mjs
      - name: Retain verified source-matched WASM before guarded publication
        if: always() && needs.plan.outputs.wasm == 'true' && steps.verified_core.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: source-matched-core-${{ github.sha }}
          path: |
            assets/wasm/pandoeditor-core.js
            assets/wasm/pandoeditor-core.wasm
            assets/wasm/pandoeditor-core.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified phases locally, then publish one guarded result
        id: publish
        if: inputs.verification != 'geometry-resources'
        shell: bash
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/p2-publish-artifacts.mjs
      - name: Hand the exact verified result to Viewer preview and acceptance
        # Verified unchanged artifacts still need source-matched Viewer checks.
        if: steps.publish.outcome == 'success' && steps.publish.outputs.superseded != 'true' && !inputs.skip_preview
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
          BASE_SHA: ${{ steps.publish.outputs.base_sha }}
        run: >-
          gh workflow run viewer-preview.yml --ref "$GITHUB_REF_NAME"
          -f source_sha="$RESULT_SHA" -f base_sha="$BASE_SHA"
          -f original_source_sha="$GITHUB_SHA" -f scope=auto
      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outcome == 'success' && steps.publish.outputs.superseded != 'true'
        with:
          name: p2-generated-${{ steps.publish.outputs.result_sha }}
          path: |
            build-native/p2/artifact-evidence.json
            assets/wasm/pandoeditor-core.manifest.json
          if-no-files-found: error
          retention-days: 14
