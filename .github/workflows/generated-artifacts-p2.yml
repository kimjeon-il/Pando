name: P2 Source-matched generated artifacts
# Source-matched generation is allowed only on dedicated work/* branches, never on main.
on:
  push:
    branches: ['work/**']
    paths:
      - 'shared/**'
      - 'assets/**'
      - 'tools/**'
      - 'scripts/p2-*.mjs'
      - 'scripts/lib/p2-*.mjs'
      - 'scripts/generate-build-metadata.mjs'
      - 'index.html'
      - 'README.md'
      - '.gitattributes'
      - 'tests/unit/**'
      - 'reports/places/*.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/generated-artifacts-p2.yml'
  # Opt-in, per-push compiled-core-only publication; avoids unrelated stale data families.
  # Include [p2-wasm-only] in a work-branch commit message for a focused rebuild.
  workflow_dispatch:
    inputs:
      scope:
        description: Which generator to run; auto only builds stale outputs
        type: choice
        options: [auto, wasm, all, verify]
        required: false
        default: auto
      verification:
        description: Run minimal publication checks or the consolidated P9 calculation suites
        type: choice
        options: [minimal, full, temporal]
        required: false
        default: minimal
permissions:
  contents: read
concurrency:
  group: pando-generated-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      wasm: ${{ steps.scopes.outputs.wasm }}
      selected_families: ${{ steps.scopes.outputs.selected_families }}
      blocked_families: ${{ steps.scopes.outputs.blocked_families }}
      pnpm_version: ${{ steps.scopes.outputs.pnpm_version }}
      cmake_version: ${{ steps.scopes.outputs.cmake_version }}
      emscripten_version: ${{ steps.scopes.outputs.emscripten_version }}
      emsdk_ref: ${{ steps.scopes.outputs.emsdk_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Test source fingerprint, rebuild selection, publication guard
        if: github.event_name == 'push' || inputs.verification == 'full'
        run: node --test tests/unit/p2-artifact-plan.test.mjs tests/unit/shared-core-assets.test.mjs
      - name: Select only stale source-derived assets
        id: scopes
        env:
          PANDO_P2_BASE_SHA: ${{ github.event.before || '' }}
          PANDO_P2_SCOPE: ${{ inputs.scope || (contains(github.event.head_commit.message, '[p2-wasm-only]') && 'wasm' || 'auto') }}
        run: node scripts/p2-artifact-plan.mjs --github-output

  generate:
    needs: plan
    if: >-
      needs.plan.outputs.wasm == 'true' || needs.plan.outputs.selected_families != '[]' ||
      needs.plan.outputs.blocked_families != '[]' ||
      inputs.scope == 'verify' || inputs.verification == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    env:
      EMCC_CORES: '1'
      BINARYEN_CORES: '1'
      PANDO_P2_SCOPE: ${{ inputs.scope || (contains(github.event.head_commit.message, '[p2-wasm-only]') && 'wasm' || 'auto') }}
      PANDO_P2_WASM: ${{ needs.plan.outputs.wasm }}
      PANDO_P2_BASE_SHA: ${{ github.event.before || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned package manager only for selected data-family owners
        uses: pnpm/action-setup@v4
        if: needs.plan.outputs.selected_families != '[]' || inputs.scope == 'verify' || inputs.verification == 'full'
        with:
          version: ${{ needs.plan.outputs.pnpm_version }}
          run_install: false
      - name: Install frozen dependencies for current data generators
        if: needs.plan.outputs.selected_families != '[]' || inputs.scope == 'verify' || inputs.verification == 'full'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: jwlawson/actions-setup-cmake@v2
        if: needs.plan.outputs.wasm == 'true'
        with:
          cmake-version: ${{ needs.plan.outputs.cmake_version }}
      - name: Install compiler prerequisites only for WASM
        if: needs.plan.outputs.wasm == 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/checkout@v4
        if: needs.plan.outputs.wasm == 'true'
        with:
          repository: emscripten-core/emsdk
          ref: ${{ needs.plan.outputs.emsdk_ref }}
          path: build-native/emsdk
          persist-credentials: false
      - name: Build the pinned C++ WASM and verify its actual source identity
        if: needs.plan.outputs.wasm == 'true'
        shell: bash
        env:
          EMSDK_VERSION: ${{ needs.plan.outputs.emscripten_version }}
        run: |
          set -euo pipefail
          # emsdk_env.sh may clear EMSDK_VERSION; preserve the pinned value.
          required_version="$EMSDK_VERSION"
          build-native/emsdk/emsdk install "$required_version"
          build-native/emsdk/emsdk activate "$required_version"
          source build-native/emsdk/emsdk_env.sh
          emcc --version | sed -n '1p' | grep -F "$required_version"
          # GitHub's /archive/ endpoint has intermittently returned HTTP 404
          # for the pinned zlib 1.3.1 tag. Use its canonical codeload host,
          # which serves the identical bytes; Emscripten's SHA-512 validation
          # remains unchanged. Refuse an unrecognized SDK port definition.
          port_file=build-native/emsdk/upstream/emscripten/tools/ports/zlib.py
          original='https://github.com/madler/zlib/archive/refs/tags/v{VERSION}.tar.gz'
          canonical='https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v{VERSION}'
          grep -Fq "$original" "$port_file"
          sed -i "s|$original|$canonical|" "$port_file"
          grep -Fq "$canonical" "$port_file"
          # Emscripten 4.0.20 derives the archive suffix from the last
          # URL component. Codeload ends in v1.3.1, not .tar.gz, although its
          # content is the same SHA-512 verified gzip archive. Fix only zlib's
          # suffix inference; do not weaken fetch or integrity verification.
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='build-native/emsdk/upstream/emscripten/tools/ports/__init__.py';
          const input=readFileSync(file,'utf8');
          const old="    ext = url_filename.split('.', 1)[1]";
          if(input.split(old).length!==2)throw Error('Unexpected pinned Emscripten port loader');
          const next="    ext = 'tar.gz' if name == 'zlib' and url.startswith('https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v') else url_filename.split('.', 1)[1]";
          writeFileSync(file,input.replace(old,next));
          NODE
          emcmake cmake --preset pando-wasm
          cmake --build --preset pando-wasm
          node tools/package-shared-core-assets.mjs --build-dir build-native/p1/pando-wasm/shared/wasm
      - name: Verify published compiled identity and package hashes
        run: node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
      - name: Verify the changed geographic contact and common fill kernels
        if: needs.plan.outputs.wasm == 'true' && inputs.verification != 'full' && inputs.verification != 'temporal'
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/shared/frontend/static/wasm/pandoeditor-core.js
        run: >-
          node --test shared/tests/p5-country-contact-wasm.test.mjs
          shared/tests/p5-boundary-split-wasm.test.mjs shared/tests/p5-polygon-mesh-wasm.test.mjs
          tests/unit/country-contact-core.test.mjs tests/unit/country-contact-legacy-parity.test.mjs
          tests/unit/boundary-topology-split.test.mjs
      - name: Verify changed temporal editing and place naming
        if: inputs.verification == 'temporal'
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/shared/frontend/static/wasm/pandoeditor-core.js
        run: >-
          node --test shared/tests/temporal-editing.test.mjs
          tests/unit/place-names.test.mjs tests/unit/territorial-library-service.test.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.verification == 'temporal'
        with:
          name: temporal-wasm-${{ github.sha }}
          path: |
            shared/frontend/static/wasm/pandoeditor-core.js
            shared/frontend/static/wasm/pandoeditor-core.wasm
            shared/frontend/static/wasm/pandoeditor-core.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Test the compiled runtime ABI and bounded document session
        if: inputs.verification == 'full'
        shell: bash
        run: |
          node --test tests/unit/shared-core-assets.test.mjs tests/unit/core-wasm-loader.test.mjs
          PANDOEDITOR_WASM_MODULE="$PWD/shared/frontend/static/wasm/pandoeditor-core.js" node --test shared/tests/wasm-document-session.test.mjs shared/tests/p5-spherical-area-wasm.test.mjs shared/tests/p5-temporal-wasm.test.mjs shared/tests/p5-timeline-wasm.test.mjs shared/tests/p5-boundary-chains-wasm.test.mjs shared/tests/p5-boundary-packet-wasm.test.mjs shared/tests/p5-boundary-interiors-wasm.test.mjs shared/tests/p5-boundary-overlap-wasm.test.mjs shared/tests/p5-boundary-refinement-wasm.test.mjs shared/tests/p5-boundary-split-wasm.test.mjs shared/tests/p5-country-contact-wasm.test.mjs tests/unit/boundary-lines.test.mjs

      - name: Verify P6 product calculation adapters
        if: inputs.verification == 'full'
        run: >-
          node --test tests/unit/p6-polygon-core.test.mjs
          tests/unit/map-analysis-core.test.mjs
          tests/unit/edit-preparation.test.mjs
          tests/unit/map-analysis-georef.test.mjs
          tests/unit/map-analysis-live-wire.test.mjs tests/unit/map-analysis-line-refiner.test.mjs
          tests/unit/river-territory-partition.test.mjs
      - name: Commit verified phases locally, then publish one guarded result
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/p2-publish-artifacts.mjs
      - name: Hand the exact verified result to P3
        if: steps.publish.outputs.pushed == 'true' && inputs.scope != 'wasm' && (github.event_name == 'push' || inputs.verification == 'full')
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
          BASE_SHA: ${{ steps.publish.outputs.base_sha }}
        run: >-
          gh workflow run remote-preview-p3.yml --ref "$GITHUB_REF_NAME"
          -f source_sha="$RESULT_SHA" -f base_sha="$BASE_SHA"
          -f original_source_sha="$GITHUB_SHA" -f scope=auto
      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outcome == 'success'
        with:
          name: p2-generated-${{ steps.publish.outputs.result_sha }}
          path: |
            build-native/p2/artifact-evidence.json
            shared/frontend/static/wasm/pandoeditor-core.manifest.json
          if-no-files-found: error
          retention-days: 14
