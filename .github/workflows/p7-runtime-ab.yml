name: Optimization same-run Viewer CPU/GPU/FPS/memory A/B

# Historical task acceptance or one-time publication: explicitly dispatched, not default CI.
on:
  workflow_dispatch:
    inputs:
      profile_only:
        description: Measure the current Viewer three times, including 32x globe LOD
        type: boolean
        required: false
        default: false
      terrain_only:
        description: Run the isolated regional terrain A1 and tile-size smoke experiment
        type: boolean
        required: false
        default: false
      terrain_full:
        description: Run three interleaved repetitions per available terrain candidate
        type: boolean
        required: false
        default: false
      terrain_phase_smoke:
        description: Run all interaction phases once for one selected candidate
        type: boolean
        required: false
        default: false
      terrain_batch:
        description: Include the experimental 512-tile instancing candidate
        type: boolean
        required: false
        default: false
      terrain_normalized_budget:
        description: Use 192 MiB for experimental candidates; A0 retains the product budget
        type: boolean
        required: false
        default: false
      terrain_region:
        description: Representative region for the terrain experiment
        type: choice
        required: false
        default: southwest-china
        options:
          - southwest-china
          - thai-lowland
          - himalaya
          - netherlands-coast
      terrain_projection:
        description: Globe, or experimental flat bootstrap (not the current Viewer default)
        type: choice
        required: false
        default: globe
        options:
          - globe
          - flat
      terrain_candidate:
        description: Restrict a diagnostic run to one terrain candidate
        type: choice
        required: false
        default: all
        options:
          - all
          - a0
          - a1
          - b512
          - batch
          - cog
          - screen

permissions:
  contents: read

concurrency:
  # Region/projection runs use isolated runners and independent evidence streams.
  group: p7-runtime-ab-${{ github.ref }}-${{ inputs.terrain_projection || 'globe' }}-${{ inputs.terrain_region || 'default' }}
  cancel-in-progress: true

jobs:
  regional-terrain-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.terrain_only == true
    runs-on: ubuntu-24.04
    # Fifteen interleaved runs now include the full interaction and capture set.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Prepare exact pinned library inputs (no regeneration)
        uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure regional candidates in the actual Viewer
        env:
          TERRAIN_FULL: ${{ inputs.terrain_full }}
          TERRAIN_PHASE_SMOKE: ${{ inputs.terrain_phase_smoke }}
          TERRAIN_BATCH: ${{ inputs.terrain_batch }}
          TERRAIN_REGION: ${{ inputs.terrain_region }}
          TERRAIN_PROJECTION: ${{ inputs.terrain_projection }}
          TERRAIN_NORMALIZED_BUDGET: ${{ inputs.terrain_normalized_budget }}
          TERRAIN_CANDIDATE: ${{ inputs.terrain_candidate }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--screen --cog "--region=$TERRAIN_REGION" "--projection=$TERRAIN_PROJECTION")
          if [ "$TERRAIN_BATCH" = 'true' ] || [ "$TERRAIN_CANDIDATE" = 'batch' ]; then args+=(--batch); fi
          if [ "$TERRAIN_NORMALIZED_BUDGET" = 'true' ]; then args+=(--normalized-budget); fi
          if [ "$TERRAIN_CANDIDATE" != 'all' ] && [ -n "$TERRAIN_CANDIDATE" ]; then args+=("--candidate=$TERRAIN_CANDIDATE"); fi
          if [ "$TERRAIN_FULL" != 'true' ]; then args+=(--smoke); fi
          if [ "$TERRAIN_PHASE_SMOKE" = 'true' ]; then args+=(--phase-smoke); fi
          node scripts/terrain-experiment/viewer-compare.mjs "${args[@]}" --out="$RUNNER_TEMP/terrain-regional-smoke"
      - name: Keep measurements and screenshots including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-regional-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/terrain-regional-smoke/**
          if-no-files-found: warn
          retention-days: 14

  paired-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_only != true && inputs.terrain_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Prepare exactly the pinned external library files
        uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure main and candidate sequentially on one Chromium runner
        shell: bash
        env:
          # Previous pinned-revision candidate that completed all three
          # Chromium measurements. The earlier baseline cannot start the
          # Viewer (duplicate declaration), so it is not a valid A/B sample.
          BASE_SHA: e8422121b18bf700ed46f1851f3bbfbfdc9f3663
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --exit-code
          node -e 'const fs=require("fs"),cp=require("child_process");const old=JSON.parse(cp.execFileSync("git",["show",process.env.BASE_SHA+":config/library-data.json"]));const next=JSON.parse(fs.readFileSync("config/library-data.json"));if(old.revision!==next.revision)throw Error("P7 A/B requires the exact same immutable library revision");'
          cp scripts/p7-browser-ab-measure.mjs scripts/.p7-ab-harness.tmp.mjs
          trap 'rm -f scripts/.p7-ab-harness.tmp.mjs' EXIT
          # Interleave the revisions on one runner to reduce monotonic host
          # drift. Each invocation creates a fresh browser and test server.
          failed=0
          for slot in main-1 p7-1 p7-2 main-2 main-3 p7-3; do
            label="${slot%-*}"
            if [ "$label" = main ]; then target="$BASE_SHA"; else target="$HEAD_SHA"; fi
            git switch --detach "$target"
            if ! node scripts/.p7-ab-harness.tmp.mjs --label="$label" --out="$RUNNER_TEMP/p7-$slot.json"; then
              failed=1
            fi
          done
          git switch --detach "$HEAD_SHA"
          set +e
          node scripts/.p7-ab-harness.tmp.mjs --mode=aggregate \
            --samples="$RUNNER_TEMP/p7-main-1.json,$RUNNER_TEMP/p7-main-2.json,$RUNNER_TEMP/p7-main-3.json" \
            --out="$RUNNER_TEMP/p7-main.json"
          base_status=$?
          node scripts/.p7-ab-harness.tmp.mjs --mode=aggregate \
            --samples="$RUNNER_TEMP/p7-p7-1.json,$RUNNER_TEMP/p7-p7-2.json,$RUNNER_TEMP/p7-p7-3.json" \
            --out="$RUNNER_TEMP/p7-work.json"
          candidate_status=$?
          node scripts/.p7-ab-harness.tmp.mjs --mode=compare \
            --main="$RUNNER_TEMP/p7-main.json" --candidate="$RUNNER_TEMP/p7-work.json" \
            --out="$RUNNER_TEMP/p7-comparison.json"
          compare_status=$?
          set -e
          echo "Raw sample failures: $failed; main aggregate: $base_status; candidate aggregate: $candidate_status; A/B comparison: $compare_status"
          test "$failed" = 0 && test "$base_status" = 0 && test "$candidate_status" = 0 && test "$compare_status" = 0
      - name: Retain both original measurements and comparison, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-runtime-ab-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p7-main-*.json
            ${{ runner.temp }}/p7-p7-*.json
            ${{ runner.temp }}/p7-main.json
            ${{ runner.temp }}/p7-work.json
            ${{ runner.temp }}/p7-comparison.json
          if-no-files-found: warn
          retention-days: 14

  current-renderer-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_only == true && inputs.terrain_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Prepare exact pinned library inputs (no regeneration)
        uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate narrowed trigger declarations
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import YAML from 'yaml';
          const read=path=>YAML.parse(readFileSync(path,'utf8'));
          const pages=read('.github/workflows/web-pages.yml');
          const p2=read('.github/workflows/generated-artifacts-p2.yml');
          const paths=workflow=>workflow.on.push.paths;
          const prohibited=['tests/**','docs/**','reports/**','assets/**','tools/**','config/**'];
          assert.ok(Array.isArray(paths(pages))&&paths(pages).includes('src/**'));
          assert.ok(paths(pages).includes('config/library-data.json'));
          assert.ok(paths(pages).includes('.github/workflows/web-pages.yml'));
          for(const path of prohibited)assert.ok(!paths(p2).includes(path), 'Broad P2 path: '+path);
          for(const path of ['src/**/native/**','assets/wasm/**','config/library-data.json','config/generated-artifacts.json'])
            assert.ok(paths(p2).includes(path), 'Missing P2 source: '+path);
          assert.ok(!paths(pages).some(path=>path.startsWith('tests/')||path.startsWith('docs/')));
          assert.ok(pages.on.workflow_dispatch&&p2.on.workflow_dispatch,'Manual dispatch must stay available');
          console.log('WORKFLOW_SCOPE_VERIFIED '+JSON.stringify({pagesPathCount:paths(pages).length,p2PathCount:paths(p2).length,manualDispatchPreserved:true}));
          NODE
      - name: Verify the committed native/WASM source identity
        run: node tools/build/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture three independent Chromium render/frame/memory/mesh samples
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for i in 1 2 3; do
            mkdir -p "$RUNNER_TEMP/renderer-screenshots/$i"
            node scripts/p7-browser-ab-measure.mjs --label=p7 --measure-zoom=1 --strict-frames=1 --screenshot-dir="$RUNNER_TEMP/renderer-screenshots/$i" --out="$RUNNER_TEMP/renderer-$i.json" || failed=1
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          node scripts/p7-browser-ab-measure.mjs --mode=aggregate --samples="$RUNNER_TEMP/renderer-1.json,$RUNNER_TEMP/renderer-2.json,$RUNNER_TEMP/renderer-3.json" --out="$RUNNER_TEMP/renderer-aggregate.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/renderer-aggregate.json','utf8'));
          const mib=x=>Number.isFinite(x)?Math.round(x/1048576*10)/10:null;
          const phases=report.phases.map(p=>({
            phase:p.phase,elapsedMedianMs:p.elapsedMs,elapsedRangeMs:p.wallTimeRangeMs,
            rafFps:p.raf?.rafFps??null,rafP95GapMs:p.raf?.p95FrameGapMs??null,
            rafMaxGapMs:p.raf?.maxFrameGapMs??null,rendererCpuSubmitP95Ms:p.renderer?.p95CpuSubmitMs??null,
            rendererCpuSubmitP99Ms:p.renderer?.p99CpuSubmitMs??null,
            mainJsHeapMiB:mib(p.jsHeapUsedBytes),chromiumFamilyPssMiB:mib(p.chromiumProcessPssBytes),
            trackedGpuBufferMiB:mib(p.renderer?.gpuTrackedBuffersBytes),
            terrainCacheMiB:mib(p.renderer?.terrainCacheBytes),hydroCacheMiB:mib(p.renderer?.hydroCacheBytes),
            countryMeshRebuildCount:p.renderer?.countryMeshRebuildCount??null,
            screenScale:p.renderer?.screenScale??null,
            activeMeshQuality:p.renderer?.activeMeshQuality??null,
            screenLodTargetKey:p.renderer?.screenLodTargetKey??null,
            countryMeshBuildSuccessCount:p.renderer?.countryMeshBuildSuccessCount??null,
            countryMeshReuseCount:p.renderer?.countryMeshReuseCount??null,
            screenLodPreparedCount:p.renderer?.screenLodPreparedCount??null,
            screenLodUploadCount:p.renderer?.screenLodUploadCount??null,
            countryMeshPreparationMs:p.renderer?.countryMeshPreparationMs??null,
            workerMessageBytes:p.renderer?.workerMessageBytes??null
          }));
          if(phases.some(p=>p.countryMeshRebuildCount===null||p.countryMeshBuildSuccessCount===null||
            p.countryMeshReuseCount===null||p.screenLodPreparedCount===null||p.screenLodUploadCount===null))
            throw Error('Renderer mesh rebuild/reuse/LOD counters must be observable, including zero.');
          console.log('RENDERER_PROFILE_MEASURED '+JSON.stringify({
            status:report.status,sourceCommit:report.identity.commit,libraryPin:report.identity.pin,
            browserVersion:report.browserVersion,gpuBackend:report.gpuBackend,replicates:report.sampleCount,
            phases,limitations:['rAF intervals are not GPU frame presentation times',
             'Chromium process PSS is nullable and not VRAM',
             'Mesh rebuild/reuse counters are renderer-owned, not a complete GPU allocation history']
          }));
          if(report.status!=='passed')process.exitCode=1;
          NODE
      - name: Keep all three raw samples and the verified aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-profile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/renderer-1.json
            ${{ runner.temp }}/renderer-2.json
            ${{ runner.temp }}/renderer-3.json
            ${{ runner.temp }}/renderer-aggregate.json
            ${{ runner.temp }}/renderer-screenshots/**
          if-no-files-found: warn
          retention-days: 14
