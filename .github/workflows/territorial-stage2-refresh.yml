# Explicit GIS/source-data reproduction; lightweight source checks remain in gis-python-p4.yml.
name: One-shot USSR territorial asset regeneration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify corrected USSR canonical source
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          await import('./assets/js/modules/polygon-geometry.js');
          const soviet=JSON.parse(fs.readFileSync('assets/data/territorial-entities/source/countries/state-soviet-union.json','utf8'));
          const geometry=soviet?.geometryVersions.find(v=>v.versionId==='state:soviet-union:1922-1991-baikonur-r1')?.geometry;
          assert.equal(geometry?.coordinates?.length,231);
          assert.equal(geometry.coordinates.reduce((sum,p)=>sum+p.reduce((n,r)=>n+r.length,0),0),40054);
          assert.equal(globalThis.PandoLabPolygonGeometry.hasCanonicalPolygonWinding(geometry),true);
          console.log('USSR: 231 canonical outer rings, 40,054 source vertices');
          JS
      - name: Regenerate territorial chunks and historical timeline
        run: |
          node tools/build-territorial-entity-chunks.mjs
          node tools/build-builtin-world.mjs
          node tools/build-prepared-polygon-mesh.mjs
          PANDOLAB_BUILD_ID=ussr-spherical-20261013 node scripts/generate-build-metadata.mjs
      - name: Verify reproducibility, lineage and temporal data contracts
        run: |
          node tools/build-territorial-entity-chunks.mjs --check
          node scripts/check-version.mjs
          node --test tests/unit/polygon-geometry.test.mjs tests/unit/territorial-chunks.test.mjs tests/unit/historical-world-publication.test.mjs
      - name: Verify generated output scope
        shell: bash
        env:
          PANDOLAB_LIBRARY_WRITE_TOKEN: ${{ secrets.PANDOLAB_LIBRARY_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node tools/library-data.mjs --store-and-stage --push -- -A -- \
            assets/data/territorial-entities/generated/v2 \
            assets/data/builtin-world/generated/v1 \
            assets/data/prepared-polygons/generated/v2 \
            assets/js/build-meta.js index.html apps/editor/editor.html README.md
          git diff --cached --check
          while IFS= read -r changed; do
            case "$changed" in
              assets/data/territorial-entities/generated/v2/index.json|\
              assets/data/territorial-entities/generated/v2/state-soviet-union.json.gz|\
              assets/data/builtin-world/generated/v1/index.json|\
              assets/data/builtin-world/generated/v1/countries/*.json.gz|\
              assets/data/builtin-world/generated/v1/coverage-report.json|\
              assets/data/prepared-polygons/generated/v2/manifest.json|\
              assets/data/prepared-polygons/generated/v2/polygon-mesh-sha256-*.bin.gz|\
              assets/js/build-meta.js|index.html|apps/editor/editor.html|README.md)
                echo "EXPECTED: $changed" ;;
              *) echo "OUT-OF-SCOPE ASSET CHANGE: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --stat
      - name: Commit validated assets to the working branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No asset updates required"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(territory): regenerate USSR Web historical assets'
          git push origin HEAD:refs/heads/fix/territory-cpp-normalization-20261013
          echo "Regeneration commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
