name: Viewer temporal renderer cross acceptance
on:
  push:
    branches: [work/ui]
    paths:
      - .github/workflows/viewer-temporal-cross-acceptance.yml
      - tests/browser/builtin-temporal-transition.spec.mjs
      - shared/frontend/js/modules/builtin-session.js
      - shared/frontend/js/modules/project-domain.js
      - shared/frontend/js/modules/gpu-map-renderer.js
      - shared/frontend/js/workers/canvas-render-worker.js
      - scripts/contracts/application-checks.json
      - scripts/lib/product-assets.mjs
      - apps/viewer/js/modules/viewer-composition.js
      - tests/unit/viewer-initial-composition.test.mjs
      - apps/viewer/js/modules/viewer-initial-presentation.js
      - tests/unit/viewer-initial-presentation.test.mjs
      - shared/frontend/js/modules/map-owner-composition.js
      - apps/editor/stage.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-temporal-cross-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/library-data
      - name: Verify Viewer browser registration and dependency planner
        run: |
          node scripts/run-application-checks.mjs --list --base HEAD --group viewer > /tmp/viewer-catalog.json
          node --test tests/unit/check-automation.test.mjs tests/unit/viewer-initial-presentation.test.mjs tests/unit/viewer-initial-composition.test.mjs
  browser:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl, canvas-worker, canvas2d]
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: ./.github/actions/library-data
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify actual ${{ matrix.backend }} frames and recovery
        run: |
          pnpm exec playwright test tests/browser/builtin-temporal-transition.spec.mjs --grep "${{ matrix.backend == 'canvas-worker' && 'canvas-worker|temporal failures|Canvas user-file' || matrix.backend }}" --workers=1 --retries=0 --reporter=list
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-cross-${{ matrix.backend }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
