name: Focused browser project-open integration
# Retest after canonical dependency policy worker closure correction
on:
  push:
    branches: [work/map-project-open-browser-20261109]
    paths: [.github/workflows/project-open-browser-check.yml]
permissions:
  contents: write
jobs:
  viewer-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: library
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/data/library-data.mjs 2>&1 | tee "$RUNNER_TEMP/project-open-library.log"
      - id: browser-setup
        if: steps.library.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/project-open-browser-setup.log"
      - id: browser
        if: steps.browser-setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test tests/browser/document/viewer-project-open.spec.mjs \
            --grep 'viewer opens the real editor GeoPackage' --workers=1 \
            2>&1 | tee "$RUNNER_TEMP/project-open-browser.log"
      - name: Preserve narrow browser evidence outside external library mounts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const read=name=>{
              const file=process.env.RUNNER_TEMP+'/project-open-'+name+'.log';
              return fs.existsSync(file)?fs.readFileSync(file,'utf8').slice(-24000):'not executed';
            };
            const result={
              schema:'pando-project-open-browser-v1',sourceCommit:context.sha,
              install:'${{ steps.install.outcome }}',library:'${{ steps.library.outcome }}',
              browserSetup:'${{ steps.browser-setup.outcome }}',
              browser:'${{ steps.browser.outcome }}',
              logs:{library:read('library'),setup:read('browser-setup'),browser:read('browser')},
            };
            const path='validation-results/project-open-browser.json',
              branch=context.ref.replace('refs/heads/','');
            let sha;
            try{
              const existing=await github.rest.repos.getContent({
                owner:context.repo.owner,repo:context.repo.repo,path,ref:branch,
              });sha=existing.data.sha;
            }catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch,...(sha?{sha}:{}),
              message:'test: record narrow browser project-open evidence',
              content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),
            });
      - name: Fail unless the one requested browser regression passes
        if: always()
        run: test '${{ steps.browser.outcome }}' = success
