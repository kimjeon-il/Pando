name: Objects cursor focused acceptance
on:
  push:
    branches: [work/objects, work/integration-objects-20261017]
    paths:
      - '.github/workflows/objects-cursor-focused-acceptance.yml'
      - 'shared/core/**'
      - 'shared/wasm/session-bindings.cpp'
      - 'shared/frontend/static/wasm/pandoeditor-core.manifest.json'
      - 'assets/js/modules/core-document-runtime.js'
      - 'tests/browser/historical-world-timeline.spec.mjs'
      - 'tests/browser/temporal-editing.spec.mjs'
      - 'tests/browser/editor-flat-document.spec.mjs'
      - 'tests/browser/territorial-common-commands.spec.mjs'
      - 'tests/browser/distribution.spec.mjs'
      - 'tests/unit/core-document-runtime.test.mjs'
      - 'tests/browser/soviet-initialization-memory.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-cursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Keep native regression evidence when published WASM is awaiting regeneration.
      - name: Install native test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Build and run C++ command, history and codec regressions
        run: |
          cmake -S . -B build-native/cursor-focused -G Ninja -DCMAKE_BUILD_TYPE=Release -DPANDO_BUILD_VARIANT=core -DBUILD_TESTING=ON
          cmake --build build-native/cursor-focused --target temporal_editing_tests project_codec_tests document_session_tests web_object_command_tests web_storage_tests web_territorial_command_tests --parallel 2
          ctest --test-dir build-native/cursor-focused -R '^(temporal_editing_tests|project_codec_tests|document_session_tests|web_object_command_tests|web_storage_tests|web_territorial_command_tests)$' --output-on-failure
      - name: Check retired-module regressions
        run: node --test tests/unit/retired-shared-core-modules.test.mjs
      - name: Check published source-matched WASM
        run: node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
      - name: Verify cursor transition ABI against source-matched generated WASM
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/shared/frontend/static/wasm/pandoeditor-core.js
        run: |
          node --test tests/unit/core-document-runtime.test.mjs tests/unit/core-document-client.test.mjs
          node --test shared/tests/wasm-document-session.test.mjs shared/tests/p5-temporal-wasm.test.mjs shared/tests/p5-timeline-wasm.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const source=resolve(process.env.PANDOEDITOR_WASM_MODULE);
          const {default:create}=await import(pathToFileURL(source));
          const core=await create({wasmBinary:await readFile(source.replace(/\.js$/,'.wasm'))});
          const seed=JSON.parse(await readFile('tests/fixtures/portability/web-document-seed.json','utf8'));
          const session=new core.DocumentSession({validateFlagDataUrl(){}});
          try {
            const initial=session.documentLoad(JSON.stringify(seed),'2026-10');
            const checkpoint=initial.checkpoint;
            const changed=session.setTimelineCursor('1914-07',initial.epoch);
            assert.equal(changed.state.timelineCursor,'1914-07');
            assert.equal(changed.world.month,'1914-07');
            assert.equal(changed.world.sourceEpoch,changed.state.epoch);
            assert.equal(changed.state.checkpoint,checkpoint);
            assert.equal(changed.state.revision,initial.revision);
            assert.equal(changed.state.canUndo,false);
            assert.equal(changed.state.dirty,false);
            const queried=session.resolveWorld('1914-07',changed.state.epoch);
            assert.deepEqual(changed.world.entities,queried.entities);
            const noOp=session.setTimelineCursor('1914-07',changed.state.epoch);
            assert.equal(noOp.state.epoch,changed.state.epoch);
            assert.deepEqual(noOp.world.entities,changed.world.entities);
            const restored=session.setTimelineCursor('2026-10',changed.state.epoch);
            assert.equal(restored.world.month,'2026-10');
            assert.equal(restored.world.sourceEpoch,restored.state.epoch);
            assert.equal(restored.state.canUndo,false);
            console.log('CURSOR_SINGLE_PASS_REAL_WASM_OK', {initial:initial.epoch,changed:changed.state.epoch,restored:restored.state.epoch,entities:changed.world.entities.length});
          } finally { session.delete(); }
          NODE
  browser-cursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install pinned browser deps
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Assert source-matched WASM for actual browser validation
        run: node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run actual Soviet selection and historical world roundtrip contracts
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: |
          pnpm exec playwright test tests/browser/soviet-initialization-memory.spec.mjs tests/browser/temporal-editing.spec.mjs --workers=1 --retries=0 --trace off
      - name: Preserve browser evidence on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objects-cursor-focused-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 10

  browser-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned external library data
        uses: ./.github/actions/library-data
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install pinned browser dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require rebuilt source-matched WASM before browser testing
        run: node tools/package-shared-core-assets.mjs --build-dir shared/frontend/static/wasm --check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Repeat new-project reset then verify real dated-view acceptance
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: pnpm exec playwright test tests/browser/historical-world-timeline.spec.mjs --grep 'new world reset materializes one source month and editor navigation keeps that snapshot' --repeat-each=3 --workers=1 --retries=0 --trace off
      - name: Verify label Undo/Redo and save/reopen on the published WASM
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: pnpm exec playwright test tests/browser/editor-flat-document.spec.mjs --workers=1 --retries=0 --trace off
      - name: Verify browser Undo/Redo for deletion and distribution edits
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: >-
          pnpm exec playwright test
          tests/browser/historical-world-timeline.spec.mjs
          tests/browser/distribution.spec.mjs
          --grep 'deleting a built-in subunit restores canonical data with Undo and Redo|a numeric distribution stores signed values and survives undo and redo'
          --workers=1 --retries=0 --trace off
      - name: Preserve reset failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objects-cursor-reset-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 10
