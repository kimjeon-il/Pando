name: Objects cursor focused acceptance
on:
  push:
    branches: [work/objects]
    paths:
      - '.github/workflows/objects-cursor-focused-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-cursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check published source-matched WASM
        run: node tools/package-shared-core-assets.mjs --build-dir assets/wasm --check
      - name: Install native test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Build and run isolated real C++ timeline editor contracts
        run: |
          cmake -S . -B build-native/cursor-focused -G Ninja -DCMAKE_BUILD_TYPE=Release -DPANDO_BUILD_VARIANT=core -DBUILD_TESTING=ON
          cmake --build build-native/cursor-focused --target temporal_editing_tests --parallel 2
          ctest --test-dir build-native/cursor-focused -R '^temporal_editing_tests$' --output-on-failure
      - name: Verify cursor transition ABI against the source-matched generated WASM
        env:
          PANDOEDITOR_WASM_MODULE: ${{ github.workspace }}/assets/wasm/pandoeditor-core.js
        run: |
          node --test tests/unit/core-document-runtime.test.mjs tests/unit/core-document-client.test.mjs
          node --test tests/unit/core-document-world-wasm.test.mjs shared/tests/wasm-document-session.test.mjs
  browser-cursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install pinned browser deps
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run actual Soviet selection and historical world roundtrip contracts
        env:
          PANDOLAB_BROWSER_CHANNEL: chromium
        run: |
          pnpm exec playwright test tests/browser/soviet-initialization-memory.spec.mjs tests/browser/temporal-editing.spec.mjs --workers=1 --retries=0 --trace off
      - name: Preserve browser evidence on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objects-cursor-focused-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 10
