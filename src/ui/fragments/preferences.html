<div id="preferencesModal" class="ui-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="preferencesTitle">
  <div class="ui-dialog-backdrop"></div>
  <section class="ui-dialog-card preferences-card">
    <header class="ui-dialog-header"><h2 id="preferencesTitle">설정</h2></header>
    <div class="preferences-fields">
      <div class="preferences-setting preferences-setting-choices" role="group" aria-labelledby="preferencesMapStyleTitle">
        <strong id="preferencesMapStyleTitle">지도 테마</strong>
        <div class="preferences-option-group" role="radiogroup" aria-label="지도 테마">
          <label class="ui-choice-row"><input type="radio" name="preferencesMapStyle" value="standard" checked /><span>표준</span></label>
          <label class="ui-choice-row"><input type="radio" name="preferencesMapStyle" value="minimal" /><span>간결</span></label>
          <label class="ui-choice-row"><input type="radio" name="preferencesMapStyle" value="classic" /><span>고전</span></label>
        </div>
      </div>
      <label class="ui-choice-row ui-toggle preferences-setting"><span>원어명 병기</span><input id="preferencesNativeNamesInput" type="checkbox" /></label>
      <label class="ui-choice-row ui-toggle preferences-setting"><span>강</span><input id="preferencesRiversInput" type="checkbox" checked /></label>
      <label class="ui-choice-row ui-toggle preferences-setting"><span>호수</span><input id="preferencesLakesInput" type="checkbox" checked /></label>
      <div id="preferencesGenericSlot" class="preferences-conditional-slot" hidden>
        <div class="preferences-conditional" role="group" aria-label="기타 객체">
          <strong>기타 객체</strong>
          <label class="ui-choice-row ui-toggle"><span>표시</span><input id="genericFeaturesVisible" type="checkbox" checked /></label>
        </div>
      </div>
      <div id="preferencesDistributionSlot" class="preferences-conditional-slot" hidden>
        <div class="preferences-conditional" role="group" aria-label="분포">
          <strong>분포</strong>
          <label class="ui-choice-row ui-toggle"><span>표시</span><input id="distributionsVisible" type="checkbox" checked /></label>
          <label class="ui-field field-group" for="preferencesDistributionBlendInput"><span>겹침 방식</span>
            <select id="preferencesDistributionBlendInput"><option value="normal">일반</option><option value="multiply">곱하기</option></select>
          </label>
          <div class="preferences-option-group" role="radiogroup" aria-label="분포 표시 기준">
            <label class="ui-choice-row"><input id="distributionOverlapRadio" type="radio" name="distributionLayerMode" value="overlap" checked /><span>여러 분포 겹쳐 보기</span></label>
            <label class="ui-choice-row"><input id="distributionSingleRadio" type="radio" name="distributionLayerMode" value="single" /><span>분포 하나만 보기</span></label>
          </div>
          <label class="ui-field field-group" for="distributionActiveLayerInput" id="preferencesDistributionLayerRow"><span>표시 대상</span>
            <select id="distributionActiveLayerInput"></select>
          </label>
          <div id="distributionLegend" class="distribution-legend" aria-label="분포 범례"></div>
          <small id="distributionLayerModeHint" class="layer-setting-hint"></small>
          <label class="ui-choice-row ui-toggle"><span>분포 경계</span><input id="distributionBoundaryVisibleInput" type="checkbox" checked /></label>
        </div>
      </div>
      <label class="ui-choice-row ui-toggle preferences-setting"><span>경위도선</span><input id="preferencesGraticuleInput" type="checkbox" checked /></label>
      <label class="ui-choice-row ui-toggle preferences-setting"><span>경계선 부드럽게</span><input id="preferencesSmoothLinesInput" type="checkbox" checked /></label>
      <div class="preferences-setting preferences-theme" role="group" aria-labelledby="preferencesThemeTitle">
        <strong id="preferencesThemeTitle">화면 테마</strong>
        <input id="preferencesThemeInput" type="hidden" value="system" />
        <div class="preferences-theme-swatches">
          <button type="button" class="ui-button preferences-theme-chip" data-preference-theme="light" aria-label="라이트" data-tooltip="라이트" aria-pressed="false"></button>
          <button type="button" class="ui-button preferences-theme-chip" data-preference-theme="dark" aria-label="다크" data-tooltip="다크" aria-pressed="false"></button>
          <button type="button" class="ui-button preferences-theme-chip" data-preference-theme="system" aria-label="시스템" data-tooltip="시스템" aria-pressed="true"></button>
        </div>
      </div>
    </div>
    <div class="ui-dialog-actions"><button id="preferencesResetBtn" class="ui-button btn ghost" type="button">기본값 복원</button>
      <span class="preferences-actions-spacer"></span><button id="preferencesCloseBtn" class="ui-button btn" type="button">닫기</button></div>
  </section>
</div>
