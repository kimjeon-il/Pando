<div class="status-group timeline-status" aria-label="시점 이동">
          <button id="timelinePreviousYear" class="ui-button ghost timeline-step" type="button" aria-label="1년 이전" data-tooltip="1년 이전">«</button>
              <button id="timelinePreviousMonth" class="ui-button ghost timeline-step" type="button" aria-label="1개월 이전" data-tooltip="1개월 이전">‹</button>
              <span class="timeline-month-control">
                <button id="timelineMonthButton" class="ui-button timeline-month-button" type="button" aria-label="시점 직접 입력" data-tooltip="시점 직접 입력">
                  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
                  <span id="timelineMonthButtonText">현재 시점</span>
                </button>
                <input id="timelineMonthInput" class="timeline-month-input" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="연월 입력" aria-describedby="timelineMonthError" placeholder="YYYY-MM" hidden />
              </span>
              <button id="timelineNextMonth" class="ui-button ghost timeline-step" type="button" aria-label="1개월 이후" data-tooltip="1개월 이후">›</button>
              <button id="timelineNextYear" class="ui-button ghost timeline-step" type="button" aria-label="1년 이후" data-tooltip="1년 이후">»</button>
              <span id="timelineMonthLabel" hidden>현재 월</span>
              <span id="timelineMonthError" class="timeline-month-error" role="status" hidden></span>
            </div>
